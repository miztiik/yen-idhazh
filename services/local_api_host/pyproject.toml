[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-api-host"
version = "2026.11.7"
description = "Reusable single-component local FastAPI hosting."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121,<0.122",
    "opentelemetry-api==1.45.1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.38,<1",
]
