[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-analysis"
version = "2026.11.7"
description = "Local multilingual linguistic feature extraction."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.11,<5",
    "fastapi>=0.121,<0.122",
    "local-api-host",
    "opentelemetry-api==1.45.1",
    "pydantic>=2.12,<3",
    "spacy==3.8.18",
    "spacy-pkuseg==1.0.2",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
verification = [
    "httpx>=0.28,<1",
]

[tool.uv]
default-groups = ["verification"]

[tool.uv.sources]
local-api-host = { path = "../local_api_host" }

[tool.hatch.build.targets.wheel]
packages = ["src/text_analysis"]
