[package]
name = "idhazh-host-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
arrow-array = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "zstd"] }
regex = "1"
ryu = "1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v5"] }
ureq = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
