name: Candidate config
description: A scratch copy of config/ whose models_file points at the candidate.

inputs:
  models_file:
    description: 'Models file under config/, for example models/gemma-4-e4b-qat.json.'
    required: true

# The committed config still names the incumbent, and a measurement does not
# edit it. The scratch copy differs in ONE LINE - `models_file` - and nothing
# else, so every control the run holds fixed (prompt, schema, sampler, context,
# threads, truncation cap) is the committed one by construction, and a candidate
# is measured through the exact line a swap would later move.
#
# Nothing is transplanted onto the entry. The bench once overwrote the
# incumbent's `inference` and `turns` digests with the candidate's, which
# asserted that numbers measured for one model held for another - and then
# reported a throughput taken on a window nobody had sized for those weights.
# The candidate's own file carries its own blocks.
#
# It is an action rather than two copies of a step because the two copies were
# byte-identical apart from the job they read the models file from, and a step
# duplicated across two files is a step that drifts the day one of them is
# edited. That drift has happened twice in these two workflows already.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CANDIDATE_MODELS_FILE: ${{ inputs.models_file }}
      run: |
        set -euo pipefail
        mkdir -p backend/var
        rm -rf backend/var/candidate-config
        cp -a config backend/var/candidate-config
        python - <<'PY'
        import json, os, pathlib
        path = pathlib.Path("backend/var/candidate-config/idhazh.json")
        settings = json.loads(path.read_text(encoding="utf-8"))
        settings["models_file"] = os.environ["CANDIDATE_MODELS_FILE"]
        path.write_text(json.dumps(settings, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        PY
