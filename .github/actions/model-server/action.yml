name: Model server
description: Restore or fetch the pinned runtime and weights, check the bytes, and leave a healthy llama-server answering.

inputs:
  github_token:
    description: >-
      Looks the pinned llama.cpp release up. A composite action cannot read
      `secrets`, so the caller hands it over.
    required: true
  port:
    description: >-
      The loopback port the server binds and the health probe reads, taken from
      the LLAMA_PORT the calling workflow declares. An input rather than an
      inherited variable: the port keeps its one home in the caller, and this is
      what carries it across the boundary, where an inherited value would be a
      dependency nothing declares.
    required: true
  weights_repo:
    description: 'The hub repository holding the weights, as the plan job published it.'
    required: true
  weights_revision:
    description: 'The commit the weights are fetched at, never a branch name.'
    required: true
  weights_file:
    description: 'The weights filename. It names the cache entry, the digest check and the loaded path.'
    required: true
  llama_cpp_build:
    description: 'The llama.cpp build tag, as `llama-cpp-pin.sh` published it. It names the cache entry.'
    required: true
  draft_repo:
    description: 'The draft head''s repository, or empty where the model entry declares none.'
    required: false
    default: ''
  draft_revision:
    description: 'The draft head''s commit, or empty.'
    required: false
    default: ''
  draft_file:
    description: 'The draft head''s filename, or empty. Empty skips the second digest check.'
    required: false
    default: ''
  draft_sha256:
    description: 'The draft head''s recorded digest, or empty.'
    required: false
    default: ''

# Five steps, and the two workflows that run all five ran them as two copies.
# They were the same steps in the same order, differing only in the job each
# read its refs from - which is a copy that drifts the day one of them is
# edited, and this pair has already drifted once: one caller put the weights
# revision into its cache key and the other got the same edit by hand
# afterwards.
#
# This file names no caller, on purpose. A block that knows who called it is a
# block one caller cannot be built or tested without.
#
# The caller keeps everything a composite action cannot hold: the runner label,
# the matrix, the bound, and the workflow `env` that declares the port. What
# moves here is the block itself, so a change to how a model is served is made
# once.
#
# This action names one model role, `summarize`, and no caller chooses it. That
# is not an oversight. The two callers share ONE cache entry because they open
# the same bytes, and a caller serving a different model needs a different key,
# a different digest and a different alias to assert - which is a design change
# rather than a parameter.
runs:
  using: composite
  steps:
    # Restored once per JOB. It is the single largest fixed cost in the
    # pipeline, and every shard shares this one key - so raising the shard count
    # adds restores, never cache bytes.
    #
    # The key names every part of what it holds. The fetch below only runs on a
    # miss, so a key that omits one of them turns a fetch step into dead code
    # and serves the old bytes: without the build a cached binary stays frozen
    # until the entry is evicted, without the weights a config change to
    # `models.summarize` restores the previous model under the new alias, and
    # without the revision two uploads of one filename share an entry - which
    # would leave a repinned config stuck on a hit whose bytes fail the check
    # below on every run until the entry expires.
    #
    # `id` is load-bearing: the fetch reads `cache-hit` off it, and without the
    # id that condition is an expression resolving to nothing, which reads as
    # false and refetches on every run.
    - name: Cache weights and runtime
      id: weights
      uses: actions/cache@v6
      with:
        path: |
          backend/models
          backend/bin
        key: llm-${{ inputs.weights_file }}-${{ inputs.weights_revision }}-${{ inputs.llama_cpp_build }}-v4

    # One shared script. It sources the runtime install, which sources the pin,
    # so nothing here spells any part of either - and every value it reads
    # arrives through `env` rather than pasted into it (Guardrail #11).
    #
    # The lookup is authenticated, because every shard asks at once and
    # anonymous api.github.com allows 60 requests an hour.
    #
    # Why the script names an immutable revision and why `-f` is load-bearing
    # are written in the script, once.
    - name: Fetch runtime and weights
      if: steps.weights.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        WEIGHTS_REPO: ${{ inputs.weights_repo }}
        WEIGHTS_REVISION: ${{ inputs.weights_revision }}
        WEIGHTS_FILE: ${{ inputs.weights_file }}
        DRAFT_REPO: ${{ inputs.draft_repo }}
        DRAFT_REVISION: ${{ inputs.draft_revision }}
        DRAFT_FILE: ${{ inputs.draft_file }}
      run: bash .github/scripts/fetch-model-runtime.sh

    # No `if:`. This runs on a cache hit as well as a miss, because a restored
    # entry is the one case where nobody watched the bytes arrive. It sits
    # before the server starts, so wrong weights cost one step instead of a
    # shard of output filed under a model that never ran (Guardrail #10).
    #
    # The draft head, where the entry declares one, is checked in the same step
    # and to the same standard. A draft that fails its digest would be a second
    # set of weights nobody verified proposing tokens to the one we did - and
    # because the target verifies every draft, the run would produce correct
    # text and no error while paying for a guess that never lands. Silent and
    # expensive is the worst pair.
    - name: Verify the weights
      shell: bash
      env:
        WEIGHTS_FILE: ${{ inputs.weights_file }}
        DRAFT_FILE: ${{ inputs.draft_file }}
        DRAFT_SHA256: ${{ inputs.draft_sha256 }}
      run: |
        set -euo pipefail
        EXPECTED=$(python -c 'import json, pathlib; config = json.load(open("config/idhazh.json", encoding="utf-8")); models = json.load(open(pathlib.Path("config") / config["models_file"], encoding="utf-8")); print(models["summarize"]["sha256"] or "")')
        if [ -z "$EXPECTED" ]; then
          echo "config records no sha256 for models.summarize" >&2
          exit 1
        fi
        echo "${EXPECTED}  backend/models/${WEIGHTS_FILE}" | sha256sum --check
        if [ -n "${DRAFT_FILE}" ]; then
          echo "${DRAFT_SHA256}  backend/models/${DRAFT_FILE}" | sha256sum --check
        fi

    # One server a job, and one job a runner. Four servers on four logical CPUs
    # is an experiment this repository has already run: `llama-server` at 8
    # threads is slower than at 4 on this host at every prompt length, and 16
    # percent slower at decode. And one server does not leave room for a second -
    # measured over four captures of run 2026-08-29-3 on 2026-09-08, one server
    # peaks at 12.57 to 13.16 GiB and reaches 14.31 GiB with the job's python,
    # 96.0 percent of the 16 GB runner.
    - name: Start the model
      shell: bash
      env:
        LLAMA_WEIGHTS: backend/models/${{ inputs.weights_file }}
        LLAMA_PORT: ${{ inputs.port }}
      run: |
        .github/scripts/start-llama-server.sh summarize llama-server

    - name: Check model health
      shell: bash
      env:
        LLAMA_PORT: ${{ inputs.port }}
        WEIGHTS_FILE: ${{ inputs.weights_file }}
      run: |
        set -euo pipefail
        for _ in $(seq 1 120); do
          curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" && break
          sleep 5
        done
        # Assert it, do not hope. Without this the loop simply ends, every unit
        # of work fails as "model unreachable", and the job produces an empty
        # result that reads as a quiet day.
        curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null || {
          echo "llama-server never became healthy" >&2
          tail -50 llama-server.log >&2
          exit 1
        }
        # Healthy says a server answers. It does not say which weights it
        # answers for, and every row downstream is filed under the config alias
        # whether or not the server agrees.
        MODEL_ALIAS=$(python -c 'import json, pathlib; config = json.load(open("config/idhazh.json", encoding="utf-8")); models = json.load(open(pathlib.Path("config") / config["models_file"], encoding="utf-8")); print(models["summarize"]["id"])')
        curl -sf "http://127.0.0.1:${LLAMA_PORT}/v1/models" \
          | jq -e --arg alias "$MODEL_ALIAS" '[.data[].id] | index($alias) != null' > /dev/null || {
          echo "the server does not serve ${MODEL_ALIAS}" >&2
          curl -s "http://127.0.0.1:${LLAMA_PORT}/v1/models" >&2 || true
          exit 1
        }
        curl -sf "http://127.0.0.1:${LLAMA_PORT}/props" \
          | jq -e --arg file "${WEIGHTS_FILE}" '[.. | strings | select(endswith($file))] | length > 0' > /dev/null || {
          echo "the loaded weights are not ${WEIGHTS_FILE}" >&2
          curl -s "http://127.0.0.1:${LLAMA_PORT}/props" >&2 || true
          exit 1
        }
