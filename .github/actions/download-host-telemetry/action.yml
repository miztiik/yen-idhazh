name: Download this run's D7 host monitor
description: Refuse different native inputs or platforms and verify the shared executable
inputs:
  artifact_name:
    description: Monitor artifact produced by this run's plan job
    required: true
outputs:
  binary:
    description: Verified executable path
    value: ${{ steps.verify.outputs.binary }}
runs:
  using: composite
  steps:
    - name: Check the monitor's source and platform binding
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        NATIVE_INPUT_HASH: ${{ hashFiles('backend/rust/host-telemetry/Cargo.toml', 'backend/rust/host-telemetry/Cargo.lock', 'backend/rust/host-telemetry/rust-toolchain.toml', 'backend/rust/host-telemetry/src/**/*.rs') }}
        RUN_ID: ${{ github.run_id }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        test -n "$NATIVE_INPUT_HASH"
        # A retried consumer still uses the immutable artifact from its plan attempt.
        expected="^d7-host-${RUN_ID}-[1-9][0-9]*-${RUNNER_OS}-${RUNNER_ARCH}-${NATIVE_INPUT_HASH}$"
        if ! [[ "$ARTIFACT_NAME" =~ $expected ]]; then
          echo "D7 monitor artifact differs from this job's native inputs or platform" >&2
          exit 1
        fi

    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}
        path: backend/var/host-monitor-artifact

    - name: Verify and enable the shared monitor
      id: verify
      shell: bash
      working-directory: backend/var/host-monitor-artifact
      run: |
        set -euo pipefail
        sha256sum --check --strict idhazh-host-telemetry.sha256
        chmod +x idhazh-host-telemetry
        binary="$GITHUB_WORKSPACE/backend/var/host-monitor-artifact/idhazh-host-telemetry"
        echo "IDHAZH_HOST_TELEMETRY_BINARY=$binary" >> "$GITHUB_ENV"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"
