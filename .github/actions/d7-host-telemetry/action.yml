name: Build pinned D7 Rust host monitor
description: Build the Rust monitor used by a producer's isolated D7 lifecycle
inputs:
  enabled:
    description: Build only when the Rust producer path is selected
    required: false
    default: 'true'
  publish:
    description: Upload this run's binary and checksum for downstream jobs
    required: false
    default: 'false'
outputs:
  binary:
    description: Absolute path to the pinned monitor binary
    value: ${{ steps.build.outputs.binary }}
  artifact_name:
    description: Immutable run artifact bound to the native inputs and runner platform
    value: ${{ steps.package.outputs.artifact_name }}
runs:
  using: composite
  steps:
    - name: Refuse an unselected monitor build
      if: inputs.enabled != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "D7 Rust monitor build skipped because Rust telemetry was not selected"

    - name: Build the pinned Rust monitor
      id: build
      if: inputs.enabled == 'true'
      shell: bash
      working-directory: backend/rust/host-telemetry
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/backend/var/rust-host-telemetry
      run: |
        set -euo pipefail
        cargo build --locked --release
        binary="$CARGO_TARGET_DIR/release/idhazh-host-telemetry"
        test -x "$binary" || { echo "missing pinned D7 monitor: $binary" >&2; exit 1; }
        echo "IDHAZH_HOST_TELEMETRY_BINARY=$binary" >> "$GITHUB_ENV"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - name: Package the monitor and its checksum
      id: package
      if: inputs.enabled == 'true' && inputs.publish == 'true'
      shell: bash
      env:
        NATIVE_INPUT_HASH: ${{ hashFiles('backend/rust/host-telemetry/Cargo.toml', 'backend/rust/host-telemetry/Cargo.lock', 'backend/rust/host-telemetry/rust-toolchain.toml', 'backend/rust/host-telemetry/src/**/*.rs') }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        BINARY: ${{ steps.build.outputs.binary }}
      run: |
        set -euo pipefail
        test -n "$NATIVE_INPUT_HASH"
        artifact_name="d7-host-${RUN_ID}-${RUN_ATTEMPT}-${RUNNER_OS}-${RUNNER_ARCH}-${NATIVE_INPUT_HASH}"
        mkdir -p backend/var/host-monitor-artifact
        cp "$BINARY" backend/var/host-monitor-artifact/idhazh-host-telemetry
        cd backend/var/host-monitor-artifact
        sha256sum idhazh-host-telemetry > idhazh-host-telemetry.sha256
        echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

    - name: Upload this run's monitor
      if: inputs.enabled == 'true' && inputs.publish == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.artifact_name }}
        path: |
          backend/var/host-monitor-artifact/idhazh-host-telemetry
          backend/var/host-monitor-artifact/idhazh-host-telemetry.sha256
        retention-days: 1
        if-no-files-found: error
