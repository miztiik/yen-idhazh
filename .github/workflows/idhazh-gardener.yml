name: Idhazh Gardener

# The gardener: every task that deletes, compacts or rewrites what this
# repository keeps, on one daily wake. What a task is, how a wake splits into
# shards and how a shard lands its one record is
# docs/architecture/publishing/idhazh-gardener.md. This file names no task: the
# `plan` job reads the declarations under config/gardener/, so adding a task is
# a declaration, plus a module only when nothing serves its kind.
#
# Three jobs, in order:
#   plan       splits the active tasks into shards, standard library only,
#              before anything of ours is installed
#   run-tasks  one job a shard. Each runs its tasks, writes one record under
#              state/raw/gardener/ and pushes it, trying again on a newer tip
#   history    the corpus squash, once every shard has ended, unless the run was
#              cancelled. It decides for itself whether the squash is due, and it
#              is the one job in this repository that force-pushes main, the
#              exception CLAUDE.md section 8 allows
#
# A push made with the default GITHUB_TOKEN starts no workflow. That is what
# keeps the shards' pushes, one a shard every day, from starting a CI run each,
# and it is why every job here uses that token and never a personal one.
#
# Why the squash exists, said out loud rather than implied: `corpus/` commits
# article text, and git history is append-only - deleting a row from the window
# does not delete its bytes from the repository. Left alone the history grows
# about 2.96 MB per harvest commit, which is 154 MB a year at
# `finetune.harvest_every_days: 7`. The only way to bound that is to rewrite the
# range those bytes are in. What it costs: a squash boundary is per-commit and
# not per-path, so the range it collapses carries `backend/`, `docs/` and
# `state/` as well as `corpus/`. After a squash `git blame` and `git bisect`
# reach back the `window` of `config/gardener/corpus-squash.json`, a commit SHA
# older than the boundary stops resolving, and a clone taken before the squash
# has to be re-fetched. Owner decision, 2026-08-28.
#
# Wired to nothing. A job that rewrites history must not sit inside the digest
# pipeline, which runs for hours and must not be put at risk by a maintenance
# task.
#
# This file was .github/workflows/prune.yml until 2026-09-28. GitHub treats a
# renamed file as a new workflow, so the runs before the rename stay listed
# under their old name, `Corpus prune`.

on:
  schedule:
    # Daily. The squash's CADENCE is not here and cannot be: `on.schedule` is
    # parsed before any step runs, so no value in `config/` can reach a cron
    # line, and 5-field cron has no every-N-days field to write one with.
    # `every_days` in `config/gardener/corpus-squash.json` is the cadence and
    # this cron is only the wake-up. Every other task runs at every wake, and
    # its own window decides what it takes.
    #
    # The MINUTE is after the UTC day boundary, so which days a compaction may
    # take is decided by each day's own end and never by where the wake falls,
    # and 40 minutes past the hour misses GitHub's top-of-hour surge.
    #
    # The force push at the end of the history job has to land while no other
    # scheduled run is pushing main. Read from the run list on 2026-09-28: the
    # last digest run of each day ended by 00:52 UTC and none was created
    # before 07:23 (2026-09-16 to 28), and the council ran from 23:57 to 01:23
    # (2026-09-19 to 28), which leaves 01:23 to 07:23 quiet. A 00:40 wake is
    # not measured yet. The two nearest cron lines were created 112 to 139
    # minutes late (23:37) and 259 to 334 minutes late (04:20), so this one is
    # estimated at 02:32 to 06:14, and the three jobs' timeouts bound the chain
    # in front of the push at 5 + 20 + 30 = 55 minutes. The push lands between
    # 02:32 and 07:09: 69 minutes after the council at the earliest, 14 minutes
    # before the first digest at the latest. The first scheduled wakes' own
    # delays replace the estimate. backend/tests/workflows/test_triggers.py
    # holds these numbers, and docs/reference/github-actions.md derives them.
    #
    # This lowers the odds; it does not close them. What keeps a clash from
    # costing another run its commits is the lease the push carries: git will
    # not replace a main that moved after the job read it.
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Squash now, even if every_days in config/gardener/corpus-squash.json says it is not due. Every other task runs at every wake anyway'
        type: boolean
        default: false

# Reading only, at workflow level. Each job names the whole of what it uses, so
# the job that force-pushes holds no Actions permission it never calls.
permissions:
  contents: read

# Never two of these at once, and never cancelled half way: the history job
# rewrites a branch, and a second copy racing the first would push two different
# histories. Not keyed on the ref, or a dispatch and a schedule would run together.
concurrency:
  group: idhazh-gardener
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      any_active_task: ${{ steps.shards.outputs.any_active_task }}
      shard_count: ${{ steps.shards.outputs.shard_count }}
      matrix: ${{ steps.shards.outputs.matrix }}
      run_id: ${{ steps.run.outputs.run_id }}
    steps:
      # The two folders the planner reads and nothing else: it runs before any
      # install, and it opens nothing outside `config/`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend/utilities

      # Which shard runs which task, from the declarations alone. Three lines for
      # $GITHUB_OUTPUT: whether any task runs, how many shards, and the matrix.
      - id: shards
        run: |
          set -euo pipefail
          python3 backend/utilities/gardener_shards.py | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # One run id for every shard and the history job, read once. Re-running a
      # failed shard keeps this job's outputs, so the shard keeps the run it
      # belongs to.
      - id: run
        run: |
          set -euo pipefail
          echo "run_id=$(date -u +%F)-${GITHUB_RUN_ID}" | tee /dev/stderr >> "$GITHUB_OUTPUT"

  run-tasks:
    needs: plan
    if: needs.plan.outputs.any_active_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `contents: write` pushes the shard's record. `actions: write` lets the two
    # collection tasks list this repository's workflow artifacts and runs, and
    # delete them once a person turns their dry run off.
    permissions:
      contents: write
      actions: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.shard_count) }}
    steps:
      # The checkout holds only the three folders the code and config live in.
      # Every name a task decides from comes from the commit: gardener_publish.py
      # lists the files under the folders the shard's tasks own or read with
      # `git ls-tree`, and downloads none of them. A task that reads a file's
      # content first widens this checkout by the day or month folders that step
      # reads, in one download. `blob:none` downloads no file outside the
      # checkout, and a task never takes a file it lacks for a member that is not
      # there: it fetches the file or it fails.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend
            .github

      # Each widening rewrites the checkout's index, which expands it to the
      # whole repository unless the index is sparse, and actions/checkout leaves
      # it not. The commit a shard lands is built in an index of its own.
      - name: Keep the index sparse
        run: git config index.sparse true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Runs the shard's tasks, writes its one record and pushes it, trying again
      # on a newer tip when another shard pushed first. It exits with the worst
      # code it earned: 2 ownership or integrity, 3 the push kept losing, 1 a
      # task failed, the shard downloaded more than max_downloaded_mb, or the
      # files under its folders could not be listed. The token also reads the
      # size of each file the clone never downloaded, from GitHub's trees API.
      - name: Run the shard's tasks and land its record
        env:
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backend/utilities/gardener_publish.py --shard "$SHARD" --run-id "$RUN_ID" --attempt "$ATTEMPT"

  history:
    # After every shard has ended, so history is rewritten last, and whatever
    # the shards did: a red shard's push has already ended, and its work is
    # tried again at the next wake either way. A skipped `needs` would skip this
    # job too, so it runs on `!cancelled()`: a day no task is active and a day a
    # shard failed both still squash, and only a cancel stops it. The person's
    # ruling, 2026-09-29.
    needs: [plan, run-tasks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Shallow, because 29 wakes out of 30 only read one committed file. The
      # full history is fetched below, and only when there is something to do.
      # Both checkouts take `main` as it is now rather than the commit this run
      # was created at: the shards pushed after that, and a rewrite of the old
      # commit would find main moved, so its first push would be refused on
      # every due wake.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      # Reads two committed files and writes nothing. The record of the run that
      # closes the loop is written by the program further down. A stamp it cannot
      # read ends the job here, before the full clone: it prints no `due`.
      - id: due
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          python3 backend/utilities/corpus_squash_due.py | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Not due
        if: steps.due.outputs.due != 'true'
        run: |
          echo "last run: ${{ steps.due.outputs.last_run }}, and the squash is ${{ steps.due.outputs.lifecycle_status }}"
          echo "nothing to squash - fewer than every_days in config/gardener/corpus-squash.json have passed"

      # Everything below only runs on the day the squash is due, which is why the
      # full clone happens about twelve times a year rather than daily.
      - uses: actions/checkout@v6
        if: steps.due.outputs.due == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.due.outputs.due == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.due.outputs.due == 'true'
        run: pip install -e .

      # The squash, the record of the run and the one force-push in this
      # repository, in one program so the decision to force never crosses a step
      # as an environment string. It remembers the tip before it rewrites
      # anything, collapses what is older than the declaration's window into one
      # root holding a complete copy of the tree, records the run whether or not
      # anything was old enough, and pushes - with force only when it rewrote,
      # and then with a lease on the tip it remembered, so git refuses the push
      # if another run pushed while this job was rewriting. A refused push is
      # followed by the whole squash again on the new tip, up to `push_attempts`
      # pushes in all; after the last refusal the run is not recorded.
      #
      # A program rather than inline shell, so a test can drive it against a real
      # repository and watch it refuse. `today` is the due step's own reading, so
      # the job reads the clock once. The run id is the plan job's, so every
      # record of one run carries one id even when the run crosses 00:00 UTC.
      # This job makes its own only when the plan job failed and left none. The
      # owner's ruling, 2026-10-04.
      - name: Squash the history, record the run and push it
        if: steps.due.outputs.due == 'true'
        env:
          TODAY: ${{ steps.due.outputs.today }}
          RUN_ID: ${{ needs.plan.outputs.run_id || format('{0}-{1}', steps.due.outputs.today, github.run_id) }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python backend/utilities/corpus_history.py --today "$TODAY" --run-id "$RUN_ID" --attempt "$ATTEMPT"
