name: Idhazh Gardener

# The gardener: every task that deletes, compacts or rewrites what this
# repository keeps, on one daily wake. What a task is, how a wake splits into
# shards and how a shard lands its one record is
# docs/architecture/publishing/idhazh-gardener.md. This file names no task: the
# `plan` job reads the declarations under config/gardener/, so adding a task is
# a declaration, plus a module only when nothing serves its kind.
#
# Jobs, in order:
#   plan       splits the active tasks into shards with the standard library
#   run-tasks  one job a shard. Each runs its tasks, writes one record under
#              state/raw/gardener/ and pushes it, trying again on a newer tip
#   history    the corpus squash, once every shard has ended, unless cancelled or
#              dispatched for telemetry proof. It decides if a squash is due and
#              is the one job in this repository that force-pushes main, the
#              exception CLAUDE.md section 8 allows
#   publish-fingerprints appends verified control evidence after history ends
#
# A push made with the default GITHUB_TOKEN starts no workflow. That is what
# keeps the shards' pushes, one a shard every day, from starting a CI run each,
# and it is why every job here uses that token and never a personal one.
#
# Why the squash exists, said out loud rather than implied: `corpus/` commits
# article text, and git history is append-only - deleting a row from the window
# does not delete its bytes from the repository. Left alone the history grows
# about 2.96 MB per harvest commit, which is 154 MB a year at
# `finetune.harvest_every_days: 7`. The only way to bound that is to rewrite the
# range those bytes are in. What it costs: a squash boundary is per-commit and
# not per-path, so the range it collapses carries `backend/`, `docs/` and
# `state/` as well as `corpus/`. After a squash `git blame` and `git bisect`
# reach back the `window` of `config/gardener/corpus-squash.json`, a commit SHA
# older than the boundary stops resolving, and a clone taken before the squash
# has to be re-fetched. Maintainer decision, 2026-08-28.
#
# Wired to nothing. A job that rewrites history must not sit inside the digest
# pipeline, which runs for hours and must not be put at risk by a maintenance
# task.
#
# This file was .github/workflows/prune.yml until 2026-09-28. GitHub treats a
# renamed file as a new workflow, so the runs before the rename stay listed
# under their old name, `Corpus prune`.

on:
  schedule:
    # Daily. The squash's CADENCE is not here and cannot be: `on.schedule` is
    # parsed before any step runs, so no value in `config/` can reach a cron
    # line, and 5-field cron has no every-N-days field to write one with.
    # `every_days` in `config/gardener/corpus-squash.json` is the cadence and
    # this cron is only the wake-up. Every other task runs at every wake, and
    # its own window decides what it takes.
    #
    # The MINUTE is after the UTC day boundary, so which days a compaction may
    # take is decided by each day's own end and never by where the wake falls,
    # and 40 minutes past the hour misses GitHub's top-of-hour surge.
    #
    # Scheduled runs do not reserve a gap on main. If another writer moves main
    # while this job runs, the push lease refuses the stale tip, and the next
    # due wake retries the rewrite.
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Squash now even if the configured cadence is not due. Cannot be combined with telemetry_proof'
        type: boolean
        default: false
      telemetry_proof:
        description: 'Run only active host fingerprint and task performance compaction; skip history. Cannot be combined with force'
        type: boolean
        default: false
      host_telemetry:
        description: 'TypeScript host telemetry, Python rollback on task shards, or off'
        type: choice
        default: typescript
        options:
          - typescript
          - python
          - 'off'
      memory_profiling:
        description: 'OS memory and fault collection; inherit reads shared config'
        type: choice
        default: inherit
        options:
          - inherit
          - 'on'
          - 'off'

# Reading only, at workflow level. Each job names the whole of what it uses, so
# the job that force-pushes holds no Actions permission it never calls.
permissions:
  contents: read

env:
  IDHAZH_HOST_TELEMETRY_MODE: ${{ inputs.host_telemetry || 'typescript' }}
  MEMORY_PROFILING: ${{ inputs.memory_profiling || 'inherit' }}

# Never two of these at once, and never cancelled half way: the history job
# rewrites a branch, and a second copy racing the first would push two different
# histories. Not keyed on the ref, or a dispatch and a schedule would run together.
concurrency:
  group: idhazh-gardener
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      any_active_task: ${{ steps.shards.outputs.any_active_task }}
      shard_count: ${{ steps.shards.outputs.shard_count }}
      matrix: ${{ steps.shards.outputs.matrix }}
      history_allowed: ${{ steps.shards.outputs.history_allowed }}
      run_id: ${{ steps.run.outputs.run_id }}
      control_run_id: ${{ steps.identity.outputs.run_id }}
      control_attempt: ${{ steps.control_bundle.outputs.attempt }}
      control_artifact: ${{ steps.control_artifact.outputs.artifact-id }}
    steps:
      # The planner reads only config and the standard-library crash printer.
      # The named native packages are only for optional control telemetry.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend/utilities
            backend/idhazh
            .github/actions/machine-apis
            packages/common-contracts
            packages/ledger-file-writer
            services/serve-pipeline-apis
            services/host-fingerprints
            services/host-probes

      # Minted once. A partial retry can receive this output from an earlier try.
      - id: identity
        run: |
          set -euo pipefail
          echo "run_id=$(date -u +%F)-${GITHUB_RUN_ID}" | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Prepare machine APIs
        if: env.IDHAZH_HOST_TELEMETRY_MODE != 'off'
        id: instrument
        continue-on-error: true
        uses: ./.github/actions/machine-apis
        with:
          mode: ${{ env.IDHAZH_HOST_TELEMETRY_MODE }}
          pipeline: gardener

      - name: Capture the planner's opening fingerprint
        if: steps.instrument.outcome == 'success'
        id: opening
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gardener-instrument-venv"
          PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
          "$PY" -m pip install -q -e .
          MODE=$("$PY" backend/utilities/host_telemetry_control.py "$IDHAZH_HOST_TELEMETRY_MODE")
          [ "$MODE" != off ] || exit 0
          echo "ready=true" >> "$GITHUB_OUTPUT"
          "$PY" backend/utilities/machine_task.py --run-id "$RUN_ID" -- \
            "$PY" backend/utilities/gardener_fingerprint.py --run-id "$RUN_ID" \
            --job plan --out "$RUNNER_TEMP/gardener-opening"

      # The planner combines the declarations and the runner's manual dispatch
      # event, then outputs the shard matrix and whether history may run.
      - id: shards
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          CONTROL_READY: ${{ steps.opening.outputs.ready }}
        run: |
          set -euo pipefail
          if [ "$CONTROL_READY" = true ]; then
            PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
            BUNDLE="$RUNNER_TEMP/gardener-opening"
            "$PY" backend/utilities/gardener_fingerprint.py --run-id "$RUN_ID" --job plan -- \
              "$PY" backend/utilities/gardener_control_task.py plan --run-id "$RUN_ID" --out "$BUNDLE"
          else
            python3 backend/utilities/gardener_shards.py
          fi | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # On planning failure, history still uses its existing run-ID fallback.
      - id: run
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - id: control_bundle
        if: ${{ !cancelled() && steps.opening.outputs.ready == 'true' }}
        continue-on-error: true
        run: |
          if [ -d "$RUNNER_TEMP/gardener-opening" ]; then
            echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi

      - id: control_artifact
        if: ${{ !cancelled() && steps.control_bundle.outputs.attempt != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gardener-fingerprint-plan-${{ steps.identity.outputs.run_id }}-${{ steps.control_bundle.outputs.attempt }}
          path: ${{ runner.temp }}/gardener-opening
          if-no-files-found: error

  run-tasks:
    # A run's page lists what every shard ran without opening a job. The names
    # come from the plan's matrix, so this file holds the format and never a
    # list of tasks.
    name: "shard ${{ matrix.shard }}: ${{ join(matrix.task_names, ', ') }}"
    needs: plan
    if: needs.plan.outputs.any_active_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: index.sparse
      GIT_CONFIG_VALUE_0: 'true'
    # `contents: write` pushes the shard's record. `actions: write` lets the two
    # collection tasks list this repository's workflow artifacts and runs, and
    # delete them once a person turns their dry run off.
    permissions:
      contents: write
      actions: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.shard_count) }}
    steps:
      # Planner data arrives with code at this ref. Planner tasks read only
      # named local periods; other families retain their named commit listing
      # and content acquisition.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend
            .github
            packages/common-contracts
            packages/ledger-file-writer
            services/serve-pipeline-apis
            services/host-fingerprints
            services/host-probes
            state/raw/feed-ingest-plan
            state/compact/feed-ingest-plan

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: oven-sh/setup-bun@v2
        if: contains(join(matrix.task_names, ','), 'compact-feed-ingest-plan-')
        with:
          bun-version: '1.3.13'

      - name: Install planner ledger contracts and writer
        if: contains(join(matrix.task_names, ','), 'compact-feed-ingest-plan-')
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd packages/ledger-file-writer

      - name: Resolve host telemetry
        id: host_telemetry
        env:
          REQUESTED: ${{ env.IDHAZH_HOST_TELEMETRY_MODE }}
        run: |
          set -euo pipefail
          MODE=$(python backend/utilities/host_telemetry_control.py "$REQUESTED" --config-root config)
          echo "IDHAZH_HOST_TELEMETRY_MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Prepare machine APIs
        continue-on-error: true
        uses: ./.github/actions/machine-apis
        with:
          mode: ${{ steps.host_telemetry.outputs.mode }}
          pipeline: gardener
          shard: ${{ matrix.shard }}
          publication_runtime_ready: ${{ contains(join(matrix.task_names, ','), 'compact-feed-ingest-plan-') }}

      # Runs the shard's tasks, writes its one record and pushes it, trying again
      # on a newer tip when another shard pushed first. It exits with the worst
      # code it earned: 2 ownership or integrity, 3 main refused the push, 1 a
      # task failed, the shard downloaded more than max_downloaded_mb, or the
      # files under its folders could not be listed. A shard whose work is out
      # of date lands nothing, warns and exits 0: main changed one of its paths
      # after its commit, or main kept moving through every try. The token also
      # reads the size of each file the clone never downloaded, from GitHub's
      # trees API.
      - name: Run the shard's tasks and land its record
        env:
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/utilities/machine_task.py --run-id "$RUN_ID" -- \
            python backend/utilities/gardener_publish.py \
            --shard "$SHARD" --run-id "$RUN_ID" --attempt "$ATTEMPT"

  history:
    # After every shard has ended, so history is rewritten last, and whatever
    # the shards did: a red shard's push has already ended, and its work is
    # tried again at the next wake either way. A skipped `needs` would skip this
    # job too, so ordinary wakes keep the explicit cancellation check. On a
    # proof dispatch the input vetoes history even if no planner output survived.
    needs: [plan, run-tasks]
    if: ${{ !cancelled() && inputs.telemetry_proof != true && needs.plan.outputs.history_allowed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      control_run_id: ${{ steps.opening.outputs.run_id }}
      control_attempt: ${{ steps.control_bundle.outputs.attempt }}
      control_artifact: ${{ steps.control_artifact.outputs.artifact-id }}
    steps:
      # Take the instrument from the workflow revision, not the newer tip the
      # actual history job must read and rewrite. Do not retain its credential.
      - id: instrument_checkout
        if: env.IDHAZH_HOST_TELEMETRY_MODE != 'off'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: gardener-instrument
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend/utilities
            backend/idhazh
            .github/actions/machine-apis
            packages/common-contracts
            packages/ledger-file-writer
            services/serve-pipeline-apis
            services/host-fingerprints
            services/host-probes

      - name: Prepare machine APIs
        id: instrument
        if: steps.instrument_checkout.outcome == 'success'
        continue-on-error: true
        uses: ./gardener-instrument/.github/actions/machine-apis
        with:
          mode: ${{ env.IDHAZH_HOST_TELEMETRY_MODE }}
          pipeline: gardener
          checkout_path: gardener-instrument

      - name: Capture the history runner, whether or not a rewrite is due
        if: steps.instrument.outcome == 'success'
        id: opening
        continue-on-error: true
        working-directory: gardener-instrument
        env:
          PLANNED_RUN_ID: ${{ needs.plan.outputs.control_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${PLANNED_RUN_ID:-$(date -u +%F)-$GITHUB_RUN_ID}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python3 -m venv "$RUNNER_TEMP/gardener-instrument-venv"
          PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
          "$PY" -m pip install -q -e .
          MODE=$("$PY" backend/utilities/host_telemetry_control.py "$IDHAZH_HOST_TELEMETRY_MODE")
          [ "$MODE" != off ] || exit 0
          echo "ready=true" >> "$GITHUB_OUTPUT"
          "$PY" backend/utilities/machine_task.py --run-id "$RUN_ID" -- \
            "$PY" backend/utilities/gardener_fingerprint.py --run-id "$RUN_ID" \
            --job history --out "$RUNNER_TEMP/gardener-opening"

      # Shallow, because 29 wakes out of 30 only read one committed file. The
      # full history is fetched below, and only when there is something to do.
      # Both checkouts take `main` as it is now rather than the commit this run
      # was created at: the shards pushed after that, and a rewrite of the old
      # commit would find main moved, so its first push would be refused on
      # every due wake.
      - uses: actions/checkout@v6
        with:
          ref: main
          path: gardener-history
          fetch-depth: 1

      # Reads two committed files and writes nothing. The record of the run that
      # closes the loop is written by the program further down. A stamp it cannot
      # read ends the job here, before the full clone: it prints no `due`.
      - id: due
        working-directory: gardener-history
        env:
          FORCE: ${{ inputs.force }}
          CONTROL_READY: ${{ steps.opening.outputs.ready }}
          CONTROL_RUN_ID: ${{ steps.opening.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$CONTROL_READY" = true ]; then
            PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
            BUNDLE="$RUNNER_TEMP/gardener-opening"
            cd "$GITHUB_WORKSPACE/gardener-instrument"
            "$PY" backend/utilities/gardener_fingerprint.py --run-id "$CONTROL_RUN_ID" --job history -- \
              "$PY" backend/utilities/gardener_control_task.py check-history-eligibility \
              --run-id "$CONTROL_RUN_ID" --out "$BUNDLE" --history-root "$GITHUB_WORKSPACE/gardener-history"
          else
            python3 backend/utilities/corpus_squash_due.py
          fi | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Not due
        if: steps.due.outputs.due != 'true'
        run: |
          echo "last run: ${{ steps.due.outputs.last_run }}, and the squash is ${{ steps.due.outputs.lifecycle_status }}"
          echo "nothing to squash - fewer than every_days in config/gardener/corpus-squash.json have passed"

      # Everything below only runs on the day the squash is due, which is why the
      # full clone happens about twelve times a year rather than daily.
      - uses: actions/checkout@v6
        if: steps.due.outputs.due == 'true'
        with:
          ref: main
          path: gardener-history
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.due.outputs.due == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gardener-history/pyproject.toml

      - name: Install
        if: steps.due.outputs.due == 'true'
        working-directory: gardener-history
        run: pip install -e .

      # The squash, the record of the run and the one force-push in this
      # repository, in one program so the decision to force never crosses a step
      # as an environment string. It remembers the tip before it rewrites
      # anything, collapses what is older than the declaration's window into one
      # root holding a complete copy of the tree, records the run whether or not
      # anything was old enough, and pushes - with force only when it rewrote,
      # and then with a lease on the tip it remembered, so git refuses the push
      # if another run pushed while this job was rewriting. A refused push is
      # followed by the whole squash again on the new tip, up to `push_attempts`
      # pushes in all; after the last refusal the run is not recorded.
      #
      # A program rather than inline shell, so a test can drive it against a real
      # repository and watch it refuse. `today` is the due step's own reading, so
      # the job reads the clock once. The run id is the plan job's, so every
      # record of one run carries one id even when the run crosses 00:00 UTC.
      # This job makes its own only when the plan job failed and left none. The
      # maintainer's ruling, 2026-10-04.
      - name: Squash the history, record the run and push it
        if: steps.due.outputs.due == 'true'
        working-directory: gardener-history
        env:
          TODAY: ${{ steps.due.outputs.today }}
          RUN_ID: ${{ needs.plan.outputs.run_id || format('{0}-{1}', steps.due.outputs.today, github.run_id) }}
          ATTEMPT: ${{ github.run_attempt }}
          CONTROL_READY: ${{ steps.opening.outputs.ready }}
          CONTROL_RUN_ID: ${{ steps.opening.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$CONTROL_READY" = true ]; then
            PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
            BUNDLE="$RUNNER_TEMP/gardener-opening"
            cd "$GITHUB_WORKSPACE/gardener-instrument"
            "$PY" backend/utilities/gardener_fingerprint.py --run-id "$CONTROL_RUN_ID" --job history -- \
              "$PY" backend/utilities/gardener_control_task.py corpus-squash \
              --run-id "$CONTROL_RUN_ID" --out "$BUNDLE" --history-root "$GITHUB_WORKSPACE/gardener-history" \
              --today "$TODAY" --history-run-id "$RUN_ID"
          else
            python backend/utilities/corpus_history.py --today "$TODAY" --run-id "$RUN_ID" --attempt "$ATTEMPT"
          fi

      - id: control_bundle
        if: ${{ !cancelled() && steps.opening.outputs.ready == 'true' }}
        continue-on-error: true
        run: |
          if [ -d "$RUNNER_TEMP/gardener-opening" ]; then
            echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi

      - id: control_artifact
        if: ${{ !cancelled() && steps.control_bundle.outputs.attempt != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gardener-fingerprint-history-${{ steps.opening.outputs.run_id }}-${{ steps.control_bundle.outputs.attempt }}
          path: ${{ runner.temp }}/gardener-opening
          if-no-files-found: error

  publish-fingerprints:
    needs: [plan, history]
    if: always() && !cancelled() && inputs.host_telemetry != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RUN_ID: ${{ needs.plan.outputs.control_run_id || needs.history.outputs.control_run_id }}
      PLAN_ATTEMPT: ${{ needs.plan.outputs.control_attempt }}
      HISTORY_ATTEMPT: ${{ needs.history.outputs.control_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend/utilities
            backend/idhazh
            .github/actions/machine-apis
            packages/common-contracts
            packages/ledger-file-writer
            services/serve-pipeline-apis
            services/host-fingerprints
            services/host-probes

      - name: Prepare the control evidence verifier
        id: host_telemetry
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gardener-instrument-venv"
          PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
          "$PY" -m pip install -q -e .
          MODE=$("$PY" backend/utilities/host_telemetry_control.py "$IDHAZH_HOST_TELEMETRY_MODE")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "IDHAZH_HOST_TELEMETRY_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Prepare machine APIs
        continue-on-error: true
        uses: ./.github/actions/machine-apis
        with:
          mode: ${{ steps.host_telemetry.outputs.mode }}
          pipeline: gardener

      - name: Capture the append runner's opening fingerprint
        if: env.IDHAZH_HOST_TELEMETRY_MODE != 'off'
        id: opening
        continue-on-error: true
        run: |
          set -euo pipefail
          RUN_ID="${RUN_ID:-$(date -u +%F)-$GITHUB_RUN_ID}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
          "$PY" backend/utilities/machine_task.py --run-id "$RUN_ID" -- \
            "$PY" backend/utilities/gardener_fingerprint.py --run-id "$RUN_ID" \
            --job publish-fingerprints --out "$RUNNER_TEMP/gardener-opening"

      - name: Name only the artifacts the producing jobs uploaded
        id: downloads
        env:
          PLAN_ARTIFACT: ${{ needs.plan.outputs.control_artifact }}
          HISTORY_ARTIFACT: ${{ needs.history.outputs.control_artifact }}
        run: |
          set -euo pipefail
          ids=()
          if [ -n "$PLAN_ARTIFACT" ]; then ids+=("$PLAN_ARTIFACT"); fi
          if [ -n "$HISTORY_ARTIFACT" ]; then ids+=("$HISTORY_ARTIFACT"); fi
          (IFS=,; echo "ids=${ids[*]}") >> "$GITHUB_OUTPUT"

      - if: env.IDHAZH_HOST_TELEMETRY_MODE != 'off' && steps.downloads.outputs.ids != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.downloads.outputs.ids }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/gardener-incoming
          merge-multiple: false

      - name: Verify and append the named control evidence
        if: env.IDHAZH_HOST_TELEMETRY_MODE != 'off'
        env:
          CAPTURE_RUN_ID: ${{ steps.opening.outputs.run_id }}
        run: |
          set -euo pipefail
          expected=()
          if [ -n "$PLAN_ATTEMPT" ]; then expected+=(--plan-attempt "$PLAN_ATTEMPT"); fi
          if [ -n "$HISTORY_ATTEMPT" ]; then expected+=(--history-attempt "$HISTORY_ATTEMPT"); fi
          PY="$RUNNER_TEMP/gardener-instrument-venv/bin/python"
          RUN_ID="${CAPTURE_RUN_ID:-$RUN_ID}"
          BUNDLE="$RUNNER_TEMP/gardener-opening"
          "$PY" backend/utilities/gardener_fingerprint.py --run-id "$RUN_ID" --job publish-fingerprints -- \
            "$PY" backend/utilities/gardener_fingerprint_publish.py --run-id "$RUN_ID" \
