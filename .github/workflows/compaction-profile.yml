name: Compaction profile

# One reading of docs/reference/benchmarks/what-a-compaction-pass-costs.md's
# small-file I/O cost on the stock ubuntu-latest runner (CLAUDE.md Guardrail
# #2), to tell whether that cost is a cost of the code or a cost of the
# Windows machine it was first measured on.
#
# workflow_dispatch only. This is a one-off reading a person takes when the
# benchmarks page needs an update, not a check every change has to pay for.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Profile the every-tier fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra, because the profiled fixture imports backend/tests
      # helpers (conftest, pytest-only fixtures) the same way the gates job's
      # own test run does.
      - name: Install the backend development environment
        run: pip install -e ".[dev]"

      - name: Profile the current compaction fixture
        run: |
          set -euo pipefail
          mkdir -p backend/var
          python backend/utilities/benchmark_compaction.py --profile-current \
            | tee backend/var/compaction-profile.json

      - name: Render the profile as the two ranked tables
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          reading = json.loads(
              Path("backend/var/compaction-profile.json").read_text(encoding="utf-8")
          )

          def table(title, rows, seconds_key):
              lines = [f"### {title}", "", "| Function | Calls | Seconds |", "| --- | ---: | ---: |"]
              for row in rows:
                  lines.append(f"| {row['function']} | {row['calls']} | {row[seconds_key]:.3f} |")
              return "\n".join(lines)

          print(f"Wall time: {reading['seconds']:.3f} seconds")
          print()
          print(table("By total time (includes callees)", reading["by_total"], "total_seconds"))
          print()
          print(table("By self time (inside the function only)", reading["by_self"], "self_seconds"))
          PY
