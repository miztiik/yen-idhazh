name: Summary evaluator checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/hhem-evaluator
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the complete model-free suites
        uses: ./.github/actions/check-summary-evaluator

      - name: Retain the current test result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: summary-evaluator-model-free-results
          path: services/hhem-evaluator/var/model-free-results.xml
          if-no-files-found: warn
