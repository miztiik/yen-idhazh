name: Summary evaluator checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/**'
      - 'packages/**'
      - 'backend/**'
      - 'config/**'
      - 'tests/fixtures/**'
      - '.github/scripts/summary-eval-tests/**'
      - '.github/actions/check-summary-evaluator/**'
      - '.github/workflows/summary-evaluator-checks.yml'

permissions:
  contents: read

jobs:
  model-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/summary_evaluator
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the complete model-free suites
        uses: ./.github/actions/check-summary-evaluator

      - name: Retain the current test result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: summary-evaluator-model-free-results
          path: services/summary_evaluator/var/model-free-results.xml
          if-no-files-found: warn
