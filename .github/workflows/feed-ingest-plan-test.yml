name: Feed ingest plan test

on:
  workflow_dispatch:
    inputs:
      # CI checks these form defaults against the committed planner config.
      freshness_hours:
        description: Maximum article age in hours for this run
        required: true
        default: '24'
        type: string
      article_limit:
        description: Optional positive article limit; blank uses configuration
        required: false
        default: '100'
        type: string
      shards:
        description: Optional positive worker count; blank uses configuration
        required: false
        default: '4'
        type: string
      partition_strategy:
        description: Article distribution; for none, clear shards or set it to 1
        required: false
        default: 'bin-pack'
        type: choice
        options:
          - bin-pack
          - round-robin
          - none

permissions:
  contents: write

jobs:
  isolated-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/
            /packages/common-contracts/package.json
            /packages/common-contracts/bun.lock
            /packages/common-contracts/src/
            /packages/data-delivery/package.json
            /packages/data-delivery/bun.lock
            /packages/data-delivery/src/
            /packages/ledger-file-writer/package.json
            /packages/ledger-file-writer/bun.lock
            /packages/ledger-file-writer/src/
            /services/feed-ingest-plan/package.json
            /services/feed-ingest-plan/bun.lock
            /services/feed-ingest-plan/src/
            /services/feed-ingest-plan/scripts/
            /services/host-fingerprints/package.json
            /services/host-fingerprints/bun.lock
            /services/host-fingerprints/src/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install declared TypeScript dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd packages/data-delivery
          bun install --frozen-lockfile --cwd packages/ledger-file-writer
          bun install --frozen-lockfile --cwd services/feed-ingest-plan
          bun install --frozen-lockfile --cwd services/host-fingerprints

      - name: Collect and select articles
        id: plan
        env:
          FRESHNESS_HOURS: ${{ inputs.freshness_hours }}
          ARTICLE_LIMIT: ${{ inputs.article_limit }}
          SHARDS: ${{ inputs.shards }}
          PARTITION_STRATEGY: ${{ inputs.partition_strategy }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-http-proof.ts

      - name: Record workflow cancellation
        id: cancellation
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"

      - name: Commit ledgers and write report
        id: finalize
        if: ${{ always() }}
        env:
          CURRENT_RUN_FILES: ${{ steps.plan.outputs.current_run_files }}
          RUN_CANCELLED: ${{ steps.cancellation.outputs.cancelled == 'true' }}
        run: bun run services/feed-ingest-plan/scripts/finalize-run-output.ts

      - name: Upload run artifacts
        id: upload
        if: ${{ always() && steps.finalize.outputs.artifact_directory != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: collect-and-select-articles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.finalize.outputs.artifact_directory }}
          if-no-files-found: error

      - name: Finish and clean up
        if: ${{ always() }}
        env:
          COLLECTION_OUTCOME: ${{ steps.plan.outcome }}
          PLANNING_COMPLETE: ${{ steps.plan.outputs.planning_complete }}
          FINALIZATION_OUTCOME: ${{ steps.finalize.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: bun run services/feed-ingest-plan/scripts/finish-run-output.ts
