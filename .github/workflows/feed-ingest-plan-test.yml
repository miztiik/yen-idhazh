name: Feed ingest plan test

on:
  workflow_dispatch:
    inputs:
      # CI checks these form defaults against the committed planner config.
      freshness_hours:
        description: Maximum article age in hours for this run
        required: true
        default: '24'
        type: string
      article_limit:
        description: Optional positive article limit; blank uses configuration
        required: false
        default: '100'
        type: string
      shards:
        description: Optional positive worker count; blank uses configuration
        required: false
        default: '4'
        type: string
      partition_strategy:
        description: Article distribution; for none, clear shards or set it to 1
        required: false
        default: 'bin-pack'
        type: choice
        options:
          - bin-pack
          - round-robin
          - none

permissions:
  contents: write

jobs:
  isolated-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/
            /packages/common-contracts/package.json
            /packages/common-contracts/bun.lock
            /packages/common-contracts/src/
            /packages/data-delivery/package.json
            /packages/data-delivery/bun.lock
            /packages/data-delivery/src/
            /packages/ledger-file-writer/package.json
            /packages/ledger-file-writer/bun.lock
            /packages/ledger-file-writer/src/
            /services/feed-ingest-plan/package.json
            /services/feed-ingest-plan/bun.lock
            /services/feed-ingest-plan/src/
            /services/feed-ingest-plan/scripts/
            /services/host-fingerprints/package.json
            /services/host-fingerprints/bun.lock
            /services/host-fingerprints/src/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install declared TypeScript dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd packages/data-delivery
          bun install --frozen-lockfile --cwd packages/ledger-file-writer
          bun install --frozen-lockfile --cwd services/feed-ingest-plan
          bun install --frozen-lockfile --cwd services/host-fingerprints

      - name: Run feed planning with saved history
        id: plan
        env:
          FRESHNESS_HOURS: ${{ inputs.freshness_hours }}
          ARTICLE_LIMIT: ${{ inputs.article_limit }}
          SHARDS: ${{ inputs.shards }}
          PARTITION_STRATEGY: ${{ inputs.partition_strategy }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-http-proof.ts

      - name: Persist verified planner ledgers
        if: ${{ !cancelled() && steps.plan.outputs.current_run_files != '' }}
        env:
          CURRENT_RUN_FILES: ${{ steps.plan.outputs.current_run_files }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-deliver.ts

      - name: Write workflow run summary
        if: ${{ always() }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-report.ts

      - name: Prepare selected handoff and recovery
        id: evidence
        if: ${{ always() }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-artifacts.ts

      # For unarchived uploads the filename is the artifact name; each path is one file.
      - name: Preserve selected text for the summarizer
        if: ${{ always() && steps.evidence.outputs.selected != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.selected }}
          if-no-files-found: error

      - name: Preserve metadata delivery result
        if: ${{ always() && steps.evidence.outputs.delivery != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.delivery }}
          if-no-files-found: error

      - name: Preserve the public Markdown report
        if: ${{ always() && steps.evidence.outputs.report != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.report }}
          if-no-files-found: error

      - name: Preserve uncommitted metadata recovery only
        if: ${{ always() && steps.evidence.outputs.metadata_recovery != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: uncommitted-metadata-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.metadata_recovery }}
          if-no-files-found: error

      - name: Require completed planning
        if: ${{ !cancelled() }}
        env:
          PLANNING_COMPLETE: ${{ steps.plan.outputs.planning_complete }}
        run: |
          bun -e 'if (process.env.PLANNING_COMPLETE !== "true") { console.error("Planning did not complete; saved partial output and selected text are retained."); process.exitCode = 2; }'
