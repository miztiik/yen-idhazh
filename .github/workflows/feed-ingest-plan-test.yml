name: Feed ingest plan test

on:
  workflow_dispatch:
    inputs:
      # The named workflow case binds these literal form defaults to configuration.
      freshness_hours:
        description: Maximum article age in hours for this run
        required: true
        default: '24'
        type: string
      article_limit:
        description: Optional positive article limit; blank uses configuration
        required: false
        default: '100'
        type: string
      shards:
        description: Optional positive worker count; blank uses configuration
        required: false
        default: '4'
        type: string
      partition_strategy:
        description: Article distribution; for none, clear shards or set it to 1
        required: false
        default: 'bin-pack'
        type: choice
        options:
          - bin-pack
          - round-robin
          - none
      profile_machine_memory:
        description: Profile the live planner CPU/RAM and separate controlled host tools; default off
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  isolated-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/
            /packages/common-contracts/
            /packages/ledger-file-writer/
            /services/feed-ingest-plan/
            /services/host-probes/
            /services/host-fingerprints/
            /.github/workflows/feed-ingest-plan-test.yml
            /.github/workflows/ci.yml
            /tests/fixtures/feed-ingest-plan/
            /tests/fixtures/ledger-file-writer/
            /tests/fixtures/host-probes/
            /tests/fixtures/host-fingerprints/linux-inputs.json
            /tests/fixtures/runtime/2026-08-30-probe-proc-stat-at-start.txt
            /tests/fixtures/runtime/2026-08-30-probe-proc-stat-at-end.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install declared TypeScript dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd packages/ledger-file-writer
          bun install --frozen-lockfile --cwd services/feed-ingest-plan
          bun install --frozen-lockfile --cwd services/host-probes
          bun install --frozen-lockfile --cwd services/host-fingerprints

      - name: Check isolated adapters and native compatibility
        run: |
          bun run --cwd packages/common-contracts check
          bun run --cwd packages/ledger-file-writer check
          bun run --cwd services/feed-ingest-plan check
          bun test ./services/feed-ingest-plan/test/feed-ingest-plan-report.test.ts ./services/feed-ingest-plan/test/feed-ingest-plan-outputs.test.ts ./services/feed-ingest-plan/test/feed-ingest-plan-workflow.test.ts --timeout 30000
          bun run services/feed-ingest-plan/test/verify-recorded-compatibility.ts

      - name: Read named history and call the real HTTP planner
        id: plan
        env:
          FRESHNESS_HOURS: ${{ inputs.freshness_hours }}
          ARTICLE_LIMIT: ${{ inputs.article_limit }}
          SHARDS: ${{ inputs.shards }}
          PARTITION_STRATEGY: ${{ inputs.partition_strategy }}
          PROFILE_MACHINE_MEMORY: ${{ inputs.profile_machine_memory }}
        run: |
          mkdir -p "$RUNNER_TEMP/feed-ingest-plan"
          set -o pipefail
          bun run services/feed-ingest-plan/scripts/feed-ingest-plan-http-proof.ts 2>&1 | tee "$RUNNER_TEMP/feed-ingest-plan/runtime.log"

      - name: Commit exact current planner metadata
        if: ${{ !cancelled() && steps.plan.outputs.current_run_files != '' }}
        env:
          CURRENT_RUN_FILES: ${{ steps.plan.outputs.current_run_files }}
        run: |
          set -o pipefail
          bun run services/feed-ingest-plan/scripts/feed-ingest-plan-commit.ts 2>&1 | tee "$RUNNER_TEMP/feed-ingest-plan/commit.log"

      - name: Install optional host instruments
        if: ${{ !cancelled() && inputs.profile_machine_memory }}
        continue-on-error: true
        run: bash services/host-probes/scripts/install-host-cache-tools.sh

      - name: Run independent optional host proof
        if: ${{ !cancelled() && inputs.profile_machine_memory }}
        continue-on-error: true
        run: bun run services/host-probes/scripts/feed-ingest-plan-profile-proof.ts

      - name: Write the public planner summary and grouped annotations
        if: ${{ always() }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-report.ts

      - name: Prepare exact individual evidence and uncommitted metadata recovery
        id: evidence
        if: ${{ always() }}
        run: bun run services/feed-ingest-plan/scripts/feed-ingest-plan-artifacts.ts

      # For unarchived uploads the filename is the artifact name; each path is one file.
      - name: Preserve selected text for the summarizer
        if: ${{ always() && steps.evidence.outputs.selected != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.selected }}
          if-no-files-found: error

      - name: Preserve planner response
        if: ${{ always() && steps.evidence.outputs.response != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.response }}
          if-no-files-found: error

      - name: Preserve feed work and request evidence
        if: ${{ always() && steps.evidence.outputs.health != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.health }}
          if-no-files-found: error

      - name: Preserve measured history staging time
        if: ${{ always() && steps.evidence.outputs.history != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.history }}
          if-no-files-found: error

      - name: Preserve metadata commit result
        if: ${{ always() && steps.evidence.outputs.commit != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.commit }}
          if-no-files-found: error

      - name: Preserve real planner and listener logs
        if: ${{ always() && steps.evidence.outputs.runtime_log != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.runtime_log }}
          if-no-files-found: error

      - name: Preserve real metadata commit logs
        if: ${{ always() && steps.evidence.outputs.commit_log != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.commit_log }}
          if-no-files-found: error

      - name: Preserve effective workflow settings
        if: ${{ always() && steps.evidence.outputs.policy != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.policy }}
          if-no-files-found: error

      - name: Preserve actual host and live planner resources
        if: ${{ always() && steps.evidence.outputs.resources != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.resources }}
          if-no-files-found: error

      - name: Preserve independent controlled host evidence
        if: ${{ always() && steps.evidence.outputs.independent != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.independent }}
          if-no-files-found: error

      - name: Preserve the public Markdown report
        if: ${{ always() && steps.evidence.outputs.report != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.report }}
          if-no-files-found: error

      - name: Preserve uncommitted metadata recovery only
        if: ${{ always() && steps.evidence.outputs.metadata_recovery != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: uncommitted-metadata-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-ingest-plan/${{ steps.evidence.outputs.metadata_recovery }}
          if-no-files-found: error

      - name: Require completed planning
        if: ${{ !cancelled() }}
        env:
          PLANNING_COMPLETE: ${{ steps.plan.outputs.planning_complete }}
        run: |
          bun -e 'if (process.env.PLANNING_COMPLETE !== "true") { console.error("Planning did not complete; saved partial output and selected text are retained."); process.exitCode = 2; }'
