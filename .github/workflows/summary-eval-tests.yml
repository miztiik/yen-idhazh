name: summary-eval-tests

on:
  workflow_dispatch:
    inputs:
      source_text:
        description: Full source text; published in the expandable run report
        required: true
        type: string
      reference_summary_text:
        description: Independent reference for this source; not sent to generation; shown in report
        required: true
        type: string
      models_file:
        description: Model JSON path relative to config/; blank uses the committed pointer
        required: false
        type: string
        default: models/ornith-1.5-9b-q5km.json

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/summary_evaluator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Prepare frozen tool dependencies
        working-directory: .
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd services/serve-pipeline-apis
          bun install --frozen-lockfile --cwd packages/ledger-file-writer
          bun install --frozen-lockfile --cwd services/host-fingerprints
          bun install --frozen-lockfile --cwd services/host-probes
          uv sync --project services/summary_evaluator --frozen --extra model --no-dev

      - name: Prepare selected native assets and validate inputs
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run --frozen --extra model --no-dev python
          ../../tools/summary-eval/run.py --root ../.. prepare

      - name: Generate natively and stop the model
        run: >-
          uv run --frozen --extra model --no-dev python
          ../../tools/summary-eval/run.py --root ../.. generate

      - name: Evaluate the saved generated answer with HHEM and UniEval
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: >-
          uv run --frozen --extra model --no-dev python
          ../../tools/summary-eval/run.py --root ../.. evaluate

      - name: Report actual results and server outcomes
        if: always()
        run: >-
          uv run --frozen --extra model --no-dev python
          ../../tools/summary-eval/report.py --root ../..

      - name: Retain results and escaped report
        if: ${{ always() && steps.prepare.outputs.output_directory != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: summary-eval-tests-report
          path: |
            ${{ steps.prepare.outputs.output_directory }}/run.json
            ${{ steps.prepare.outputs.output_directory }}/generation.json
            ${{ steps.prepare.outputs.output_directory }}/generation-phase.json
            ${{ steps.prepare.outputs.output_directory }}/evaluation.json
            ${{ steps.prepare.outputs.output_directory }}/results.json
            ${{ steps.prepare.outputs.output_directory }}/report.md
          if-no-files-found: warn

      - name: Retain server diagnostics after failure or cancellation
        if: ${{ (failure() || cancelled()) && steps.prepare.outputs.output_directory != '' && steps.prepare.outputs.native_log_directory != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: summary-eval-tests-server-logs
          path: |
            ${{ steps.prepare.outputs.output_directory }}/logs/
            ${{ steps.prepare.outputs.native_log_directory }}/
          if-no-files-found: warn
