name: Yen-AI-Pipeline

on:
  workflow_dispatch:
    inputs:
      models_file:
        description: 'Model declaration under config/; blank uses config/idhazh.json.'
        required: false
        default: ''
      url:
        description: 'Target URL to summarize (leave blank to use fallback text)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Direct/fallback input text'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      prompt:
        description: 'Complete generator system prompt override; blank uses the configured default.'
        required: false
        default: ''

jobs:
  run-api-pipeline:
    runs-on: ubuntu-latest
    name: LLM Inference API Pipeline
    env:
      CONFIG_ROOT: ${{ inputs.models_file != '' && 'backend/var/candidate-config' || 'config' }}
      PYTHONPATH: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup frozen evaluator tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - name: Install
        run: |
          python -m pip install 'pydantic>=2.12'
          python -m pip install -e . --no-deps

      - name: Point scratch config at the selected declaration
        if: inputs.models_file != ''
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ inputs.models_file }}

      - name: Validate the selected request
        id: request
        run: |
          set -euo pipefail
          DECLARED=$(python backend/utilities/model_runtime.py describe-request --config-root "$CONFIG_ROOT")
          echo "probe_url=$(echo "$DECLARED" | jq -r .base_url)" >> "$GITHUB_OUTPUT"

      - name: Read pinned runtime build
        id: runtime
        run: python backend/utilities/model_runtime.py print-pinned-build >> "$GITHUB_OUTPUT"

      - name: Configure Linux Swappiness
        run: |
          sudo sysctl vm.swappiness=1
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd services/summary-generator
          bun install --frozen-lockfile --cwd tools/summary-generator-caller
          uv sync --project services/summary_evaluator --frozen --extra model --no-dev

      - name: Start selected model
        uses: ./.github/actions/model-server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ steps.request.outputs.probe_url }}
          llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
          config_root: ${{ env.CONFIG_ROOT }}

      - name: Start summary-generator API
        env:
          CONFIG_ROOT: ${{ github.workspace }}/${{ env.CONFIG_ROOT }}
        run: |
          set -euo pipefail
          bun run services/summary-generator/src/start-api-server.ts \
            > services/summary-generator/backend_ts_server_log.log 2>&1 &
          API_PID=$!
          echo "$API_PID" > services/summary-generator/.summary-generator.pid
          bun run tools/summary-generator-caller/wait-summary-api.ts "$API_PID"

      - name: Prepare input, call summary API and publish its report
        id: summary
        env:
          URL: ${{ inputs.url }}
          INPUT_TEXT: ${{ inputs.input_text }}
          SYSTEM_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          bun run tools/summary-generator-caller/run-summary-api.ts \
            | jq '{success, prompt_source, prompt_sha256, usage}'

      - name: Confirm generation processes have stopped
        id: stop
        if: always()
        run: >-
          services/summary_evaluator/.venv/bin/python
          tools/summary-eval/score-saved.py --root . stop-generation
          --pid-file services/summary-generator/.summary-generator.pid
          --pid-file llama-server.pid

      - name: Prepare the saved summary for native evaluation
        if: ${{ !cancelled() && steps.summary.outcome == 'success' && steps.stop.outcome == 'success' }}
        run: >-
          bun run --no-install tools/summary-eval/export-saved-summaries.ts
          --format summary-api
          --input "${{ steps.summary.outputs.output_directory }}/summary-events.jsonl"
          --output saved-summary-requests.jsonl

      - name: Score the saved summary with native HHEM and UniEval
        id: scores
        if: ${{ !cancelled() && steps.summary.outcome == 'success' && steps.stop.outcome == 'success' }}
        run: >-
          services/summary_evaluator/.venv/bin/python
          tools/summary-eval/score-saved.py --root . evaluate
          --requests saved-summary-requests.jsonl

      - name: Upload Logs and Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yen-ai-pipeline-artifacts
          path: |
            llama-server.log
            services/summary-generator/backend_ts_server_log.log
            ${{ steps.summary.outputs.output_directory }}
            saved-summary-requests.jsonl
            ${{ steps.scores.outputs.output_directory }}
            ${{ steps.scores.outputs.log_directory }}
