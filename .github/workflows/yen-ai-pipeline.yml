name: Yen-AI-Pipeline

on:
  workflow_dispatch:
    inputs:
      models_file:
        description: 'Model declaration under config/; blank uses config/idhazh.json.'
        required: false
        default: ''
      url:
        description: 'Target URL to summarize (leave blank to use fallback text)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Direct/fallback input text'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      prompt:
        description: 'System Prompt'
        required: false
        default: 'You are an executive summarizer. Output ONLY the requested JSON. Do NOT output thinking tags or reasoning.'

jobs:
  run-api-pipeline:
    runs-on: ubuntu-latest
    name: LLM Inference API Pipeline
    env:
      CONFIG_ROOT: ${{ inputs.models_file != '' && 'backend/var/candidate-config' || 'config' }}
      PYTHONPATH: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install 'pydantic>=2.12'
          python -m pip install -e . --no-deps

      - name: Point scratch config at the selected declaration
        if: inputs.models_file != ''
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ inputs.models_file }}

      - name: Validate the selected request
        id: request
        run: |
          set -euo pipefail
          DECLARED=$(python backend/utilities/model_runtime.py describe-request --config-root "$CONFIG_ROOT")
          echo "probe_url=$(echo "$DECLARED" | jq -r .base_url)" >> "$GITHUB_OUTPUT"

      - name: Read pinned runtime build
        id: runtime
        run: python backend/utilities/model_runtime.py print-pinned-build >> "$GITHUB_OUTPUT"

      - name: Configure Linux Swappiness
        run: |
          sudo sysctl vm.swappiness=1
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        working-directory: services/summarizer
        run: bun install --frozen-lockfile

      - name: Start selected model
        uses: ./.github/actions/model-server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ steps.request.outputs.probe_url }}
          llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
          config_root: ${{ env.CONFIG_ROOT }}

      - name: Start Summarizer Bun API Daemon (Port 9932)
        env:
          PORT: 9932
          CONFIG_ROOT: ${{ github.workspace }}/${{ env.CONFIG_ROOT }}
          RUNNER_NAME: ${{ runner.name }}
          SHARD_ID: ${{ github.job }}
          LLAMA_PID_FILE: ${{ github.workspace }}/llama-server.pid
        run: |
          set -euo pipefail
          cd services/summarizer
          bun run src/index.ts > backend_ts_server_log.log 2>&1 &
          API_PID=$!
          echo "$API_PID" > .summarizer_api.pid
          for _ in {1..30}; do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat backend_ts_server_log.log >&2
              exit 1
            fi
            if curl -sf http://127.0.0.1:9932/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9932/health > /dev/null

      - name: Dispatch Summarize Request
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_TEXT: ${{ inputs.input_text }}
          SYSTEM_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          REQUEST=$(jq -n --arg url "$INPUT_URL" --arg input_text "$INPUT_TEXT" \
            --arg system_prompt "$SYSTEM_PROMPT" \
            '{url: $url, input_text: $input_text, system_prompt: $system_prompt}')
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:9932/api/summarize \
            -H "Content-Type: application/json" --data-binary "$REQUEST")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.success == true' > /dev/null

      - name: Stop local processes
        if: always()
        run: |
          for file in services/summarizer/.summarizer_api.pid llama-server.pid; do
            if [ -f "$file" ]; then
              kill "$(cat "$file")" 2>/dev/null || true
              rm -f "$file"
            fi
          done

      - name: Upload Logs and Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yen-ai-pipeline-artifacts
          path: |
            llama-server.log
            services/summarizer/backend_ts_server_log.log
            services/summarizer/pipeline-events.jsonl
