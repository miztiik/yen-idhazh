name: Yen-Summarizers

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: 'HuggingFace Model (provider/model)'
        required: true
        default: 'ornith-ai/Ornith-1.5-9B-GGUF'
      url:
        description: 'URL to extract with Defuddle (leave empty to use input_text)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Input text (used directly if URL is empty, or as fallback if URL fails)'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      context_size:
        description: 'Context Window Size'
        required: false
        default: '16384'
      prompt:
        description: 'System Prompt'
        required: false
        default: 'You are an executive summarizer. Output ONLY the requested JSON. Do NOT output thinking tags or reasoning.'

jobs:
  run-inference:
    runs-on: ubuntu-latest
    name: LLM Inference Pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # 1. TUNE SWAPPINESS & CONFIGURE 8GB SAFETY SWAP
      - name: Configure Linux Memory & Swappiness
        run: |
          echo "Setting swappiness to 1 (prevents unnecessary paging to SSD)..."
          sudo sysctl vm.swappiness=1

          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "Swappiness value:"
          cat /proc/sys/vm/swappiness

      # 2. Setup Node ES Module & Install Defuddle
      - name: Setup Node ES Module & Install Defuddle
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"
          npm install defuddle linkedom

      # 3. Download Official Standard llama.cpp CPU Server (Strict CPU Regex & Safe Extraction)
      - name: Download Official llama-server
        run: |
          mkdir -p ./bin
          echo "Fetching latest official ggml-org/llama.cpp CPU binary for Ubuntu x64..."

          RELEASE_JSON=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=1")

          # Strict regex: must start with 'llama-' (excludes cudart-) and match CPU ubuntu-x64
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.[0].assets[] | select(.name | test("^llama-.*-bin-ubuntu-x64\\.(tar\\.gz|zip)$")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            TAG=$(echo "$RELEASE_JSON" | jq -r '.[0].tag_name')
            DOWNLOAD_URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-ubuntu-x64.tar.gz"
          fi

          echo "Downloading CPU package from: $DOWNLOAD_URL"
          curl -fL -o llama-package "$DOWNLOAD_URL"

          # Accurately distinguish .tar.gz (gzip) from .zip
          if [[ "$DOWNLOAD_URL" == *.tar.gz ]] || file llama-package | grep -qi "gzip"; then
            echo "Extracting tar.gz archive..."
            tar -xzf llama-package -C ./bin
          else
            echo "Extracting zip archive..."
            unzip -o llama-package -d ./bin
          fi

          # Flatten nested build directories if present
          if [ -d "./bin/build/bin" ]; then
            cp -r ./bin/build/bin/* ./bin/ 2>/dev/null || true
          fi
          find ./bin -type f -name "llama-server" -exec cp {} ./bin/llama-server \;
          find ./bin -type f -name "*.so*" -exec cp {} ./bin/ \; 2>/dev/null || true
          chmod +x ./bin/llama-server

          # Test binary with local library path
          export LD_LIBRARY_PATH="./bin:$LD_LIBRARY_PATH"
          ./bin/llama-server --version || true

      # 4. Cache Model Directory
      - name: Cache Model Directory
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models
          key: model-cache-${{ github.event.inputs.model_repo }}

      # 5. Resolve & Download GGUF
      - name: Download Model from HuggingFace
        run: |
          mkdir -p ./models
          REPO="${{ github.event.inputs.model_repo }}"

          # Discover the GGUF file in 2 lines
          FILE=$(curl -sL "https://huggingface.co/api/models/${REPO}/tree/main" | jq -r '.[].path' | grep -iE '\.gguf$' | grep -iE 'q5_k_m|q4_k_m' | head -n 1)
          [ -z "$FILE" ] && FILE=$(curl -sL "https://huggingface.co/api/models/${REPO}/tree/main" | jq -r '.[].path' | grep -iE '\.gguf$' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::No .gguf files found in repository '$REPO'!"
            exit 1
          fi

          echo "Selected GGUF: $FILE"
          echo "MODEL_FILE=$FILE" >> $GITHUB_ENV

          if [ ! -f "./models/$FILE" ]; then
            echo "Downloading $FILE..."
            curl -fL -o "./models/$FILE" "https://huggingface.co/${REPO}/resolve/main/${FILE}"
          else
            echo "Found $FILE in runner cache."
          fi

          # Verify GGUF magic bytes
          if [ "$(head -c 4 "./models/$FILE")" != "GGUF" ]; then
            echo "::error::Downloaded file is corrupted or not a valid GGUF binary!"
            exit 1
          fi

      # 6. Start llama-server (16k Context on Port 9931)
      - name: Start llama-server (Port 9931)
        run: |
          CORES=$(nproc)
          CTX="${{ github.event.inputs.context_size }}"

          echo "Starting llama-server for $MODEL_FILE on $CORES cores with ${CTX} context..."

          export LD_LIBRARY_PATH="./bin:$LD_LIBRARY_PATH"

          ./bin/llama-server \
            -m "./models/$MODEL_FILE" \
            --host 127.0.0.1 \
            --port 9931 \
            -c $CTX \
            -np 1 \
            --flash-attn on \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --temp 0.2 \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > .llama_server.pid
          echo "llama-server started (PID: $SERVER_PID). Monitoring health on port 9931..."

          READY=false
          for i in {1..60}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::llama-server died on startup!"
              cat llama-server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9931/health | grep -q "ok"; then
              echo "llama-server is ready on port 9931!"
              READY=true
              break
            fi

            echo "Warming up... ($i/60)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::llama-server failed to respond in 120s."
            cat llama-server.log
            exit 1
          fi

      # 7. Run Event Pipeline with OpenAPI Spec & Full Terminal Logs
      - name: Execute AI Event Pipeline
        env:
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          SERVER_URL: "http://127.0.0.1:9931"
          MODEL_NAME: "${{ env.MODEL_FILE }}"
          SHARD_ID: "shard-1/1"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts

      # 8. Upload JSONL Telemetry & Server Logs
      - name: Upload Logs and JSONL Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-pipeline-artifacts
          path: |
            llama-server.log
            pipeline-events.jsonl
