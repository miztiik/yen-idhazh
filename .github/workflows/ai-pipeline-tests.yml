name: Yen-Summarizers

on:
  workflow_dispatch:
    inputs:
      input_source:
        description: 'Input Source Mode'
        required: true
        type: choice
        options:
          - 'feed'
          - 'url'
          - 'text'
        default: 'feed'
      feed_url:
        description: 'Feed URL (feed mode only); blank uses the existing feed list'
        required: false
        type: string
        default: ''
      article_count_goal:
        description: 'Target number of articles to collect from feeds'
        required: false
        default: '1'
      feed_max_age_hours:
        description: 'Max article age in hours (feed mode only)'
        required: false
        default: '24'
      url:
        description: 'Direct URL to extract (used when input_source is url)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Input text (used directly if input_source is text, or as fallback)'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      model:
        description: 'Model declaration under config/ (default: Ornith)'
        required: false
        type: choice
        options:
          - 'models/ornith-1.5-9b-q5km.json'
          - 'models/deepseek-v4-pro-qwen3.5-9b-q4km.json'
          - 'models/gemma-4-12b-it-qat-ud-q4-k-xl.json'
          - 'models/gemma-4-e4b-qat-no-draft.json'
          - 'models/gemma-4-e4b-qat.json'
          - 'models/qwen3.5-9b-kimi-k3-distilled-q4km.json'
          - 'models/qwen3.5-9b-q4km-thinking.json'
          - 'models/qwen3.5-9b-q4km.json'
          - 'models/qwen3.8-9b-q5km-distill.json'
        default: 'models/ornith-1.5-9b-q5km.json'
      max_word_length:
        description: 'Maximum ingested word count per article before truncation'
        required: false
        default: '2000'
      prompt:
        description: 'System Prompt Preamble'
        required: false
        default: 'You are a precise, objective intelligence analyst. Your mandate is to produce a faithful, high-density synthesis of the provided document.'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    name: LLM Inference
    env:
      MODELS_FILE: ${{ inputs.model }}
      CONFIG_ROOT: ${{ inputs.model != '' && 'backend/var/candidate-config' || 'config' }}
      PYTHONPATH: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup frozen evaluator tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - name: Install Shared Metadata Dependencies
        working-directory: packages/common-contracts
        run: bun install --frozen-lockfile

      - name: Install
        run: |
          python -m pip install 'pydantic>=2.12'
          python -m pip install -e . --no-deps

      - name: Point scratch config at the selected declaration
        if: env.MODELS_FILE != ''
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ env.MODELS_FILE }}

      - name: Validate the selected request
        id: request
        run: |
          set -euo pipefail
          DECLARED=$(python backend/utilities/model_runtime.py describe-request --config-root "$CONFIG_ROOT")
          echo "probe_url=$(echo "$DECLARED" | jq -r .base_url)" >> "$GITHUB_OUTPUT"

      - name: Read pinned runtime build
        id: runtime
        run: python backend/utilities/model_runtime.py print-pinned-build >> "$GITHUB_OUTPUT"

      - name: Install native model-request helper dependencies
        working-directory: services/summary-generator
        run: bun install --frozen-lockfile

      # 1. TUNE LINUX MEMORY
      - name: Configure Linux Memory & Swappiness
        run: |
          sudo sysctl vm.swappiness=1
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install existing inference dependencies
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"
          npm install --no-audit --no-fund defuddle linkedom feedsmith tidy-url
          uv sync --project services/summary_evaluator --frozen --extra model --no-dev

      - name: Start selected model
        uses: ./.github/actions/model-server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ steps.request.outputs.probe_url }}
          llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
          config_root: ${{ env.CONFIG_ROOT }}

      # 5. PHASE 1: RUN INGESTION & LLM INFERENCE
      - name: Execute Phase 1 Inference
        id: inference
        env:
          INPUT_SOURCE: "${{ github.event.inputs.input_source }}"
          FEED_URL: "${{ github.event.inputs.feed_url }}"
          ARTICLE_COUNT_GOAL: "${{ github.event.inputs.article_count_goal }}"
          FEED_MAX_AGE_HOURS: "${{ github.event.inputs.feed_max_age_hours }}"
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          MAX_WORD_LENGTH: "${{ github.event.inputs.max_word_length }}"
          SHARD_ID: "${{ github.job }}"
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=infer

      - name: Confirm generation has stopped before native evaluation
        id: stop
        if: always()
        run: |
          set -euo pipefail
          services/summary_evaluator/.venv/bin/python \
            tools/summary-eval/score-saved.py --root . stop-generation \
            --pid-file llama-server.pid
          sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches

      - name: Prepare saved inference for native evaluation
        if: ${{ !cancelled() && steps.inference.outcome == 'success' && steps.stop.outcome == 'success' }}
        run: >-
          bun run --no-install tools/summary-eval/export-saved-summaries.ts
          --format pipeline --input pipeline-events.jsonl
          --output saved-summary-requests.jsonl

      - name: Score saved inference with native HHEM and UniEval
        id: scores
        if: ${{ !cancelled() && steps.inference.outcome == 'success' && steps.stop.outcome == 'success' }}
        run: >-
          services/summary_evaluator/.venv/bin/python
          tools/summary-eval/score-saved.py --root . evaluate
          --requests saved-summary-requests.jsonl

      - name: Upload Logs and JSONL Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            llama-server.log
            pipeline-events.jsonl
            saved-summary-requests.jsonl
            ${{ steps.scores.outputs.output_directory }}
            ${{ steps.scores.outputs.log_directory }}
