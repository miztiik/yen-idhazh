name: Yen-Summarizers

on:
  workflow_dispatch:
    inputs:
      input_source:
        description: 'Input Source Mode'
        required: true
        type: choice
        options:
          - 'feed'
          - 'url'
          - 'text'
        default: 'feed'
      article_count_goal:
        description: 'Target number of articles to collect from feeds'
        required: false
        default: '3'
      feed_max_age_hours:
        description: 'Max article age in hours (feed mode only)'
        required: false
        default: '24'
      url:
        description: 'Direct URL to extract (used when input_source is url)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Input text (used directly if input_source is text, or as fallback)'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      models_file:
        description: 'Model declaration under config/; blank uses config/idhazh.json.'
        required: false
        default: ''
      max_word_length:
        description: 'Maximum ingested word count per article before truncation'
        required: false
        default: '8200'
      prompt:
        description: 'System Prompt Preamble'
        required: false
        default: 'You are a precise, objective intelligence analyst. Your mandate is to produce a faithful, high-density synthesis of the provided document.'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    name: Phased LLM Inference & UniEval Audit
    env:
      CONFIG_ROOT: ${{ inputs.models_file != '' && 'backend/var/candidate-config' || 'config' }}
      PYTHONPATH: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          python -m pip install 'pydantic>=2.12'
          python -m pip install -e . --no-deps

      - name: Point scratch config at the selected declaration
        if: inputs.models_file != ''
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ inputs.models_file }}

      - name: Validate the selected request
        id: request
        run: |
          set -euo pipefail
          DECLARED=$(python backend/utilities/model_runtime.py describe-request --config-root "$CONFIG_ROOT")
          echo "probe_url=$(echo "$DECLARED" | jq -r .base_url)" >> "$GITHUB_OUTPUT"

      - name: Read pinned runtime build
        id: runtime
        run: python backend/utilities/model_runtime.py print-pinned-build >> "$GITHUB_OUTPUT"

      - name: Install Summarizer Dependencies
        working-directory: services/summarizer
        run: bun install --frozen-lockfile

      # 1. TUNE LINUX MEMORY
      - name: Configure Linux Memory & Swappiness
        run: |
          sudo sysctl vm.swappiness=1
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install existing inference and evaluation dependencies
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"
          npm install --no-audit --no-fund defuddle linkedom feedsmith tidy-url

          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir transformers sentencepiece protobuf evaluate rouge-score nltk rank-bm25 prettytable scipy fastapi uvicorn pydantic
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

          rm -rf /tmp/unieval
          git clone --depth 1 https://github.com/maszhongming/UniEval.git /tmp/unieval

      - name: Start selected model
        uses: ./.github/actions/model-server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ steps.request.outputs.probe_url }}
          llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
          config_root: ${{ env.CONFIG_ROOT }}

      # 5. PHASE 1: RUN INGESTION & LLM INFERENCE
      - name: Execute Phase 1 Inference
        env:
          INPUT_SOURCE: "${{ github.event.inputs.input_source }}"
          ARTICLE_COUNT_GOAL: "${{ github.event.inputs.article_count_goal }}"
          FEED_MAX_AGE_HOURS: "${{ github.event.inputs.feed_max_age_hours }}"
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          MAX_WORD_LENGTH: "${{ github.event.inputs.max_word_length }}"
          SHARD_ID: "${{ github.job }}"
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=infer

      # 6. TEARDOWN LLAMA-SERVER & RECLAIM PHYSICAL RAM
      - name: Stop llama-server (Reclaim Memory)
        if: always()
        run: |
          if [ -f llama-server.pid ]; then
            echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"INFO","message":"Stopping llama-server to reclaim RAM for UniEval..."}'
            kill "$(cat llama-server.pid)" || true
            rm -f llama-server.pid
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
          fi

      # 7. START FASTAPI UNIEVAL ENGINE (PORT 9933)
      - name: Start Python FastAPI UniEval Engine (Port 9933)
        env:
          EVAL_EVENTS_PATH: "eval-events.jsonl"
        run: |
          UNIEVAL_DIR=/tmp/unieval python -u .github/scripts/serve-evaluator.py > eval_server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > .eval_server.pid

          READY=0
          # 180 iterations * 1s = 180 seconds (3 minutes)
          for i in {1..180}; do
            # Immediate fail-fast: exit in <1s if Python crashes or OOMs
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"ERROR","message":"UniEval server process terminated unexpectedly"}'
              cat eval_server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9933/health | grep -q '"status":"ok"'; then
              echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"INFO","message":"Python UniEval FastAPI server ready on port 9933 (warmed up in '$i's)"}'
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"ERROR","message":"UniEval server failed to become ready within 180s"}'
            cat eval_server.log
            exit 1
          fi

      # 8. PHASE 2: RUN QUALITY AUDIT
      - name: Execute Phase 2 Quality Audit
        env:
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          SHARD_ID: "${{ github.job }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=eval

      # 9. TEARDOWN EVAL SERVER
      - name: Teardown Python Eval Server
        if: always()
        run: |
          if [ -f .eval_server.pid ]; then
            kill -9 $(cat .eval_server.pid) || true
            rm -f .eval_server.pid
          fi

      # 10. UPLOAD LOGS & JSONL TELEMETRY
      - name: Upload Logs and JSONL Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            llama-server.log
            eval_server.log
            pipeline-events.jsonl
            eval-events.jsonl
