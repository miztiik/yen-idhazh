name: ornith-test
on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: 'HuggingFace Model Repo'
        required: false
        default: 'ornith-ai/Ornith-1.0-9B-GGUF'
      model_file:
        description: 'GGUF Filename'
        required: false
        default: 'ornith-1.0-9b-Q4_K_M.gguf'
      context_size:
        description: 'Context Window Size (e.g. 8192, 16384, 65536)'
        required: false
        default: '16384'
      prompt:
        description: 'System Prompt'
        required: false
        default: 'You are an executive summarizer. Output ONLY the requested JSON. Do NOT output thinking tags or reasoning.'
      input_text:
        description: 'Input text to summarize'
        required: false
        default: 'Ornith-1.0 is an open-source model family designed for agentic coding and reasoning tasks. Built on top of modern dense architectures, the 9B parameter model delivers high throughput on consumer and continuous integration compute hardware when quantized to 4-bit precision.'

jobs:
  run-inference:
    runs-on: ubuntu-latest
    name: LLM Inference Pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # 1. TUNE SWAPPINESS & CONFIGURE 8GB SAFETY SWAP
      - name: Configure Linux Memory & Swappiness
        run: |
          echo "=== Initial Swappiness & Memory ==="
          cat /proc/sys/vm/swappiness
          free -h

          # Set swappiness to 1 (prevents aggressive paging of active RAM)
          sudo sysctl vm.swappiness=1

          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Configured Memory ==="
          free -h

      # 2. Configure ES Module workspace for Node.js
      - name: Setup Node ES Module Workspace
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"

      # 3. Download llama-server binary
      - name: Download llama-server
        run: |
          mkdir -p ./bin
          echo "Fetching llama-server binary..."
          curl -L "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10685-7dffb15/llama-prism-b10685-7dffb15-bin-ubuntu-x64.tar.gz" -o llama-server.tar.gz
          tar -xzf llama-server.tar.gz -C ./bin --strip-components=1 || tar -xzf llama-server.tar.gz -C ./bin
          chmod +x ./bin/llama-server
          ./bin/llama-server --version || true

      # 4. Cache & Download Model Dynamically via Inputs
      - name: Cache Model File
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models/${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}
          key: model-cache-${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}

      - name: Download Model from HuggingFace
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./models
          REPO="${{ github.event.inputs.model_repo || 'ornith-ai/Ornith-1.0-9B-GGUF' }}"
          FILE="${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}"
          echo "Downloading $FILE from $REPO..."
          curl -L -o "./models/$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE"

      # 5. Start llama-server & Record PID for Process Telemetry
      - name: Start llama-server (Port 9931)
        run: |
          CORES=$(nproc)
          FILE="${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}"
          CTX="${{ github.event.inputs.context_size || '8192' }}"

          echo "Starting llama-server for $FILE on $CORES cores with ${CTX} context..."

          ./bin/llama-server \
            -m "./models/$FILE" \
            --host 127.0.0.1 \
            --port 9931 \
            -c $CTX \
            -np 1 \
            --flash-attn on \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --temp 0.2 \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > .llama_server.pid
          echo "llama-server started (PID: $SERVER_PID). Monitoring health..."

          READY=false
          for i in {1..60}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::llama-server died on startup!"
              cat llama-server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9931/health | grep -q "ok"; then
              echo "llama-server is ready on port 9931!"
              READY=true
              break
            fi

            echo "Warming up... ($i/60)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::llama-server failed to respond in 120s."
            cat llama-server.log
            exit 1
          fi

      # 6. Run Event Pipeline with Process Swap & Memory Telemetry
      - name: Execute AI Event Pipeline
        env:
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          SERVER_URL: "http://127.0.0.1:9931"
          MODEL_NAME: "${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts

      # 7. Debug Artifacts
      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-log
          path: llama-server.log
