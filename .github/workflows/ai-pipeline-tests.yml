name: ornith test

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: 'HuggingFace Model Repo'
        required: false
        default: 'ornith-ai/Ornith-1.0-9B-GGUF'
      model_file:
        description: 'GGUF Filename'
        required: false
        default: 'ornith-1.5-9B-Q4_K_M.gguf'
      context_size:
        description: 'Context Window Size'
        required: false
        default: '16384'
      prompt:
        description: 'System Prompt'
        required: false
        default: 'You are an executive summarizer. Output ONLY the requested JSON. Do NOT output thinking tags or reasoning.'
      input_text:
        description: 'Input text to summarize'
        required: false
        default: '[T]he government … ought to be so constituted as to protect the minority of the opulent against the majority.”     —James Madison, June 26, 1787      “[A positive interest rate policy is] basic income for those who already have money.”     —Warren Mosler, here  This is Part 5 of a brief series on money. We started it here, with a look at what dollars are. There we uncovered the most basic fact about dollars, obvious yet never ever acknowledged:  • You can’t create dollars. Only the government does that.  Everything else in this series proceeds from that fact. If you memorize that, you’ll understand everything. Our story so far:  • Part 1 is about the dollar: “Why ‘Entitlement’ Cuts May Succeed” • Part 2 explains why taxes are levied: “Why Governments Tax: A List” • Part 3 discusses the ‘deficit’: “What Is This ‘Deficit’ We Hear So Much About?” • Part 4 uncovers the true nature of the Treasuries market: “What Is the Federal Bond Market Really?”  And this, Part 5, addresses the question, “If our government makes dollars from nothing, what’s the ‘national debt’?”  To answer we need to go back to Part 4, and its discussion of the voluntary requirement to sell Treasury bonds. You can read that discussion, but in short, our government has voluntarily tied its own hands. Though it can create dollars directly, and it can authorize (via Congress) to spend as much as it wants, the Treasury is forced to sell bonds to finance itself entirely by choice, by laws that can be repealed.  Please support this site by sharing our work. Thanks!  Share First Principles First  To begin, consider these points:  • The source of all U.S. dollars is ultimately the government.  There’s no other source. The Fed creates dollars because the government says it can. Banks create dollars by lending beyond their reserves — lending cash they don’t have — because the government says it can. The government’s always in charge of dollar creation.  • Therefore, the government has no inherent need to borrow. Do airlines need to borrow “airline miles” to give them away? Of course not; they make them. End of.  • Each dollar spent by the government is a dollar in somebody’s pocket. No spending, no dollars.  • The Treasury is financed with bonds only because that’s the law. If those laws were repealed, the Treasury could just create dollars and buy what it needs.  • Treasury bonds are therefore a gift, offered to people with money. If you don’t have money, or not enough of it, you can’t buy government bonds. If you have money to spare, you can. The ‘National Debt’  So what’s the “national debt”? It’s the sum of all Treasury bonds held outside the government. This includes bonds held by you, by mutual funds and the like, by banks and the Fed itself, and by foreign governments and their own central banks.  Thus:  • The “national debt” is the market for U.S. Treasuries. • Because having a Treasuries market is voluntary, the “national debt” is really just an investment vehicle, a way to give money to people who already have money via interest payments. • The “national debt” is therefore not a debt, but a gift. Subscribe Why Have a Treasuries Market?  So why do we have it, this market for U.S. Treasuries?  First, think of the wealthy. The world of the rich needs a 100% guaranteed place to stash money, especially when the world seems unstable. The Treasuries market is that place.  Now think of the money supply. Dollars exist because government spends and because banks are permitted to lend money they don’t have. So if there’s too much money around, the government takes some of it back, reducing the supply.  How? Here’s where it gets interesting. Government has two ways of taking money out of the economy. The first is through federal taxes. Everyone is taxed, but the system is so skewed that the rich avoid being taxed almost entirely.      Between 2014 and 2018, Elon Musk’s wealth grew by $13.9 billion, yet he paid only $455 million in federal income taxes, resulting in an actual tax rate of about 3.27% (ProPublica, 2021). In contrast, the average American family’s effective federal income tax rate was 13.3% in 2018 (Tax Foundation, 2021). This stark difference highlights how the current tax system enables wealth accumulation without proportionate tax contributions. [emphasis mine]  And from ProPublica:      Some years billionaires pay no federal income taxes: Jeff Bezos paid zero in 2007 and 2011, Elon Musk paid zero in 2018, Michael Bloomberg paid zero several times in “recent years”, and George Soros paid zero three years in a row.  So how does the government extract excess money from the rich? That’s the second way: It pays the rich to surrender its cash temporarily by offering the Treasuries market. Bonds bought means money retired, at least for a while.  Two ways to reduce the money supply, taxation and the Treasuries market. Thus another of the great imbalances in our system. When government wants to reduce the money supply it extracts unreimbursed and involuntary-given money from you via your taxes, and reimbursed and voluntary-given money from the wealthy via Treasury bonds.  Or, as Cory Doctorow puts it:      Taxes coercively reduce the purchasing power of the private sector (they’re a stick). T-bills do the same thing, but voluntarily (they’re the carrot).  So What If the Government Paid Off the ‘National Debt’?  The answer has to be clear from what you just read. If the “national debt” is the market for U.S. Treasuries, and the government…      Repealed every law requiring the issuance of bonds, and      Paid off all Treasury bonds, bills and notes outstanding, and      Never issued new ones — not ever, not once  …the U.S. Treasuries market would disappear. In whole, not in part.  Does anyone with money want that? You may not care, though if you have enough to invest in a Treasury fund, you’d be getting above 5%. But the super-rich definitely care. They need a place to stash cash when nothing seems safe, and our government is nothing if not a servant of wealth (see quotes above).  The national debt is the sum of all “deficit” spending expressed as the total of publicly-held Treasury bonds. If we paid off the “debt,” we’d be in a whole new world.'

jobs:
  run-inference:
    runs-on: ubuntu-latest
    name: LLM Inference Pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # 1. TUNE SWAPPINESS & CONFIGURE 8GB SAFETY SWAP
      - name: Configure Linux Memory & Swappiness
        run: |
          echo "Setting swappiness to 1 (prevents unnecessary paging to SSD)..."
          sudo sysctl vm.swappiness=1

          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "Swappiness value:"
          cat /proc/sys/vm/swappiness

      # 2. Configure ES Module workspace for Node.js
      - name: Setup Node ES Module Workspace
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"

      # 3. Download Official llama-server binary
      - name: Download llama-server
        run: |
          mkdir -p ./bin
          echo "Fetching llama-server binary..."
          curl -L "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10685-7dffb15/llama-prism-b10685-7dffb15-bin-ubuntu-x64.tar.gz" -o llama-server.tar.gz
          tar -xzf llama-server.tar.gz -C ./bin --strip-components=1 || tar -xzf llama-server.tar.gz -C ./bin
          chmod +x ./bin/llama-server
          ./bin/llama-server --version || true

      # 4. Cache & Download Model from HuggingFace
      - name: Cache Model File
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models/${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}
          key: model-cache-${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}

      - name: Download Model from HuggingFace
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./models
          REPO="${{ github.event.inputs.model_repo || 'ornith-ai/Ornith-1.0-9B-GGUF' }}"
          FILE="${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}"
          echo "Downloading $FILE from $REPO..."
          curl -L -o "./models/$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE"

      # 5. Start llama-server & Record PID for Process Telemetry
      - name: Start llama-server (Port 9931)
        run: |
          CORES=$(nproc)
          FILE="${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}"
          CTX="${{ github.event.inputs.context_size || '8192' }}"

          echo "Starting llama-server for $FILE on $CORES cores with ${CTX} context..."

          ./bin/llama-server \
            -m "./models/$FILE" \
            --host 127.0.0.1 \
            --port 9931 \
            -c $CTX \
            -np 1 \
            --flash-attn on \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --temp 0.2 \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > .llama_server.pid
          echo "llama-server started (PID: $SERVER_PID). Monitoring health on port 9931..."

          READY=false
          for i in {1..60}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::llama-server died on startup!"
              cat llama-server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9931/health | grep -q "ok"; then
              echo "llama-server is ready on port 9931!"
              READY=true
              break
            fi

            echo "Warming up... ($i/60)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::llama-server failed to respond in 120s."
            cat llama-server.log
            exit 1
          fi

      # 6. Run Event Pipeline with Diagnostics, Token Metrics & UUIDv5
      - name: Execute AI Event Pipeline
        env:
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          SERVER_URL: "http://127.0.0.1:9931"
          MODEL_NAME: "${{ github.event.inputs.model_file || 'ornith-1.0-9b-Q4_K_M.gguf' }}"
          SHARD_ID: "shard-1/1"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts

      # 7. Debug Artifacts
      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-log
          path: llama-server.log
