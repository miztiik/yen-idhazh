name: Yen-Summarizers

on:
  pull_request:
    paths:
      - '.github/scripts/ai-pipeline.ts'
      - '.github/scripts/read-pipeline-events.ts'
      - '.github/scripts/prepare-evaluation-request.ts'
      - '.github/scripts/read-coverage-settings.ts'
      - '.github/scripts/test/workflow-handoff.test.ts'
      - '.github/workflows/ai-pipeline-tests.yml'
      - 'packages/common-contracts/**'
      - 'services/summary-generator/**'
      - '.github/scripts/declare-workflow-event-source.ts'
      - 'tests/fixtures/typescript-metadata/workflow-output-event.json'
      - 'tests/fixtures/typescript-metadata/evaluator-request.json'
      - 'tests/fixtures/typescript-metadata/evaluator-response.json'
  workflow_dispatch:
    inputs:
      input_source:
        description: 'Input Source Mode'
        required: true
        type: choice
        options:
          - 'feed'
          - 'url'
          - 'text'
        default: 'feed'
      feed_url:
        description: 'Feed URL (feed mode only); blank uses the existing feed list'
        required: false
        type: string
        default: ''
      article_count_goal:
        description: 'Target number of articles to collect from feeds'
        required: false
        default: '3'
      feed_max_age_hours:
        description: 'Max article age in hours (feed mode only)'
        required: false
        default: '24'
      url:
        description: 'Direct URL to extract (used when input_source is url)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Input text (used directly if input_source is text, or as fallback)'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      model:
        description: 'Model declaration under config/ (default: Ornith)'
        required: false
        type: choice
        options:
          - 'models/ornith-1.5-9b-q5km.json'
          - 'models/deepseek-v4-pro-qwen3.5-9b-q4km.json'
          - 'models/gemma-4-12b-it-qat-ud-q4-k-xl.json'
          - 'models/gemma-4-e4b-qat-no-draft.json'
          - 'models/gemma-4-e4b-qat.json'
          - 'models/qwen3.5-9b-kimi-k3-distilled-q4km.json'
          - 'models/qwen3.5-9b-q4km-thinking.json'
          - 'models/qwen3.5-9b-q4km.json'
          - 'models/qwen3.8-9b-q5km-distill.json'
        default: 'models/ornith-1.5-9b-q5km.json'
      models_file:
        description: 'Optional model JSON path under config/; overrides the model dropdown'
        required: false
        default: ''
      max_word_length:
        description: 'Maximum ingested word count per article before truncation'
        required: false
        default: '8200'
      prompt:
        description: 'System Prompt Preamble'
        required: false
        default: 'You are a precise, objective intelligence analyst. Your mandate is to produce a faithful, high-density synthesis of the provided document.'

jobs:
  workflow-handoff:
    runs-on: ubuntu-latest
    name: Saved workflow handoff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Prepare locked metadata and existing workflow dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd services/summary-generator
          npm install --no-save --package-lock=false --no-audit --no-fund defuddle linkedom feedsmith tidy-url
      - name: Check the real saved handoff without model dispatch
        run: |
          bun run --no-install ./packages/common-contracts/node_modules/typescript/bin/tsc \
            --noEmit --target ESNext --module ESNext --moduleResolution Bundler \
            --strict --skipLibCheck --allowImportingTsExtensions --types bun \
            --typeRoots packages/common-contracts/node_modules/@types \
            .github/scripts/ai-pipeline.ts .github/scripts/test/workflow-handoff.test.ts
          bun test ./.github/scripts/test/workflow-handoff.test.ts

  run-pipeline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Phased LLM Inference & UniEval Audit
    env:
      MODELS_FILE: ${{ inputs.models_file || inputs.model }}
      CONFIG_ROOT: ${{ (inputs.models_file || inputs.model) != '' && 'backend/var/candidate-config' || 'config' }}
      PYTHONPATH: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup frozen Python dependency tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - name: Install Shared Metadata Dependencies
        working-directory: packages/common-contracts
        run: bun install --frozen-lockfile

      - name: Install
        run: |
          python -m pip install 'pydantic>=2.12'
          python -m pip install -e . --no-deps

      - name: Point scratch config at the selected declaration
        if: env.MODELS_FILE != ''
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ env.MODELS_FILE }}

      - name: Validate the selected request
        id: request
        run: |
          set -euo pipefail
          DECLARED=$(python backend/utilities/model_runtime.py describe-request --config-root "$CONFIG_ROOT")
          echo "probe_url=$(echo "$DECLARED" | jq -r .base_url)" >> "$GITHUB_OUTPUT"

      - name: Read pinned runtime build
        id: runtime
        run: python backend/utilities/model_runtime.py print-pinned-build >> "$GITHUB_OUTPUT"

      - name: Install native model-request helper dependencies
        working-directory: services/summary-generator
        run: bun install --frozen-lockfile

      # 1. TUNE LINUX MEMORY
      - name: Configure Linux Memory & Swappiness
        run: |
          sudo sysctl vm.swappiness=1
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install existing inference and frozen evaluation dependencies
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"
          npm install --no-audit --no-fund defuddle linkedom feedsmith tidy-url

          uv sync --project services/summary_evaluator --frozen --extra model --no-dev
          services/summary_evaluator/.venv/bin/python \
            services/summary_evaluator/scripts/prepare-coverage-resources.py --root . --include-weights

      - name: Read the actual coverage listener and lifecycle bounds
        id: coverage
        run: |
          services/summary_evaluator/.venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import math
          from pathlib import Path
          from summary_evaluator.serve_http.api_settings import load_api_settings
          from summary_evaluator.source_coverage.load_settings import load_settings
          root = Path(".")
          api = load_api_settings(root / "config" / "summary-evals" / "api.json")
          selected = load_settings(root, api.listener, api.logging)
          host = f"[{api.listener.host}]" if ":" in api.listener.host else api.listener.host
          print(f"health_url=http://{host}:{api.listener.port}/api/2026-11-05/get-summary-coverage-health")
          print(f"startup_seconds={math.ceil(selected.worker.startup_timeout_ms / 1000)}")
          print(f"shutdown_seconds={math.ceil(api.shutdown_timeout_ms / 1000)}")
          print(f"forced_stop_seconds={math.ceil(selected.worker.forced_stop_ms / 1000)}")
          print(f"health_seconds={math.ceil(api.listener.body_read_timeout_ms / 1000)}")
          print(f"max_identity_bytes={selected.worker.max_proc_identity_bytes}")
          print(f"model_revision={selected.assets.model.revision}")
          print(f"code_revision={selected.assets.code.revision}")
          print(f"log_directory={api.log_directory}")
          PY

      - name: Start selected model
        uses: ./.github/actions/model-server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ steps.request.outputs.probe_url }}
          llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
          config_root: ${{ env.CONFIG_ROOT }}

      # 5. PHASE 1: RUN INGESTION & LLM INFERENCE
      - name: Execute Phase 1 Inference
        env:
          INPUT_SOURCE: "${{ github.event.inputs.input_source }}"
          FEED_URL: "${{ github.event.inputs.feed_url }}"
          ARTICLE_COUNT_GOAL: "${{ github.event.inputs.article_count_goal }}"
          FEED_MAX_AGE_HOURS: "${{ github.event.inputs.feed_max_age_hours }}"
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          MAX_WORD_LENGTH: "${{ github.event.inputs.max_word_length }}"
          SHARD_ID: "${{ github.job }}"
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=infer

      # 6. TEARDOWN LLAMA-SERVER & RECLAIM PHYSICAL RAM
      - name: Stop llama-server (Reclaim Memory)
        if: always()
        run: |
          if [ -f llama-server.pid ]; then
            echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"INFO","message":"Stopping llama-server to reclaim RAM for UniEval..."}'
            kill "$(cat llama-server.pid)" || true
            rm -f llama-server.pid
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
          fi

      - name: Start the explicitly selected source-coverage evaluator
        id: coverage_server
        env:
          COVERAGE_HEALTH_URL: ${{ steps.coverage.outputs.health_url }}
          STARTUP_SECONDS: ${{ steps.coverage.outputs.startup_seconds }}
          HEALTH_SECONDS: ${{ steps.coverage.outputs.health_seconds }}
          MAX_IDENTITY_BYTES: ${{ steps.coverage.outputs.max_identity_bytes }}
          MODEL_REVISION: ${{ steps.coverage.outputs.model_revision }}
          CODE_REVISION: ${{ steps.coverage.outputs.code_revision }}
        run: |
          set -euo pipefail
          services/summary_evaluator/.venv/bin/python -m summary_evaluator \
            --root . --routes coverage > eval_server.log 2>&1 &
          SERVER_PID=$!
          echo "pid=$SERVER_PID" >> "$GITHUB_OUTPUT"
          export SERVER_PID
          PIN=$(services/summary_evaluator/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          pid = int(os.environ["SERVER_PID"])
          try:
              with Path(f"/proc/{pid}/stat").open("rb") as source:
                  raw = source.read(int(os.environ["MAX_IDENTITY_BYTES"]) + 1)
              if len(raw) > int(os.environ["MAX_IDENTITY_BYTES"]):
                  raise ValueError("Process identity exceeds its bound")
              print(raw.decode().rsplit(")", 1)[1].split()[19])
          except (OSError, ValueError, IndexError, UnicodeError):
              raise SystemExit(1) from None
          PY
          )
          echo "start_ticks=$PIN" >> "$GITHUB_OUTPUT"
          READY=0
          DEADLINE=$((SECONDS + STARTUP_SECONDS))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "The owned coverage server exited before readiness"
              cat eval_server.log
              exit 1
            fi
            if curl --silent --fail --max-time "$HEALTH_SECONDS" "$COVERAGE_HEALTH_URL" \
              | services/summary_evaluator/.venv/bin/python -c '
          import json, os, subprocess, sys
          try:
              value = json.load(sys.stdin)
              model, worker = value["model"], value["worker"]
              pid = worker["pid"]
              if type(pid) is not int or pid <= 0:
                  raise ValueError("Invalid owned worker identity")
              owner = int(subprocess.check_output(["ps", "-o", "ppid=", "-p", str(pid)], text=True).strip())
              valid = value["status"] == "ready" and owner == int(os.environ["SERVER_PID"])
              valid = valid and model["loaded_revision"] == os.environ["MODEL_REVISION"]
              valid = valid and model["tokenizer_revision"] == os.environ["MODEL_REVISION"]
              valid = valid and model["code_revision"] == os.environ["CODE_REVISION"]
              raise SystemExit(0 if valid else 1)
          except (ValueError, KeyError, TypeError, subprocess.SubprocessError):
              raise SystemExit(1) from None
          '; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "Coverage did not become ready within its configured startup bound"
            cat eval_server.log
            exit 1
          fi

      # 8. PHASE 2: RUN QUALITY AUDIT
      - name: Execute Phase 2 Quality Audit
        env:
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          SHARD_ID: "${{ github.job }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=eval

      - name: Stop the exact owned coverage server
        if: always()
        env:
          SERVER_PID: ${{ steps.coverage_server.outputs.pid }}
          SERVER_START_TICKS: ${{ steps.coverage_server.outputs.start_ticks }}
          SHUTDOWN_SECONDS: ${{ steps.coverage.outputs.shutdown_seconds }}
          FORCED_STOP_SECONDS: ${{ steps.coverage.outputs.forced_stop_seconds }}
          MAX_IDENTITY_BYTES: ${{ steps.coverage.outputs.max_identity_bytes }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_PID" ]; then exit 0; fi
          if [ -z "$SERVER_START_TICKS" ]; then
            echo "Coverage startup did not establish an owned process pin" >&2
            exit 1
          fi
          owns_server() {
            services/summary_evaluator/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          try:
              pid = int(os.environ["SERVER_PID"])
              with Path(f"/proc/{pid}/stat").open("rb") as source:
                  raw = source.read(int(os.environ["MAX_IDENTITY_BYTES"]) + 1)
              if len(raw) > int(os.environ["MAX_IDENTITY_BYTES"]):
                  raise ValueError("Process identity exceeds its bound")
              fields = raw.decode().rsplit(")", 1)[1].split()
              matches = fields[19] == os.environ["SERVER_START_TICKS"] and fields[0] != "Z"
              raise SystemExit(0 if matches else 1)
          except FileNotFoundError:
              raise SystemExit(1) from None
          except (OSError, ValueError, IndexError, UnicodeError):
              raise SystemExit(2) from None
          PY
          }
          STATE=0
          owns_server || STATE=$?
          if [ "$STATE" -eq 2 ]; then
            echo "The owned server identity is unreadable; refusing an unpinned stop" >&2
            exit 1
          fi
          if [ "$STATE" -eq 0 ]; then
            kill "$SERVER_PID"
            DEADLINE=$((SECONDS + SHUTDOWN_SECONDS))
            while owns_server && [ "$SECONDS" -lt "$DEADLINE" ]; do sleep 1; done
            STATE=0
            owns_server || STATE=$?
            if [ "$STATE" -eq 0 ]; then
              kill -KILL "$SERVER_PID"
              DEADLINE=$((SECONDS + FORCED_STOP_SECONDS))
              while owns_server && [ "$SECONDS" -lt "$DEADLINE" ]; do sleep 1; done
              STATE=0
              owns_server || STATE=$?
            fi
            if [ "$STATE" -ne 1 ]; then
              echo "The exact owned coverage server exit could not be confirmed" >&2
              exit 1
            fi
          fi

      # 10. UPLOAD LOGS & JSONL TELEMETRY
      - name: Upload Logs and JSONL Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            llama-server.log
            eval_server.log
            pipeline-events.jsonl
            ${{ steps.coverage.outputs.log_directory }}
