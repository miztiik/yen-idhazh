name: Yen-Summarizers

on:
  workflow_dispatch:
    inputs:
      input_source:
        description: 'Input Source Mode'
        required: true
        type: choice
        options:
          - 'feed'
          - 'url'
          - 'text'
        default: 'feed'
      article_count_goal:
        description: 'Target number of articles to collect from feeds'
        required: false
        default: '3'
      feed_max_age_hours:
        description: 'Max article age in hours (feed mode only)'
        required: false
        default: '24'
      url:
        description: 'Direct URL to extract (used when input_source is url)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Input text (used directly if input_source is text, or as fallback)'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      model_family:
        description: 'HuggingFace Repo Name & Model Family (owner/repo)'
        required: true
        default: 'ornith-ai/Ornith-1.5-9B-GGUF'
      model_id:
        description: 'Specific Model ID / GGUF Filename (leave blank for auto-detect)'
        required: false
        default: ''
      context_size:
        description: 'Context Window Size'
        required: false
        default: '16384'
      max_word_length:
        description: 'Maximum ingested word count per article before truncation'
        required: false
        default: '8200'
      prompt:
        description: 'System Prompt Preamble'
        required: false
        default: 'You are a precise, objective intelligence analyst. Your mandate is to produce a faithful, high-density synthesis of the provided document.'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    name: Phased LLM Inference & UniEval Audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. TUNE LINUX MEMORY
      - name: Configure Linux Memory & Swappiness
        run: |
          sudo sysctl vm.swappiness=1
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # 2. INSTALL LLAMA.CPP
      - name: Install Official llama.cpp
        run: |
          curl -LsSf https://llama.app/install.sh | SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 3. PARALLEL SETUP: DEPENDENCIES & GGUF MODEL DOWNLOAD
      - name: Parallel Setup (Dependencies & Model Download)
        run: |
          set -euo pipefail

          # Ensure all child background jobs are killed if parent script exits unexpectedly
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

          LOG_DEPS="/tmp/install_deps.log"
          LOG_MODEL="/tmp/download_model.log"
          mkdir -p ./models

          # Resolve Hugging Face Model Filename in Parent Shell
          REPO="${{ github.event.inputs.model_family }}"
          SPECIFIC_FILE="${{ github.event.inputs.model_id }}"

          echo "[$(date +%T)] 🔍 Resolving model filename for '${REPO}'..."
          if [ -n "$SPECIFIC_FILE" ]; then
            FILE="$SPECIFIC_FILE"
          else
            FILE=$(curl -sL "https://huggingface.co/api/models/${REPO}/tree/main" | jq -r '.[].path' | grep -iE '\.gguf$' | grep -iE 'q5_k_m|q4_k_m' | head -n 1)
            [ -z "$FILE" ] && FILE=$(curl -sL "https://huggingface.co/api/models/${REPO}/tree/main" | jq -r '.[].path' | grep -iE '\.gguf$' | head -n 1)
          fi

          if [ -z "$FILE" ] || [ "$FILE" = "null" ]; then
            echo "::error::Failed to resolve a valid .gguf file from Hugging Face repository: ${REPO}"
            exit 1
          fi

          echo "MODEL_FILE=$FILE" >> $GITHUB_ENV
          echo "[$(date +%T)] 🎯 Target Model: $FILE"

          # -------------------------------------------------------------
          # FUNCTION 1: Runtime Dependencies Setup
          # -------------------------------------------------------------
          task_install_deps() {
            echo "[$(date +%T)] Starting Node.js & Python dependencies installation..."
            
            if [ ! -f package.json ]; then npm init -y; fi
            npm pkg set type="module"
            npm install --no-audit --no-fund defuddle linkedom feedsmith tidy-url

            pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
            pip install --no-cache-dir transformers sentencepiece protobuf evaluate rouge-score nltk rank-bm25 prettytable scipy fastapi uvicorn pydantic
            python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

            rm -rf /tmp/unieval
            git clone --depth 1 https://github.com/maszhongming/UniEval.git /tmp/unieval
            echo "[$(date +%T)] All runtime dependencies successfully installed."
          }

          # -------------------------------------------------------------
          # FUNCTION 2: Model Binary Download
          # -------------------------------------------------------------
          task_download_model() {
            echo "[$(date +%T)] Starting model download for ./models/$FILE..."
            if [ ! -f "./models/$FILE" ]; then
              curl -fL -C - \
                --retry 3 \
                --retry-delay 2 \
                --retry-connrefused \
                -o "./models/$FILE" \
                "https://huggingface.co/${REPO}/resolve/main/${FILE}"
            else
              echo "Model file already exists in cache."
            fi
            echo "[$(date +%T)] Model binary download verified and complete."
          }

          # -------------------------------------------------------------
          # DISPATCH PARALLEL JOBS
          # -------------------------------------------------------------
          task_install_deps > "$LOG_DEPS" 2>&1 &
          PID_DEPS=$!

          task_download_model > "$LOG_MODEL" 2>&1 &
          PID_MODEL=$!

          echo "[$(date +%T)] 🚀 Parallel tasks dispatched:"
          echo "       ↳ [PID $PID_DEPS] Runtime Dependencies (logging to $LOG_DEPS)"
          echo "       ↳ [PID $PID_MODEL] GGUF Model Download (logging to $LOG_MODEL)"

          declare -A TASK_NAMES=( ["$PID_DEPS"]="Dependencies Installation" ["$PID_MODEL"]="GGUF Model Download" )
          declare -A TASK_LOGS=( ["$PID_DEPS"]="$LOG_DEPS" ["$PID_MODEL"]="$LOG_MODEL" )

          # -------------------------------------------------------------
          # FAIL-FAST EVENT LOOP (wait -n)
          # -------------------------------------------------------------
          for _ in 1 2; do
            EXITED_PID=""
            if wait -n -p EXITED_PID; then
              NAME="${TASK_NAMES[$EXITED_PID]}"
              echo "[$(date +%T)] ✅ $NAME completed successfully."
              echo "::group::📄 View $NAME Logs"
              cat "${TASK_LOGS[$EXITED_PID]}"
              echo "::endgroup::"
            else
              STATUS=$?
              NAME="${TASK_NAMES[${EXITED_PID:-$PID_DEPS}]}"
              echo "::error::[$(date +%T)] ❌ $NAME failed with exit code $STATUS!"

              # Terminate sibling task immediately to release runner bandwidth
              kill "$PID_DEPS" "$PID_MODEL" 2>/dev/null || true

              echo "::group::🚨 FAILED TASK LOG: $NAME"
              cat "${TASK_LOGS[${EXITED_PID:-$PID_DEPS}]}"
              echo "::endgroup::"
              exit $STATUS
            fi
          done

          # Disable trap on clean completion
          trap - EXIT
          echo "[$(date +%T)] 🎉 Both setup stages completed in parallel without error."

      # 4. START LLAMA-SERVER (PORT 9931)
      - name: Start llama-server Daemon (Port 9931)
        run: |
          CORES=$(nproc)
          CTX="${{ github.event.inputs.context_size }}"

          llama serve \
            -m "./models/$MODEL_FILE" \
            --host 127.0.0.1 \
            --port 9931 \
            -c $CTX \
            -np 1 \
            --flash-attn on \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --temp 0.2 \
            --repeat-penalty 1.15 \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo $SERVER_PID > .llama_server.pid

          READY=0
          for i in {1..120}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"ERROR","message":"llama serve died on startup"}'
              cat llama-server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9931/health | grep -q "ok"; then
              echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"INFO","message":"llama server is ready on port 9931"}'
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ $READY -ne 1 ]; then
            echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"ERROR","message":"llama server failed to start within 60s"}'
            cat llama-server.log
            exit 1
          fi

      # 5. PHASE 1: RUN INGESTION & LLM INFERENCE
      - name: Execute Phase 1 Inference
        env:
          INPUT_SOURCE: "${{ github.event.inputs.input_source }}"
          ARTICLE_COUNT_GOAL: "${{ github.event.inputs.article_count_goal }}"
          FEED_MAX_AGE_HOURS: "${{ github.event.inputs.feed_max_age_hours }}"
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          CONTEXT_SIZE: "${{ github.event.inputs.context_size }}"
          MAX_WORD_LENGTH: "${{ github.event.inputs.max_word_length }}"
          SERVER_URL: "http://127.0.0.1:9931"
          MODEL_NAME: "${{ env.MODEL_FILE }}"
          MODEL_FAMILY: "${{ github.event.inputs.model_family }}"
          REQUESTED_MODEL_ID: "${{ github.event.inputs.model_id }}"
          SHARD_ID: "${{ github.job }}"
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
          LLAMA_TEMPERATURE: "0.2"
          LLAMA_TOP_K: "40"
          LLAMA_TOP_P: "0.95"
          LLAMA_MIN_P: "0.05"
          LLAMA_REPEAT_PENALTY: "1.15"
          LLAMA_PRESENCE_PENALTY: "0.2"
          LLAMA_FREQUENCY_PENALTY: "0.2"
          LLAMA_MAX_TOKENS: "4350"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=infer

      # 6. TEARDOWN LLAMA-SERVER & RECLAIM PHYSICAL RAM
      - name: Stop llama-server (Reclaim Memory)
        run: |
          if [ -f .llama_server.pid ]; then
            echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"INFO","message":"Stopping llama-server to reclaim RAM for UniEval..."}'
            kill -9 $(cat .llama_server.pid) || true
            rm -f .llama_server.pid
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
          fi

      # 7. START FASTAPI UNIEVAL ENGINE (PORT 9933)
      - name: Start Python FastAPI UniEval Engine (Port 9933)
        env:
          EVAL_EVENTS_PATH: "eval-events.jsonl"
        run: |
          UNIEVAL_DIR=/tmp/unieval python -u .github/scripts/serve-evaluator.py > eval_server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > .eval_server.pid

          READY=0
          for i in {1..120}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"ERROR","message":"UniEval server process terminated unexpectedly"}'
              cat eval_server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9933/health | grep -q '"status":"ok"'; then
              echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"INFO","message":"Python UniEval FastAPI server ready on port 9933"}'
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ $READY -ne 1 ]; then
            echo '{"timestamp":"'$(date -u +%FT%TZ)'","level":"ERROR","message":"UniEval server failed to become ready within 60s"}'
            cat eval_server.log
            exit 1
          fi

      # 8. PHASE 2: RUN QUALITY AUDIT
      - name: Execute Phase 2 Quality Audit
        env:
          MODEL_NAME: "${{ env.MODEL_FILE }}"
          MODEL_FAMILY: "${{ github.event.inputs.model_family }}"
          REQUESTED_MODEL_ID: "${{ github.event.inputs.model_id }}"
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          SHARD_ID: "${{ github.job }}"
          PIPELINE_EVENTS_PATH: "pipeline-events.jsonl"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts --phase=eval

      # 9. TEARDOWN EVAL SERVER
      - name: Teardown Python Eval Server
        if: always()
        run: |
          if [ -f .eval_server.pid ]; then
            kill -9 $(cat .eval_server.pid) || true
            rm -f .eval_server.pid
          fi

      # 10. UPLOAD LOGS & JSONL TELEMETRY
      - name: Upload Logs and JSONL Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            llama-server.log
            eval_server.log
            pipeline-events.jsonl
            eval-events.jsonl
