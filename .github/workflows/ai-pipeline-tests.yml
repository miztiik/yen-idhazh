name: AI Event-Driven Pipeline

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: 'HuggingFace Repo (provider/model)'
        required: true
        default: 'ornith-ai/Ornith-1.5-9B-GGUF'
      model_file:
        description: 'GGUF Filename'
        required: true
        default: 'Ornith-1.5-9B-Q5_K_M.gguf'
      context_size:
        description: 'Context Window Size'
        required: false
        default: '16384'
      url:
        description: 'URL to extract with Defuddle (defaults to Wikipedia)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      prompt:
        description: 'System Prompt'
        required: false
        default: 'You are an executive summarizer. Output ONLY the requested JSON. Do NOT output thinking tags or reasoning.'
      input_text:
        description: 'Fallback text if Defuddle URL fails'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'

jobs:
  run-inference:
    runs-on: ubuntu-latest
    name: LLM Inference Pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # 1. TUNE SWAPPINESS & CONFIGURE 8GB SAFETY SWAP
      - name: Configure Linux Memory & Swappiness
        run: |
          echo "Setting swappiness to 1 (prevents unnecessary paging to SSD)..."
          sudo sysctl vm.swappiness=1

          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "Swappiness value:"
          cat /proc/sys/vm/swappiness

      # 2. Setup Node ES Module & Install Defuddle
      - name: Setup Node ES Module & Install Defuddle
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"
          npm install defuddle linkedom

      # 3. Download llama-server binary
      - name: Download llama-server
        run: |
          mkdir -p ./bin
          echo "Fetching llama-server binary..."
          curl -L "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10685-7dffb15/llama-prism-b10685-7dffb15-bin-ubuntu-x64.tar.gz" -o llama-server.tar.gz
          tar -xzf llama-server.tar.gz -C ./bin --strip-components=1 || tar -xzf llama-server.tar.gz -C ./bin
          chmod +x ./bin/llama-server
          ./bin/llama-server --version || true

      # 4. Cache Model File
      - name: Cache Model File
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models/${{ github.event.inputs.model_file }}
          key: model-cache-${{ github.event.inputs.model_repo }}-${{ github.event.inputs.model_file }}

      # 5. Generic Hugging Face Download (Provider Neutral)
      - name: Download Model from HuggingFace
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./models
          REPO="${{ github.event.inputs.model_repo }}"
          FILE="${{ github.event.inputs.model_file }}"
          URL="https://huggingface.co/${REPO}/resolve/main/${FILE}"

          echo "Downloading $FILE from $URL..."
          # -f/--fail ensures curl fails immediately on HTTP 404
          curl -fL -o "./models/$FILE" "$URL"

          # Verify GGUF magic bytes
          if [ "$(head -c 4 "./models/$FILE")" != "GGUF" ]; then
            echo "::error::Downloaded file is corrupted or not a valid GGUF file!"
            exit 1
          fi
          echo "Verified GGUF binary header successfully."

      # 6. Start llama-server (16k Context on Port 9931)
      - name: Start llama-server (Port 9931)
        run: |
          CORES=$(nproc)
          FILE="${{ github.event.inputs.model_file }}"
          CTX="${{ github.event.inputs.context_size }}"

          echo "Starting llama-server for $FILE on $CORES cores with ${CTX} context..."

          ./bin/llama-server \
            -m "./models/$FILE" \
            --host 127.0.0.1 \
            --port 9931 \
            -c $CTX \
            -np 1 \
            --flash-attn on \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --temp 0.2 \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > .llama_server.pid
          echo "llama-server started (PID: $SERVER_PID). Monitoring health on port 9931..."

          READY=false
          for i in {1..60}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::llama-server died on startup!"
              cat llama-server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9931/health | grep -q "ok"; then
              echo "llama-server is ready on port 9931!"
              READY=true
              break
            fi

            echo "Warming up... ($i/60)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::llama-server failed to respond in 120s."
            cat llama-server.log
            exit 1
          fi

      # 7. Run Event Pipeline with Defuddle URL Ingestion & Diagnostics
      - name: Execute AI Event Pipeline
        env:
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          SERVER_URL: "http://127.0.0.1:9931"
          MODEL_NAME: "${{ github.event.inputs.model_file }}"
          SHARD_ID: "shard-1/1"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts

      # 8. Debug Artifacts
      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-log
          path: llama-server.log
