name: Yen-Summarizers

on:
  workflow_dispatch:
    inputs:
      input_source:
        description: 'Input Source Mode'
        required: true
        type: choice
        options:
          - 'feed'
          - 'url'
          - 'text'
        default: 'feed'
      article_count_goal:
        description: 'Target number of articles to collect from feeds'
        required: false
        default: '1'
      feed_max_age_hours:
        description: 'Max article age in hours (feed mode only)'
        required: false
        default: '24'
      url:
        description: 'Direct URL to extract with Defuddle (used when input_source is url)'
        required: false
        default: 'https://en.wikipedia.org/wiki/Ternary_numeral_system'
      input_text:
        description: 'Input text (used directly if input_source is text, or as fallback)'
        required: false
        default: 'Local LLMs allow running transformer architectures directly on edge devices and continuous integration runners without transmitting data over third-party APIs.'
      model_family:
        description: 'HuggingFace Repo Name & Model Family (owner/repo)'
        required: true
        default: 'ornith-ai/Ornith-1.5-9B-GGUF'
      model_id:
        description: 'Specific Model ID / GGUF Filename (leave blank for auto-detect)'
        required: false
        default: ''
      context_size:
        description: 'Context Window Size'
        required: false
        default: '16384'
      prompt:
        description: 'System Prompt'
        required: false
        default: 'You are an executive summarizer. Output ONLY the requested JSON. Do NOT output thinking tags or reasoning.'

jobs:
  run-inference:
    runs-on: ubuntu-latest
    name: LLM Inference Pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # 1. TUNE SWAPPINESS & CONFIGURE 8GB SAFETY SWAP
      - name: Configure Linux Memory & Swappiness
        run: |
          echo "Setting swappiness to 1 (prevents unnecessary paging to SSD)..."
          sudo sysctl vm.swappiness=1

          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "Swappiness value:"
          cat /proc/sys/vm/swappiness

      # 2. Setup Node ES Module & Install Dependencies
      - name: Setup Node ES Module & Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"
          npm install defuddle linkedom feedsmith

      # 3. Official llama.app Installer
      - name: Install Official llama.cpp
        run: |
          echo "Installing official llama.cpp via llama.app installer..."
          curl -LsSf https://llama.app/install.sh | SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ~/.local/bin/llama --version

      # 4. Cache Model Directory
      - name: Cache Model Directory
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models
          key: model-cache-${{ github.event.inputs.model_family }}-${{ github.event.inputs.model_id }}

      # 5. Resolve & Download GGUF (Specific Model ID or Auto-Detect)
      - name: Download Model from HuggingFace
        run: |
          mkdir -p ./models
          REPO="${{ github.event.inputs.model_family }}"
          SPECIFIC_FILE="${{ github.event.inputs.model_id }}"

          if [ -n "$SPECIFIC_FILE" ]; then
            echo "Using explicitly requested model_id: $SPECIFIC_FILE"
            FILE="$SPECIFIC_FILE"
          else
            echo "No specific model_id provided. Auto-resolving optimal GGUF from $REPO..."
            FILE=$(curl -sL "https://huggingface.co/api/models/${REPO}/tree/main" | jq -r '.[].path' | grep -iE '\.gguf$' | grep -iE 'q5_k_m|q4_k_m' | head -n 1)
            [ -z "$FILE" ] && FILE=$(curl -sL "https://huggingface.co/api/models/${REPO}/tree/main" | jq -r '.[].path' | grep -iE '\.gguf$' | head -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "::error::No .gguf files found in repository '$REPO'!"
            exit 1
          fi

          echo "Selected Model File: $FILE"
          echo "MODEL_FILE=$FILE" >> $GITHUB_ENV

          if [ ! -f "./models/$FILE" ]; then
            echo "Downloading $FILE..."
            curl -fL -o "./models/$FILE" "https://huggingface.co/${REPO}/resolve/main/${FILE}"
          else
            echo "Found $FILE in runner cache."
          fi

          # Verify GGUF magic bytes
          if [ "$(head -c 4 "./models/$FILE")" != "GGUF" ]; then
            echo "::error::Downloaded file is corrupted or not a valid GGUF binary!"
            exit 1
          fi

      # 6. Start Server using 'llama serve' (Port 9931, Context Configured)
      - name: Start llama-server (Port 9931)
        run: |
          CORES=$(nproc)
          CTX="${{ github.event.inputs.context_size }}"

          echo "Starting 'llama serve' for $MODEL_FILE on $CORES cores with ${CTX} context..."

          llama serve \
            -m "./models/$MODEL_FILE" \
            --host 127.0.0.1 \
            --port 9931 \
            -c $CTX \
            -np 1 \
            --flash-attn on \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --temp 0.2 \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > .llama_server.pid
          echo "llama server started (PID: $SERVER_PID). Monitoring health on port 9931..."

          READY=false
          for i in {1..60}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::llama server died on startup!"
              cat llama-server.log
              exit 1
            fi

            if curl -s http://127.0.0.1:9931/health | grep -q "ok"; then
              echo "llama server is ready on port 9931!"
              READY=true
              break
            fi

            echo "Warming up... ($i/60)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::llama server failed to respond in 120s."
            cat llama-server.log
            exit 1
          fi

      # 7. Run Event Pipeline with Config-Driven Environment Variables
      - name: Execute AI Event Pipeline
        env:
          INPUT_SOURCE: "${{ github.event.inputs.input_source }}"
          ARTICLE_COUNT_GOAL: "${{ github.event.inputs.article_count_goal }}"
          FEED_MAX_AGE_HOURS: "${{ github.event.inputs.feed_max_age_hours }}"
          URL: "${{ github.event.inputs.url }}"
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
          CONTEXT_SIZE: "${{ github.event.inputs.context_size }}"
          SERVER_URL: "http://127.0.0.1:9931"
          MODEL_NAME: "${{ env.MODEL_FILE }}"
          MODEL_FAMILY: "${{ github.event.inputs.model_family }}"
          REQUESTED_MODEL_ID: "${{ github.event.inputs.model_id }}"
          SHARD_ID: "${{ github.job }}"
          RUNNER_NAME: "${{ runner.name }}"
          RUNNER_OS: "${{ runner.os }}"
          RUNNER_ARCH: "${{ runner.arch }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_RUN_NUMBER: "${{ github.run_number }}"
          GITHUB_WORKFLOW: "${{ github.workflow }}"
          # Optional overrides for model telemetry params:
          LLAMA_TEMPERATURE: "0.2"
          LLAMA_TOP_K: "40"
          LLAMA_TOP_P: "0.95"
          LLAMA_MIN_P: "0.05"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts

      # 8. Upload JSONL Telemetry & Server Logs
      - name: Upload Logs and JSONL Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-pipeline-artifacts
          path: |
            llama-server.log
            pipeline-events.jsonl
