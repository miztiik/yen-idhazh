name: Pages publication

# Publishes the static bundle. It builds from committed data only - nothing here
# fetches, and nothing here runs a model (Guardrail #1).

on:
  # Publication follows a verdict, never a push. A push reaches this workflow at
  # the same moment it reaches CI, so it publishes before anything has said the
  # commit is sound - and since `scope` answers from each push's own paths, the
  # run that would have caught it may not even be the next one.
  #
  # Two workflows can produce that verdict. CI verifies a push to main. The daily
  # run validates the day it built before committing it, and its own pushes
  # start no CI at all - GitHub deliberately does not let one workflow's push
  # trigger another - so it reports here directly, which is what stops the
  # digest landing every morning and never reaching a reader. `branches` keeps a
  # pull request's run out; the decision below still checks the event, because
  # a fork's branch can be called main.
  workflow_run:
    workflows: [CI, Content refresh]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is declared per job below rather than here, because the two jobs
# want opposite answers and one group for the whole run cannot tell them apart.
# It is not a knob either: GitHub resolves `concurrency` before a job starts, so
# nothing has read a config file yet, and there is no value a knob could hold
# that makes cancelling a live deploy right (Guardrail #6).

jobs:
  # Whether to publish, and which commit. The rule is one program,
  # backend/utilities/publish_decision.py, so a test can run it against a real
  # repository. A pull request never publishes. A push publishes after its CI
  # passes, and only when it changed something the site is built from. The daily
  # run publishes when it landed a published change, whatever its conclusion:
  # the job that writes a day runs `check-publication` before its own commit, so
  # a sibling job failing afterwards does not unvalidate it. Every publish builds
  # main's tip, so a verdict that arrives late cannot take the site back to an
  # older commit.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # A push's range lives on its check suite; the workflow_run payload has no `before`.
      checks: read
    outputs:
      ref: ${{ steps.rule.outputs.ref }}
      publish: ${{ steps.rule.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - id: before
        if: github.event.workflow_run.name == 'CI'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUITE: ${{ github.event.workflow_run.check_suite_id }}
        run: echo "sha=$(gh api "repos/$REPOSITORY/check-suites/$SUITE" --jq .before || true)" >> "$GITHUB_OUTPUT"

      - id: rule
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ github.event.workflow_run.name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHECKED: ${{ github.event.workflow_run.head_sha }}
          BEFORE: ${{ steps.before.outputs.sha }}
          TIP: ${{ github.sha }}
          DISPATCHED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 backend/utilities/publish_decision.py >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer build supersedes an older one. Publishing is last-write-wins, so an
    # older bundle that finishes is discarded the moment the newer one deploys,
    # and finishing it bought nothing. Cancelling it cannot strand a deployment:
    # `deploy` needs this job, a cancelled job satisfies no `needs`, and a run
    # whose build stopped early uploaded no artifact for a deploy to take.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.decide.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # The repository name is the Pages sub-path, so every asset URL needs
          # it. Getting this wrong is the single most common Pages failure.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Report published size
        working-directory: frontend
        run: |
          echo "site bytes: $(du -sb build | cut -f1)"
          echo "site files: $(find build -type f | wc -l)"

      # enablement turns Pages on for a repo that has never published. Without
      # it the first ever deploy fails with a bare "Not Found", which reads like
      # a broken workflow rather than an unset repository switch.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, and never cancel one in flight: a half-replaced site
    # is worse than an old one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
