name: Model validation

# Row #10: qualify one candidate summarizer on absolute machine gates.
#
# One model runs. The owner ruled on 2026-08-26 that the candidate is judged
# alone, so there is no incumbent case, no paired replay and no second set of
# weights on this runner. Andre ruled the consequence: re-basing the dropped
# comparisons on the committed 8B history would be confounded, so the gates
# that survived read their thresholds from config, from the adoption target in
# docs/reference/pipeline-cost.md, and from this dispatch's own job bound.
#
# The corpus is frozen, not replanned. Each shard fetches and extracts its own
# slice exactly once, hashes the bytes, writes the hashes down, and only then
# starts calling the model - three times over the same bytes. The article
# bodies never leave the job that captured them; only hashes and measurements
# travel (CLAUDE.md section 0a).
#
# Never scheduled. A model swap is an ESCALATE, so this is dispatched by a
# human who intends to read the answer.

on:
  workflow_dispatch:
    inputs:
      # ONE argument names the candidate, and it is the same one line a swap
      # moves: the models file. Everything about a candidate - the repository,
      # the commit, the GGUF filename, its digest, its byte count, the alias it
      # answers to, the quantisation - is already written in that file, and a
      # form that asked for them again was a second copy of six facts that could
      # disagree with the first. It could bench one set of bytes and adopt
      # another, and nothing here would have noticed.
      #
      # Empty falls back to the pointer in `config/idhazh.json`, so a dispatch
      # that fills nothing in re-qualifies the incumbent - a coherent run rather
      # than a broken one, and no model ref is written in this file
      # (Guardrail #6).
      candidate_models_file:
        description: 'Models file under config/, for example models/qwen3.5-9b-q4km.json. Empty = the configured one.'
        default: ''
      shards:
        description: 'Capture-and-replay jobs. Each one freezes its own slice.'
        default: '3'
      corpus_per_shard:
        description: 'Frozen articles each shard replays'
        default: '10'
      job_budget_minutes:
        description: 'Per-job bound. The budget gate is measured against it (Guardrail #2).'
        default: '330'

permissions:
  contents: write

concurrency:
  # One group per candidate, because two candidates are two questions.
  #
  # `group: validate` admitted one run of this workflow at a time. A dispatch
  # fired while another was going waited, which is the intent - but GitHub
  # keeps only ONE pending run per group and a newer pending run cancels the
  # older one. So dispatching four candidates at once kept the run that
  # started and the case dispatched last, and silently cancelled the two
  # between them - no error anywhere, only a cancelled run with no reason on
  # it.
  #
  # The candidate file is the whole of what makes two dispatches different
  # runs, so it is what names the group. Two dispatches of the SAME candidate
  # still share a group and still queue, which is right - that is one question
  # asked twice. An empty field means the model `config/idhazh.json` points at,
  # which is a candidate like any other, so it gets a name rather than leaving
  # a bare trailing dash for every empty dispatch to collide on.
  #
  # `inputs` is legal here: GitHub's context availability table allows
  # `github, inputs, vars` on the `concurrency` key, and this workflow is
  # dispatch-only, so the context is always populated.
  group: validate-${{ inputs.candidate_models_file || 'the-configured-model' }}
  cancel-in-progress: false

# No llama.cpp pin here. It is `.github/scripts/llama-cpp-pin.sh`, which the
# fetch step sources and the `plan` job reads, so this workflow cannot spell a
# build the binary it unpacks disagrees with. A qualification on a different
# runtime than production is not qualifying production.
env:
  # Where this job's own probes ask. It is not where the stage posts - that is
  # `model_server.base_url`, and the server command binds the port inside it.
  # This is the one place this workflow writes an address, and it is always
  # loopback because the candidate runs on this runner (Guardrail #6).
  MODEL_SERVER_PROBE: 'http://127.0.0.1:8080'

jobs:
  # One plan, read once, for every shard. A long run can cross UTC midnight, so
  # the date is decided here and carried forward rather than recomputed - two
  # halves of one qualification filed under two dates is two half-runs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.decide.outputs.date }}
      matrix: ${{ steps.fanout.outputs.matrix }}
      candidate_models_file: ${{ steps.candidate.outputs.models_file }}
      candidate_id: ${{ steps.candidate.outputs.id }}
      candidate_weights_path: ${{ steps.candidate.outputs.weights_path }}
      candidate_cache_key: ${{ steps.candidate.outputs.cache_key }}
      llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - id: decide
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The build every shard is about to install, asked once of the file that
      # decides it. `needs` resolves before a shard's first step and `steps`
      # does not, so reading it here is what lets the cache key below name the
      # build it holds - and reading it from its one home is what stops this
      # workflow carrying a second copy that can disagree with the binary the
      # shards actually unpack.
      - id: runtime
        name: Say which llama.cpp build this run qualifies on
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py print-pinned-build \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # One place decides what the candidate is: the models file the dispatch
      # named, the pointer in `config/idhazh.json` otherwise. Every job below
      # reads the answer from here rather than repeating that fallback at each
      # use site, which is what keeps the two from disagreeing.
      #
      # The input arrives through `env` and not through an expression pasted
      # into the program, because a value pasted into a script is text before it
      # is a value. It becomes a FILE PATH, so it is resolved and proved to sit
      # inside `config/` before anything opens it - `..` in a form field is the
      # whole reason this is a containment check and not a name check
      # (CLAUDE.md section 4). The fields it publishes are substituted straight
      # into shell commands and into a download URL downstream, and nothing
      # after this point can catch a value carrying a space, a quote or a
      # newline - so each one is asserted to be one bare word here.
      - id: candidate
        env:
          CANDIDATE_MODELS_FILE: ${{ inputs.candidate_models_file }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_refs.py describe-trial-model \
            --models-file "$CANDIDATE_MODELS_FILE" >> "$GITHUB_OUTPUT"

      # Every number this dispatch carries, shaped once, here. `plan` is the job
      # every other job needs, so "before its first use" is anywhere after this
      # step - the qualify matrix, the job bound and the gate all read these
      # afterwards. They arrive through `env` and are read by name, so nothing
      # below is pasted into a command.
      - id: fanout
        env:
          SHARDS: ${{ inputs.shards }}
          CORPUS_PER_SHARD: ${{ inputs.corpus_per_shard }}
          JOB_BUDGET_MINUTES: ${{ inputs.job_budget_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "$SHARDS" =~ ^[1-8]$ ]]; then
            echo "shards must be an integer from 1 through 8" >&2
            exit 1
          fi
          for count in "$CORPUS_PER_SHARD" "$JOB_BUDGET_MINUTES"; do
            if ! [[ "$count" =~ ^[1-9][0-9]{0,3}$ ]]; then
              echo "corpus_per_shard and job_budget_minutes are 1 through 9999" >&2
              exit 1
            fi
          done
          echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      # Why the copy differs in one line and nothing else is written down once,
      # in the action. `trial_state` is the second line and it is not a control
      # on the measurement: it says where this run's own ledgers land, not what
      # the run measures. `pipeline-tests` is the directory the bench and the
      # pipeline test rig already write to, so "not a production day" is one
      # place in `state/` rather than three.
      - name: Build the candidate config
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ steps.candidate.outputs.models_file }}
          trial_state: pipeline-tests

      # The addresses only. A plan carries URLs and rank metadata, never an
      # article body, so it is the one thing that may cross a job boundary here.
      #
      # `--config backend/var/candidate-config` is what keeps this step out of
      # the ledgers a published day is built from. `plan` appends to the seen
      # store, feed health, feed retirements and the counterfactual scores, and
      # without the flag it loads the committed config - which names no trial
      # directory, so a qualification would mark real addresses seen. Nothing
      # in this job is committed today, so the rows die with the runner; the
      # flag is here because a job that CAN reach the production state root is
      # one commit step away from doing it, and this workflow already holds
      # `contents: write` and commits `state` from `decide`.
      - name: Read the feeds
        run: |
          python -m idhazh plan \
            --config backend/var/candidate-config \
            --date "${{ steps.decide.outputs.date }}"

      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: backend/var/run/${{ steps.decide.outputs.date }}/plan.json
          retention-days: 1

  qualify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.job_budget_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The same two lines as the daily run, for the same reason: the default
      # PyPI `torch` wheel for Linux is the graphics-card build and this runner
      # has no graphics card (Guardrail #2). The extra finds torch already
      # satisfied and installs the rest.
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[faithfulness]"

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      # Why the copy differs in one line and nothing else is written down once,
      # in the action. What it means HERE is the part worth repeating: move that
      # line and you have run the swap; move it back and you have run the
      # revert, so a candidate is qualified through the exact line an adoption
      # would later touch.
      #
      # `trial_state` matches the plan job's copy. `qualify` writes no ledger
      # today - it freezes bytes under `backend/var/` and replays them - so the
      # redirect changes nothing this dispatch does. It is here so that the two
      # copies of one config say the same thing, and so a stage added to this
      # job later inherits the redirect rather than discovering it is missing.
      - name: Build the candidate config
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ needs.plan.outputs.candidate_models_file }}
          trial_state: pipeline-tests

      # Keyed on the candidate bytes, not on its filename: two builds of one
      # model share a name, and a key that cannot tell them apart serves the
      # wrong weights under the right alias. One model per entry, so the cache
      # never holds two multi-gigabyte GGUFs at once (Guardrail #2).
      - name: Cache the candidate weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: qualify-${{ needs.plan.outputs.candidate_cache_key }}-${{ needs.plan.outputs.llama_cpp_build }}

      # Two calls to one program, and neither is handed a URL, a filename or a
      # digest: it reads the scratch config's own entry and fetches every file
      # that entry declares. The three candidate refs used to be substituted
      # straight into a download URL, which is text before it is a value.
      - name: Fetch the runtime and the candidate
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py install-runtime
          python3 backend/utilities/model_runtime.py download-model-files \
            --config-root backend/var/candidate-config

      # No `if:`. This runs on a cache hit too, because a restored entry is the
      # one case where nobody watched the bytes arrive. It sits before the
      # server starts, so wrong weights cost one step instead of a whole shard
      # of measurements filed under a model that never ran (Guardrail #10).
      #
      # It reads the declaration rather than a filename, so it checks every file
      # the entry declares against that entry's own digest and declared size.
      - name: Verify the candidate bytes
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py verify-model-files \
            --config-root backend/var/candidate-config

      - name: Start the candidate
        run: |
          set -euo pipefail
          # The scratch config's `models.summarizer` IS the candidate, so the
          # alias, every flag and the weights come from the same place the run
          # is judged against. This step used to render the flag list from a
          # second copy, which is how it went two changes without the
          # context-shift refusal the daily run has had since PR #88.
          python3 backend/utilities/model_runtime.py start-server \
            --config-root backend/var/candidate-config

      - name: Check the candidate is the one serving
        env:
          CANDIDATE_ID: ${{ needs.plan.outputs.candidate_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            curl -sf "${MODEL_SERVER_PROBE}/health" > /dev/null && break
            sleep 5
          done
          curl -sf "${MODEL_SERVER_PROBE}/health" > /dev/null || {
            echo "the candidate never became healthy" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          SERVED=$(curl -sf "${MODEL_SERVER_PROBE}/v1/models" | jq -r '.data[0].id')
          if [ "$SERVED" != "$CANDIDATE_ID" ]; then
            echo "the server answers to ${SERVED}, not ${CANDIDATE_ID}" >&2
            exit 1
          fi

      - name: What this runner is
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          backend/bin/llama-server --version 2>&1 | head -5 || true

      # Freeze, register the hashes, then replay. That ordering lives inside the
      # stage rather than in this file, so nothing can call the model before the
      # corpus is written down.
      #
      # `LLAMA_CPP_BUILD` is what the candidate's identity record names as the
      # runtime that decoded the bytes. It used to reach here as workflow `env`
      # beside a copy of the pin; it now comes from the step that read the pin,
      # so it cannot name a build other than the one the shards installed. Unset
      # it degrades to `build-not-recorded` rather than failing, which is a
      # qualification whose report cannot say what ran (Guardrail #10).
      - name: Freeze the corpus and replay it
        env:
          LLAMA_CPP_BUILD: ${{ needs.plan.outputs.llama_cpp_build }}
          CANDIDATE_WEIGHTS: ${{ needs.plan.outputs.candidate_weights_path }}
        run: |
          python -m idhazh qualify \
            --config backend/var/candidate-config \
            --date "${{ needs.plan.outputs.date }}" \
            --shard "${{ matrix.shard }}" \
            --shards "${{ fromJSON(inputs.shards) }}" \
            --corpus-per-shard "${{ fromJSON(inputs.corpus_per_shard) }}" \
            --weights "$CANDIDATE_WEIGHTS" \
            --commit "${GITHUB_SHA}" \
            --runner ubuntu-latest

      # `if: always()` buys the record of a bad shard. A run that died mid-way
      # is exactly the one whose counts a reader wants, and the stage writes
      # this file before it returns.
      - name: What this shard measured
        if: always()
        run: cat backend/var/qualification/shard-${{ matrix.shard }}.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Runtime log on failure
        if: failure()
        run: tail -80 llama-server.log || true

      # Hashes, counts and timings. The frozen article payloads stay under
      # backend/var/qualification/<date>/ on this runner and are thrown away
      # with it - this repository is public and an article body is not ours to
      # publish (CLAUDE.md section 0a).
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ matrix.shard }}
          path: backend/var/qualification/shard-*.json
          retention-days: 30

      # Our own summaries, so a person can read the writing the scores judged.
      # Its own artifact rather than a field on the shard, because a gate must
      # not learn to read it. Still no article body: the source is a link
      # (CLAUDE.md section 0a).
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-samples-${{ matrix.shard }}
          path: backend/var/qualification/samples-*.json
          retention-days: 30

      # What each call was sent and what came back, one file per call per item
      # per repeat. Without it a gate verdict names a count and nothing can say
      # what the model was asked, which is the question every investigation of a
      # bad score opens with. `backend/utilities/pipeline_artifact_analyzer.py`
      # reads this directory.
      #
      # Owner decision, 2026-09-18. A prompt carries the article body, and this
      # repository is public: GitHub asks only for read access to download an
      # artifact, so this is readable by anyone rather than by maintainers
      # alone. digest.yml had already made that trade for the daily run. It is
      # bounded by `logging.capture_prompts` and `logging.capture_replies` -
      # with both off the directory is empty and this line is a green no-op.
      - uses: actions/upload-artifact@v7
        with:
          name: captures-${{ matrix.shard }}
          path: backend/var/run/${{ needs.plan.outputs.date }}/captures/
          retention-days: 30
          if-no-files-found: ignore

  decide:
    needs: [plan, qualify]
    # `always()`, because a shard that died still leaves the gates something to
    # say. This job fails on the merged evidence and names the metric, rather
    # than inheriting a failure it cannot explain.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          pattern: qualification-*
          merge-multiple: true
          path: backend/var/qualification/

      # The third copy of the scratch config, and the last job that had none.
      # `qualify-decide` writes this dispatch's verdict, and until 2026-09-18 it
      # wrote it to `state/validation-<date>.csv` off the repository root - so a
      # candidate judged on a trial state root still wrote the tree a published
      # day is built from. `trial_state` matches the two jobs above it.
      - name: Build the candidate config
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ needs.plan.outputs.candidate_models_file }}
          trial_state: pipeline-tests

      # Non-zero when a gate fails, deliberately: that verdict is an ESCALATE
      # and a green build would let it pass unread.
      #
      # `--execution ${{ github.run_id }}` is what keeps two candidates apart.
      # GitHub allocates that number and no second dispatch can reproduce it, so
      # the verdict's run id - and the segment filename built from it - differ
      # even when both dispatches judge the same day. Left out, the run counts
      # off the last committed manifest and two dispatches read the same answer.
      - name: Run the gates
        id: gates
        continue-on-error: true
        run: |
          python -m idhazh qualify-decide \
            --config backend/var/candidate-config \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --job-budget-minutes "${{ fromJSON(inputs.job_budget_minutes) }}" \
            --runner ubuntu-latest

      # The gates write a segment rather than the day file, so this is what turns
      # it into the row the step below commits. `--config` points it at the same
      # trial state root the gates wrote to, so the segment it drains is the one
      # this dispatch left and no production head is opened.
      #
      # `if: always()` for the same reason the commit step carries it: a failed
      # gate still leaves a verdict, and that is the dispatch whose record is
      # worth having.
      - name: Fold the verdict into its day
        if: always()
        run: >-
          python -m idhazh compact --config backend/var/candidate-config
          --date "${{ needs.plan.outputs.date }}"

      # The ten gates, failures first. `if: always()` because the step above
      # exits non-zero on an ESCALATE, and that is precisely the verdict a
      # reader opened this page for.
      - name: The verdict
        if: always()
        run: cat backend/var/qualification/report.md >> "$GITHUB_STEP_SUMMARY" || true

      # The trial root, and `state` whole until 2026-09-18 - which staged every
      # production ledger in the checkout, so a dispatch could commit whatever
      # else happened to be dirty in the tree. This job's whole state root is
      # redirected here by the config step above, so everything under this path
      # that is dirty on this runner was written by this runner.
      #
      # The trial root rather than `state/pipeline-tests/validation`, and that is
      # the same trade the telemetry fold records: `git add` on a path the
      # checkout does not hold aborts the whole step under `set -e`, and a
      # dispatch whose gates wrote no verdict has no validation directory at all.
      # The trial root is in every checkout.
      - name: Commit the validation ledger
        env:
          COMMIT_MESSAGE: "qualify: ${{ needs.plan.outputs.candidate_id }} ${{ needs.plan.outputs.date }}"
          NOTHING_STAGED_MESSAGE: "the gates wrote no ledger row"
          PUSH_FAILED_MESSAGE: "could not push the validation ledger"
        run: bash .github/scripts/commit-and-push.sh state/pipeline-tests

      - uses: actions/upload-artifact@v7
        with:
          name: qualification-report
          path: backend/var/qualification/
          retention-days: 30

      - name: Fail the run when a gate failed
        if: steps.gates.outcome == 'failure'
        run: |
          echo "A hard gate failed. Adopting this model changes a persisted" >&2
          echo "contract and re-goldens every fixture, so the run stops here" >&2
          echo "for sign-off. The failing gate and its measured value are in" >&2
          echo "the step log above and in the qualification-report artifact." >&2
          exit 1
