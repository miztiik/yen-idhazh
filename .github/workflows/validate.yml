name: Model validation

# Row #7: does the model pick survive contact with our own prompt, our own
# extraction and our own corpus? A leaderboard ranks models against someone
# else's three. This runs ours.
#
# Never scheduled. A model swap is an ESCALATE, so this is dispatched by a human
# who intends to read the answer.

on:
  workflow_dispatch:
    inputs:
      incumbent_leaderboard:
        description: 'Published faithfulness score for the configured model'
        default: '0.75'
      challenger_repo:
        description: 'Hugging Face GGUF repo for the challenger'
        default: 'Qwen/Qwen3-4B-GGUF'
      challenger_file:
        description: 'GGUF filename for the challenger'
        default: 'Qwen3-4B-Q4_K_M.gguf'
      challenger_leaderboard:
        description: 'Published faithfulness score for the challenger'
        default: '0.74'

permissions:
  contents: write

concurrency:
  group: validate
  cancel-in-progress: false

env:
  MODEL_REPO: Qwen/Qwen3-8B-GGUF
  MODEL_FILE: Qwen3-8B-Q4_K_M.gguf

jobs:
  validate:
    runs-on: ubuntu-latest
    # The corpus is the day's own plan through the 8B and again through the
    # challenger, plus a faithfulness pass over each. Measured 2026-08-22: the
    # 8B blends to 196 s an article, so 20 is a bit over an hour per model.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[faithfulness]"

      - name: Cache weights and runtime
        id: weights
        uses: actions/cache@v4
        with:
          path: |
            backend/models
            backend/bin
          key: validate-${{ inputs.challenger_file }}-v2

      - name: Fetch runtime and both models
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30' \
            | jq -r 'if type=="array" then ([.[].assets[] | select(.name | test("^llama-b[0-9]+-bin-ubuntu-x64\\.tar\\.gz$"))][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ]; then
            echo "no ubuntu-x64 llama.cpp build found" >&2
            exit 1
          fi
          curl -sSL -o llama.tar.gz "$URL"
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          chmod +x backend/bin/llama-server
          curl -sSL -o "backend/models/${MODEL_FILE}" \
            "https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE}?download=true"
          curl -sSL -o "backend/models/${{ inputs.challenger_file }}" \
            "https://huggingface.co/${{ inputs.challenger_repo }}/resolve/main/${{ inputs.challenger_file }}?download=true"

      - name: Plan the validation corpus
        # Once, before either model runs, so both score the identical list and
        # the only difference between their numbers is the weights. The plan is
        # whatever the feeds offered that morning - there is no cap to raise.
        run: |
          set -euo pipefail
          python -m idhazh plan --date "$(date -u +%F)"
          python - <<'PY'
          import datetime, json, pathlib
          date = datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%d")
          plan = json.loads(
              pathlib.Path(f"backend/var/run/{date}/plan.json").read_text(encoding="utf-8")
          )
          print(f"validation corpus: {len(plan['items'])} articles from {plan['feeds_read']} feeds")
          PY

      - name: Score the corpus with the incumbent
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH=backend/bin nohup backend/bin/llama-server \
            --model "backend/models/${MODEL_FILE}" --alias incumbent \
            --ctx-size 8192 --threads 4 --port 8080 --no-warmup > incumbent.log 2>&1 &
          for _ in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health && break; sleep 5; done
          curl -sf http://127.0.0.1:8080/health > /dev/null || { tail -50 incumbent.log >&2; exit 1; }
          python -m idhazh validate --leaderboard "${{ inputs.incumbent_leaderboard }}"
          pkill -f llama-server || true

      # The challenger is served under the same config, so the only thing that
      # differs between the two numbers is the weights.
      - name: Score the corpus with the challenger
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("config/idhazh.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["models"]["summarize"]["id"] = "${{ inputs.challenger_file }}".lower().replace(".gguf", "").replace("_", "-").replace(".", "-")
          config["models"]["summarize"]["repo"] = "${{ inputs.challenger_repo }}"
          config["models"]["summarize"]["file"] = "${{ inputs.challenger_file }}"
          path.write_text(json.dumps(config, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          LD_LIBRARY_PATH=backend/bin nohup backend/bin/llama-server \
            --model "backend/models/${{ inputs.challenger_file }}" --alias challenger \
            --ctx-size 8192 --threads 4 --port 8080 --no-warmup > challenger.log 2>&1 &
          for _ in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health && break; sleep 5; done
          curl -sf http://127.0.0.1:8080/health > /dev/null || { tail -50 challenger.log >&2; exit 1; }
          python -m idhazh validate --leaderboard "${{ inputs.challenger_leaderboard }}"
          pkill -f llama-server || true
          git checkout -- config/idhazh.json

      # Non-zero on a switch, deliberately: that verdict is an ESCALATE and a
      # green build would let it pass unread.
      - name: Decide
        id: decide
        continue-on-error: true
        run: |
          python -m idhazh decide \
            --commit "${GITHUB_SHA}" \
            --runner ubuntu-latest \
            | tee decision.txt

      - name: Commit the validation ledger
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "validate: model gate $(date -u +%F)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: validation
          path: backend/var/validation/
          retention-days: 30

      - name: Fail the run when the gate says switch
        if: steps.decide.outcome == 'failure'
        run: |
          echo "The gate wants a different model. That changes a persisted" >&2
          echo "contract and re-goldens every fixture, so it pauses here for" >&2
          echo "sign-off rather than switching itself." >&2
          exit 1
