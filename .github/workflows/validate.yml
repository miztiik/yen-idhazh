name: Model validation

# Row #10: qualify one candidate summarizer on absolute machine gates.
#
# One model runs. The owner ruled on 2026-08-26 that the candidate is judged
# alone, so there is no incumbent case, no paired replay and no second set of
# weights on this runner. Andre ruled the consequence: re-basing the dropped
# comparisons on the committed 8B history would be confounded, so the gates
# that survived read their thresholds from config, from the adoption target in
# docs/reference/measurements.md, and from this dispatch's own job bound.
#
# The corpus is frozen, not replanned. Each shard fetches and extracts its own
# slice exactly once, hashes the bytes, writes the hashes down, and only then
# starts calling the model - three times over the same bytes. The article
# bodies never leave the job that captured them; only hashes and measurements
# travel (CLAUDE.md section 0a).
#
# Never scheduled. A model swap is an ESCALATE, so this is dispatched by a
# human who intends to read the answer.

on:
  workflow_dispatch:
    inputs:
      # ONE argument names the candidate, and it is the same one line a swap
      # moves: the models file. Everything about a candidate - the repository,
      # the commit, the GGUF filename, its digest, its byte count, the alias it
      # answers to, the quantisation - is already written in that file, and a
      # form that asked for them again was a second copy of six facts that could
      # disagree with the first. It could bench one set of bytes and adopt
      # another, and nothing here would have noticed.
      #
      # Empty falls back to the pointer in `config/idhazh.json`, so a dispatch
      # that fills nothing in re-qualifies the incumbent - a coherent run rather
      # than a broken one, and no model ref is written in this file
      # (Guardrail #6).
      candidate_models_file:
        description: 'Models file under config/, for example models/qwen3.5-9b-q4km.json. Empty = the configured one.'
        default: ''
      shards:
        description: 'Capture-and-replay jobs. Each one freezes its own slice.'
        default: '3'
      corpus_per_shard:
        description: 'Frozen articles each shard replays'
        default: '10'
      repeats:
        description: 'Deterministic repeats per frozen article'
        default: '3'
      job_budget_minutes:
        description: 'Per-job bound. The budget gate is measured against it (Guardrail #2).'
        default: '330'

permissions:
  contents: write

concurrency:
  group: validate
  cancel-in-progress: false

env:
  # The build digest.yml and measure.yml pin. A qualification on a different
  # runtime than production is not qualifying production.
  LLAMA_CPP_BUILD: b10598
  LLAMA_CPP_ASSET: llama-b10598-bin-ubuntu-x64.tar.gz
  LLAMA_CPP_SHA256: d77a09db4165f8850b513629ed0ffeaab7851bb03e7cc3870b74e721f894694c
  # The one place this workflow says which port. `server_argv` binds it, every
  # probe below reads it, and `idhazh.llm.server` reads it for the address the
  # stage posts to - so the three cannot disagree (Guardrail #6).
  LLAMA_PORT: '8080'

jobs:
  # One plan, read once, for every shard. A long run can cross UTC midnight, so
  # the date is decided here and carried forward rather than recomputed - two
  # halves of one qualification filed under two dates is two half-runs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.decide.outputs.date }}
      matrix: ${{ steps.fanout.outputs.matrix }}
      candidate_models_file: ${{ steps.candidate.outputs.models_file }}
      candidate_repo: ${{ steps.candidate.outputs.repo }}
      candidate_revision: ${{ steps.candidate.outputs.revision }}
      candidate_file: ${{ steps.candidate.outputs.file }}
      candidate_id: ${{ steps.candidate.outputs.id }}
      candidate_quantisation: ${{ steps.candidate.outputs.quantisation }}
      candidate_sha256: ${{ steps.candidate.outputs.sha256 }}
      candidate_byte_count: ${{ steps.candidate.outputs.byte_count }}
      candidate_draft_repo: ${{ steps.candidate.outputs.draft_repo }}
      candidate_draft_revision: ${{ steps.candidate.outputs.draft_revision }}
      candidate_draft_file: ${{ steps.candidate.outputs.draft_file }}
      candidate_draft_sha256: ${{ steps.candidate.outputs.draft_sha256 }}
      candidate_cache_key: ${{ steps.candidate.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - id: decide
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # One place decides what the candidate is: the models file the dispatch
      # named, the pointer in `config/idhazh.json` otherwise. Every job below
      # reads the answer from here rather than repeating that fallback at each
      # use site, which is what keeps the two from disagreeing.
      #
      # The input arrives through `env` and not through an expression pasted
      # into the program, because a value pasted into a script is text before it
      # is a value. It becomes a FILE PATH, so it is resolved and proved to sit
      # inside `config/` before anything opens it - `..` in a form field is the
      # whole reason this is a containment check and not a name check
      # (CLAUDE.md section 4). The fields it publishes are substituted straight
      # into shell commands and into a download URL downstream, and nothing
      # after this point can catch a value carrying a space, a quote or a
      # newline - so each one is asserted to be one bare word here.
      - id: candidate
        env:
          CANDIDATE_MODELS_FILE: ${{ inputs.candidate_models_file }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_refs.py candidate \
            --models-file "$CANDIDATE_MODELS_FILE" >> "$GITHUB_OUTPUT"

      # Every number this dispatch carries, shaped once, here. `plan` is the job
      # every other job needs, so "before its first use" is anywhere after this
      # step - the qualify matrix, the job bound and the gate all read these
      # afterwards. They arrive through `env` and are read by name, so nothing
      # below is pasted into a command.
      - id: fanout
        env:
          SHARDS: ${{ inputs.shards }}
          CORPUS_PER_SHARD: ${{ inputs.corpus_per_shard }}
          REPEATS: ${{ inputs.repeats }}
          JOB_BUDGET_MINUTES: ${{ inputs.job_budget_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "$SHARDS" =~ ^[1-8]$ ]]; then
            echo "shards must be an integer from 1 through 8" >&2
            exit 1
          fi
          for count in "$CORPUS_PER_SHARD" "$REPEATS" "$JOB_BUDGET_MINUTES"; do
            if ! [[ "$count" =~ ^[1-9][0-9]{0,3}$ ]]; then
              echo "corpus_per_shard, repeats and job_budget_minutes are 1 through 9999" >&2
              exit 1
            fi
          done
          echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      # The addresses only. A plan carries URLs and rank metadata, never an
      # article body, so it is the one thing that may cross a job boundary here.
      - name: Read the feeds
        run: python -m idhazh plan --date "${{ steps.decide.outputs.date }}"

      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: backend/var/run/${{ steps.decide.outputs.date }}/plan.json
          retention-days: 1

  qualify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.job_budget_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[faithfulness]"

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      # Why the copy differs in one line and nothing else is written down once,
      # in the action. What it means HERE is the part worth repeating: move that
      # line and you have run the swap; move it back and you have run the
      # revert, so a candidate is qualified through the exact line an adoption
      # would later touch.
      - name: Build the candidate config
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ needs.plan.outputs.candidate_models_file }}

      # Keyed on the candidate bytes, not on its filename: two builds of one
      # model share a name, and a key that cannot tell them apart serves the
      # wrong weights under the right alias. One model per entry, so the cache
      # never holds two multi-gigabyte GGUFs at once (Guardrail #2).
      - name: Cache the candidate weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: qualify-${{ needs.plan.outputs.candidate_cache_key }}-${{ env.LLAMA_CPP_BUILD }}

      - name: Fetch the runtime and the candidate
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_REPO: ${{ needs.plan.outputs.candidate_draft_repo }}
          DRAFT_REVISION: ${{ needs.plan.outputs.candidate_draft_revision }}
          DRAFT_FILE: ${{ needs.plan.outputs.candidate_draft_file }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          # `cp -a`, not `find -type f`. These builds ship versioned shared
          # objects as symlinks, and `-type f` skips a symlink.
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          chmod +x backend/bin/llama-server
          # An immutable revision in the path, never a branch name. A branch
          # moves, and a candidate nobody can fetch again is a candidate nobody
          # can reproduce.
          curl -fsSL --retry 3 --retry-all-errors \
            -o "backend/models/${{ needs.plan.outputs.candidate_file }}" \
            "https://huggingface.co/${{ needs.plan.outputs.candidate_repo }}/resolve/${{ needs.plan.outputs.candidate_revision }}/${{ needs.plan.outputs.candidate_file }}?download=true"
          # The draft head, when the entry declares one. The server loads it at
          # start-up, so a candidate that declares one and cannot find it does
          # not serve at all.
          if [ -n "${DRAFT_FILE}" ]; then
            curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${DRAFT_FILE}" \
              "https://huggingface.co/${DRAFT_REPO}/resolve/${DRAFT_REVISION}/${DRAFT_FILE}?download=true"
          fi

      # No `if:`. This runs on a cache hit too, because a restored entry is the
      # one case where nobody watched the bytes arrive. It sits before the
      # server starts, so wrong weights cost one step instead of a whole shard
      # of measurements filed under a model that never ran (Guardrail #10).
      - name: Verify the candidate bytes
        env:
          DRAFT_FILE: ${{ needs.plan.outputs.candidate_draft_file }}
          DRAFT_SHA256: ${{ needs.plan.outputs.candidate_draft_sha256 }}
        run: |
          set -euo pipefail
          WEIGHTS="backend/models/${{ needs.plan.outputs.candidate_file }}"
          echo "${{ needs.plan.outputs.candidate_sha256 }}  ${WEIGHTS}" | sha256sum --check
          if [ -n "${DRAFT_FILE}" ]; then
            echo "${DRAFT_SHA256}  backend/models/${DRAFT_FILE}" | sha256sum --check
          fi
          OBSERVED=$(stat -c %s "$WEIGHTS")
          # The entry's own declared size, cross-checking the DOCUMENT rather
          # than the file - sha256 above already settles the bytes. Empty means
          # the entry declares none, which is an entry nobody has fetched yet.
          DECLARED="${{ needs.plan.outputs.candidate_byte_count }}"
          if [ -n "$DECLARED" ] && [ "$OBSERVED" != "$DECLARED" ]; then
            echo "candidate is ${OBSERVED} bytes; its entry declares ${DECLARED}" >&2
            exit 1
          fi

      - name: Start the candidate
        env:
          LLAMA_WEIGHTS: backend/models/${{ needs.plan.outputs.candidate_file }}
        run: |
          set -euo pipefail
          chmod +x backend/bin/llama-server
          mkdir -p backend/var
          # The scratch config's `models.summarize` IS the candidate, so the
          # alias and every flag come from the same place the run is judged
          # against. This step used to render the flag list from a second copy,
          # which is how it went two changes without the context-shift refusal
          # the daily run has had since PR #88.
          python - <<'PY' > backend/var/llama-argv
          import os
          import sys
          from pathlib import Path

          from idhazh import config
          from idhazh.llm.server import server_argv

          settings = config.load(Path("backend/var/candidate-config"))
          argv = server_argv(
              binary=Path("backend/bin/llama-server"),
              weights=Path(os.environ["LLAMA_WEIGHTS"]),
              model=settings.models.summarize,
              inference=settings.models.summarize.inference,
              port=int(os.environ["LLAMA_PORT"]),
          )
          sys.stdout.write("\0".join(argv) + "\0")
          PY
          mapfile -d '' LLAMA_ARGV < backend/var/llama-argv
          echo "starting: ${LLAMA_ARGV[*]}"
          LD_LIBRARY_PATH=backend/bin nohup "${LLAMA_ARGV[@]}" > llama-server.log 2>&1 &
          echo "$!" > llama-server.pid

      - name: Check the candidate is the one serving
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null && break
            sleep 5
          done
          curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null || {
            echo "the candidate never became healthy" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          SERVED=$(curl -sf "http://127.0.0.1:${LLAMA_PORT}/v1/models" | jq -r '.data[0].id')
          if [ "$SERVED" != "${{ needs.plan.outputs.candidate_id }}" ]; then
            echo "the server answers to ${SERVED}, not ${{ needs.plan.outputs.candidate_id }}" >&2
            exit 1
          fi

      - name: What this runner is
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          backend/bin/llama-server --version 2>&1 | head -5 || true

      # Freeze, register the hashes, then replay. That ordering lives inside the
      # stage rather than in this file, so nothing can call the model before the
      # corpus is written down.
      - name: Freeze the corpus and replay it
        run: |
          python -m idhazh qualify \
            --config backend/var/candidate-config \
            --date "${{ needs.plan.outputs.date }}" \
            --shard "${{ matrix.shard }}" \
            --shards "${{ fromJSON(inputs.shards) }}" \
            --repeats "${{ fromJSON(inputs.repeats) }}" \
            --corpus-per-shard "${{ fromJSON(inputs.corpus_per_shard) }}" \
            --weights "backend/models/${{ needs.plan.outputs.candidate_file }}" \
            --commit "${GITHUB_SHA}" \
            --runner ubuntu-latest

      # `if: always()` buys the record of a bad shard. A run that died mid-way
      # is exactly the one whose counts a reader wants, and the stage writes
      # this file before it returns.
      - name: What this shard measured
        if: always()
        run: cat backend/var/qualification/shard-${{ matrix.shard }}.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Runtime log on failure
        if: failure()
        run: tail -80 llama-server.log || true

      # Hashes, counts and timings. The frozen article payloads stay under
      # backend/var/qualification/<date>/ on this runner and are thrown away
      # with it - this repository is public and an article body is not ours to
      # publish (CLAUDE.md section 0a).
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ matrix.shard }}
          path: backend/var/qualification/shard-*.json
          retention-days: 30

      # Our own summaries, so a person can read the writing the scores judged.
      # Its own artifact rather than a field on the shard, because a gate must
      # not learn to read it. Still no article body: the source is a link
      # (CLAUDE.md section 0a).
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-samples-${{ matrix.shard }}
          path: backend/var/qualification/samples-*.json
          retention-days: 30

  decide:
    needs: [plan, qualify]
    # `always()`, because a shard that died still leaves the gates something to
    # say. This job fails on the merged evidence and names the metric, rather
    # than inheriting a failure it cannot explain.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          pattern: qualification-*
          merge-multiple: true
          path: backend/var/qualification/

      # Non-zero when a gate fails, deliberately: that verdict is an ESCALATE
      # and a green build would let it pass unread.
      - name: Run the gates
        id: gates
        continue-on-error: true
        run: |
          python -m idhazh qualify-decide \
            --date "${{ needs.plan.outputs.date }}" \
            --job-budget-minutes "${{ fromJSON(inputs.job_budget_minutes) }}" \
            --runner ubuntu-latest

      # The eleven gates, failures first. `if: always()` because the step above
      # exits non-zero on an ESCALATE, and that is precisely the verdict a
      # reader opened this page for.
      - name: The verdict
        if: always()
        run: cat backend/var/qualification/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the validation ledger
        env:
          COMMIT_MESSAGE: "qualify: ${{ needs.plan.outputs.candidate_id }} ${{ needs.plan.outputs.date }}"
          NOTHING_STAGED_MESSAGE: "the gates wrote no ledger row"
          PUSH_FAILED_MESSAGE: "could not push the validation ledger after three attempts"
        run: bash .github/scripts/commit-and-push.sh state

      - uses: actions/upload-artifact@v7
        with:
          name: qualification-report
          path: backend/var/qualification/
          retention-days: 30

      - name: Fail the run when a gate failed
        if: steps.gates.outcome == 'failure'
        run: |
          echo "A hard gate failed. Adopting this model changes a persisted" >&2
          echo "contract and re-goldens every fixture, so the run stops here" >&2
          echo "for sign-off. The failing gate and its measured value are in" >&2
          echo "the step log above and in the qualification-report artifact." >&2
          exit 1
