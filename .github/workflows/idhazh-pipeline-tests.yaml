# Test a model on the production path, as fast as the runners allow.
#
# Name a models file and every enabled test case runs on those weights, through
# the production code - the real fetcher, the real extractor, the real prompts,
# the real two calls, the real model server - over a few drawn articles. Name
# nothing and it runs the configured model. It is a check that a model walks the
# path, not a benchmark: measuring and tuning a server is `measure.yml`'s job, and
# how good a model's summaries are is `validate.yml`'s.
#
# Four jobs. `plan` draws the articles once and lists the runners the enabled
# test cases need. `test-case` is one job per runner, each with its own model
# server: the articles split into shards the way a production day is split
# across workers, and every shard of every test case runs at the same time, so a
# dispatch takes as long as its slowest article. `report` puts what every test
# case did on the run page. `commit` keeps the ledgers the runners wrote.
#
# Runners are not compared with each other by wall clock. Prefill spans 4.2x
# between GitHub-hosted runners (docs/reference/pipeline-cost.md), so a number
# read across two of them says which hosts were drawn rather than what a test
# case changed.
#
# The articles are DRAWN, not fixed, from `config/pipeline-tests.json`, once, in
# the plan job, seeded from the run id GitHub allocated - so every runner of every
# test case records the same item ids, and a fixed pair cannot quietly pass for
# as long as two pages stay up.
#
# It publishes nothing a reader sees. No step writes `frontend/public/` and
# nothing here is on any reader's path. The `commit` job appends what each test
# case wrote under that test case's own trial roots - its raw ledgers
# tier-first at `state/raw/pipeline-tests/<id>/` and its JSONL traces at
# `state/raw/traces/pipeline-tests/<id>/` - which no console page reads; every
# other job keeps `contents: read`. What the runners produced - the article
# text included - leaves only as an artifact.
#
# The faithfulness scorer is skipped. It is a second model download, and
# whether a summary is faithful is the qualification's question, not this one's.
name: Pipeline tests

# Dispatch only, and it asks for ONE thing: which model to run the test cases
# on. Every test case setting is drawn or read from config (Guardrail #6) - the
# addresses, the draw size, the shard size, the job bound, which test cases run,
# the slot counts and the windows. The committed config names the incumbent by
# design, so which model to check is the one question config cannot answer, and
# it is the same line a swap would later move.
on:
  workflow_dispatch:
    inputs:
      candidate_models_file:
        description: 'Models file under config/, for example models/gemma-4-e4b-qat.json. Empty runs the configured model.'
        default: ''

permissions:
  contents: read

# One dispatch per model file at a time. Two dispatches of one model are one
# question asked twice, so the second waits for the first; two models are two
# questions, so they run side by side.
concurrency:
  group: pipeline-tests-${{ inputs.candidate_models_file || 'configured-model' }}
  cancel-in-progress: false

# No llama.cpp pin here. It is `config/llama-cpp-pin.json`, which the pin step
# reads, so this workflow cannot spell a build the binary it unpacks disagrees
# with.
env:
  MODEL_SERVER_PROBE: 'http://127.0.0.1:8080'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      date: ${{ steps.plan.outputs.date }}
      item_ids: ${{ steps.plan.outputs.item_ids }}
      models_file: ${{ steps.models.outputs.candidate_models_file }}
      llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Before anything that imports idhazh, which is every program below.
      - name: Install
        run: pip install -e .

      # The build every runner installs, read once off the file that decides it
      # and handed to each runner as a job output: the model block keys its
      # cache on it, and the work stage stamps it as the build that decoded the
      # run - so the two cannot name different binaries.
      - id: runtime
        name: Say which llama.cpp build this run installs
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py print-pinned-build \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The draw, made ONCE, before any runner starts. `github.run_id` is
      # allocated by GitHub and nothing in the run can compute it, so two
      # dispatches read different articles and this line says which ones a
      # result belongs to.
      #
      # It prints the seed and the addresses as well as publishing them, because
      # a result whose inputs are only in a step output is a result nobody can
      # read six weeks later off the run log alone.
      - name: Pick the articles
        id: pick
        env:
          PICK_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_draw.py pick --seed "$PICK_SEED" \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # Which model this dispatch runs, read once and handed to every runner. The
      # input arrives through `env` rather than pasted into this program, because
      # a pasted value is text before it is a value (Guardrail #11) - and it
      # becomes a FILE PATH, so the program resolves it and proves it sits inside
      # `config/` before opening it. Here, in the first job, so a mistyped file
      # fails a dispatch in a minute rather than after every runner has started.
      #
      # `--models-file` empty reads the committed pointer, so an empty dispatch
      # runs the configured model.
      - id: models
        env:
          CANDIDATE_MODELS_FILE: ${{ inputs.candidate_models_file }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_refs.py describe-trial-model \
            --prefix candidate_ \
            --models-file "$CANDIDATE_MODELS_FILE" \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # One plan, written once, from the addresses the draw chose. Every runner
      # runs it, so the item ids are fixed before the first request.
      #
      # Everything but the address comes off the feed in `config/sources.json` -
      # the vertical, the tier, the form - so this step invents nothing about a
      # source. The item id is derived exactly as the ranker derives it, because
      # a test that minted its own would file its results under ids the pipeline
      # never writes.
      - name: Plan the articles
        id: plan
        env:
          PICKED_ADDRESSES: ${{ steps.pick.outputs.addresses }}
          PICKED_FEEDS: ${{ steps.pick.outputs.feeds }}
          RUN_EXECUTION: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_draw.py plan \
            --addresses "$PICKED_ADDRESSES" \
            --feeds "$PICKED_FEEDS" \
            --execution "$RUN_EXECUTION" | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The matrix, read off config: one entry for every runner of every test
      # case `config/pipeline-tests.json` switches on. A test case that is off
      # starts no job, and switching one on is an edit to that file alone.
      - name: List the runners the enabled test cases need
        id: jobs
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_case.py jobs \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Upload the plan
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-tests-plan-${{ github.run_id }}
          path: backend/var/pipeline-tests/plan.json
          retention-days: 90

  test-case:
    needs: plan
    name: ${{ matrix.test_case }} runner ${{ matrix.runner }}
    runs-on: ubuntu-latest
    # Said here rather than inherited. The `commit` job takes the write, and a
    # reader comparing the two has to be able to see that this one does not have
    # it without first working out what the file-level default was.
    permissions:
      contents: read
    # What one runner may take, and `pipeline-tests.budget_minutes` is where it
    # is written. A test holds the two together.
    timeout-minutes: 140
    strategy:
      # One runner that fails costs its own shards, never its siblings': the
      # rest still report what the model did with their articles.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Take the plan
        uses: actions/download-artifact@v8
        with:
          name: pipeline-tests-plan-${{ github.run_id }}
          path: backend/var/pipeline-tests

      # The config root every test case is cut from. The committed `config/` is
      # never edited - the action copies it and moves one line, `models_file`,
      # so a candidate is run through the exact line a swap would later move and
      # every other control is the committed one by construction.
      #
      # `trial_state` is not a control. It says where this run's own ledgers
      # land, so a dispatch writes nothing beside the rows the console reads.
      - name: Build the config this dispatch runs
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ needs.plan.outputs.models_file }}
          trial_state: pipeline-tests

      # One config root per declared test case, cut from the scratch copy above
      # and differing only in what that test case changes. Every declared one is
      # written, switched on or not, so a test case that is off is still proven
      # to load and turning it on cannot be the first time anybody read it.
      #
      # Two files move, and the test case declares one intention that moves both.
      # `visuals.enabled_kinds` empty is what makes no picture reachable, so the
      # gate takes the plan fields off the summarize-and-plan call's grammar;
      # `summarize.asks_for_a_visual_plan` false is what sizes the window for
      # the call that is really sent. Apart they disagree, and the disagreement
      # refuses articles that fit.
      - name: Write each test case's config
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_case_config.py \
            --config-root backend/var/candidate-config

      # The cache, the fetch, the digest check, the server and the health probe,
      # as production's work job runs them - one action, so this runner's server
      # is started, checked and proven to hold the declared weights exactly as a
      # production shard's is. It reads this test case's own config root, so the
      # slot count and the window are the ones the test case declares.
      - uses: ./.github/actions/model-server
        id: model_server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ env.MODEL_SERVER_PROBE }}
          llama_cpp_build: ${{ needs.plan.outputs.llama_cpp_build }}
          config_root: backend/var/test-cases/${{ matrix.test_case }}/config

      # Production's check that the entry is true of the server: the render, the
      # prefix cache, the grammar, the architecture in the weights and the
      # window against the length the model was trained for. A candidate whose
      # declaration is wrong fails here, by name, before an article is read.
      - name: The server proves the entry
        env:
          TEST_CASE: ${{ matrix.test_case }}
        run: |
          set -euo pipefail
          python3 backend/utilities/prove_the_entry.py \
            --config-root "backend/var/test-cases/${TEST_CASE}/config"

      # Every shard this runner holds, at once, against its one server, through
      # the production `work` and `record` commands. `LLAMA_CPP_BUILD` is what
      # the run manifest stamps as the build that decoded the bytes.
      - name: Run the test case
        env:
          TEST_CASE: ${{ matrix.test_case }}
          RUNNER: ${{ matrix.runner }}
          RUN_DATE: ${{ needs.plan.outputs.date }}
          RUN_EXECUTION: ${{ github.run_id }}
          LLAMA_CPP_BUILD: ${{ needs.plan.outputs.llama_cpp_build }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_case.py run \
            "$TEST_CASE" "$RUN_DATE" --runner "$RUNNER" --execution "$RUN_EXECUTION"

      - name: Stop the model
        if: always()
        env:
          TEST_CASE: ${{ matrix.test_case }}
          RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          if [ -f llama-server.pid ]; then
            kill "$(cat llama-server.pid)" 2>/dev/null || true
          fi
          mkdir -p "backend/var/test-cases/${TEST_CASE}/runner-${RUNNER}"
          cp llama-server.log "backend/var/test-cases/${TEST_CASE}/runner-${RUNNER}/" 2>/dev/null || true

      # Ninety days, because a model is often argued about weeks after the
      # dispatch that checked it.
      #
      # The article text this produced goes with it. An article body is never
      # republished to a reader, and this is not that: nothing under
      # `backend/var/` is committed, nothing here reaches a reader, and an
      # operator is who downloads it.
      - name: Upload what the test case produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-tests-${{ github.run_id }}-${{ matrix.test_case }}-${{ matrix.runner }}
          path: backend/var/test-cases/
          retention-days: 90

      # The ledgers, separately from the tree above, because the `commit` job
      # downloads them into its own checkout and must never be handed the article
      # text that tree carries. `corpus/` is the one place this project commits
      # article text.
      #
      # Gathered into one fixed directory rather than uploaded by a glob over
      # `state/`. An artifact's internal root is the common ancestor of what
      # matched, so a glob would unpack one test case's ledger at a different
      # depth from another's.
      - name: Gather the ledgers the test case wrote
        if: always()
        env:
          RUN_DATE: ${{ needs.plan.outputs.date }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_ledgers.py gather \
            --tree backend/var/trial-ledgers --day "$RUN_DATE"

      - name: Upload the ledgers the test case wrote
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-tests-ledgers-${{ github.run_id }}-${{ matrix.test_case }}-${{ matrix.runner }}
          path: backend/var/trial-ledgers/
          if-no-files-found: ignore
          retention-days: 90

  # Every runner's articles, put back together per test case and read against
  # the draw. A runner that failed is still reported: its articles are named as
  # missing rather than dropped from the table.
  report:
    needs: [plan, test-case]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Take what the test cases produced
        uses: actions/download-artifact@v8
        with:
          pattern: pipeline-tests-${{ github.run_id }}-*
          merge-multiple: true
          path: backend/var/test-cases

      # The runtime half of the Oracle. The workflow-shape half asserts that one
      # job draws and every runner reads it; this puts every runner's articles
      # back together per test case, names any a failed runner never filed, and
      # ends red when a test case got none summarized - a run whose every article
      # failed before the model answered has said nothing about the model.
      - name: Say what the test cases did
        env:
          EXPECTED_ITEM_IDS: ${{ needs.plan.outputs.item_ids }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_case_report.py \
            --expected "$EXPECTED_ITEM_IDS" | tee -a "$GITHUB_STEP_SUMMARY"

  # The runners' own measurements, kept. Its own job because it is the only
  # thing here that writes to the repository. The runners read the open web;
  # this one never does, and what crosses between them is read against the
  # contracts before anything is staged.
  #
  # It runs whenever the plan did and nobody cancelled: a runner that failed
  # still measured what it reached. A dispatch whose runners wrote nothing
  # uploads nothing, the download below then brings nothing, and the commit
  # finds nothing to stage.
  commit:
    needs: [plan, test-case]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The check below reads the committed contracts, so it needs the package.
      - name: Install
        run: pip install -e .

      # Into a scratch directory, never straight onto `state/`. The check has to
      # read exactly what arrived, and a download unpacked over the checkout
      # would be read together with rows that are already committed.
      - name: Take the ledgers the test cases wrote
        uses: actions/download-artifact@v8
        with:
          pattern: pipeline-tests-ledgers-${{ github.run_id }}-*
          merge-multiple: true
          path: backend/var/trial-ledgers

      # The control, and the reason this job may hold a write at all. Every file
      # is read through the reader production uses for it and every directory
      # name comes from committed code and config, so nothing the open web
      # touched decides a path (Guardrail #11). A refusal ends the job before
      # anything is staged.
      - name: Check the ledgers against their contracts
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_ledgers.py check \
            --tree backend/var/trial-ledgers

      # `place` prints the roots to stage, and creates every declared one first.
      # The commit script hands its arguments to `git add`, which aborts on a
      # path the checkout does not hold and takes the whole step with it.
      - name: Commit the ledgers the test cases wrote
        env:
          COMMIT_MESSAGE: 'pipeline tests: what the test cases wrote'
          NOTHING_STAGED_MESSAGE: 'the test cases wrote no ledger this dispatch has not already committed'
          PUSH_FAILED_MESSAGE: 'the pipeline-test ledgers lost every push attempt'
        run: |
          set -euo pipefail
          mapfile -t TRIAL_ROOTS < <(python3 backend/utilities/pipeline_test_ledgers.py place \
            --tree backend/var/trial-ledgers)
          python backend/utilities/commit_and_push.py "${TRIAL_ROOTS[@]}"
