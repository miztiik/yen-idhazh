# Two articles, three cases, one runner - the loop a person can close in the
# hour they wrote the change in.
#
# A production run takes about 200 minutes and has been cancelling shards, so a
# change to the pipeline was tested the next day, against a day of eighty
# articles whose spread hid whatever the change did. This dispatch runs the real
# path - the real fetcher, the real extractor, the real two calls, the real
# model server - over two articles and reports what each case cost.
#
# Three cases, in sequence, on ONE runner, over the SAME two articles, and never
# a matrix. Between two GitHub-hosted runners prefill spans 4.2x
# (docs/reference/pipeline-cost.md), which is larger than anything a case here is
# looking for, so a matrix would report the hosts it drew rather than the change
# it ran. Sequential on one box cancels the host.
#
# The two articles are DRAWN, not fixed, from `config/pipeline-tests.json`. The
# draw is made once, in `Pick the two articles`, seeded from the run id GitHub
# allocated, and every case reads that step's output - so the three cases record
# the same two item ids and the comparison between them is valid. A fixed pair
# would pass for as long as those two pages stayed up and say nothing about
# anything else the extractor meets.
#
# It publishes nothing a reader sees. No step writes `frontend/public/` and
# nothing here is on any reader's path. It does commit one thing: a `commit` job
# appends what the cases wrote under `state/pipeline-tests/`, the trial root
# `validate.yml` and the bench already commit into and no console page reads.
# The case job keeps `contents: read`; the write is the second job's alone. What
# the cases produced - the article text included - still leaves only as an
# artifact.
#
# It also answers "can this candidate model walk the real path", for the price
# of a dispatch rather than the price of a bench. Name a models file and every
# case runs on those weights, through the real prompts and the real two calls;
# name nothing and it runs the configured model exactly as it always did. It is
# not the qualification - that is validate.yml, ten gates on a frozen corpus
# - and two articles settle nothing about how good a model is.
#
# Two things one dispatch cannot settle. Whether two articles are
# representative of the eighty a production day carries - they are not, and the
# draw is what stops them being representative of nothing. And the faithfulness
# scorer, which every case skips: it is a second model download, it is identical
# across the cases so it cancels from every comparison here, and it is not what
# the two-call path is being measured for.
name: Pipeline tests

# Dispatch only, and it asks for ONE thing: which model to run the cases on.
# Every case setting is still drawn or read from config (Guardrail #6) - the
# addresses, the draw size, the job bound, the slot counts, the windows. The
# committed config names the incumbent by design, so which model to check is
# the one question config cannot answer, and it is the same line a swap would
# later move.
#
# Empty runs the configured model, which is exactly what this dispatch did
# before the input existed.
on:
  workflow_dispatch:
    inputs:
      candidate_models_file:
        description: 'Models file under config/, for example models/gemma-4-e4b-qat.json. Empty runs the configured model.'
        default: ''

permissions:
  contents: read

# One at a time. The cases are read against each other by wall clock, and two
# dispatches sharing a runner pool is the one confound the sequential design
# exists to remove.
concurrency:
  group: pipeline-tests
  cancel-in-progress: false

# No llama.cpp pin here. It is `.github/scripts/llama-cpp-pin.sh`, which the
# fetch step sources and the step above reads, so this workflow cannot spell a
# build the binary it unpacks disagrees with.
env:
  MODEL_SERVER_PROBE: 'http://127.0.0.1:8080'

jobs:
  cases:
    runs-on: ubuntu-latest
    # Said here rather than inherited. The `commit` job below takes the write,
    # and a reader comparing the two has to be able to see that this one does
    # not have it without first working out what the file-level default was.
    permissions:
      contents: read
    # The whole promise of this workflow, and `pipeline-tests.budget_minutes`
    # is where it is written. A test holds the two together.
    timeout-minutes: 140
    # Whether anything was gathered to push. The job below is skipped when it is
    # false, because `download-artifact` on a name nobody uploaded fails.
    outputs:
      ledgers: ${{ steps.ledgers.outputs.ledgers }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Before anything that imports idhazh, which is every inline program
      # below and the argv builder both server starts reach.
      - name: Install
        run: pip install -e .

      # The draw, made ONCE, before any case runs. `github.run_id` is allocated
      # by GitHub and nothing in the run can compute it, so two dispatches read
      # different articles and this line says which pair a result belongs to.
      #
      # It prints the seed and the addresses as well as publishing them, because
      # a result whose inputs are only in a step output is a result nobody can
      # read six weeks later off the run log alone.
      - name: Pick the two articles
        id: pick
        env:
          PICK_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_draw.py pick --seed "$PICK_SEED" \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # Which model this dispatch runs, read once and published to every step
      # that needs it. The input arrives through `env` rather than pasted into
      # this program, because a pasted value is text before it is a value
      # (Guardrail #11) - and it becomes a FILE PATH, so the program resolves it
      # and proves it sits inside `config/` before opening it.
      #
      # `--models-file` empty reads the committed pointer, so an empty dispatch
      # publishes exactly the refs the `configured` mode used to publish.
      - id: models
        env:
          CANDIDATE_MODELS_FILE: ${{ inputs.candidate_models_file }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_refs.py describe-trial-model \
            --prefix candidate_ \
            --models-file "$CANDIDATE_MODELS_FILE" \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The config root every case is cut from. The committed `config/` is never
      # edited - the action copies it and moves one line, `models_file`, so a
      # candidate is run through the exact line a swap would later move and
      # every other control is the committed one by construction.
      #
      # `trial_state` is not a control. It says where this run's own ledgers
      # land, and `pipeline-tests` is where the bench already puts its own - so
      # a dispatch writes nothing beside the rows the console reads.
      - name: Build the config this dispatch runs
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ steps.models.outputs.candidate_models_file }}
          trial_state: pipeline-tests

      # The build the install below is about to put down, asked of the file that
      # decides it. The cache key names the build and the cache step runs before
      # the install, so the pin has to be readable here - and reading it from its
      # one home is what stops this workflow carrying a second copy that can
      # disagree with the binary it actually unpacks.
      - id: runtime
        name: Say which llama.cpp build this job installs
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py print-pinned-build \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The same key the daily run uses when nothing is named, so a dispatch on
      # a warm runner pays nothing for the weights, and a second entry only
      # appears when a dispatch really does run other bytes. The model half is a
      # digest over every file the entry declares, which is exactly the set the
      # download reads - so the key cannot name a smaller set than arrives, and
      # a candidate that declares a companion cannot restore one that does not.
      - name: Cache weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: llm-${{ steps.models.outputs.candidate_cache_key }}-${{ steps.runtime.outputs.llama_cpp_build }}-v5

      # Two calls to one program. Neither is handed a URL, a filename or a
      # digest: the program reads what the scratch config's own entry declares
      # and fetches every file of it.
      - name: Fetch runtime and weights
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py install-runtime
          python3 backend/utilities/model_runtime.py download-model-files \
            --config-root backend/var/candidate-config

      # No `if:`. A restored cache entry is the one case where nobody watched
      # the bytes arrive, so it is the case that most needs checking.
      #
      # It reads the config root the cases are cut from, which IS the
      # candidate's own entry - so a dispatch cannot check one model's bytes
      # against another model's recorded digest - and it reads the declaration
      # rather than a filename, so it covers every file the key digested.
      - name: Verify the weights
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py verify-model-files \
            --config-root backend/var/candidate-config

      # One config root per case, cut from the scratch copy above and differing
      # only in what that case changes. The committed config is never edited: a
      # case that edited it would leave the next case reading whatever the last
      # one wrote.
      #
      # Two files move, and the case declares one intention that moves both.
      # `visuals.enabled_kinds` empty is what makes no picture reachable, so the
      # gate takes the plan fields off the summarize-and-plan call's grammar;
      # `summarize.asks_for_a_visual_plan` false is what sizes the window for
      # the call that is really sent. Apart they disagree, and the disagreement
      # refuses articles that fit.
      - name: Write each case's config
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_case_config.py \
            --config-root backend/var/candidate-config

      # One plan, written once, from the addresses the draw chose. The cases all
      # run it, so the two item ids are fixed before the first request and the
      # three cases are comparing the same work.
      #
      # Everything but the address comes off the feed in `config/sources.json` -
      # the vertical, the tier, the form - so this step invents nothing about a
      # source. The item id is derived exactly as the ranker derives it, because
      # a test that minted its own would file its results under ids the pipeline
      # never writes.
      - name: Plan the two articles
        id: plan
        env:
          PICKED_ADDRESSES: ${{ steps.pick.outputs.addresses }}
          PICKED_FEEDS: ${{ steps.pick.outputs.feeds }}
          RUN_EXECUTION: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_draw.py plan \
            --addresses "$PICKED_ADDRESSES" \
            --feeds "$PICKED_FEEDS" \
            --execution "$RUN_EXECUTION" | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Start the model
        env:
          MODEL_ALIAS: ${{ steps.models.outputs.candidate_id }}
        run: |
          set -euo pipefail
          # Every flag, the alias and the weights come from the first case's
          # config, so the server this case measures is the server that case's
          # config describes (Guardrail #6).
          python3 backend/utilities/model_runtime.py start-server \
            --config-root backend/var/cases/baseline/config
          for _ in $(seq 1 120); do
            curl -sf "${MODEL_SERVER_PROBE}/health" > /dev/null && break
            sleep 5
          done
          # Assert it, do not hope. Without this the loop simply ends, every
          # item fails as "model unreachable", and three cases agree on nothing.
          curl -sf "${MODEL_SERVER_PROBE}/health" > /dev/null || {
            echo "the model never became healthy" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          # Healthy says a server answers. It does not say which weights it
          # answers for, and every case's numbers are read against case one's
          # alias whether or not the server agrees. The alias is read by name
          # rather than pasted into this program, and it comes from the entry
          # the case's own config points at.
          curl -sf "${MODEL_SERVER_PROBE}/v1/models" \
            | jq -e --arg alias "$MODEL_ALIAS" '[.data[].id] | index($alias) != null' > /dev/null || {
            echo "the server does not serve ${MODEL_ALIAS}" >&2
            curl -s "${MODEL_SERVER_PROBE}/v1/models" >&2 || true
            exit 1
          }

      # Case one. The production path exactly as the daily run walks it: both
      # calls, the visual decision on, one slot on the server. Every other case is
      # read against this one, so it runs first and it changes nothing.
      #
      # `python3 <path>`, which is how this repository calls into
      # `backend/utilities/`. A program is handed to an interpreter, so it asks
      # nothing of a file mode - and the first dispatch of this workflow died on
      # exactly that mode, exit 126 `Permission denied`, back when the case body
      # was a script committed 100644.
      #
      # `!cancelled()` on every case, because a rig exists to say what happened.
      # On that first dispatch one broken call took all three cases with it, so
      # the run read as a baseline problem where it had a caller problem; three
      # cases failing the same way would have named the cause on the run page.
      # A case still needs the one plan, and the runner refuses by name without
      # it rather than summarizing nothing quietly.
      - name: Case baseline
        if: ${{ !cancelled() }}
        env:
          RUN_DATE: ${{ steps.plan.outputs.date }}
        run: python3 backend/utilities/pipeline_test_case.py baseline "$RUN_DATE"

      # Case two. No picture is reachable, so the summarize-and-plan call comes
      # back with the summary alone and the plan's decode is not spent. The
      # server is the same process case one used - nothing about this case is a
      # start-time setting - so what the difference measures is the decode and
      # nothing else.
      - name: Case no-visual-decision
        if: ${{ !cancelled() }}
        env:
          RUN_DATE: ${{ steps.plan.outputs.date }}
        run: python3 backend/utilities/pipeline_test_case.py no-visual-decision "$RUN_DATE"

      # The slot count is fixed when the process starts, so this case costs a
      # restart and a second model load. That load is itself one of the numbers
      # worth having: it is the fixed cost `run.shard_size` exists to amortise.
      #
      # It carries an id because case three reads its outcome, and it runs after a
      # failed case for the same reason the cases do.
      - name: Restart the model with two slots
        id: restart
        if: ${{ !cancelled() }}
        env:
          MODEL_ALIAS: ${{ steps.models.outputs.candidate_id }}
        run: |
          set -euo pipefail
          kill "$(cat llama-server.pid)" 2>/dev/null || true
          for _ in $(seq 1 30); do
            kill -0 "$(cat llama-server.pid)" 2>/dev/null || break
            sleep 1
          done
          mv llama-server.log backend/var/cases/baseline/llama-server.log
          python3 backend/utilities/model_runtime.py start-server \
            --config-root backend/var/cases/parallel-2/config
          for _ in $(seq 1 120); do
            curl -sf "${MODEL_SERVER_PROBE}/health" > /dev/null && break
            sleep 5
          done
          curl -sf "${MODEL_SERVER_PROBE}/health" > /dev/null || {
            echo "the model never became healthy on the second start" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          # The same question the first start asks, and it matters more on a
          # restart: a second server can come up on stale flags or stale weights
          # and still answer 200.
          curl -sf "${MODEL_SERVER_PROBE}/v1/models" \
            | jq -e --arg alias "$MODEL_ALIAS" '[.data[].id] | index($alias) != null' > /dev/null || {
            echo "the server does not serve ${MODEL_ALIAS}" >&2
            curl -s "${MODEL_SERVER_PROBE}/v1/models" >&2 || true
            exit 1
          }

      # Case three. Two slots, and the window doubled with them so each slot
      # still holds what the production gate admits articles against.
      #
      # The one case that reads a step rather than only `!cancelled()`, and the
      # difference is what a failed restart leaves behind: a healthy one-slot
      # server. This case would then run against one slot and publish the number
      # under `parallel-2`, which is a wrong answer that looks like a right one.
      # A failed restart fails the job, so nothing is hidden by the skip.
      - name: Case parallel-2
        if: ${{ !cancelled() && steps.restart.conclusion == 'success' }}
        env:
          RUN_DATE: ${{ steps.plan.outputs.date }}
        run: python3 backend/utilities/pipeline_test_case.py parallel-2 "$RUN_DATE"

      - name: Stop the model
        if: always()
        run: |
          set -euo pipefail
          if [ -f llama-server.pid ]; then
            kill "$(cat llama-server.pid)" 2>/dev/null || true
          fi
          cp llama-server.log backend/var/cases/parallel-2/llama-server.log 2>/dev/null || true

      # The runtime half of the Oracle. The workflow-shape half asserts that one
      # step draws and every case reads it; this asserts the cases really did land
      # on the same two items, which is the thing that makes a comparison
      # between them mean anything. An address that could not be fetched is
      # reported by name rather than passed over: a stale list is the expected
      # way this workflow decays.
      #
      # Two different failures, and only one of them is this step's to raise. A
      # case that recorded nothing failed or was skipped, its own step is red and
      # the job is red with it, so the report names it and moves on. A case that
      # recorded articles which are not the pair the draw chose has produced
      # numbers nobody may subtract, and that is what raises here.
      - name: Say what the three cases measured
        if: always()
        env:
          EXPECTED_ITEM_IDS: ${{ steps.plan.outputs.item_ids }}
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_case_report.py \
            --expected "$EXPECTED_ITEM_IDS" | tee -a "$GITHUB_STEP_SUMMARY"

      # Ninety days, because a change is often argued about weeks after the
      # dispatch that measured it, and re-running is 45 minutes.
      #
      # The article text this produced goes with it. An article body is never
      # republished to a reader, and this is not that: nothing under
      # `backend/var/` is committed, nothing here reaches a reader, and an
      # operator is who downloads it.
      - name: Upload what the cases produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-tests-${{ github.run_id }}
          path: backend/var/cases/
          retention-days: 90

      # The ledgers, separately from the tree above, because the `commit` job
      # downloads this one into its own checkout and must never be handed the
      # article text that tree carries. `corpus/` is the one place this project
      # commits article text.
      #
      # Gathered into one fixed directory rather than uploaded by a glob over
      # `state/`. An artifact's internal root is the common ancestor of what
      # matched, so a glob would unpack one case's store at the depth three
      # cases' stores sit at the moment two of them died.
      # No `tee` into the log. This program prints what a person reads on
      # stderr, which the log already shows, and keeps stdout for the one
      # `key=value` line the step output takes. A `tee` here would copy the
      # progress lines into `$GITHUB_OUTPUT` as well, and one line that is not
      # `key=value` fails the step and loses the push.
      - name: Gather the ledgers the cases wrote
        id: ledgers
        if: always()
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_ledgers.py gather \
            --tree backend/var/trial-ledgers \
            >> "$GITHUB_OUTPUT"

      - name: Upload the ledgers the cases wrote
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-tests-ledgers-${{ github.run_id }}
          path: backend/var/trial-ledgers/
          if-no-files-found: ignore
          retention-days: 90

  # The run's own measurements, kept. Until now every case wrote a span rollup
  # and a trace for each item, and the runner was torn down with all of it - so a
  # dispatch could only ever be read off its own run page.
  #
  # Its own job because it is the only thing here that writes to the repository.
  # The cases read the open web; this one never does, and what crosses between
  # them is read against the contracts before anything is staged.
  commit:
    needs: cases
    # A case that failed still measured what it reached, and a dispatch that died
    # on case three has two cases worth keeping. A dispatch that never started a
    # case uploaded nothing, and downloading an artifact nobody made fails the
    # step - so the job asks first.
    if: always() && needs.cases.outputs.ledgers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The check below reads the committed contracts, so it needs the package.
      - name: Install
        run: pip install -e .

      # Into a scratch directory, never straight onto `state/`. The check has to
      # read exactly what arrived, and a download unpacked over the checkout
      # would be read together with rows that are already committed.
      - name: Take the ledgers the cases wrote
        uses: actions/download-artifact@v8
        with:
          pattern: pipeline-tests-ledgers-*
          merge-multiple: true
          path: backend/var/trial-ledgers

      # The control, and the reason this job may hold a write at all. Every file
      # is read through the contract that declares it and every directory name
      # comes from committed config, so nothing the open web touched decides a
      # path (Guardrail #11). A refusal ends the job before anything is staged.
      - name: Check the ledgers against their contracts
        run: |
          set -euo pipefail
          python3 backend/utilities/pipeline_test_ledgers.py check \
            --tree backend/var/trial-ledgers

      # `place` prints the roots to stage, and creates every declared one first.
      # The commit script hands its arguments to `git add`, which aborts on a
      # path the checkout does not hold and takes the whole step with it.
      - name: Commit the ledgers the cases wrote
        env:
          COMMIT_MESSAGE: 'pipeline tests: what the cases wrote'
          NOTHING_STAGED_MESSAGE: 'the cases wrote no ledger this dispatch has not already committed'
          PUSH_FAILED_MESSAGE: 'the pipeline-test ledgers lost every push attempt'
        run: |
          set -euo pipefail
          mapfile -t TRIAL_ROOTS < <(python3 backend/utilities/pipeline_test_ledgers.py place \
            --tree backend/var/trial-ledgers)
          python backend/utilities/commit_and_push.py "${TRIAL_ROOTS[@]}"
