# Two articles, three arms, one runner - the loop a person can close in the
# hour they wrote the change in.
#
# A production run takes about 200 minutes and has been cancelling shards, so a
# change to the pipeline was tested the next day, against a day of eighty
# articles whose spread hid whatever the change did. This dispatch runs the real
# path - the real fetcher, the real extractor, the real two calls, the real
# model server - over two articles and reports what each arm cost.
#
# Three arms, in sequence, on ONE runner, over the SAME two articles, and never
# a matrix. Between two GitHub-hosted runners prefill spans 4.2x
# (docs/reference/measurements.md), which is larger than anything an arm here is
# looking for, so a matrix would report the hosts it drew rather than the change
# it ran. Sequential on one box cancels the host.
#
# The two articles are DRAWN, not fixed, from `config/pipeline-tests.json`. The
# draw is made once, in `Pick the two articles`, seeded from the run id GitHub
# allocated, and every arm reads that step's output - so the three arms record
# the same two item ids and the comparison between them is valid. A fixed pair
# would pass for as long as those two pages stayed up and say nothing about
# anything else the extractor meets.
#
# It publishes nothing. No step writes `frontend/public/`, no step commits, and
# nothing here is on any reader's path. What the arms produced leaves as an
# artifact.
#
# Two things one dispatch cannot settle. Whether two articles are
# representative of the eighty a production day carries - they are not, and the
# draw is what stops them being representative of nothing. And the faithfulness
# scorer, which every arm skips: it is a second model download, it is identical
# across the arms so it cancels from every comparison here, and it is not what
# the two-call path is being measured for.
name: Pipeline tests

# Dispatch only, and deliberately without inputs. Everything a dispatch varies
# is drawn or read from config (Guardrail #6), so there is nothing for an
# operator to type and nothing typed for a step to have to shape.
on:
  workflow_dispatch:

permissions:
  contents: read

# One at a time. The arms are read against each other by wall clock, and two
# dispatches sharing a runner pool is the one confound the sequential design
# exists to remove.
concurrency:
  group: pipeline-tests
  cancel-in-progress: false

env:
  LLAMA_CPP_BUILD: b10598
  LLAMA_CPP_ASSET: llama-b10598-bin-ubuntu-x64.tar.gz
  LLAMA_CPP_SHA256: d77a09db4165f8850b513629ed0ffeaab7851bb03e7cc3870b74e721f894694c
  LLAMA_PORT: '8080'

jobs:
  arms:
    runs-on: ubuntu-latest
    # The whole promise of this workflow, and `pipeline-tests.budget_minutes`
    # is where it is written. A test holds the two together.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Before anything that imports idhazh, which is every inline program
      # below and the argv builder both server starts reach.
      - name: Install
        run: pip install -e .

      # The draw, made ONCE, before any arm runs. `github.run_id` is allocated
      # by GitHub and nothing in the run can compute it, so two dispatches read
      # different articles and this line says which pair a result belongs to.
      #
      # It prints the seed and the addresses as well as publishing them, because
      # a result whose inputs are only in a step output is a result nobody can
      # read six weeks later off the run log alone.
      - name: Pick the two articles
        id: pick
        env:
          PICK_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          from idhazh.contracts.pipeline_tests import PipelineTestsConfig

          settings = PipelineTestsConfig.from_json(
              Path("config/pipeline-tests.json").read_text(encoding="utf-8")
          )
          seed = os.environ["PICK_SEED"]
          drawn = settings.draw(seed)
          print(f"seed={seed}")
          print("addresses=" + " ".join(candidate.url for candidate in drawn))
          print("feeds=" + " ".join(candidate.source_id for candidate in drawn))
          PY

      # Read from config once, here, so the fetch and the cache key below cannot
      # open it a second time and disagree. Each value is asserted to be one
      # bare word at the point that writes it, because each one is substituted
      # into a shell command further down.
      - id: models
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          config = json.load(open("config/idhazh.json", encoding="utf-8"))
          models_file = pathlib.Path("config") / config["models_file"]
          models = json.load(open(models_file, encoding="utf-8"))
          for field in ("repo", "revision", "file"):
              value = models["summarize"].get(field) or ""
              if value.split() != [value]:
                  raise SystemExit(f"models.summarize.{field} is empty or not one word")
              print(f"summarize_{field}={value}")
          PY

      # The same key the daily run uses, so a dispatch on a warm runner pays
      # nothing for the weights. The key names every part of what it holds: the
      # fetch below only runs on a miss, so a key missing one of them turns that
      # step into dead code and serves whatever bytes are already there.
      - name: Cache weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: llm-${{ steps.models.outputs.summarize_file }}-${{ steps.models.outputs.summarize_revision }}-${{ env.LLAMA_CPP_BUILD }}-v4

      - name: Fetch runtime and weights
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          # `cp -a`, never `find -type f`: these builds ship versioned shared
          # objects as symlinks, and a symlink is not a file to `find`.
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          chmod +x backend/bin/llama-server
          # The pinned commit, never a branch, and `-f` so an HTTP error body
          # cannot be written into the weights file and then cached.
          curl -fsSL --retry 3 --retry-all-errors \
            -o "backend/models/${{ steps.models.outputs.summarize_file }}" \
            "https://huggingface.co/${{ steps.models.outputs.summarize_repo }}/resolve/${{ steps.models.outputs.summarize_revision }}/${{ steps.models.outputs.summarize_file }}?download=true"

      # No `if:`. A restored cache entry is the one case where nobody watched
      # the bytes arrive, so it is the case that most needs checking.
      - name: Verify the weights
        run: |
          set -euo pipefail
          EXPECTED=$(python -c 'import json, pathlib; config = json.load(open("config/idhazh.json", encoding="utf-8")); models = json.load(open(pathlib.Path("config") / config["models_file"], encoding="utf-8")); print(models["summarize"]["sha256"] or "")')
          if [ -z "$EXPECTED" ]; then
            echo "config records no sha256 for models.summarize" >&2
            exit 1
          fi
          echo "${EXPECTED}  backend/models/${{ steps.models.outputs.summarize_file }}" | sha256sum --check

      # One config root per arm, built from the committed `config/` and
      # differing only in what that arm changes. The committed config is never
      # edited: an arm that edited it would leave the next arm reading whatever
      # the last one wrote.
      #
      # Two files move, and the arm declares one intention that moves both.
      # `visuals.enabled_kinds` empty is what makes no picture reachable, so the
      # gate takes the plan fields off the summarize-and-plan call's grammar;
      # `summarize.asks_for_a_visual_plan` false is what sizes the window for
      # the call that is really sent. Apart they disagree, and the disagreement
      # refuses articles that fit.
      - name: Write each arm's config
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          from idhazh.contracts.pipeline_tests import PipelineTestsConfig

          settings = PipelineTestsConfig.from_json(
              Path("config/pipeline-tests.json").read_text(encoding="utf-8")
          )
          for arm in settings.arms:
              root = Path("backend/var/arms") / arm.id / "config"
              if root.exists():
                  shutil.rmtree(root)
              root.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree("config", root)

              app_path = root / "idhazh.json"
              app = json.loads(app_path.read_text(encoding="utf-8"))
              # Through `.get`, because the committed config carries only what
              # differs from a default - so a block this arm moves may not be
              # in the file at all.
              summarize = dict(app.get("summarize") or {})
              summarize["asks_for_a_visual_plan"] = arm.asks_for_a_visual_plan
              app["summarize"] = summarize
              if not arm.asks_for_a_visual_plan:
                  visuals = dict(app.get("visuals") or {})
                  visuals["enabled_kinds"] = []
                  app["visuals"] = visuals
              app_path.write_text(
                  json.dumps(app, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )

              models_path = root / app["models_file"]
              models = json.loads(models_path.read_text(encoding="utf-8"))
              entry = dict(models["summarize"])
              inference = dict(entry["inference"])
              if arm.n_parallel is not None:
                  inference["n_parallel"] = arm.n_parallel
              if arm.n_ctx is not None:
                  inference["n_ctx"] = arm.n_ctx
              entry["inference"] = inference
              models["summarize"] = entry
              models_path.write_text(
                  json.dumps(models, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              print(f"{arm.id}={root.as_posix()}")
          PY

      # One plan, written once, from the addresses the draw chose. The arms all
      # run it, so the two item ids are fixed before the first request and the
      # three arms are comparing the same work.
      #
      # Everything but the address comes off the feed in `config/sources.json` -
      # the vertical, the tier, the form - so this step invents nothing about a
      # source. The item id is derived exactly as the ranker derives it, because
      # a test that minted its own would file its results under ids the pipeline
      # never writes.
      - name: Plan the two articles
        id: plan
        env:
          PICKED_ADDRESSES: ${{ steps.pick.outputs.addresses }}
          PICKED_FEEDS: ${{ steps.pick.outputs.feeds }}
          RUN_EXECUTION: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from idhazh import assemble, config, discover, rank
          from idhazh.contracts.base import derive_url_key
          from idhazh.contracts.run_plan import PlannedItem, RunPlan, VerticalPlan

          settings = config.load(Path("config"))
          feeds = {feed.id: feed for feed in settings.sources.feeds}
          addresses = os.environ["PICKED_ADDRESSES"].split()
          chosen = os.environ["PICKED_FEEDS"].split()
          date = datetime.now(UTC).strftime("%Y-%m-%d")

          items = []
          for address, source_id in zip(addresses, chosen, strict=True):
              feed = feeds[source_id]
              canonical = discover.canonicalise(address)
              url_key = derive_url_key(canonical)
              items.append(
                  PlannedItem(
                      item_id=rank.item_id(feed.vertical, url_key),
                      url_key=url_key,
                      source_url=address,
                      canonical_url=canonical,
                      source_id=feed.id,
                      tier=feed.tier,
                      source_form=feed.form,
                      vertical=feed.vertical,
                      rank_score=0.0,
                  )
              )

          # A desk row per vertical the draw landed on, because the payload
          # refuses a list whose items and counts disagree. `feeds_read` stays
          # zero and that is the honest reading: this plan came off a config
          # list, so no feed was asked anything.
          counts: dict[str, int] = {}
          for item in items:
              counts[item.vertical] = counts.get(item.vertical, 0) + 1
          verticals = [
              VerticalPlan(id=name, considered=drawn, planned=drawn, eligible_feeds=drawn)
              for name, drawn in sorted(counts.items())
          ]

          plan = RunPlan(
              date=date,
              run_id=f"{date}-{os.environ['RUN_EXECUTION']}",
              generated_at=assemble.utc_now(),
              verticals=verticals,
              items=items,
          )
          written = Path("backend/var/pipeline-tests/plan.json")
          written.parent.mkdir(parents=True, exist_ok=True)
          assemble.write_atomic(written, plan.to_json())
          print(f"date={date}")
          print("item_ids=" + " ".join(item.item_id for item in plan.items))
          PY

      - name: Start the model
        env:
          LLAMA_WEIGHTS: backend/models/${{ steps.models.outputs.summarize_file }}
        run: |
          set -euo pipefail
          mkdir -p backend/var
          # Every flag comes from the first arm's config, so the server this arm
          # measures is the server that arm's config describes (Guardrail #6).
          python - <<'PY' > backend/var/llama-argv
          import os
          import sys
          from pathlib import Path

          from idhazh import config
          from idhazh.llm.server import server_argv

          settings = config.load(Path("backend/var/arms/baseline/config"))
          argv = server_argv(
              binary=Path("backend/bin/llama-server"),
              weights=Path(os.environ["LLAMA_WEIGHTS"]),
              model=settings.models.summarize,
              inference=settings.models.summarize.inference,
              port=int(os.environ["LLAMA_PORT"]),
          )
          sys.stdout.write("\0".join(argv) + "\0")
          PY
          mapfile -d '' LLAMA_ARGV < backend/var/llama-argv
          echo "starting: ${LLAMA_ARGV[*]}"
          LD_LIBRARY_PATH=backend/bin nohup "${LLAMA_ARGV[@]}" > llama-server.log 2>&1 &
          echo "$!" > llama-server.pid
          for _ in $(seq 1 120); do
            curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null && break
            sleep 5
          done
          # Assert it, do not hope. Without this the loop simply ends, every
          # item fails as "model unreachable", and three arms agree on nothing.
          curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null || {
            echo "the model never became healthy" >&2
            tail -50 llama-server.log >&2
            exit 1
          }

      # Arm one. The production path exactly as the daily run walks it: both
      # calls, the visual decision on, one slot on the server. Every other arm is
      # read against this one, so it runs first and it changes nothing.
      #
      # `bash <path>`, which is what seven of the nine calls this repository
      # already makes into `.github/scripts/` do. The bare path works only while
      # the file carries the executable bit, a file mode is invisible to the
      # tests that read this YAML and to the shellcheck step that reads the
      # script, and the first dispatch of this workflow died on exactly that -
      # exit 126, `Permission denied`, on a script committed 100644. Handing the
      # file to bash asks nothing of the mode.
      #
      # `!cancelled()` on every arm, because a rig exists to say what happened.
      # On that first dispatch one broken call took all three arms with it, so
      # the run read as a baseline problem where it had a script problem; three
      # arms failing the same way would have named the cause on the run page.
      # An arm still needs the one plan, and the script refuses by name without
      # it rather than summarizing nothing quietly.
      - name: Arm baseline
        if: ${{ !cancelled() }}
        env:
          RUN_DATE: ${{ steps.plan.outputs.date }}
        run: bash .github/scripts/run-pipeline-test-arm.sh baseline "$RUN_DATE"

      # Arm two. No picture is reachable, so the summarize-and-plan call comes
      # back with the summary alone and the plan's decode is not spent. The
      # server is the same process arm one used - nothing about this arm is a
      # start-time setting - so what the difference measures is the decode and
      # nothing else.
      - name: Arm no-visual-decision
        if: ${{ !cancelled() }}
        env:
          RUN_DATE: ${{ steps.plan.outputs.date }}
        run: bash .github/scripts/run-pipeline-test-arm.sh no-visual-decision "$RUN_DATE"

      # The slot count is fixed when the process starts, so this arm costs a
      # restart and a second model load. That load is itself one of the numbers
      # worth having: it is the fixed cost `run.shard_size` exists to amortise.
      #
      # It carries an id because arm three reads its outcome, and it runs after a
      # failed arm for the same reason the arms do.
      - name: Restart the model with two slots
        id: restart
        if: ${{ !cancelled() }}
        env:
          LLAMA_WEIGHTS: backend/models/${{ steps.models.outputs.summarize_file }}
        run: |
          set -euo pipefail
          kill "$(cat llama-server.pid)" 2>/dev/null || true
          for _ in $(seq 1 30); do
            kill -0 "$(cat llama-server.pid)" 2>/dev/null || break
            sleep 1
          done
          mv llama-server.log backend/var/arms/baseline/llama-server.log
          python - <<'PY' > backend/var/llama-argv
          import os
          import sys
          from pathlib import Path

          from idhazh import config
          from idhazh.llm.server import server_argv

          settings = config.load(Path("backend/var/arms/parallel-2/config"))
          argv = server_argv(
              binary=Path("backend/bin/llama-server"),
              weights=Path(os.environ["LLAMA_WEIGHTS"]),
              model=settings.models.summarize,
              inference=settings.models.summarize.inference,
              port=int(os.environ["LLAMA_PORT"]),
          )
          sys.stdout.write("\0".join(argv) + "\0")
          PY
          mapfile -d '' LLAMA_ARGV < backend/var/llama-argv
          echo "restarting: ${LLAMA_ARGV[*]}"
          LD_LIBRARY_PATH=backend/bin nohup "${LLAMA_ARGV[@]}" > llama-server.log 2>&1 &
          echo "$!" > llama-server.pid
          for _ in $(seq 1 120); do
            curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null && break
            sleep 5
          done
          curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null || {
            echo "the model never became healthy on the second start" >&2
            tail -50 llama-server.log >&2
            exit 1
          }

      # Arm three. Two slots, and the window doubled with them so each slot
      # still holds what the production gate admits articles against.
      #
      # The one arm that reads a step rather than only `!cancelled()`, and the
      # difference is what a failed restart leaves behind: a healthy one-slot
      # server. This arm would then run against one slot and publish the number
      # under `parallel-2`, which is a wrong answer that looks like a right one.
      # A failed restart fails the job, so nothing is hidden by the skip.
      - name: Arm parallel-2
        if: ${{ !cancelled() && steps.restart.conclusion == 'success' }}
        env:
          RUN_DATE: ${{ steps.plan.outputs.date }}
        run: bash .github/scripts/run-pipeline-test-arm.sh parallel-2 "$RUN_DATE"

      - name: Stop the model
        if: always()
        run: |
          set -euo pipefail
          if [ -f llama-server.pid ]; then
            kill "$(cat llama-server.pid)" 2>/dev/null || true
          fi
          cp llama-server.log backend/var/arms/parallel-2/llama-server.log 2>/dev/null || true

      # The runtime half of the Oracle. The workflow-shape half asserts that one
      # step draws and every arm reads it; this asserts the arms really did land
      # on the same two items, which is the thing that makes a comparison
      # between them mean anything. An address that could not be fetched is
      # reported by name rather than passed over: a stale list is the expected
      # way this workflow decays.
      #
      # Two different failures, and only one of them is this step's to raise. An
      # arm that recorded nothing failed or was skipped, its own step is red and
      # the job is red with it, so the report names it and moves on. An arm that
      # recorded articles which are not the pair the draw chose has produced
      # numbers nobody may subtract, and that is what raises here.
      - name: Say what the three arms measured
        if: always()
        env:
          EXPECTED_ITEM_IDS: ${{ steps.plan.outputs.item_ids }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          from idhazh.contracts.pipeline_tests import PipelineTestsConfig

          settings = PipelineTestsConfig.from_json(
              Path("config/pipeline-tests.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_ITEM_IDS"].split()
          print("| arm | items | summaries | model ms | failed |")
          print("| --- | --- | --- | --- | --- |")
          silent = []
          disagreed = []
          for arm in settings.arms:
              items = Path("backend/var/arms") / arm.id / "run" / "items"
              landed = sorted(path.name.split(".")[0] for path in items.glob("*.article.json"))
              summaries = sorted(items.glob("*.summary.json"))
              spent = 0
              failed = []
              for path in summaries:
                  summary = json.loads(path.read_text(encoding="utf-8"))
                  spent += summary.get("summarize_ms") or 0
                  if summary.get("status") != "ok":
                      failed.append(f"{path.name.split('.')[0]}:{summary.get('failure_code')}")
              note = ", ".join(failed) or "-"
              if not landed:
                  silent.append(arm.id)
                  note = "nothing recorded"
              elif landed != sorted(expected):
                  disagreed.append(f"{arm.id} recorded {landed}")
              print(
                  f"| {arm.id} | {len(landed)} | {len(summaries)} | {spent} | {note} |"
              )
          print("")
          print(f"the draw asked every arm for {' and '.join(expected)}")
          if silent:
              print(f"these arms produced nothing: {', '.join(silent)}")
          if disagreed:
              raise SystemExit(
                  "the arms did not all read the same two articles, so nothing here "
                  "compares: " + "; ".join(disagreed)
              )
          PY

      # Ninety days, because a change is often argued about weeks after the
      # dispatch that measured it, and re-running is 45 minutes.
      #
      # The article text this produced goes with it. Nothing under
      # `backend/var/` is committed and nothing here reaches a reader, so this
      # is an artifact an operator downloads rather than anything republished
      # (CLAUDE.md section 0a).
      - name: Upload what the arms produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-tests-${{ github.run_id }}
          path: backend/var/arms/
          retention-days: 90
