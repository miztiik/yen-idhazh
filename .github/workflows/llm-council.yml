name: LLM-COUNCIL

# The judge, once a night, on its own clock. It reads yesterday's published day,
# asks a model which borderline pairs are one story, folds the answers into a
# fixed-size record and fits the merge line off it.
#
# **Council, not judges, and the name is about where this goes** (owner,
# 2026-09-18). Today the four legs shard a list and never confer, so on today's
# shape `judges` would be the more literal word. What is coming is not one
# question: autotune argues a case and needs something to adjudicate it - a
# judge, a jury or a plain heuristic - and some of those paths will put a person
# in the loop. One roof for all of them, named for the room rather than for the
# one job being done in it this month.
#
# It is not part of `digest.yml`, and the reason is the budget the design
# permits rather than the day the pipeline usually has. At the `pair_budget` cap
# of 200 pairs, one job doing all of them is 5 h 15 m of model time at the
# measured average pair of 94.53 s, and 6 h 10 m at the worst pair measured of
# 110.98 s - against a 6 h ceiling, where GitHub kills the job and nothing is
# written (Guardrail #2). Measured 2026-09-18 over 82 pairs on four stock
# runners: docs/reference/benchmarks/what-a-judge-pair-costs.md. So one job is a
# coin toss against the ceiling before `digest.yml`'s own work is added to it.
# Today's median day would fit comfortably, which is exactly why sizing the
# shape off the median is the wrong move.

on:
  schedule:
    # 22:00 UTC. The last digest cron is 20 18 * * *, and a scheduled run there
    # starts 40-70 minutes late and then takes 164-184 minutes (ubuntu-latest,
    # 2026-08-23/24, n=3), so it normally finishes between 21:44 and 22:34. The
    # first 34 minutes of a judge run can therefore land inside the tail of a
    # publish. Both push to `main` and the fold's two commit calls already
    # handle that; what the overlap costs is a queued cache restore, never a
    # failed run.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Digest date to judge (YYYY-MM-DD). Defaults to yesterday, UTC.'
        default: ''

permissions:
  contents: write

concurrency:
  group: llm-council
  cancel-in-progress: false

env:
  # The one place this workflow says which port, for the reason `digest.yml`
  # gives: `server_argv` binds it and `idhazh.llm.server` reads it for the
  # address the leg posts to.
  LLAMA_PORT: '8080'

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.decide.outputs.date }}
      shards: ${{ steps.fanout.outputs.shards }}
      matrix: ${{ steps.fanout.outputs.matrix }}
      shard_timeout_minutes: ${{ steps.bounds.outputs.shard_timeout_minutes }}
      summarize_repo: ${{ steps.models.outputs.summarize_repo }}
      summarize_revision: ${{ steps.models.outputs.summarize_revision }}
      summarize_file: ${{ steps.models.outputs.summarize_file }}
      draft_repo: ${{ steps.models.outputs.draft_repo }}
      draft_revision: ${{ steps.models.outputs.draft_revision }}
      draft_file: ${{ steps.models.outputs.draft_file }}
      draft_sha256: ${{ steps.models.outputs.draft_sha256 }}
      llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - id: decide
        env:
          # Through `env`, not pasted into the program below. A value read by
          # name is a value, whatever it contains.
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DATE="${DISPATCH_DATE:-}"
          # Yesterday, because a day publishes five times and the last slot can
          # still be running at 22:00. Judging a day that is still being written
          # would draw pairs from a day the next run replaces.
          [ -n "$DATE" ] || DATE=$(date -u -d 'yesterday' +%F)
          # The same anchored pattern `digest.yml` uses, for the same reason: a
          # typo files rows at an address no reader ever looks at, silently,
          # after a run of about two hours. The month and the day are bounded as
          # well as counted, because 2026-13-45 files as readily as 2026-08-27.
          if ! [[ "$DATE" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "date must be YYYY-MM-DD, and it becomes the address these rows file under" >&2
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # The model refs, read once from config and published to every leg. They
      # travel as job OUTPUTS rather than as `env`, because `needs` resolves
      # before a job's first step and `steps` does not - and the weights cache
      # key below has to name the file it holds.
      - id: models
        run: |
          set -euo pipefail
          python3 backend/utilities/model_refs.py configured >> "$GITHUB_OUTPUT"

      # The build every leg is about to install, asked once of the file that
      # decides it. A job output for the same reason the refs are.
      - id: runtime
        name: Say which llama.cpp build this run installs
        run: |
          set -euo pipefail
          bash .github/scripts/llama-cpp-pin.sh \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # How long a leg may take, read from the one file that says so. A job
      # OUTPUT because `timeout-minutes` resolves from `needs` before the job's
      # first step, and `steps` is not readable there.
      #
      # Asserted to be a bare positive whole number at the one point that writes
      # it. `timeout-minutes` takes whatever it is handed, so a value Actions
      # cannot read as a number leaves the leg with no bound at all and the run
      # finds out at the 6 h ceiling, where GitHub kills it with nothing
      # written.
      - id: bounds
        run: |
          set -euo pipefail
          python3 backend/utilities/shard_bound.py --key council.shard_timeout_minutes \
            >> "$GITHUB_OUTPUT"

      # How many shards split the night, read off the council's own block. A
      # literal here would be a second answer to how wide the fan-out is, and the
      # two can disagree - the draw would deal four ways while three shards ran,
      # and a quarter of the night would go unjudged with nothing saying so.
      #
      # The council's block and not a tenant's, because the width sizes this
      # matrix: read out of a judge's config path, this step raises before the
      # planning job plans anything on a night with no judge configured.
      - id: fanout
        run: |
          set -euo pipefail
          SHARDS=$(python -c 'import json; print(json.load(open("config/idhazh.json", encoding="utf-8"))["council"]["shards"])')
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")" >> "$GITHUB_OUTPUT"

      # It reads two committed files and scores what they already carry. No
      # model, no socket, no fetcher.
      - name: Draw the borderline pairs
        run: |
          set -euo pipefail
          python -m idhazh judge-draw --date "${{ steps.decide.outputs.date }}"

      - uses: actions/upload-artifact@v7
        with:
          name: judge-draw
          path: backend/var/judge/${{ steps.decide.outputs.date }}/draw.csv
          retention-days: 1

  judge:
    needs: draw
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.draw.outputs.shard_timeout_minutes) }}
    strategy:
      # A leg that runs out of clock costs its pairs for that day and nothing
      # else. The fold still runs, still appends every row the other legs
      # produced, and refuses to fold a partial day into the record.
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.draw.outputs.shards) }}
      matrix:
        shard: ${{ fromJSON(needs.draw.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Before the leg reads it. Without the draw a leg has nothing to judge and
      # `judge-shard` fails on a missing file.
      - uses: actions/download-artifact@v8
        with:
          name: judge-draw
          path: backend/var/judge/${{ needs.draw.outputs.date }}

      # The cache, the fetch, the digest check, the server and the health probe.
      # One action, shared with `digest.yml`, which ran the same five steps as a
      # second copy. Two things follow from sharing it: the two runs cannot key
      # the cache differently, so the daily run has already created the entry
      # and this restores rather than downloads and adds ZERO bytes to the 10 GB
      # allowance; and the repository's own throughput reading transfers to this
      # workload, because it was taken on these weights.
      #
      # The port is handed over rather than inherited: it has one home, the
      # workflow `env` above, and this is the line that carries it in.
      - uses: ./.github/actions/model-server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          port: ${{ env.LLAMA_PORT }}
          weights_repo: ${{ needs.draw.outputs.summarize_repo }}
          weights_revision: ${{ needs.draw.outputs.summarize_revision }}
          weights_file: ${{ needs.draw.outputs.summarize_file }}
          llama_cpp_build: ${{ needs.draw.outputs.llama_cpp_build }}
          draft_repo: ${{ needs.draw.outputs.draft_repo }}
          draft_revision: ${{ needs.draw.outputs.draft_revision }}
          draft_file: ${{ needs.draw.outputs.draft_file }}
          draft_sha256: ${{ needs.draw.outputs.draft_sha256 }}

      - name: Judge this leg's pairs
        run: |
          set -euo pipefail
          python -m idhazh judge-shard \
            --date "${{ needs.draw.outputs.date }}" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.draw.outputs.shards }}

      # The leg uploads and commits nothing. Four legs each committing into one
      # union-merged day file would buy four pushes that can each lose a race
      # against a digest run, four rebases, and a leg that dies after pushing
      # half its rows. One fold is one push.
      #
      # `always()`, because the exposure was never the collecting job dying - it
      # is a leg dying. A leg that stops on its own clock, or is killed on the
      # platform's, has still judged every pair it reached, and without this
      # those verdicts go in the bin however much of the bound they cost.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: judge-verdicts-${{ matrix.shard }}
          path: backend/var/judge/${{ needs.draw.outputs.date }}/verdicts/${{ matrix.shard }}.csv
          retention-days: 1

      # What the hosted work measured about its own instrument, on its own way
      # out. An artifact rather than a commit, and the reason is that a commit
      # would not reach the reader: every checkout here names no ref, so each
      # job is pinned to the commit the run was triggered at and a row pushed at
      # 22:40 is invisible to a job checked out at 22:00.
      #
      # `always()`, because a unit that stopped on its own clock still measured
      # what it reached, and that is the reading the night is judged on. Nothing
      # writes this directory until a tenant is registered, so an empty upload is
      # the no-tenant case rather than a failure.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: council-metrics-${{ matrix.shard }}
          path: backend/var/council/${{ needs.draw.outputs.date }}/metrics
          if-no-files-found: warn
          retention-days: 1

  fold:
    needs: [draw, judge]
    # A leg that died still leaves the others' rows worth keeping, and the day
    # still owes a fitted row saying why it was held.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          pattern: judge-verdicts-*
          merge-multiple: true
          path: backend/var/judge/${{ needs.draw.outputs.date }}/verdicts

      # Every unit's metrics, merged into one tree. Each upload carries the
      # tenant's own slug as a directory level, so two tenants' shard 0 land
      # beside each other rather than on top of each other.
      - uses: actions/download-artifact@v8
        with:
          pattern: council-metrics-*
          merge-multiple: true
          path: backend/var/council/${{ needs.draw.outputs.date }}/metrics

      # One process appends every leg's rows into one day file, so two writers
      # never share a path: no merge driver to trust, no union stacking to
      # census afterwards, and no key to settle across legs.
      #
      # A day missing a leg is NOT folded into the record. The record counts a
      # date once and refuses a second fold, so folding three legs of four would
      # make the fourth leg's verdicts unreachable for ever. The day's fitted row
      # then says `legs_missing` and a re-dispatch folds the whole day cleanly.
      - name: Fold the day into the record
        run: |
          set -euo pipefail
          python -m idhazh judge-fold --date "${{ needs.draw.outputs.date }}"

      # After the fold and before the commits. Nothing reads the line it writes
      # until `assemble.same_story.adaptive_dedup_threshold.enabled` is turned
      # on, so this step cannot change a published day today.
      - name: Fit the merge line
        run: |
          set -euo pipefail
          python -m idhazh judge-fit --date "${{ needs.draw.outputs.date }}"

      # Two calls, rows first. The rows are what this run saw and are replayed
      # onto a new base when the push loses a race; the record is derived from
      # them and is rebuilt instead, which is why it is the only one of the two
      # that names a `REGENERATE_COMMAND` and a `REFRESH_PATHS`.
      - name: Commit what the legs judged
        env:
          COMMIT_MESSAGE: "judge: ${{ needs.draw.outputs.date }}"
          NOTHING_STAGED_MESSAGE: "no pairs were judged"
          PUSH_FAILED_MESSAGE: "could not push the judged pairs after three attempts"
        run: >-
          bash .github/scripts/commit-and-push.sh
          state/story-similarity/scored-pairs

      # The record is the only derived file here, so it is the only one this
      # call may rebuild. The fitted row is a row this run WROTE - what the
      # evidence said on this date - so a lost race replays it onto the new base
      # the way `state/seen` is replayed, and never regenerates it: a second fit
      # against a moved tip would answer a different question and overwrite the
      # answer to this one.
      #
      # Rebuilding the record is safe because this workflow is its only writer
      # and `concurrency` runs one judge at a time. A rebase restores the same
      # bytes this run started from, the date is not in `folded_dates`, and the
      # fold lands once.
      - name: Commit the record and the line
        env:
          COMMIT_MESSAGE: "judge record: ${{ needs.draw.outputs.date }}"
          NOTHING_STAGED_MESSAGE: "the record did not move"
          PUSH_FAILED_MESSAGE: "could not push the record after three attempts"
          REFRESH_PATHS: >-
            state/story-similarity/score-distribution.json
          REGENERATE_COMMAND: >-
            python -m idhazh judge-fold --date ${{ needs.draw.outputs.date }}
        run: >-
          bash .github/scripts/commit-and-push.sh
          state/story-similarity/score-distribution.json
          state/story-similarity/fitted-thresholds
          state/story-similarity/archive
