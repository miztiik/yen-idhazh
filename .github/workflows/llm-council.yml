name: LLM-COUNCIL

# The council, once a night, on its own clock. It asks every tenant registered
# active in `judge_names` in `config/llm_council.json` to pick its work for the day, fans out over one job a
# tenant a shard, and settles what came back.
#
# **Council, not judges, and the name is about where this goes** (owner,
# 2026-09-18). Today the units shard a list and never confer, so on today's
# shape `judges` would be the more literal word. What is coming is not one
# question: autotune argues a case and needs something to adjudicate it - a
# judge, a jury or a plain heuristic - and some of those paths will put a person
# in the loop. One roof for all of them, named for the room rather than for the
# one job being done in it this month.
#
# **The venue names no tenant.** Every verb below is the council's own and every
# ledger it commits is named by the tenants themselves, so a repository with no
# judge in it runs this file end to end and judges nothing.
#
# It is not part of `digest.yml`, and the reason is the budget the design
# permits rather than the day the pipeline usually has. At the `pair_budget` cap
# of 200 pairs, one job doing all of them is 5 h 15 m of model time at the
# measured average pair of 94.53 s, and 6 h 10 m at the worst pair measured of
# 110.98 s - against a 6 h ceiling, where GitHub kills the job and nothing is
# written (Guardrail #2). Measured 2026-09-18 over 82 pairs on four stock
# runners: docs/reference/benchmarks/what-a-judge-pair-costs.md. So one job is a
# coin toss against the ceiling before `digest.yml`'s own work is added to it.
# Today's median day would fit comfortably, which is exactly why sizing the
# shape off the median is the wrong move.

on:
  schedule:
    # 22:00 UTC. The last digest cron is 20 18 * * *, and a scheduled run there
    # starts 40-70 minutes late and then takes 164-184 minutes (ubuntu-latest,
    # 2026-08-23/24, n=3), so it normally finishes between 21:44 and 22:34. The
    # first 34 minutes of a council run can therefore land inside the tail of a
    # publish. Both push to `main` and the settle's commit call already handles
    # that; what the overlap costs is a queued cache restore, never a failed run.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'One required digest date (YYYY-MM-DD, UTC).'
        required: true
        type: string
      judges:
        description: 'One or more judge names from config/llm_council.json as JSON (["name"]). Active: publish as scheduled. Paused: download only, no commits. Retired: refused. Download council-results-<run_id>.'
        required: true
        type: string
      memory_profiling:
        description: 'OS memory and fault collection; inherit reads shared config'
        type: choice
        default: inherit
        options:
          - inherit
          - 'on'
          - 'off'

concurrency:
  group: llm-council
  cancel-in-progress: false

env:
  # Where this job's own probes ask, for the reason `digest.yml` gives: the
  # server is on this runner, and where a unit posts is `model_server.base_url`.
  MODEL_SERVER_PROBE: 'http://127.0.0.1:8080'

jobs:
  draw:
    env:
      COUNCIL_EVENT_FILE: backend/var/council/events/planner.jsonl
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.plan.outputs.date }}
      selection: ${{ steps.plan.outputs.selection }}
      run_id: ${{ steps.identity.outputs.run_id }}
      matrix: ${{ steps.fanout.outputs.matrix }}
      max_parallel: ${{ steps.fanout.outputs.max_parallel }}
      dates: ${{ steps.fanout.outputs.dates }}
      committed_paths: ${{ steps.fanout.outputs.committed_paths }}
      shard_timeout_minutes: ${{ steps.bounds.outputs.shard_timeout_minutes }}
      llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # The planner validates the whole selection before work starts. Scheduled
      # runs give each active judge yesterday UTC and its own bounded repairs.
      # Manual runs require one date and selected active or paused judges.
      - id: plan
        name: Say which dates tonight judges
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DATE: ${{ inputs.date }}
          DISPATCH_JUDGES: ${{ inputs.judges }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule) MODE=scheduled ;;
            workflow_dispatch) MODE=manual ;;
            *) exit 2 ;;
          esac
          python -m idhazh.council.night_plan \
            --mode "$MODE" \
            --dispatched "${DISPATCH_DATE:-}" \
            --judges "${DISPATCH_JUDGES:-}" \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The name every row this night writes is filed under, minted once here.
      # A job output for the same reason the bound is: the later jobs read it
      # through `needs`, and a name minted per job would compute the date prefix
      # once a job - so a run crossing midnight would file one night's rows
      # under two addresses.
      #
      # The council mints its own rather than borrowing the digest run's, which
      # claims a machine and a clock this night never drew and carries a date
      # prefix a day stale. The prefix is the day the COUNCIL runs, because a
      # reader takes a run id's first ten characters as the day its run opened.
      - id: identity
        name: Mint the name this night files its rows under
        env:
          # Through `env`, not pasted into the command. The platform's run id
          # and not its run number: the number starts again in the next workflow
          # and would collide with a digest run's id.
          PLATFORM_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m idhazh.council.run_identity --platform-run-id "$PLATFORM_RUN_ID" \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The build every unit is about to install, asked once of the file that
      # decides it. A job OUTPUT because `needs` resolves before a unit's first
      # step and `steps` does not, and the weights cache key names the build.
      #
      # The model's own refs used to travel the same way, read here and relayed
      # through seven job outputs to the step that downloaded them. The download
      # reads the file itself now, so there is nothing left to relay.
      - id: runtime
        name: Say which llama.cpp build this run installs
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py print-pinned-build \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # How long one unit may take, read from the one file that says so. A job
      # OUTPUT because `timeout-minutes` resolves from `needs` before the job's
      # first step, and `steps` is not readable there.
      #
      # Asserted to be a bare positive whole number at the one point that writes
      # it. `timeout-minutes` takes whatever it is handed, so a value Actions
      # cannot read as a number leaves the unit with no bound at all and the run
      # finds out at the 6 h ceiling, where GitHub kills it with nothing
      # written.
      - id: bounds
        run: |
          set -euo pipefail
          python3 backend/utilities/shard_bound.py --key shard_timeout_minutes --config-file llm_council.json \
            >> "$GITHUB_OUTPUT"

      # What tonight fans out to, asked of the tenants rather than computed
      # here. A cell is flat - tenant, date, shard, shards and runs_model -
      # because a per-tenant width is not a third axis: a cross product
      # would hand every tenant the widest tenant's width and pay a weights
      # restore for work that runs no model.
      #
      # `max_parallel` is the cell count under the platform's own ceiling, never
      # the shard width. Bound to the width, two tenants over two dates would
      # run sixteen cells in four waves and finish across two other schedules.
      - id: fanout
        name: Say what tonight fans out to and what it will commit
        env:
          COUNCIL_SELECTION: ${{ steps.plan.outputs.selection }}
        run: |
          set -euo pipefail
          python3 backend/utilities/council_matrix.py \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # Every tenant picks its own work, once a date, before any unit runs. It
      # reads committed files and scores what they already carry - no model, no
      # socket, no fetcher.
      - name: Pick the work for each date
        env:
          COUNCIL_SELECTION: ${{ steps.plan.outputs.selection }}
          COUNCIL_DATES: ${{ steps.fanout.outputs.dates }}
          COUNCIL_RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          set -euo pipefail
          echo "$COUNCIL_DATES" | jq -r '.[]' | while read -r judged; do
            python -m idhazh council-prepare --date "$judged" --run-id "$COUNCIL_RUN_ID"
          done

      # The whole council scratch root rather than one file inside it, so the
      # date and the tenant survive as directory levels. Two tenants' selections
      # then land beside each other in the merged download rather than on top of
      # each other, which an artifact named for neither could not prevent.
      #
      # The planner's safe event lines also travel here, even if preparation
      # failed or no tenant ran.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: council-selection-${{ steps.plan.outputs.date }}
          path: backend/var/council
          if-no-files-found: warn
          # Three nights, so what a night wrote is still reachable while the
          # plan can still name that night's date. One day expired before the
          # next scheduled run even started, which threw away the work of a run
          # that died between judging and committing. A shard file is about
          # 27 KB, so a week of four shards is under a megabyte.
          retention-days: 3

  judge:
    env:
      COUNCIL_SELECTION: ${{ needs.draw.outputs.selection }}
      COUNCIL_EVENT_FILE: backend/var/council/events/${{ matrix.tenant }}/${{ matrix.date }}/${{ matrix.shard }}.jsonl
    permissions:
      contents: read
      actions: read
    needs: draw
    # An empty matrix is a strategy-evaluation failure, and the run reds on it
    # rather than skipping quietly. No tenant registered is a legal night, and
    # the guard is what makes it one; a tenant registered whose cells did not
    # build is not, and the difference has to be visible from the run list.
    if: needs.draw.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.draw.outputs.shard_timeout_minutes) }}
    strategy:
      # A unit that runs out of clock costs its own work for that day and
      # nothing else. The settle still runs, still appends every row the other
      # units produced, and a partial day is not counted into a record.
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.draw.outputs.max_parallel) }}
      matrix:
        # A flat list of cells, so a tenant's own shard width travels on the
        # cell that uses it. `include` with no base keys is one job per entry.
        include: ${{ fromJSON(needs.draw.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Before the unit reads it. Without the selection a unit has nothing to
      # work on. By pattern rather than by name, and every date at once: the
      # artifact carries its own date as a directory level, so a merged download
      # reassembles the tree and this unit reads the one date it was given.
      - uses: actions/download-artifact@v8
        with:
          pattern: council-selection-*
          merge-multiple: true
          path: backend/var/council
          # Passed rather than inherited. This job's permissions block names
          # what this credential may do, and an artifact read is one of them.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The cache, the fetch, the digest check, the server and the health probe.
      # One action, shared with `digest.yml`, which ran the same five steps as a
      # second copy. Two things follow from sharing it: the two runs cannot key
      # the cache differently, so the daily run has already created the entry
      # and this restores rather than downloads and adds ZERO bytes to the 10 GB
      # allowance; and the repository's own throughput reading transfers to this
      # workload, because it was taken on these weights.
      #
      # The probe address is handed over rather than inherited: it has one home,
      # the workflow `env` above, and this is the line that carries it in.
      - uses: ./.github/actions/model-server
        if: matrix.runs_model
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ env.MODEL_SERVER_PROBE }}
          llama_cpp_build: ${{ needs.draw.outputs.llama_cpp_build }}

      # One cell is one tenant, so the in-process deadline the verb computes is
      # about this tenant's span and nobody else's. Two tenants in one job would
      # each be handed the whole span the venue meant for one of them.
      - name: Run this unit of the tenant's work
        env:
          COUNCIL_RUN_ID: ${{ needs.draw.outputs.run_id }}
          COUNCIL_TENANT: ${{ matrix.tenant }}
          COUNCIL_DATE: ${{ matrix.date }}
          COUNCIL_SHARD: ${{ matrix.shard }}
          COUNCIL_SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          python -m idhazh council-shard \
            --tenant "$COUNCIL_TENANT" \
            --date "$COUNCIL_DATE" \
            --run-id "$COUNCIL_RUN_ID" \
            --shard "$COUNCIL_SHARD" \
            --shards "$COUNCIL_SHARDS"

      # The unit commits nothing, and an artifact is the only way its rows get
      # across. Every checkout here names no ref, so each job is pinned to the
      # commit the run was triggered at: a row pushed at 22:40 is invisible to
      # the collecting job, which checked out at 22:00 and decides whether every
      # unit reported by counting what it downloaded. One settle is one push.
      #
      # `always()`, because the exposure was never the collecting job dying - it
      # is a unit dying. A unit that stopped on its own clock, or was killed on
      # the platform's, has still done every piece of work it reached, and
      # without this that work goes in the bin however much of the bound it
      # cost. The selection is excluded because this job downloaded it rather
      # than wrote it.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: council-metrics-${{ matrix.tenant }}-${{ matrix.date }}-${{ matrix.shard }}
          path: |
            backend/var/council
            !backend/var/council/*/selection
            !backend/var/council/trials/*/*/*/scratch/*/selection
            !backend/var/council/events/planner.jsonl
          if-no-files-found: warn
          # The same three nights the selection keeps, and for the same reason:
          # a unit's verdicts outlive the run that produced them.
          retention-days: 3

  save_council_results:
    permissions:
      contents: write
      actions: read
    needs: [draw, judge]
    # A unit that died still leaves the others' work worth keeping, and a date
    # still owes whatever its tenants settle.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stamp the collecting job clock
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config
            backend
            .github

      - name: Keep collection sparse and disable implicit downloads
        run: |
          git config index.sparse true
          echo "GIT_NO_LAZY_FETCH=1" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .
      - name: Select the pinned host toolchain
        working-directory: backend/rust/host-telemetry
        run: echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: host-crates-${{ runner.os }}-${{ hashFiles('backend/rust/host-telemetry/Cargo.lock', 'backend/rust/host-telemetry/rust-toolchain.toml') }}
      - uses: ./.github/actions/d7-host-telemetry

      # Every unit's output, merged into one tree. Each upload carries the date
      # and the tenant as directory levels, so two tenants' first unit land
      # beside each other rather than on top of each other.
      #
      # Every council artifact and not only the units': the planning job records
      # its own selection unit the same way a judging unit records a shard, and
      # that row travels in the selection artifact. Collecting only the units'
      # uploads would leave the night's record short by one row a tenant.
      - uses: actions/download-artifact@v8
        with:
          pattern: council-*
          merge-multiple: true
          path: backend/var/council
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One job looping the dates rather than one job a date. Two jobs of one
      # run pushing `main` would race each other, and the workflow-level
      # `concurrency` group does not serialise jobs inside a run.
      - name: Settle and publish every completed tenant output
        if: always()
        env:
          COUNCIL_SELECTION: ${{ needs.draw.outputs.selection }}
          COUNCIL_RUN_ID: ${{ needs.draw.outputs.run_id }}
          COUNCIL_COMMIT: ${{ github.sha }}
          COUNCIL_UNITS_RESULT: ${{ needs.judge.result }}
          COUNCIL_MATRIX: ${{ needs.draw.outputs.matrix }}
          MEMORY_PROFILING: ${{ inputs.memory_profiling || 'inherit' }}
        run: |
          set -euo pipefail
          python backend/utilities/d7_host_telemetry.py run \
            --job save_council_results \
            --run-id "$COUNCIL_RUN_ID" --git-sha "$COUNCIL_COMMIT" \
            --memory-profiling "$MEMORY_PROFILING" -- \
            python backend/utilities/council_publish.py \
            --run-id "$COUNCIL_RUN_ID" --commit "$COUNCIL_COMMIT" \
            --job-started-at "$JOB_STARTED_AT" --units-result "$COUNCIL_UNITS_RESULT" \
            --matrix "$COUNCIL_MATRIX"

      - name: Refuse to publish without a verified D7 receipt
        if: always()
        run: |
          if [ "${IDHAZH_HOST_TELEMETRY_VERIFIED:-0}" != 1 ] \
            && [ "${IDHAZH_HOST_TELEMETRY_SKIPPED:-}" != council-no-active-publishers ]; then
           echo "D7 receipt verification failed; refusing to settle council output" >&2
           exit 1
          fi
      - name: Clean up the owned D7 monitor
        if: always()
        run: |
          if [ -n "${IDHAZH_HOST_TELEMETRY_SESSION:-}" ]; then
           python backend/utilities/d7_host_telemetry.py cleanup \
             --workspace "$IDHAZH_HOST_TELEMETRY_SESSION"
          fi

      # Settlement writes paused judges' trial state after the unit downloads.
      # Keep it, and active publication receipts, even when collection fails.
      - name: Upload final council results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: council-results-${{ needs.draw.outputs.run_id }}
          path: backend/var/council
          if-no-files-found: warn
          retention-days: 3
