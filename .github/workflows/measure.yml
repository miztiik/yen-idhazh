name: Measurements

# Measures real prefill/decode throughput on a stock GitHub-hosted runner so the
# pipeline design rests on numbers rather than estimates (CLAUDE.md Guardrail #10).
# Every figure it emits carries the hardware it ran on and the date.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Measurement target'
        type: choice
        required: true
        default: bench
        options:
          - bench
          - corpus
          - batched
          - budgets
      # ONE argument names the candidate, and it is the same line a swap moves:
      # the models file. Every fact about a candidate is already written there,
      # and a form that asked for them again could bench one set of bytes while
      # the adoption pointed at another. Leave it empty and the bench measures
      # the model config already names, which is how the case is checked against
      # the page it is supposed to reproduce.
      candidate_models_file:
        description: 'Models file under config/, for example models/qwen3.5-9b-q4km.json. Empty benches the configured model.'
        default: ''
      threads:
        description: 'Comma-separated llama-bench thread counts, for example 4,8'
        default: '4'
      # One dispatch's answer to the same question `bench.run_model_speed_case`
      # answers for every dispatch. `config` follows the knob; the other two
      # overrule it for this run and nothing else, so an operator who wants the
      # rest of the flow without the half-hour of llama-bench needs no commit.
      model_speed_case:
        description: 'Run the llama-bench speed case? config follows bench.run_model_speed_case'
        type: choice
        default: config
        options:
          - config
          - run
          - skip
      corpus_links:
        description: 'How many real links to measure for the length distribution'
        default: '200'
      runtime_candidate:
        description: 'llama-server runtime candidate, or a case set like draft_depth'
        type: choice
        default: baseline
        options:
          - baseline
          - np1
          - batch2048
          - no_startup_warmup
          - flash_attention_on
          - load_mode_mmap_mlock
          - kv_q8
          - prio_poll
          - threads
          - threads_batch
          - np2_inflight
          - no_draft
          - draft_depth
      # What the job timeout is spent on is repeats times articles times cases,
      # and the first two of those now sit beside each other in `bench` so that
      # raising one shows the other. Empty follows `bench.repeats`.
      runtime_repeats:
        description: 'Repeats per case, overruling bench.repeats for this run. Use 2 for draft_depth'
        default: ''
      # The corpus is what the job timeout is actually spent in, and a case set
      # multiplies it: `draft_depth` runs FOUR cases, so two repeats is eight
      # passes rather than the four a named candidate costs. At the 13.1 minutes
      # an article the slowest pass has recorded, eight passes over the
      # committed three articles is 314 minutes against a 330 minute timeout,
      # and two articles is 210. Empty follows `bench.corpus_items`.
      runtime_corpus_items:
        description: 'Articles per repeat, overruling bench.corpus_items for this run. Use 2 for draft_depth'
        default: ''
      # Breadth comes from several jobs rather than a longer one. Eight passes
      # over five articles is about 524 minutes against a 360-minute platform
      # ceiling, so five articles cannot share a job with four cases. Each
      # dispatch still runs every case, so every case-against-case comparison
      # stays inside one machine - which is the whole reason the cases are
      # paired. This is what stops three dispatches of one day all reading the
      # same top two articles and reporting two articles as six.
      runtime_corpus_offset:
        description: 'Skip this many planned articles first, so a second dispatch measures different ones'
        default: ''
      runtime_threads:
        description: 'Value for --threads when runtime_candidate is threads'
        default: '8'
      runtime_threads_batch:
        description: 'Value for -tb when runtime_candidate is threads_batch'
        default: '4'
      budget_samples:
        description: 'How many corpus rows the tokens-a-word probe reads'
        default: '200'

permissions:
  contents: read

concurrency:
  # One group per target, because the four targets are four jobs that share
  # nothing. Only `bench` commits: its `runtime` job pushes one host row to
  # `state/pipeline-tests/host-fingerprint/<Y>/<M>/<DD>.csv`, a day file two
  # dispatches on one day both append to. Until every writer owns its own
  # filename, two of them racing that path lose a row at the rebase - and the
  # step is `continue-on-error`, so the run stays green while the record goes.
  #
  # Per target rather than one flat group, for validate.yml's reason: GitHub
  # keeps only ONE pending run per group and a newer pending run cancels the
  # older one. This workflow is dispatched by hand many times a day, so a flat
  # group would drop a measurement with no error anywhere. A `corpus` dispatch
  # has no reason to queue behind a five-hour `bench`, and two `bench`
  # dispatches are the pair that has to queue.
  #
  # `inputs` is legal here: GitHub allows `github, inputs, vars` on the
  # `concurrency` key, and this workflow is dispatch-only, so the context is
  # always populated. `target` is a choice with a default, so it is never empty.
  group: measurements-${{ inputs.target }}
  cancel-in-progress: false

env:
  LLAMA_CPP_BUILD: b10598
  LLAMA_CPP_ASSET: llama-b10598-bin-ubuntu-x64.tar.gz
  LLAMA_CPP_SHA256: d77a09db4165f8850b513629ed0ffeaab7851bb03e7cc3870b74e721f894694c
  # The one place this workflow says which port, the same declaration digest.yml
  # and validate.yml make. The runtime job starts its own server from an inline
  # python block rather than through `.github/scripts/start-llama-server.sh`,
  # because it sweeps a setting and needs the process handle - but it reads the
  # port from here, so no part of this repository spells the number twice
  # (Guardrail #6).
  LLAMA_PORT: '8080'

jobs:
  # The model refs, read once from config and published to every target that
  # loads weights. Same step, same guard and same reason as the `models` step in
  # digest.yml: `needs` resolves before a job's first step and `steps` does not,
  # which is what lets a job-scoped `env` name the model at all.
  #
  # This job is not gated on the target. A `needs` on a skipped job skips the
  # dependent, so gating it would skip whichever target was dispatched. It reads
  # one file and finishes in seconds.
  #
  # It is also where the candidate is decided: the dispatch input where one was
  # given, the configured model otherwise. One place, so the two cases of the
  # bench cannot disagree about which bytes they measured.
  #
  # And it is where the speed case is decided, for the same reason plus one: a
  # job's own `if:` cannot read a step of its own job, so the answer has to
  # arrive as a `needs` output.
  models:
    name: Read the candidate out of config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      model_speed_case: ${{ steps.speed.outputs.model_speed_case }}
      summarize_repo: ${{ steps.models.outputs.summarize_repo }}
      summarize_revision: ${{ steps.models.outputs.summarize_revision }}
      summarize_file: ${{ steps.models.outputs.summarize_file }}
      candidate_repo: ${{ steps.models.outputs.candidate_repo }}
      candidate_revision: ${{ steps.models.outputs.candidate_revision }}
      candidate_file: ${{ steps.models.outputs.candidate_file }}
      candidate_sha256: ${{ steps.models.outputs.candidate_sha256 }}
      candidate_byte_count: ${{ steps.models.outputs.candidate_byte_count }}
      candidate_id: ${{ steps.models.outputs.candidate_id }}
      candidate_quantisation: ${{ steps.models.outputs.candidate_quantisation }}
      candidate_ref: ${{ steps.models.outputs.candidate_ref }}
      candidate_models_file: ${{ steps.models.outputs.candidate_models_file }}
      candidate_draft_repo: ${{ steps.models.outputs.candidate_draft_repo }}
      candidate_draft_revision: ${{ steps.models.outputs.candidate_draft_revision }}
      candidate_draft_file: ${{ steps.models.outputs.candidate_draft_file }}
      candidate_draft_sha256: ${{ steps.models.outputs.candidate_draft_sha256 }}
      candidate_cache_key: ${{ steps.models.outputs.candidate_cache_key }}
    steps:
      - uses: actions/checkout@v6

      # `model_speed_case.py` reads `bench.run_model_speed_case` through the
      # contract, so this job needs the package installed even though it writes
      # nothing and finishes in under a minute. It had neither a Python setup
      # nor an install from 2026-09-17, when the speed case became bypassable,
      # until the first bench dispatched after that died here on
      # `ModuleNotFoundError: No module named 'idhazh'`. The `models` step below
      # is dependency-free on purpose and stays that way.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      # Each value is asserted to be one bare word at the one point that writes
      # them, so an expression that substitutes one into a shell command below
      # cannot carry a space, a quote or a newline into it. The input arrives
      # through `env` for the same reason: a value pasted into this program
      # would be text before it was a value. It becomes a FILE PATH, so it is
      # resolved and proved to sit inside `config/` before anything opens it.
      - id: models
        env:
          CANDIDATE_MODELS_FILE: ${{ inputs.candidate_models_file }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_refs.py candidate \
            --prefix candidate_ \
            --also-configured \
            --models-file "$CANDIDATE_MODELS_FILE" >> "$GITHUB_OUTPUT"

      # Config decides, the dispatch may overrule, and the module holds the
      # rule so this file never spells it twice (Guardrail #6). The input
      # arrives through `env` for the same reason the models file does: a value
      # pasted into a shell command would be text before it was a value.
      - id: speed
        env:
          MODEL_SPEED_CASE: ${{ inputs.model_speed_case }}
        run: |
          set -euo pipefail
          python3 backend/utilities/model_speed_case.py \
            --dispatch "$MODEL_SPEED_CASE" | tee /dev/stderr >> "$GITHUB_OUTPUT"

  # The bench, case one: raw prefill and decode throughput with nothing else in
  # the process. This is the case that says whether the weights can move tokens
  # at all, and it is the cheap one - it runs first so a model that cannot clear
  # the bar never costs the server case a runner hour.
  #
  # It also holds the cache both cases read. The entry is keyed on the candidate
  # digest rather than its filename, because two builds of one model share a
  # name and a key that cannot tell them apart serves the wrong weights under
  # the right alias.
  #
  # The key is written and read as `needs['llama-bench']`, never
  # `needs.llama-bench`: a hyphen inside an expression is subtraction, so the
  # index form is the only one that resolves.
  llama-bench:
    name: Model speed - prefill and decode with llama-bench
    if: >-
      ${{ inputs.target == 'bench'
      && needs.models.outputs.model_speed_case == 'run' }}
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - name: Record runner hardware
        run: |
          set -euo pipefail
          mkdir -p backend/var
          {
            echo "measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "nproc=$(nproc)"
            echo "nproc_all=$(nproc --all)"
            echo "getconf_online=$(getconf _NPROCESSORS_ONLN)"
            echo "getconf_configured=$(getconf _NPROCESSORS_CONF)"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            if [ -r /sys/fs/cgroup/cpu.max ]; then
              echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max)"
            fi
            if [ -r /sys/fs/cgroup/cpuset.cpus.effective ]; then
              echo "cgroup_cpuset=$(cat /sys/fs/cgroup/cpuset.cpus.effective)"
            fi
            grep '^Cpus_allowed_list:' /proc/self/status
            cat /proc/self/cgroup
            free -g | sed -n '1,2p'
            lscpu
            echo "cpu_core_map:"
            lscpu -p=CPU,CORE,SOCKET,NODE
            echo "thread_siblings:"
            for topology in /sys/devices/system/cpu/cpu*/topology/thread_siblings_list; do
              printf '%s=%s\n' \
                "$(basename "$(dirname "$(dirname "$topology")")")" \
                "$(cat "$topology")"
            done
            df -h / /mnt 2>/dev/null | sed -n '1,4p'
          } | tee backend/var/hardware.txt

      # Keyed on the candidate bytes, and shared with the server case below. One
      # model per entry, so the cache never holds two multi-gigabyte sets of
      # weights at once (Guardrail #2).
      - name: Cache the candidate weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: bench-${{ needs.models.outputs.candidate_cache_key }}-${{ env.LLAMA_CPP_BUILD }}

      # The measurement runtime is immutable even while production still
      # follows the latest compatible release. A candidate and an incumbent
      # measured on different builds are not a controlled comparison.
      - name: Install pinned llama.cpp
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          echo "llama.cpp from $URL"
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          # The whole directory, not one binary. These builds are dynamically
          # linked, so copying llama-bench alone leaves its shared objects
          # behind and the binary dies at exec with a 127 that names a library
          # rather than the mistake. `cp -a`, not `find -type f`: the builds
          # ship versioned shared objects as symlinks and `-type f` skips one.
          SRC=$(dirname "$(find llama -type f -name 'llama-bench' | head -1)")
          cp -a "$SRC"/. backend/bin/

      # llama-bench never runs a draft head, so this case does not measure one.
      # It fetches it anyway, because it fills the cache the server case reads:
      # an entry saved here without the draft is a hit there with a file
      # missing, and the server exits at load rather than at fetch. The bytes
      # are tens of megabytes against multi-gigabyte weights.
      - name: Fetch the draft head
        if: >-
          steps.weights.outputs.cache-hit != 'true'
          && needs.models.outputs.candidate_draft_file != ''
        env:
          DRAFT_REPO: ${{ needs.models.outputs.candidate_draft_repo }}
          DRAFT_REVISION: ${{ needs.models.outputs.candidate_draft_revision }}
          DRAFT_FILE: ${{ needs.models.outputs.candidate_draft_file }}
          DRAFT_SHA256: ${{ needs.models.outputs.candidate_draft_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p backend/models
          curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${DRAFT_FILE}" \
            "https://huggingface.co/${DRAFT_REPO}/resolve/${DRAFT_REVISION}/${DRAFT_FILE}?download=true"

      # No `if:`, for the usual reason: a restored entry is the one case where
      # nobody watched the bytes arrive. It matters more here than anywhere,
      # because this case never runs the draft head - the only thing standing
      # between a corrupt cached copy and the server case is this line.
      - name: Verify the draft head
        env:
          DRAFT_FILE: ${{ needs.models.outputs.candidate_draft_file }}
        run: |
          set -euo pipefail
          if [ -n "${DRAFT_FILE}" ]; then
            echo "${{ needs.models.outputs.candidate_draft_sha256 }}  backend/models/${DRAFT_FILE}" \
              | sha256sum --check
          fi

      # No `if:`. A restored entry is the one case where nobody watched the
      # bytes arrive, so this runs on a cache hit too and the hardware record
      # names the binary either way (Guardrail #10).
      - name: Record the runtime identity
        run: |
          set -euo pipefail
          chmod +x backend/bin/llama-* || true
          echo "LLAMA_BIN=backend/bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=backend/bin" >> "$GITHUB_ENV"
          {
            echo "llama_cpp_build=${LLAMA_CPP_BUILD}"
            echo "llama_cpp_archive_sha256=${LLAMA_CPP_SHA256}"
            echo "weights_cache_hit=${WEIGHTS_CACHE_HIT}"
            sha256sum backend/bin/llama-bench
          } | tee -a backend/var/hardware.txt
        env:
          WEIGHTS_CACHE_HIT: ${{ steps.weights.outputs.cache-hit == 'true' }}

      # The bench refuses any bytes but the declared ones, so every number it
      # writes is about a model somebody can fetch again (Guardrail #10). It
      # also writes the raw half of the dossier body the server case finishes.
      - name: Benchmark the candidate
        env:
          CANDIDATE_REF: ${{ needs.models.outputs.candidate_ref }}
          CANDIDATE_SHA256: ${{ needs.models.outputs.candidate_sha256 }}
          CANDIDATE_ID: ${{ needs.models.outputs.candidate_id }}
          CANDIDATE_QUANTISATION: ${{ needs.models.outputs.candidate_quantisation }}
          THREAD_COUNTS: ${{ inputs.threads }}
        run: |
          set -euo pipefail
          max_threads=$(( $(nproc) * 2 ))
          IFS=',' read -ra THREADS <<< "$THREAD_COUNTS"
          for threads in "${THREADS[@]}"; do
            if [[ ! "$threads" =~ ^[1-9][0-9]*$ ]]; then
              echo "threads must be comma-separated positive integers" >&2
              exit 2
            fi
            if [ "$threads" -gt "$max_threads" ]; then
              echo "thread count ${threads} exceeds 2 x nproc (${max_threads})" >&2
              exit 2
            fi
          done
          python3 backend/utilities/measure_llm.py bench \
            --models "$CANDIDATE_REF" \
            --expect-sha256 "$CANDIDATE_SHA256" \
            --candidate-id "$CANDIDATE_ID" \
            --quantisation "$CANDIDATE_QUANTISATION" \
            --threads "$THREAD_COUNTS" \
            --binary "$LLAMA_BIN/llama-bench" \
            --readings backend/var/bench/raw-case.json

      # The rates, on the run page. They used to reach a reader only through a
      # 90-day artifact, so reading them meant downloading a file - and the
      # dossier that pastes them is written by the other job, hours later.
      #
      # `if: always()` and a module that exits 0 on a missing file: a run that
      # produced no readings says so here rather than turning a failed
      # measurement into a second failure (section 1a, degrade rather than
      # fail). The identity comes from the same job outputs the bench step
      # reads, so the table names the bytes its rates are about (Guardrail #10).
      - name: Put the speed readings in the run summary
        if: always()
        env:
          CANDIDATE_ID: ${{ needs.models.outputs.candidate_id }}
          CANDIDATE_QUANTISATION: ${{ needs.models.outputs.candidate_quantisation }}
        run: |
          set -euo pipefail
          python3 backend/utilities/summarise_bench.py backend/var/llm.json \
            --markdown \
            --candidate-id "$CANDIDATE_ID" \
            --quantisation "$CANDIDATE_QUANTISATION" \
            >> "$GITHUB_STEP_SUMMARY"

      # Ninety days, not seven. A dossier is pasted from these numbers weeks
      # after the dispatch that read them, and an artifact that expired is a
      # re-run of a five-hour job. The whole tree is a few hundred kilobytes of
      # JSON and text against the 500 MB ceiling (Guardrail #2).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-raw
          path: backend/var/
          retention-days: 90

  corpus:
    name: How long real articles are
    if: ${{ inputs.target == 'corpus' }}
    # The length buckets every per-article cost figure multiplies by are invented
    # until this job runs. It reaches the open web, which is why it lives here and
    # never in a test (Guardrail #7).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # The same interpreter and the same dependency file the daily jobs name,
      # so this reads the entry they already keep warm rather than filling one
      # of its own. A cache on a dispatch nobody runs for a fortnight is bytes
      # that expire unread; a shared key costs nothing and hits on run one.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Record runner hardware
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep -E 'Model name' | head -1

      - name: Install the package
        run: pip install -e "."

      - name: Measure real article lengths
        env:
          # Through `env`, not pasted into the command below.
          CORPUS_LINKS: ${{ inputs.corpus_links }}
        run: |
          set -euo pipefail
          if ! [[ "$CORPUS_LINKS" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "corpus_links is how many links to fetch: 1 to 99999" >&2
            exit 1
          fi
          python3 backend/utilities/measure_corpus.py \
            --limit "$CORPUS_LINKS" --sleep 1

      - uses: actions/upload-artifact@v7
        with:
          name: bench-corpus
          path: backend/var/corpus.json

  # The bench, case two: a real llama-server, real fetches, real summaries. Raw
  # throughput says what the weights can do; this says what a shard of the daily
  # run costs, which is the number the job budget is spent against.
  #
  # It needs the raw case rather than running beside it, for two reasons. The
  # weights cache is already warm, so this job downloads nothing. And the emit
  # step at the end needs both halves in one place to write the page body.
  runtime:
    name: A real server over a fixed corpus
    # A skipped job skips everything that needs it. An `if:` with no status
    # function carries an implicit `success()`, and a skipped need is not a
    # success - so bypassing the speed case above would silently take this job
    # with it, and a bypass that skips half the workflow is worse than no
    # bypass. `!cancelled()` lifts the implicit check; the clauses after it put
    # back exactly what it was doing. Skipped is allowed, failed is not: a
    # candidate that could not move a token has already answered the question
    # this job would spend five hours asking again.
    if: >-
      ${{ !cancelled()
      && inputs.target == 'bench'
      && needs.models.result == 'success'
      && (needs['llama-bench'].result == 'success'
      || needs['llama-bench'].result == 'skipped') }}
    needs: [models, llama-bench]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # The one job in this workflow that pushes, and it pushes exactly one thing:
    # the machine it drew, under `state/pipeline-tests/`. Every other job here
    # reads the repository and writes nothing back, which is why the permission
    # is raised on this job rather than at workflow level.
    permissions:
      contents: write
    env:
      CANDIDATE_REPO: ${{ needs.models.outputs.candidate_repo }}
      CANDIDATE_REVISION: ${{ needs.models.outputs.candidate_revision }}
      CANDIDATE_FILE: ${{ needs.models.outputs.candidate_file }}
      CANDIDATE_SHA256: ${{ needs.models.outputs.candidate_sha256 }}
      CANDIDATE_ID: ${{ needs.models.outputs.candidate_id }}
      CANDIDATE_QUANTISATION: ${{ needs.models.outputs.candidate_quantisation }}
      DRAFT_REPO: ${{ needs.models.outputs.candidate_draft_repo }}
      DRAFT_REVISION: ${{ needs.models.outputs.candidate_draft_revision }}
      DRAFT_FILE: ${{ needs.models.outputs.candidate_draft_file }}
      DRAFT_SHA256: ${{ needs.models.outputs.candidate_draft_sha256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Record runner hardware
        run: |
          set -euo pipefail
          mkdir -p backend/var/runtime-sweep
          {
            echo "measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_OS:-unknown}"
            echo "nproc=$(nproc)"
            echo "nproc_all=$(nproc --all)"
            echo "getconf_online=$(getconf _NPROCESSORS_ONLN)"
            if [ -r /sys/fs/cgroup/cpu.max ]; then
              echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max)"
            fi
            grep '^Cpus_allowed_list:' /proc/self/status
            free -g | sed -n '1,2p'
            lscpu
            echo "cpu_core_map:"
            lscpu -p=CPU,CORE,SOCKET,NODE
          } | tee backend/var/runtime-sweep/hardware.txt

      - name: Install
        run: pip install -e .

      # The same key the raw case wrote, so this job restores what that job
      # already paid for. A miss here is a second download of the same bytes,
      # and download seconds are wall-clock seconds exactly like compute is.
      - name: Restore the candidate weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: bench-${{ needs.models.outputs.candidate_cache_key }}-${{ env.LLAMA_CPP_BUILD }}

      - name: Fetch runtime and weights
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${CANDIDATE_FILE}" \
            "https://huggingface.co/${CANDIDATE_REPO}/resolve/${CANDIDATE_REVISION}/${CANDIDATE_FILE}?download=true"
          if [ -n "${DRAFT_FILE}" ]; then
            curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${DRAFT_FILE}" \
              "https://huggingface.co/${DRAFT_REPO}/resolve/${DRAFT_REVISION}/${DRAFT_FILE}?download=true"
          fi

      # A throughput number is about a model only if it names the bytes that
      # produced it (Guardrail #10). No `if:`, because a restored cache entry is
      # the one case where nobody watched the bytes arrive. The draft head is
      # checked on the same terms: the server loads it, so it is part of what
      # the number is about.
      - name: Verify the weights
        run: |
          set -euo pipefail
          chmod +x backend/bin/llama-server
          echo "${{ needs.models.outputs.candidate_sha256 }}  backend/models/${CANDIDATE_FILE}" \
            | sha256sum --check
          if [ -n "${DRAFT_FILE}" ]; then
            echo "${DRAFT_SHA256}  backend/models/${DRAFT_FILE}" | sha256sum --check
          fi
          OBSERVED=$(stat -c %s "backend/models/${CANDIDATE_FILE}")
          # The entry's own declared size, cross-checking the DOCUMENT rather
          # than the file - sha256 above already settles the bytes. Empty means
          # the entry declares none, which is an entry nobody has fetched yet.
          DECLARED="${{ needs.models.outputs.candidate_byte_count }}"
          if [ -n "$DECLARED" ] && [ "$OBSERVED" != "$DECLARED" ]; then
            echo "candidate is ${OBSERVED} bytes; its entry declares ${DECLARED}" >&2
            exit 1
          fi

      - name: Record input identity
        env:
          GGUF_CACHE_HIT: ${{ steps.weights.outputs.cache-hit == 'true' }}
        run: |
          {
            echo "gguf_cache_hit=${GGUF_CACHE_HIT}"
            echo "llama_cpp_build=${LLAMA_CPP_BUILD}"
            echo "llama_cpp_archive_sha256=${LLAMA_CPP_SHA256}"
            sha256sum backend/bin/llama-server
            echo "model_repo=${CANDIDATE_REPO}"
            echo "model_revision=${CANDIDATE_REVISION}"
            stat -c 'model_bytes=%s' "backend/models/${CANDIDATE_FILE}"
            sha256sum "backend/models/${CANDIDATE_FILE}"
            if [ -n "${DRAFT_FILE}" ]; then
              echo "draft_repo=${DRAFT_REPO}"
              echo "draft_revision=${DRAFT_REVISION}"
              stat -c 'draft_bytes=%s' "backend/models/${DRAFT_FILE}"
              sha256sum "backend/models/${DRAFT_FILE}"
            fi
          } | tee backend/var/runtime-sweep/cache-state.txt

      # Why the copy differs in one line and nothing else is written down once,
      # in the action. The second input is the exception and it is not a control
      # on the measurement: a bench is a run that exercises production's code
      # path and must not be readable as a production day, so `cli` moves this
      # run's whole state root onto `state/pipeline-tests/`.
      - name: Build the candidate config
        uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ needs.models.outputs.candidate_models_file }}
          trial_state: pipeline-tests

      # `--execution` is the GitHub run id for the reason digest.yml gives: two
      # dispatches on one day would otherwise compute the same run id, and the
      # machine record is keyed on it - so the second dispatch's host would read
      # as a repeat of the first and be settled away. Nothing else here reads a
      # run id.
      #
      # How big the corpus is comes from `bench.corpus_items` and is read once,
      # here, by the module that also freezes the plan. It was a `--cap` literal
      # in this file and a constant in that module until 2026-09-17, and when
      # the two disagreed the dispatch died at the freeze step with the plan
      # already paid for (Guardrail #6).
      #
      # `--config backend/var/candidate-config` is what keeps `plan` out of the
      # production ledgers. `plan` appends to the seen store, feed health, feed
      # retirements and the counterfactual scores, and without this flag it
      # loads the committed config - which names no trial directory, so a bench
      # marked real URLs seen and the next production day skipped those stories.
      - name: Build the fixed bench corpus
        env:
          RUNTIME_CORPUS_ITEMS: ${{ inputs.runtime_corpus_items }}
          RUNTIME_CORPUS_OFFSET: ${{ inputs.runtime_corpus_offset }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          export RUNTIME_DATE="$DATE"
          echo "RUNTIME_DATE=$DATE" >> "$GITHUB_ENV"
          CORPUS_ITEMS=$(python3 backend/utilities/runtime_sweep.py corpus-items \
            --config backend/var/candidate-config \
            --dispatch "$RUNTIME_CORPUS_ITEMS")
          echo "CORPUS_ITEMS=$CORPUS_ITEMS" >> "$GITHUB_ENV"
          CORPUS_CAP=$(python3 backend/utilities/runtime_sweep.py corpus-cap \
            --config backend/var/candidate-config \
            --offset "$RUNTIME_CORPUS_OFFSET")
          python -m idhazh plan \
            --config backend/var/candidate-config \
            --date "$DATE" \
            --cap "$CORPUS_CAP" \
            --execution "${{ github.run_id }}"
          python3 backend/utilities/runtime_sweep.py freeze-corpus \
            --config backend/var/candidate-config \
            --offset "$RUNTIME_CORPUS_OFFSET" \
            --date "$DATE"

      # A bench reading is about a machine, and until now the bench recorded
      # which processor it drew in one line of a JSON summary that expires with
      # the artifact. This is the same probe the digest jobs run, filed the same
      # way, and it is the only row this workflow commits.
      #
      # It goes through the candidate config, which is what puts the row under
      # `state/pipeline-tests/` rather than beside the production rows. A bench
      # is dispatched many times a day against unmerged branches; mixing those
      # rows into the ledger the console reads would mean every panel filtering
      # by job for ever.
      #
      # After the corpus step because the probe reads the plan that step wrote,
      # and before the sweep because the bandwidth reading wants a gigabyte and
      # an idle machine - the same order the `work` job uses around its server.
      - name: What machine this bench drew
        run: |
          set -euo pipefail
          python -m idhazh fingerprint \
            --config backend/var/candidate-config \
            --date "$RUNTIME_DATE" \
            --shard 0 \
            --job runtime

      # The probe writes a segment rather than the day file, so this is what
      # turns it into the row the step below commits. It runs here, straight
      # after the probe and not beside the commit: the sweep can fail, the commit
      # step is `if: always()` and this one is not, so a compaction further down
      # would be skipped on exactly the dispatch whose machine record is worth
      # having.
      #
      # `--config` is what points it at `state/pipeline-tests/`. The same flag
      # moved the probe's whole state root there, so the segment it drains is the
      # one the probe wrote and no production head is opened.
      #
      # Two dispatches of this workflow can run at once - it is the one state
      # writer with no concurrency group at all - so the segment is what keeps
      # them off one path. The heads they fold into are still two rewrites of one
      # file: the run-id key keeps the two rows distinct, and with no union
      # driver left a lost race conflicts at the rebase rather than stacking both
      # copies.
      - name: Fold the machine record into its day
        run: python -m idhazh compact --config backend/var/candidate-config

      - name: Measure runtime candidate
        env:
          RUNTIME_CANDIDATE: ${{ inputs.runtime_candidate }}
          RUNTIME_REPEATS: ${{ inputs.runtime_repeats }}
          RUNTIME_THREADS: ${{ inputs.runtime_threads }}
          RUNTIME_THREADS_BATCH: ${{ inputs.runtime_threads_batch }}
          # Whether the weights were already on the machine decides what the
          # first server start of this job measures, so the summary records it
          # rather than asserting it.
          GGUF_CACHE_HIT: ${{ steps.weights.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          python3 backend/utilities/runtime_sweep.py sweep \
            --date "$RUNTIME_DATE" \
            --candidate "$RUNTIME_CANDIDATE" \
            --candidate-file "$CANDIDATE_FILE" \
            --candidate-id "$CANDIDATE_ID" \
            --repeats "$RUNTIME_REPEATS" \
            --threads "$RUNTIME_THREADS" \
            --threads-batch "$RUNTIME_THREADS_BATCH" \
            --gguf-cache-hit "$GGUF_CACHE_HIT"

      # Only when there is one to read. A bypassed speed case writes no
      # `bench-raw` artifact at all, and a download that named a missing
      # artifact would fail this job at the end of a five-hour run.
      - if: needs['llama-bench'].result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: bench-raw
          path: backend/var/raw-case/

      # The whole point of the job. Two artifacts of numbers are a
      # transcription job; a page body with the numbers already in it is a
      # paste. This step never writes the committed config and never touches
      # `docs/` - a person reads the emitted page and decides.
      #
      # A dossier is both cases, so it is written only when both ran.
      - name: Emit the dossier body
        if: needs['llama-bench'].result == 'success'
        run: |
          set -euo pipefail
          python3 backend/utilities/measure_llm.py emit \
            --raw backend/var/raw-case/bench/raw-case.json \
            --server backend/var/runtime-sweep/runtime-summary.json \
            --corpus "${CORPUS_ITEMS} articles" \
            --dossier backend/var/runtime-sweep/dossier.md \
            --readings backend/var/runtime-sweep/readings.json
          cat backend/var/runtime-sweep/dossier.md >> "$GITHUB_STEP_SUMMARY"

      # The other half of that decision. A page with one case on it would read
      # like a whole dossier, so the run says which half is missing and how to
      # get it instead (section 1a, degrade rather than fail).
      - name: Say what a bypassed speed case cost this dossier
        if: needs['llama-bench'].result == 'skipped'
        run: |
          set -euo pipefail
          {
            echo '## No model speed dossier for this dispatch'
            echo
            echo 'The llama-bench speed case did not run, so this dispatch has the'
            echo 'server half of the reading and not the raw half. The fixed corpus,'
            echo 'the sweep, the machine record and the runtime artifact are all'
            echo 'here; prefill and decode rates are not.'
            echo
            echo 'To get them, dispatch again with model_speed_case set to run, or'
            echo 'set bench.run_model_speed_case back to true.'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE ONE THING THIS WORKFLOW PUSHES. Every other step here uploads an
      # artifact and the runner takes the rest with it; this commits one row -
      # the machine this dispatch drew - to `main`.
      #
      # `state/pipeline-tests/host-fingerprint` and nothing wider. The sweep's
      # own item-health, scores and traces land under the same trial root
      # because the whole state root moved, but nothing reads them back and
      # committing them would grow the repository for no reader (Guardrail #12).
      #
      # The row is keyed on the run id, the run id is `github.run_id`, and no
      # second dispatch can reproduce one - so two dispatches never write one
      # row, and this path needs no merge driver. Nothing under `state/` carries
      # a union driver any more except the published and cleanup day trees.
      #
      # `if: always()` because a bench that failed its verdict still drew a
      # machine, and that is the dispatch worth having the record of.
      # `continue-on-error` because a lost push must not turn a five-hour
      # measurement into a red run.
      - name: Commit the machine this bench drew
        if: always()
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "bench: the machine ${{ inputs.runtime_candidate }} drew"
          NOTHING_STAGED_MESSAGE: "no machine recorded"
          PUSH_FAILED_MESSAGE: "could not push the bench host record"
        run: >-
          bash .github/scripts/commit-and-push.sh
          state/pipeline-tests/host-fingerprint

      - name: Upload runtime sweep
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-server-${{ inputs.runtime_candidate }}
          path: backend/var/runtime-sweep/
          retention-days: 90

  # Three constants in this repository were sized by asking a tokenizer a
  # question, and `idhazh.measured.SIZED_BY_A_READING_HERE` says which. A model
  # swap invalidates all three at one stroke, and the only honest way to retake
  # them is to ask the running server's own tokenizer - a vocabulary ships
  # inside the weights and moves when they do.
  #
  # Its own target rather than a step on the bench, because retaking three token
  # counts is minutes and the bench is hours. Nobody should have to spend the
  # second to get the first.
  #
  # **It writes nothing a commit would carry.** It prints into the run summary
  # and uploads one artifact; a person reads the print-out and edits
  # `backend/idhazh/measured.py`. A workflow that wrote a measurement into a
  # commit would be a workflow deciding a number, which this tree reserves for
  # people (row #13's rejected option 1). Printing is not writing.
  budgets:
    name: Token budgets from the model's own tokenizer
    if: ${{ inputs.target == 'budgets' }}
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_REPO: ${{ needs.models.outputs.candidate_repo }}
      CANDIDATE_REVISION: ${{ needs.models.outputs.candidate_revision }}
      CANDIDATE_FILE: ${{ needs.models.outputs.candidate_file }}
      CANDIDATE_SHA256: ${{ needs.models.outputs.candidate_sha256 }}
      CANDIDATE_ID: ${{ needs.models.outputs.candidate_id }}
      CANDIDATE_QUANTISATION: ${{ needs.models.outputs.candidate_quantisation }}
      DRAFT_REPO: ${{ needs.models.outputs.candidate_draft_repo }}
      DRAFT_REVISION: ${{ needs.models.outputs.candidate_draft_revision }}
      DRAFT_FILE: ${{ needs.models.outputs.candidate_draft_file }}
      DRAFT_SHA256: ${{ needs.models.outputs.candidate_draft_sha256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # The same key the bench cases use, so a dispatch that follows a bench pays
      # nothing for the weights and one that does not pays once (Guardrail #2).
      - name: Restore the candidate weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: bench-${{ needs.models.outputs.candidate_cache_key }}-${{ env.LLAMA_CPP_BUILD }}

      - name: Fetch runtime and weights
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${CANDIDATE_FILE}" \
            "https://huggingface.co/${CANDIDATE_REPO}/resolve/${CANDIDATE_REVISION}/${CANDIDATE_FILE}?download=true"
          if [ -n "${DRAFT_FILE}" ]; then
            curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${DRAFT_FILE}" \
              "https://huggingface.co/${DRAFT_REPO}/resolve/${DRAFT_REVISION}/${DRAFT_FILE}?download=true"
          fi

      # A reading is about a vocabulary only if it names the bytes that carry it
      # (Guardrail #10). No `if:`, because a restored cache entry is the one case
      # where nobody watched the bytes arrive.
      - name: Verify the weights
        run: |
          set -euo pipefail
          chmod +x backend/bin/llama-server
          echo "${{ needs.models.outputs.candidate_sha256 }}  backend/models/${CANDIDATE_FILE}" \
            | sha256sum --check
          if [ -n "${DRAFT_FILE}" ]; then
            echo "${DRAFT_SHA256}  backend/models/${DRAFT_FILE}" | sha256sum --check
          fi
          OBSERVED=$(stat -c %s "backend/models/${CANDIDATE_FILE}")
          # The entry's own declared size, cross-checking the DOCUMENT rather
          # than the file - sha256 above already settles the bytes. Empty means
          # the entry declares none, which is an entry nobody has fetched yet.
          DECLARED="${{ needs.models.outputs.candidate_byte_count }}"
          if [ -n "$DECLARED" ] && [ "$OBSERVED" != "$DECLARED" ]; then
            echo "candidate is ${OBSERVED} bytes; its entry declares ${DECLARED}" >&2
            exit 1
          fi

      # The committed config still names the incumbent and a measurement does
      # not edit it. The scratch copy differs in the active model file and
      # nothing else, so the taxonomy the definition probe reads is the
      # committed one by construction.
      #
      # This job kept its own copy until 2026-09-15, and that copy still
      # TRANSPLANTED the candidate's digest, quantisation and revision onto the
      # incumbent's entry - which asserts that numbers measured for one model
      # hold for another. The shared action moves the pointer instead, so the
      # candidate's own file carries its own blocks.
      - uses: ./.github/actions/candidate-config
        with:
          models_file: ${{ needs.models.outputs.candidate_models_file }}

      - name: Start the tokenizer
        env:
          LLAMA_WEIGHTS: backend/models/${{ needs.models.outputs.candidate_file }}
        run: |
          set -euo pipefail
          mkdir -p backend/var
          # Every flag comes from the scratch config, so the server this counts
          # with is the server the run would start (Guardrail #6).
          python3 backend/utilities/llama_argv.py \
            --config-root backend/var/candidate-config > backend/var/llama-argv
          mapfile -d '' LLAMA_ARGV < backend/var/llama-argv
          echo "starting: ${LLAMA_ARGV[*]}"
          LD_LIBRARY_PATH=backend/bin nohup "${LLAMA_ARGV[@]}" > llama-server.log 2>&1 &
          echo "$!" > llama-server.pid
          # A build that refuses one of these flags is gone in under a second,
          # and the wait below would then spend 900 of them asking a closed
          # port. Two seconds separates a dead start-up from a slow one. It is
          # the same check the shared start script does, written out here
          # because this job cannot call that script - it starts its server
          # against a scratch config the script does not know about.
          sleep 2
          kill -0 "$(cat llama-server.pid)" || {
            echo "the tokenizer exited before it could answer" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          for _ in $(seq 1 180); do
            curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null && break
            sleep 5
          done
          curl -sf "http://127.0.0.1:${LLAMA_PORT}/health" > /dev/null || {
            echo "the tokenizer never became healthy" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          # Healthy says a server replied. It does not say which weights
          # replied, and every budget below is filed under this alias
          # (Guardrail #10).
          SERVED=$(curl -sf "http://127.0.0.1:${LLAMA_PORT}/v1/models" | jq -r '.data[0].id')
          if [ "$SERVED" != "${CANDIDATE_ID}" ]; then
            echo "the server answers to ${SERVED}, not ${CANDIDATE_ID}" >&2
            exit 1
          fi

      # The whole point of the job. Three artifacts of numbers are a
      # transcription job; a block with the numbers already in it is a paste.
      - name: Retake the budgets a vocabulary sizes
        env:
          BUDGET_SAMPLES: ${{ inputs.budget_samples }}
        run: |
          set -euo pipefail
          mkdir -p backend/var/budgets
          python backend/utilities/measure_budgets.py read \
            --base "http://127.0.0.1:${LLAMA_PORT}" \
            --config backend/var/candidate-config \
            --subject "${CANDIDATE_SHA256}" \
            --samples "${BUDGET_SAMPLES}" \
            --runner "github ${RUNNER_OS} $(nproc) vCPU, ${CANDIDATE_ID}" \
            --readings backend/var/budgets/readings.json \
            --page backend/var/budgets/budgets.md
          cat backend/var/budgets/budgets.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the tokenizer
        if: always()
        run: |
          set -euo pipefail
          if [ -f llama-server.pid ]; then
            kill "$(cat llama-server.pid)" 2>/dev/null || true
          fi
          cp llama-server.log backend/var/budgets/llama-server.log 2>/dev/null || true

      - name: Upload the budget readings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: budgets-${{ needs.models.outputs.candidate_id }}
          path: backend/var/budgets/
          retention-days: 90

  batched:
    name: Parallel decode with llama-batched-bench
    if: ${{ inputs.target == 'batched' }}
    needs: models
    # Does decoding more than one sequence at a time pay for itself on 4 vCPU?
    # `llama-batched-bench` answers it in one table: `S_TG t/s` is aggregate
    # decode throughput at a parallel level, so the ratio between two rows is
    # the whole result. Nothing else in this file measures that.
    #
    # One job, never a matrix. The ratio is only meaningful self-paired -
    # prefill spans 3.4x across runner hosts (docs/reference/pipeline-cost.md),
    # so two matrix members would compare hardware and call it batching. Three
    # repeats run as three processes inside this one job so a level that dies
    # still leaves the earlier repeats on disk.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODEL_REPO: ${{ needs.models.outputs.summarize_repo }}
      MODEL_REVISION: ${{ needs.models.outputs.summarize_revision }}
      MODEL_FILE: ${{ needs.models.outputs.summarize_file }}
      # Fixed here rather than dispatchable, so a later reading stays
      # comparable to the recorded one. The lengths round the medians of the
      # 293 requests behind docs/reference/pipeline-cost.md's one-slot
      # observation, 2026-08-24: prompt p50 877 - the tokens prefill evaluates
      # once the shared system prompt is cached, not the whole context - and
      # generated p50 279. Parallel level 4 is a read the bench gives away
      # free, not a build target: it oversubscribes 4 vCPU at 4 threads.
      BENCH_PROMPT_TOKENS: '900'
      BENCH_GENERATE_TOKENS: '300'
      BENCH_PARALLEL_LEVELS: '1,2,4'
      BENCH_REPEATS: '3'
      # Decode is 36.8 percent of model time (232.7 min prefill, 135.7 min
      # decode, run 32742672105, 2026-08-24). At 1.5x aggregate decode a run
      # saves 12.3 percent of wall-clock, at 2.0x it saves 18.4 percent. Below
      # this ratio the whole parallel-decode line of work is dead.
      BENCH_GATE_RATIO: '1.4'
    steps:
      - uses: actions/checkout@v6

      - name: Record runner hardware
        run: |
          set -euo pipefail
          mkdir -p backend/var/batched-bench
          {
            echo "measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_OS:-unknown}"
            echo "nproc=$(nproc)"
            echo "nproc_all=$(nproc --all)"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            if [ -r /sys/fs/cgroup/cpu.max ]; then
              echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max)"
            fi
            grep '^Cpus_allowed_list:' /proc/self/status
            free -g | sed -n '1,2p'
            lscpu
            echo "cpu_core_map:"
            lscpu -p=CPU,CORE,SOCKET,NODE
          } | tee backend/var/batched-bench/hardware.txt

      - name: Install pinned llama.cpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          # The whole directory, not one binary. `llama-batched-bench` links
          # against its own `libllama-batched-bench-impl.so` next to it.
          BIN=$(dirname "$(find llama -type f -name 'llama-batched-bench' | head -1)")
          echo "LLAMA_BIN=$BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BIN" >> "$GITHUB_ENV"
          chmod +x "$BIN"/llama-* || true
          {
            echo "llama_cpp_build=${LLAMA_CPP_BUILD}"
            echo "llama_cpp_archive_sha256=${LLAMA_CPP_SHA256}"
            sha256sum "$BIN/llama-batched-bench"
          } | tee -a backend/var/batched-bench/hardware.txt

      - name: Read the production inference settings
        # The bench has to run the shape production runs, so the four context
        # and threading knobs come from config rather than from a literal
        # copied into this file (CLAUDE.md Guardrail #6). Change config and the next
        # reading follows it.
        run: |
          set -euo pipefail
          MODELS_FILE="config/$(jq -er '.models_file' config/idhazh.json)"
          for key in n_ctx n_batch n_ubatch n_threads; do
            value=$(jq -er ".summarize.inference.${key}" "$MODELS_FILE")
            case "$value" in
              ''|*[!0-9]*)
                echo "${MODELS_FILE} summarize.inference.${key} must be a positive integer, got '${value}'" >&2
                exit 2
                ;;
            esac
            name="BENCH_$(echo "$key" | tr '[:lower:]' '[:upper:]')"
            echo "${name}=${value}" >> "$GITHUB_ENV"
            echo "${name}=${value}" | tee -a backend/var/batched-bench/hardware.txt
          done

      - name: Download the summarizer weights
        run: |
          set -euo pipefail
          mkdir -p backend/models
          curl -fsSL --retry 3 --retry-all-errors -o "backend/models/${MODEL_FILE}" \
            "https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}/${MODEL_FILE}?download=true"
          {
            echo "gguf_cache_hit=false"
            echo "model_repo=${MODEL_REPO}"
            echo "model_revision=${MODEL_REVISION}"
            stat -c 'model_bytes=%s' "backend/models/${MODEL_FILE}"
            sha256sum "backend/models/${MODEL_FILE}"
          } | tee -a backend/var/batched-bench/hardware.txt

      # The ratio this job publishes is a claim about one model. Checking the
      # digest before the bench runs is what lets the number name it (Guardrail #10).
      # `python3`, because this job installs no interpreter of its own.
      - name: Verify the weights
        run: |
          set -euo pipefail
          EXPECTED=$(python3 -c 'import json, pathlib; config = json.load(open("config/idhazh.json", encoding="utf-8")); models = json.load(open(pathlib.Path("config") / config["models_file"], encoding="utf-8")); print(models["summarize"]["sha256"] or "")')
          if [ -z "$EXPECTED" ]; then
            echo "config records no sha256 for models.summarize" >&2
            exit 1
          fi
          echo "${EXPECTED}  backend/models/${MODEL_FILE}" | sha256sum --check

      - name: Benchmark parallel decode
        run: |
          set -euo pipefail
          MAX_LEVEL=$(echo "$BENCH_PARALLEL_LEVELS" | tr ',' '\n' | sort -n | tail -1)
          NEEDED=$(( MAX_LEVEL * (BENCH_PROMPT_TOKENS + BENCH_GENERATE_TOKENS) ))
          # llama-batched-bench silently skips any level whose context does not
          # fit, so an undersized context returns a shorter table rather than an
          # error. Refuse before spending an hour on a table with a hole in it.
          if [ "$NEEDED" -gt "$BENCH_N_CTX" ]; then
            echo "parallel level ${MAX_LEVEL} needs ${NEEDED} context tokens, config gives ${BENCH_N_CTX}" >&2
            exit 2
          fi
          for repeat in $(seq 1 "$BENCH_REPEATS"); do
            echo "repeat ${repeat} of ${BENCH_REPEATS}"
            "$LLAMA_BIN/llama-batched-bench" \
              -m "backend/models/${MODEL_FILE}" \
              -c "$BENCH_N_CTX" -b "$BENCH_N_BATCH" -ub "$BENCH_N_UBATCH" \
              -t "$BENCH_N_THREADS" \
              -npp "$BENCH_PROMPT_TOKENS" \
              -ntg "$BENCH_GENERATE_TOKENS" \
              -npl "$BENCH_PARALLEL_LEVELS" \
              2>&1 | tee "backend/var/batched-bench/repeat-${repeat}.txt"
          done

      - name: Report the parallel decode ratio
        # A verdict of "dead" is a successful measurement, so this step reports
        # it and exits zero. It fails only when the instrument did.
        run: |
          set -euo pipefail
          python3 backend/utilities/batched_report.py \
            --levels "$BENCH_PARALLEL_LEVELS" \
            --repeats "$BENCH_REPEATS" \
            --gate-ratio "$BENCH_GATE_RATIO" \
            --llama-build "$LLAMA_CPP_BUILD" \
            --model-file "$MODEL_FILE" \
            --prompt-tokens "$BENCH_PROMPT_TOKENS" \
            --generate-tokens "$BENCH_GENERATE_TOKENS" \
            --n-ctx "$BENCH_N_CTX" \
            --n-batch "$BENCH_N_BATCH" \
            --n-ubatch "$BENCH_N_UBATCH" \
            --n-threads "$BENCH_N_THREADS"

      - name: Upload batched bench
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-batched
          path: backend/var/batched-bench/
          retention-days: 7
