name: Content refresh

# The run, five times a day. An orchestrator that never does the work,
# disposable workers that do, and an assemble step that publishes whatever
# finished.
#
# The shape mirrors the runner's own economics (Guardrail #2): weights are
# restored once per JOB rather than once per run, so a worker handles a shard of
# several items to amortize the restore rather than one item per machine.

on:
  schedule:
    # Five UTC runs, four hours apart. A story that broke at 07:00 waited a full
    # day under a daily schedule, and the digest is only worth opening if it is
    # current.
    #
    # The 02:20 slot exists so a finished digest is waiting before 06:30. A
    # scheduled run here starts 40-70 min after its cron minute and then takes
    # 164-184 min (ubuntu-latest, 2026-08-23/24, n=3), so the old 06:20 first
    # slot did not publish until about 10:30.
    #
    # :20, not :00. GitHub queues scheduled jobs by load and the top of the hour
    # is the busiest minute on the platform; twenty past costs a reader nothing
    # and buys a run that starts closer to when it was asked for.
    #
    # Five lines rather than one `20 2,6,10,14,18 * * *`. The schedule is
    # identical and `github.event.schedule` is not: with one line it returns the
    # whole expression and a run cannot tell which of the five slots fired, so
    # nothing could say how late it was. GitHub drops scheduled slots under load
    # and 8 of 13 went missing between 2026-08-27 and 2026-08-29 without one
    # failure to show for it (docs/reference/github-actions.md). Five lines are
    # what let the run report that itself.
    - cron: '20 2 * * *'
    - cron: '20 6 * * *'
    - cron: '20 10 * * *'
    - cron: '20 14 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Digest date (YYYY-MM-DD). Defaults to today, UTC.'
        default: ''
      shards:
        description: 'Total work-shard jobs'
        type: choice
        default: '4'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
      faithfulness:
        description: 'Run the faithfulness scorer (slow first run - downloads weights)'
        type: boolean
        default: true

permissions:
  contents: write

# No concurrency group, and the absence is the decision. Two runs of this
# workflow are meant to overlap.
#
# Every committed path a job here writes carries that run's own identity in the
# filename, so two runs at once name two files rather than one and the rebase
# applies both whole. A group on top of that bought no safety. It bought a
# queue, and the queue cost two things. GitHub keeps ONE pending run per group
# and cancels the older without an error anywhere, so a dispatch fired during a
# run disappeared. And a run that did wait then read a store its own wait had
# made stale: run 35660521768 waited 46 minutes and folded a 46-minute-old
# store, then lost the whole day at the push.
#
# Re-adding a group brings both back. What settles two writers here is the
# filename and the read that settles it, not a queue.

# No model ref lives here. `config/idhazh.json` is the only place one is written
# and the model block reads it where it is used, so every job below reads one
# answer. A copy here was a second answer: the alias already came from config
# while the weights came from this block, so one edit could serve 8B bytes under
# a 9B alias and file every eval row under a model that never ran (Guardrail #10).
#
# No llama.cpp pin either. It is `config/llama-cpp-pin.json`, which the install
# reads and the `plan` job publishes, so the build this run installs, the build
# its cache key names and the build its run manifest records are one answer and
# cannot drift apart.
env:
  # The one place this workflow says which port. `server_argv` binds it, every
  # probe below reads it, and `idhazh.llm.server` reads it for the address the
  # stage posts to - so the three cannot disagree (Guardrail #6).
  LLAMA_PORT: '8080'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.decide.outputs.date }}
      day_dir: ${{ steps.decide.outputs.day_dir }}
      shards: ${{ steps.fanout.outputs.shards }}
      matrix: ${{ steps.fanout.outputs.matrix }}
      shard_timeout_minutes: ${{ steps.bounds.outputs.shard_timeout_minutes }}
      push_deadline_seconds: ${{ steps.bounds.outputs.push_deadline_seconds }}
      faithfulness: ${{ steps.decide.outputs.faithfulness }}
      llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
    steps:
      # First, before the checkout, for the reason written above the shard's own
      # stamp: the number then covers the checkout and the install as well as the
      # feed reads. That is the whole question - the case for splitting this job
      # rests on a figure nothing in this repository can check, and this is the
      # instrument. The job-clock step below subtracts this stamp and files the
      # difference onto the host row this job already opens.
      - name: Stamp the plan clock
        run: |
          set -euo pipefail
          echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - id: decide
        env:
          # Through `env`, not pasted into the program below. A value read by
          # name is a value, whatever it contains.
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DATE="${DISPATCH_DATE:-}"
          [ -n "$DATE" ] || DATE=$(date -u +%F)
          # The shape check runs AFTER the default, so one pattern covers both
          # paths and the scheduled one is the case it is proved against:
          # `date -u +%F` writes 2026-08-27 and the pattern accepts it. The
          # month and the day are bounded as well as counted, because
          # 2026-13-45 is as publishable as 2026-08-27 and nothing downstream
          # reads either one as a calendar date.
          #
          # This is a correctness check, not a permission check. Dispatching
          # this workflow already needs write access, so the person typing the
          # date could commit to `main` by hand. What they cannot see is the
          # cost of a typo: `2026-8-27`, or a trailing space, publishes a day
          # directory at an address no reader and no archive page will ever
          # look at, silently, after a run of about three hours.
          if ! [[ "$DATE" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "date must be YYYY-MM-DD, and it becomes the day's address" >&2
            exit 1
          fi
          # A scheduled run has no inputs at all, so every one of these is the
          # empty string and every one needs its default here. `faithfulness`
          # is normalized to a STRING for the same reason: read as a boolean,
          # the empty string compares equal to `false` and silently turned the
          # scorer off on every scheduled run - which is every automatic run.
          FAITH="${{ inputs.faithfulness }}"
          [ -n "$FAITH" ] || FAITH=true
          # Where the day's payload lives. Derived once, here, because the date
          # becomes a fact for the whole run here - and the assemble job needs
          # to name `digest.json` and `run.json` one file at a time.
          echo "day_dir=frontend/public/digest/${DATE//-//}" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "faithfulness=$FAITH" >> "$GITHUB_OUTPUT"

      # The build every worker is about to install, asked once of the file that
      # decides it. It travels as a job OUTPUT because `needs` resolves before a
      # worker's first step and `steps` does not, and the weights cache key has
      # to name the build it holds.
      #
      # Reading it from its one home is what stops this workflow carrying a
      # second copy. Three things have to agree about which binary decoded the
      # day - the install, the cache key, and the `runtime_build` the run
      # manifest stamps - and they now agree by construction rather than by
      # three edits landing together (Guardrail #10).
      #
      # The model's own refs no longer travel this way. They used to be read
      # here and relayed through seven job outputs to the step that downloaded
      # them; the download reads the file itself now, so there is nothing to
      # relay and nothing that can disagree with it.
      - id: runtime
        name: Say which llama.cpp build this run installs
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py print-pinned-build \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # How long a worker may take, and how long any job here may keep trying to
      # push what it committed. Both read from the one file that says so, and
      # both travel as job OUTPUTS for the same reason the model refs do: a
      # job's `timeout-minutes` resolves from `needs` before that job's first
      # step, and `steps` is not readable there.
      #
      # Each is asserted to be a bare positive whole number here, at the one
      # point that writes it. `timeout-minutes` takes whatever it is handed, so a
      # value Actions cannot read as a number leaves the worker with no bound at
      # all and the run finds out six hours later.
      #
      # One reader and one refusal for both, because a second utility would be a
      # second answer to what a bound is. The key is a dotted path, so a knob in
      # another block is read without a second program.
      - id: bounds
        run: |
          set -euo pipefail
          python3 backend/utilities/shard_bound.py >> "$GITHUB_OUTPUT"
          python3 backend/utilities/shard_bound.py \
            --key run.push_deadline_seconds >> "$GITHUB_OUTPUT"

      # GitHub queues a scheduled workflow by load and silently drops the slots
      # it cannot place. Measured 2026-08-27 to 2026-08-29: 13 slots elapsed, 5
      # produced a run, and every run that started succeeded. So a thin day is a
      # run that never happened rather than a run that failed, and nothing in
      # this repository said so - the run list showed five green runs and no
      # trace of the eight that were never created.
      #
      # This step cannot make the platform reliable. It makes the loss visible
      # in the one place a person already looks, and it is why the cron is five
      # one-slot lines: `github.event.schedule` names the line that fired, so
      # the run can say which slot it is and how late.
      - name: Say which slot this is and how late it started
        if: github.event_name == 'schedule'
        env:
          # Through `env`, not pasted into the script. A value read by name is a
          # value, whatever it contains.
          SLOT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          SLOT_MINUTE=$(printf '%s' "$SLOT" | cut -d' ' -f1)
          SLOT_HOUR=$(printf '%s' "$SLOT" | cut -d' ' -f2)
          # A leading zero is octal to the shell, so every field is forced to
          # base ten. `date -u +%H` writes 08 at eight in the morning.
          ASKED=$(( 10#$SLOT_HOUR * 60 + 10#$SLOT_MINUTE ))
          NOW=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          LATE=$(( NOW - ASKED ))
          # A slot placed after midnight is late by yesterday's clock, not early
          # by today's. That case is the one worth catching: it is how the 18:20
          # slot of 2026-08-28 became a run on 2026-08-29 and published to the
          # wrong day.
          [ "$LATE" -ge 0 ] || LATE=$(( LATE + 1440 ))
          echo "slot ${SLOT_HOUR}:${SLOT_MINUTE} UTC, started ${LATE} minutes late"
          # 120 minutes is DERIVED, not measured: a scheduled run here normally
          # starts 40-70 minutes after its cron minute, so this is roughly twice
          # the recorded normal. It is a reporting threshold and nothing reads it
          # to make a decision.
          if [ "$LATE" -ge 120 ]; then
            echo "::warning title=Late run::Slot ${SLOT_HOUR}:${SLOT_MINUTE} UTC started ${LATE} minutes late. GitHub queues scheduled runs by load and drops slots it cannot place - see docs/reference/github-actions.md."
          fi

      # The fold below derives a committed file from other committed files, and
      # `actions/checkout` hands it the commit this run was TRIGGERED at. The
      # `digest` concurrency group holds a queued run until the run ahead of it
      # finishes, so those two moments are an unbounded distance apart: run
      # 35660521768 was created at 22:02 and started here at 22:48, five commits
      # and one whole digest behind. It folded segments the run ahead had
      # already folded and deleted, wrote five day heads that run had already
      # written, and the rebase then held two derived versions of one file with
      # no way to choose. The day was lost at the push.
      #
      # Ahead of everything else in this job that writes under `state/` - which
      # is everything after it.
      - name: Take the run state from the tip, not from the trigger commit
        run: python3 backend/utilities/take_state_from_the_tip.py state

      # No weights load here. The plan job is feed reads and arithmetic, and it
      # finishes in seconds - which is what makes fanning out afterwards cheap.
      #
      # `--execution` is what every ledger row of this run is filed under. It has
      # to be a number no second execution can compute, and the count of runs in
      # the committed manifest was not one: `actions/checkout` pins this job to
      # the commit the run was triggered at, so a run that starts while another
      # is still working reads a manifest that has never heard of it. On
      # 2026-08-29 runs 33270983446 and 33274853468 both derived `2026-08-29-3`.
      # `github.run_id` is allocated by GitHub, is unique across every run of
      # every workflow here, and is written once - into plan.json, which every
      # shard downloads - so all of a run's shards file under one id.
      - name: Plan the day
        run: >-
          python -m idhazh plan
          --date "${{ steps.decide.outputs.date }}"
          --execution "${{ github.run_id }}"

      # Every job draws its own runner, so every job records the one it drew. A
      # run is only as fast as its slowest job, and until now only `work` said
      # what machine it was on - so the two jobs either side of it cost time
      # nobody could attribute to a processor.
      #
      # After the plan and not before it: the probe files its row under the
      # run's own id, and the plan is where that id is written. Before the
      # fan-out, because nothing heavy has started - the feed reads are done and
      # the bandwidth probe wants a gigabyte and an idle machine, which is the
      # same reason it sits ahead of the model server in `work`.
      - name: What machine this job drew
        run: |
          set -euo pipefail
          python -m idhazh fingerprint \
            --date "${{ steps.decide.outputs.date }}" \
            --shard 0 \
            --job plan

      # The day decides the fan-out, so this runs after the plan rather than
      # beside the date. `run.shard_size` is what one worker is sized to carry,
      # so a small day spends fewer jobs and restores the weights fewer times
      # (Guardrail #2). The derivation is bounded by `run.max_parallel`, which is
      # four, so a scheduled run still never asks for more workers than the four
      # it has always had - the eight in the dispatch form above is the ceiling
      # an operator may ask for, and moving the automatic path onto it needs the
      # three conditions in docs/reference/pipeline-cost.md, not this step. A
      # dispatch input still wins, which is why the guard stays a hard failure
      # there. What this step writes is also what caps the workers that run at
      # once, so the fan-out and its concurrency cap cannot disagree.
      - id: fanout
        run: |
          set -euo pipefail
          SHARD_PATTERN='^[1-8]$'
          SHARDS="${{ inputs.shards }}"
          if [ -z "$SHARDS" ]; then
            SHARDS=$(python -m idhazh shards --date "${{ steps.decide.outputs.date }}")
            # The derivation is bounded by run.max_parallel, which this pattern
            # does not read. Walk a derived count down into what the pattern
            # accepts instead of exiting: the feeds have already been read by
            # now, and a config the pattern disagrees with must cost the tail of
            # the fan-out rather than the whole day.
            while [ "$SHARDS" -gt 1 ] && ! [[ "$SHARDS" =~ $SHARD_PATTERN ]]; do
              SHARDS=$((SHARDS - 1))
            done
          fi
          if ! [[ "$SHARDS" =~ $SHARD_PATTERN ]]; then
            echo "shards must be an integer from 1 through 8" >&2
            exit 1
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      # The other end of `What machine this job drew`, exactly as in `work`: the
      # probe opens the row before anything heavy, and what the job cost is only
      # knowable near its end, so this writes a second row of the same key and
      # the fold in assemble unites them.
      #
      # Before the commit step and not after the artifact upload, because the
      # commit below is what carries this row off the runner - a segment written
      # after it goes in the bin with the machine. So the number stops short of
      # the commit and the upload, which is the same bound the shard's clock has.
      #
      # No `--server-log` and no `--counters-file`: this job stands no model
      # server up, so the three cells they fill stay empty. An empty cell says
      # the reading was not taken, where a zero would claim a job that read no
      # tokens.
      - name: What this job cost
        run: |
          set -euo pipefail
          python -m idhazh job-clock \
            --date "${{ steps.decide.outputs.date }}" \
            --job plan \
            --shard 0 \
            --job-started-at "${JOB_STARTED_AT:-}"

      # The plan job writes the sight and health ledgers, so the plan job commits
      # them - not assemble. A run that dies in the worker still saw what it saw,
      # and the next run needs that: first sight is the only age an undated
      # article has, and a feed we never recorded is a feed we cannot quarantine.
      # A bad day is exactly the day worth measuring, so waiting for a successful
      # publish would lose the records that matter most.
      #
      # `state` whole, and it used to be five paths named one at a time. Naming
      # the directory rather than its contents is what makes the step survive a
      # fresh clone: `git add` runs under `set -euo pipefail`, so a path missing
      # from the checkout aborts the whole step and costs every ledger beside
      # it. `state` is in every checkout; a collection inside it need not be.
      # The work shards and the two assemble commits stage `state` whole for the
      # same reason.
      #
      # A second attempt at this same plan writes its own files rather than the
      # files the first attempt wrote: the attempt is in every name, so the two
      # never open one path and there is nothing for a merge driver to settle.
      # Until 2026-09-19 `.gitattributes` gave the shared feed-health file a
      # union driver and the merge kept both verdicts; the driver went, and the
      # next shape of that failure was a rebase nobody could settle. The name is
      # what removes it rather than making it quiet.
      #
      # `continue-on-error` because the plan this job exists to produce is the
      # artifact below, not this push. Run `35660521768` died here: the push lost
      # a race, the step failed, and the upload after it was skipped - so a plan
      # that had already been computed never reached the shards and the whole day
      # was lost to a ledger commit. The rows this push carries are worth a run;
      # they are not worth the run.
      - name: Commit what the plan saw
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "plan: ${{ steps.decide.outputs.date }}"
          NOTHING_STAGED_MESSAGE: "nothing new to record"
          PUSH_FAILED_MESSAGE: "could not push what the plan saw"
          PUSH_DEADLINE_SECONDS: ${{ steps.bounds.outputs.push_deadline_seconds }}
        run: >-
          bash .github/scripts/commit-and-push.sh
          state

      # `error` rather than the default: `assemble` downloads this by name and
      # cannot be built without it, so a plan job that finishes having written no
      # plan has to fail here, where the cause is, and not one job later.
      #
      # `always()` so that a step above failing cannot throw away a plan this job
      # already wrote. The `error` setting is what keeps that honest: a job that
      # reaches here with no plan.json still fails, and it fails naming the file.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan
          path: backend/var/run/${{ steps.decide.outputs.date }}/plan.json
          retention-days: 1
          if-no-files-found: error

  # This bound is the backstop, not the budget, and it is written in exactly one
  # place: `run.shard_timeout_minutes` in config/idhazh.json, which the plan job
  # publishes above. It used to say 330 here while config said 150, so anyone
  # sizing a model against config was reading a number production ignored.
  #
  # 150 minutes is half again the slowest worker ever measured at the current
  # item ceiling - 94.5 minutes on 2026-08-26 - and it still sits above the
  # 117.5-minute slowest worker of 2026-08-24, when a day handed each worker 50
  # items instead of 40. Raising it is not the fix for a slow worker (Guardrail #2);
  # lowering `run.safety_ceiling_per_run` is, and that is the lever the ceiling
  # was last moved with.
  work:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.shard_timeout_minutes) }}
    strategy:
      fail-fast: false
      # The run's own worker count, so no worker ever waits for a sibling on
      # either path: a scheduled run derives four from config, and a dispatch
      # may name up to eight. A fixed number here is a second answer to how wide
      # the fan-out is, and the two can disagree - at four it would have queued
      # half of an eight-shard dispatch and handed back the wall-clock the
      # fan-out buys. Eight workers is well inside Guardrail #2's 20 concurrent
      # jobs.
      max-parallel: ${{ fromJSON(needs.plan.outputs.shards) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # First, before the checkout, so the number covers everything the job
      # does: the cache restore, the weight load and the warmup as well as the
      # model time. The truncation cap reverts when the slowest work job passes
      # 110 minutes, and until this stamp existed the only place a job's clock
      # lived was the GitHub jobs API - which drops a job record when the run
      # ages out, so the rollback rule was a person making an API call by hand
      # (docs/reference/pipeline-cost.md). The job-clock step subtracts this and
      # files the difference onto the host row this shard opened.
      - name: Stamp the shard clock
        run: |
          set -euo pipefail
          echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Before anything that imports `idhazh`, which now includes the step that
      # builds the server command. It used to run after that step, and the whole
      # reason a second copy of the flag list existed was to be readable from a
      # job that had not installed the package yet.
      #
      # `torch` comes from the processor-only index first, and the extra then
      # finds it already satisfied. The default PyPI wheel for Linux carries the
      # graphics-card runtime, and this runner has no graphics card (Guardrail
      # #2) - so every shard of every run downloaded and unpacked a few gigabytes
      # it could never execute. The index is the one `measure.yml` already names.
      # It cannot go in the extra: a local version pinned there would follow a
      # developer whose machine does have a card.
      - name: Install
        run: |
          if [ "${{ needs.plan.outputs.faithfulness }}" = "false" ]; then
            pip install -e .
          else
            pip install --index-url https://download.pytorch.org/whl/cpu torch
            pip install -e ".[faithfulness]"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      # Before the model block, and the reason is unchanged: the bandwidth probe
      # wants a gigabyte and an idle machine, and once llama-server holds the
      # memory it has neither. It sat between the digest check and the server
      # start until the block became one action, which cannot be entered
      # halfway. Nothing the probe measures moved with it - the restore ahead of
      # it is disk traffic that has finished by the time this step runs, and the
      # memory it needs is held by no process either side of the move.
      - name: What machine this job drew
        run: |
          set -euo pipefail
          python -m idhazh fingerprint \
            --date "${{ needs.plan.outputs.date }}" \
            --shard ${{ matrix.shard }} \
            --job work

      # The cache, the fetch, the digest check, the server and the health probe.
      # One action, shared with `llm-council.yml`, which ran the same steps as a
      # second copy - so the two share one cache entry by construction rather
      # than by a test comparing two literals.
      #
      # The port is handed over rather than inherited: it has one home, the
      # workflow `env` above, and this is the line that carries it in. Nothing
      # about the model is handed over at all - the action reads the same config
      # this run was planned from.
      - uses: ./.github/actions/model-server
        id: model_server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          port: ${{ env.LLAMA_PORT }}
          llama_cpp_build: ${{ needs.plan.outputs.llama_cpp_build }}

      # Healthy says a server answers and the step above says which file it
      # opened. Neither says the entry is true. Row #2 moved the turn envelope
      # onto the model entry, so the entry now CLAIMS how a turn opens and
      # closes - and a wrong marker renders a prompt with no turn structure that
      # the grammar still accepts, so the only symptom is worse summaries and
      # nothing goes red.
      #
      # Five cases, and none of them has a skip flag: the render, the prefix
      # cache, the grammar, the architecture in the weights, and the window
      # against the length the model was trained for. Each refuses by name and
      # says what was declared and what was reported.
      #
      # Here rather than anywhere later, because a refusal costs this step where
      # the failure it prevents costs a shard of summaries filed under a model
      # that never rendered a turn. Per server rather than per run: every shard
      # starts its own. It costs one template render, two tokenisations, two
      # completions of at most 32 tokens, one model list and a few kilobytes off
      # the front of the weights file.
      #
      # The schema is handed in from the module that builds it rather than
      # copied here, so the grammar case is held to the shape this run really
      # sends (`docs/architecture/summarize/model-boundary.md`).
      - name: The server proves the entry
        run: |
          set -euo pipefail
          python3 backend/utilities/prove_the_entry.py --config-root config

      # A shard's throughput varies with the host it drew, and no run log named
      # the host, the binary or the weights - so no number a shard produced could
      # say which bytes produced it (Guardrail #10). These six lines settle all three.
      # `always()`, because the shard that failed is the one whose host is worth
      # naming.
      - name: What this runner is
        if: always()
        env:
          LLAMA_CPP_BUILD: ${{ needs.plan.outputs.llama_cpp_build }}
          MODEL_PATH: ${{ steps.model_server.outputs.weights_path }}
        run: |
          echo "pinned llama.cpp build: ${LLAMA_CPP_BUILD}"
          grep -m1 'model name' /proc/cpuinfo || true
          nproc || true
          grep -m1 'system_info' llama-server.log || true
          LD_LIBRARY_PATH=backend/bin backend/bin/llama-server --version 2>&1 | head -3 || true
          sha256sum backend/bin/llama-server || true
          sha256sum "${MODEL_PATH}" || true

      # Neither of the two runs this shape was read from measured memory at all,
      # and the runner has 16 GB (Guardrail #2). `measure.yml` already samples exactly
      # this; the daily path did not.
      #
      # The sampler is `backend/utilities/memory_sampler.py`, which shares its
      # `/proc` read with the sweep that has taken the same reading for longer.
      # Every key it writes, and why each one is there, is in that module's own
      # docstring.
      #
      # This step is the parent and it exits: the loop is launched into its own
      # session and the pid written is the LOOP's. The shell this replaced
      # backgrounded itself and wrote `$!`, which named the shell rather than
      # the sampler, so a loop that died at once left a green step.
      - name: Sample memory
        run: |
          set -euo pipefail
          python3 backend/utilities/memory_sampler.py start-sampler \
            --pid "$(cat llama-server.pid)"

      # `LLAMA_CPP_BUILD` is what the run manifest stamps as `runtime_build`,
      # the llama.cpp release that decoded this shard's bytes. It used to reach
      # here as workflow `env` beside a copy of the pin; it now comes from the
      # step that read the pin, so the build stamped and the build installed are
      # one answer. Unset it degrades to `build-not-recorded` rather than
      # failing, so losing it would publish a day whose manifest cannot say what
      # decoded it (Guardrail #10).
      - name: Work the shard
        env:
          LLAMA_CPP_BUILD: ${{ needs.plan.outputs.llama_cpp_build }}
        run: |
          python -m idhazh work \
            --date "${{ needs.plan.outputs.date }}" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }} \
            ${{ needs.plan.outputs.faithfulness == 'false' && '--no-faithfulness' || '' }}

      - name: Runtime log on failure
        if: failure()
        run: tail -50 llama-server.log || true

      # The rows this shard earned, committed here rather than three hours later
      # in assemble. Until then they exist only inside the items artifact at the
      # end of this job, which is never committed and expires - so a run stopped
      # after the workers had measured every item recorded none of it.
      #
      # First of the `always()` steps for that reason: a cancelled job runs them
      # in order inside a grace period, and this is the one whose loss the pair
      # exists to prevent.
      #
      # Neither step may fail the shard. What this job owes the run is the items
      # artifact assemble publishes from, and assemble writes the same census
      # again - so a ledger that will not push costs this run an early copy of
      # rows it is going to get anyway, while a failed shard costs the day a
      # worker. `continue-on-error` says that out loud instead of leaving it to
      # whether the last command in a `run:` body happens to return zero.
      - name: Record what this shard measured
        if: always()
        continue-on-error: true
        run: |
          python -m idhazh record \
            --date "${{ needs.plan.outputs.date }}" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }}

      # llama-server counts these already and only publishes them under
      # `--metrics`, which `config/idhazh.json` turns on. Read once, at the end:
      # they are cumulative over the job, so a per-request scrape would add
      # requests to the thing it measures and still report only the last one.
      # One server serves one shard for a whole job, so one read covers it all.
      #
      # Before `What this job cost`, because that step reads the file this one
      # writes and puts two of its counters onto the host row. Until they were
      # committed these numbers reached only this job log, which keeps them for
      # two days - and that is what made the prefill rate the throughput doc and
      # the console publish impossible to check against anything (Guardrail #10).
      # See docs/architecture/summarize/throughput.md.
      #
      # `always()`, because the shard that died is the shard whose context high
      # water mark matters most. `continue-on-error` for the reason written above
      # the record step: an unreadable scrape costs one observation row, a failed
      # shard costs the day a worker. The endpoint is llama-server's own loopback
      # surface inside this job - nothing a reader can reach (Guardrail #1).
      - name: What the server counted
        if: always()
        continue-on-error: true
        run: |
          curl -sf --max-time 30 "http://127.0.0.1:${LLAMA_PORT}/metrics" -o llama-metrics.prom || true
          if [ -s llama-metrics.prom ]; then
            # The whole counter set, so a llama.cpp rename is visible rather than
            # silently absent, and then the four a reader names: the two a run is
            # read by, and the two the job-clock step below parses onto the host
            # row. Either pair renamed says so here, where a person reading a
            # failed shard will find it, rather than arriving as an empty cell.
            grep -E '^llamacpp:' llama-metrics.prom || true
            for series in llamacpp:n_busy_slots_per_decode llamacpp:n_tokens_max \
                          llamacpp:prompt_tokens_total llamacpp:prompt_seconds_total; do
              grep -m1 "^${series} " llama-metrics.prom \
                || echo "${series}: this build does not publish it"
            done
          else
            echo "no metrics: llama-server was already gone, or the role's inference.metrics is off"
          fi
          # The kernel's own peak, for the runtime artifact and the operator
          # step below. The stage never opens `/sys` itself: that tree is on the
          # runner and on no developer machine this project is written on, so a
          # stage that read it could not be run or tested anywhere else.
          if [ -f /sys/fs/cgroup/memory.peak ]; then
            echo "cgroup_memory_peak_bytes=$(cat /sys/fs/cgroup/memory.peak)" > memory-peak.txt
          else
            echo "cgroup_memory_peak_bytes=unavailable" > memory-peak.txt
          fi

      # The other end of `What machine this job drew`. That step probes the host
      # before the model server starts, because the bandwidth reading wants a
      # gigabyte and an idle machine; the four cells below are only knowable once
      # the job is over. So the host row is written in two halves that fill
      # different cells, into the one segment this job owns, and the fold in
      # assemble unites them - one row a job in the day file either way.
      #
      # Every reading is already on this runner: `JOB_STARTED_AT` was stamped by
      # the first step of this job, before the checkout, so the clock covers the
      # cache restore and the weight load as well as the model time; llama-server's
      # own log brackets the model load with two stamps; and the step above wrote
      # what the server counted. That scrape is read here as well as there because
      # the two prompt counters on it are the second instrument - the only reading
      # on the site that can disagree with the item ledger's own arithmetic.
      #
      # `always()` and `continue-on-error`, for the reason written above the two
      # steps before it: a job clock nobody recorded costs this run one cell,
      # where a failed shard costs the day a worker. `:-` so a stamp that never
      # arrived leaves an empty cell rather than sending the word "unbound" to a
      # contract that would refuse it.
      - name: What this job cost
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m idhazh job-clock \
            --date "${{ needs.plan.outputs.date }}" \
            --job work \
            --shard ${{ matrix.shard }} \
            --job-started-at "${JOB_STARTED_AT:-}" \
            --server-log llama-server.log \
            --counters-file llama-metrics.prom

      # The shape the plan job uses, for the reason written there, and the same
      # script - eight shards racing one branch is what its rebase loop is for.
      # It cannot rebuild what it commits, so it carries none of the refresh
      # settings.
      #
      # Appending the same row twice is the one thing that would make this worse
      # than the loss it fixes, because `public_telemetry` copies every row into
      # the file the console reads. No file is shared here any more: the item
      # census, the eval rows, the record of what those rows are and the span
      # fold each go into their day directory under a name that carries this
      # writer's run, attempt, job and shard.
      #
      # Nothing here shares a file with another writer any more, which is why no
      # settling pass runs after the rebase. Until 2026-09-19 one did:
      # `.gitattributes` gave `state/**/*.csv` a union merge driver, a second
      # attempt at this shard could not see what the first attempt pushed, and
      # the merge kept both rows. Each writer takes its own segment now, so two
      # attempts write two files and the second one replaces the first when the
      # compaction folds them by key.
      #
      # `state/span-rollup` was staged here from 2026-09-15 because a shard was
      # the only thing that wrote it. `roll_up_spans` folds the shard's spans and
      # the fold used to be appended to the month file in this runner's checkout;
      # until that day no list named the path, so each fold died with the runner
      # and assemble published a header row over an absent directory. Every span
      # this project had ever opened was measured, folded and thrown away by one
      # missing path.
      #
      # `state` whole is what this stages now, and naming the directory rather
      # than its contents is what makes the step survive a fresh clone: `git add`
      # runs under `set -euo pipefail`, so a path missing from the checkout
      # aborts the whole step and costs every ledger beside it. `state` is in
      # every checkout; a collection inside it need not be. It is also what the
      # plan job and the two assemble commits have always staged.
      #
      # Every path this shard writes under it carries this writer's run,
      # attempt, job and shard in the file name - the item census, the eval
      # rows, the record of what those rows are, the span fold, the machine row
      # and the committed trace alike. Two shards never write one path and two
      # attempts at one shard never write one path, so no merge driver is needed
      # anywhere below and a lost push race costs a rebase rather than the rows.
      # `PUSH_DEADLINE_SECONDS` is this job's own number and not the one the
      # rest of the run uses. A shard keeps back `run.shard_wrap_up_minutes` -
      # 12 minutes - for everything after its last item, so the 300 s the knob
      # declares would be 5 of those 12. 120 s is 16.7 percent of the reserve,
      # which is four attempts at the capped backoff.
      #
      # `SHARD` is here so the `push attempt=` line names which of the shards it
      # came from. Eight of them commit to one branch, and a contention figure
      # nobody can attribute to a writer answers nothing.
      - name: Commit what this shard measured
        if: always()
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "work: ${{ needs.plan.outputs.date }} shard ${{ matrix.shard }}"
          NOTHING_STAGED_MESSAGE: "nothing measured to record"
          PUSH_FAILED_MESSAGE: "could not push what this shard measured"
          PUSH_DEADLINE_SECONDS: "120"
          SHARD: ${{ matrix.shard }}
        run: >-
          bash .github/scripts/commit-and-push.sh
          state

      - name: Prompt cache log summary
        if: always()
        run: |
          if [ ! -f llama-server.log ]; then
            echo "llama-server.log not found"
            exit 0
          fi
          # A fixed list of known lines hid the proof of prefix reuse for two
          # measured runs: the list greps `kv cache rm [`, which this build never
          # emits, while the line that settles it starts `slot get_availabl:`.
          # The list was replaced by `^(srv|slot) `, which was worse - it can
          # match nothing at all, because every line the runtime prints opens
          # with a timestamp and a level letter:
          #   `0.04.686.486 I srv    load_model: initializing, n_slots = 4, ...`
          # Measured against the four captures in `tests/fixtures/runtime/`:
          # that pattern found 1 line of 40 per capture, and the one it found
          # was matched by `n_ctx_slot` rather than by the anchor. The tag is
          # the third field, so the anchor reads the first two. It now finds 38
          # of 40; the two it leaves are tagged `cmn` and are the common-args
          # block, which this step is not for.
          # `n_ctx_slot` and `n_ctx_seq` are one field under two llama.cpp
          # spellings, and the pin does not stop a later bump from renaming it.
          pattern='^[0-9.]+ [A-Z] (srv|slot) |n_ctx_slot|n_ctx_seq|n_ctx_per_seq'
          grep -E "$pattern" llama-server.log || true
          # What that pattern found, against what the log holds. A pattern that
          # matches nothing prints nothing and exits 0, which is how `^(srv|slot) `
          # survived two measured runs finding 1 line in 40 - the line beside it
          # did match, so the step never looked empty. This counts on the real
          # log, on the real build, on every run, so it says so the day
          # llama.cpp renames a field.
          matched=$(grep -cE "$pattern" llama-server.log || true)
          total=$(wc -l < llama-server.log)
          echo "matched ${matched:-0} of ${total} lines of llama-server.log"
          # `f_sim_best` is the shared prefix over the incoming prompt and
          # `f_keep` the same prefix over what the slot held. The distribution is
          # where a prefix-reuse loss shows; the presence of the line is not.
          # Both of these do match a real line - checked the same way, against
          # the same four captures.
          for field in f_sim_best f_keep; do
            grep -oE "${field} = [0-9.]+" llama-server.log | awk '{ print $3 }' | sort -n | awk -v field="$field" '
              { v[NR] = $1 + 0 }
              END {
                if (NR == 0) { printf "%s: no samples\n", field; exit }
                for (i = 1; i <= NR; i++) { b = int(v[i] * 10); if (b > 9) b = 9; bucket[b]++ }
                line = ""
                for (b = 0; b <= 9; b++) line = line sprintf(" %.1f:%d", b / 10, bucket[b] + 0)
                printf "%s: n=%d min=%.3f median=%.3f max=%.3f buckets%s\n", field, NR, v[1], v[int((NR + 1) / 2)], v[NR], line
              }'
          done

      # The operator's read of the same two files the host row read, in the
      # job log where a person looking at a failed shard will find it. It writes
      # nothing: `memory-peak.txt` is written by the scrape step above, so the
      # number printed here and the number the sampler took are one reading.
      #
      # The five figures and the roll-call behind them come off the module that
      # wrote the records, rather than off an `awk` program reading a
      # tab-separated file by column name. Both are keyed JSON now, so a key
      # cannot move and there is no column position left to get wrong.
      - name: What memory this shard used
        if: always()
        run: |
          cat memory-peak.txt 2>/dev/null || echo "memory-peak.txt not found"
          python3 backend/utilities/memory_sampler.py summarize

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-log-${{ matrix.shard }}
          path: |
            llama-server.log
            rss-samples.jsonl
            python-procs.jsonl
            memory-peak.txt
            llama-metrics.prom
          retention-days: 2
          if-no-files-found: ignore

      # Seven days, not one. Assemble reads this within the
      # hour, so one day was enough for the run itself - but it is also the only
      # copy of the article text a finished run leaves behind, and
      # `data_wrangler.py backfill` replays it into the training corpus.
      #
      # At one day the scheduled harvest is the only way rows ever arrive, and it
      # takes one run every `finetune.harvest_every_days` - about 85 rows a week
      # measured over runs 33179908136 and 33227285523 on 2026-08-29, which is
      # roughly six months to fill a 2000-row window. At seven days a single
      # backfill reaches every run of the past week and fills it in one sitting.
      #
      # Measured 2026-08-29: one run's four shards are 555,842 bytes, so five
      # runs a day held for seven days is 18.6 MB against the 500 MB of artifact
      # storage Guardrail #2 allows - 3.7 percent of the budget, for the only copy of
      # the text that exists.
      #
      # `always()`, because a step with no condition runs on `success()` and a
      # job stopped by `timeout-minutes` is cancelled rather than successful.
      # Run 34852763827 on 2026-09-14 is what that cost: three of four shards
      # were cancelled at the bound, the `always()` ledger steps above them ran
      # and filed 33 items as published, and this upload was skipped on all
      # three - so assemble composed the day from shard 3 alone. The census read
      # 46 published items and the committed day carries 13.
      #
      # There is something to upload because `work` writes each item's payloads
      # as it finishes that item rather than once at the end. The record step
      # above reads this same directory and did file rows on every cancelled
      # shard, which is the evidence the files are on disk when the bound lands.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: items-${{ matrix.shard }}
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/
          retention-days: 7
          if-no-files-found: ignore

      # The pictures this shard drew. The summarize-and-plan call writes the
      # summary and the plan in
      # one reply, so `work` is the only job that renders, and a decision naming
      # an asset whose bytes never left this runner is a broken image on the
      # page - `_picture_faults` calls it "names a picture file that is not
      # there". A day where nothing was drawable matches nothing here, which
      # `if-no-files-found: ignore` makes a green no-op.
      #
      # The decisions themselves need no line: they are written into the items
      # directory above and travel in that artifact.
      #
      # This run's day and never the whole tree: `render.write.asset_relpath`
      # files every chart under the day that names it, so a wider line sends
      # every committed day back to Actions on every run (Guardrail #12).
      #
      # `always()` for the reason written over the items artifact, and it has to
      # be the same answer for both: the decision naming a chart travels in
      # `items/` and the chart's bytes travel here, so guarding one alone
      # publishes a story naming a picture file that is not there - which is
      # what `_picture_faults` refuses the day for.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-visuals-${{ matrix.shard }}
          path: ${{ needs.plan.outputs.day_dir }}/
          retention-days: 1
          if-no-files-found: ignore

      # The article and the summary each scored item was judged on, for the
      # person who labels the faithfulness queue by hand. The committed ledger
      # keeps digests and no text, and this checkout is deleted when the job
      # ends, so this artifact is the only copy that survives the run.
      #
      # Kept longer than every other artifact here and still not forever.
      # Labelling sixty rows is an evening of a person's time, not a job step,
      # so one day is not a window; ninety days would be a promise this project
      # does not make about somebody else's article body. Fourteen days is a
      # deadline a labeller can plan around, and it is what bounds the storage
      # this costs (Guardrail #2). See
      # docs/how-to/label-the-faithfulness-queue.md.
      #
      # Never committed, and deliberately not named in any commit-and-push.sh
      # call: an article body is not ours to republish (CLAUDE.md section 0a).
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.shard }}
          path: backend/var/evidence/${{ needs.plan.outputs.date }}/
          retention-days: 14
          if-no-files-found: ignore

      # What each model call was sent and what came back. The census row says a
      # reply was 1,158 tokens where it used to be 229; it cannot say what the
      # model was asked, so it cannot say whether the prompt moved, the article
      # was longer, or the decoder simply ran on. That question was open for six
      # days on the regression this exists for, and it was open because the only
      # copy of the text was on a runner that had already been deleted.
      #
      # Ninety days, which is the longest window anything here keeps and is
      # deliberate: a regression is found by comparing today with a run from
      # weeks ago, and fourteen days would put the comparison run out of reach
      # exactly when it is wanted. It is bounded by the two flags that fill it -
      # `logging.capture_prompts` and `logging.capture_replies` - and with both
      # off the directory is empty and this line is a green no-op.
      #
      # Never committed, and deliberately not named in any commit-and-push.sh
      # call: a rendered prompt carries the article body inside it, and an
      # article body is not ours to republish (CLAUDE.md section 0a).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-${{ matrix.shard }}
          path: backend/var/run/${{ needs.plan.outputs.date }}/captures/
          retention-days: 90
          if-no-files-found: ignore

  assemble:
    needs: [plan, work]
    # Runs even when a worker failed, because a run that publishes nothing on a
    # bad day is a run whose bad days are invisible.
    #
    # `always()` said more than that and started this job when the PLAN failed
    # too. There is nothing to assemble then - the plan is the artifact the step
    # below downloads by name - so the run's one real failure arrived with a
    # second, louder one stacked on top of it about a missing artifact, and the
    # job that reported the cause was not the one anybody opened. A cancelled
    # run started it as well.
    #
    # The status function is what keeps the failed-worker path: without one,
    # GitHub applies an implicit `success()` and the workers would have to pass
    # too.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      # The third job that draws its own runner, and the last one to say so. It
      # sits straight after the plan arrives and before anything else runs: the
      # probe reads the plan for the run's id, and the bandwidth reading wants a
      # gigabyte and an idle machine, which this job stops having the moment it
      # starts embedding a day and building a site.
      #
      # `if: always()` on the job means this runs on a bad day too, which is the
      # day worth measuring. `continue-on-error` for the reason the ledger steps
      # below carry it: what this job owes a reader is the published day, and a
      # probe must never be what costs one.
      - name: What machine this job drew
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m idhazh fingerprint \
            --date "${{ needs.plan.outputs.date }}" \
            --shard 0 \
            --job assemble

      - uses: actions/download-artifact@v8
        with:
          pattern: items-*
          merge-multiple: true
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/

      # The pictures the work shards drew. The summarize-and-plan call writes
      # the summary and the
      # plan in one reply, so a chart is rendered on the shard that read the
      # article and travels with it - one artifact per shard, and
      # `continue-on-error` because a day where nothing was drawable is a normal
      # day rather than a failed one.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shard-visuals-*
          merge-multiple: true
          path: ${{ needs.plan.outputs.day_dir }}/

      - name: Assemble and publish
        run: |
          python -m idhazh assemble \
            --date "${{ needs.plan.outputs.date }}" \
            --commit "${{ github.sha }}" \
            --runner ubuntu-latest

      # The training window, built here because here is the only place the text
      # exists. `backend/var/run/<date>/items/` is gitignored and travels as a
      # one-day artifact, so a scheduled workflow of its own would check out a
      # fresh tree, find an empty directory and harvest nothing - silently, every
      # week, until somebody went looking.
      #
      # It is still a stage that runs alone with a file in and a file out
      # (CLAUDE.md section 4): what moved is the workflow it is invoked from, not
      # the command. The cadence is `finetune.harvest_every_days` and the step
      # decides for itself, because `on.schedule` is parsed before any step runs
      # and no config value can reach a cron line.
      #
      # `continue-on-error`, for the reason the two worker ledger steps carry it:
      # what this job owes a reader is the published day, and a corpus that will
      # not build must never be what stops one.
      - name: Harvest the training corpus
        continue-on-error: true
        run: python -m idhazh harvest --date "${{ needs.plan.outputs.date }}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the site
        working-directory: frontend
        run: npm ci

      # The day just written rides inside frontend/public, and /archive/ inlines
      # every committed day for the on-device search - so this job is the one
      # that can push a page past its ceiling or a payload no reader can read.
      # Those are two different severities and they now sit on opposite sides of
      # the commit below.
      #
      # An invalid payload means the day must not publish, so the two checks that
      # find one run BEFORE the commit and stop it. The weight ratchet runs
      # after. See ../../docs/architecture/publishing/layout.md.
      #
      # `validate-days` is the first of the two and it is the one that opens
      # every story. Since the reading routes split on 2026-09-01 a document
      # carries a seed and a browser fetches the rest, so the build below never
      # looks at the stories past the seed and cannot fail on one.
      #
      # This run wrote one day, so it names that day. Every other committed day
      # is frozen and was validated before it was pushed, and re-opening all of
      # them costs about 0.27 s a day - measured 2026-09-05, 16 days in 6.6 s -
      # five times a day, forever (Guardrail #12). `ci.yml` re-reads the whole tree
      # on the change that can actually invalidate it: one that moves a contract.
      - name: The day this run wrote still matches its contracts
        run: python -m idhazh validate-days --day "${{ needs.plan.outputs.date }}"

      - name: Build the site
        working-directory: frontend
        run: npm run build

      # The 1 GB Pages cap is measured HERE and nowhere else, because `build` is
      # the tree the deploy uploads and it does not exist until the step above
      # has run. `assemble` can only see the committed payloads, which are a
      # different tree eighteen times smaller - measuring those was an alarm that
      # could never fire. Over the alarm point this prints and passes; past the
      # cap it fails, before the day is pushed rather than at the deploy.
      - name: Measure the built site against the Pages cap
        working-directory: frontend
        run: python -m idhazh site-weight --site-tree build

      # The paths the rebuild below owns, read from `backend/idhazh/paths.py`
      # rather than written out here. They were a space-split string in this
      # file, under a header warning that no path in it may carry a space - a
      # rule nothing could check - and the workflow tests carried a second copy
      # of the same list. Three lists that can drift is the defect; there is one
      # now, and both this step and the tests read it.
      #
      # Through `$GITHUB_OUTPUT` and never `$GITHUB_ENV`. An env var set here
      # reaches every later step of this job, and `Commit the folded telemetry`
      # is a later step with no `REGENERATE_COMMAND` - the script refuses a
      # refresh with no rebuild and exits 2, and that step is
      # `continue-on-error`, so the fold would silently stop happening on every
      # run.
      #
      # `DAY_DIR` through `env`, not pasted into the line below: a value read by
      # name is a value, whatever it contains.
      - id: derived
        name: Say which committed paths a rebuild owns
        env:
          DAY_DIR: ${{ needs.plan.outputs.day_dir }}
        run: |
          set -euo pipefail
          python -m idhazh derived-paths --day-dir "$DAY_DIR" >> "$GITHUB_OUTPUT"

      # The checkout above carries main's tip at TRIGGER time, and this run has
      # been going for two to three hours by now. So the day was just built on a
      # base that old, and the push below is the first thing to find out.
      #
      # `REGENERATE_COMMAND` is the same invocation as the step above: when the
      # push loses a race, the fix is to build the day again against the tip the
      # push wants, not to ask git to text-merge two digests. `REFRESH_PATHS` is
      # what that rebuild owns, named one file at a time under the day's
      # directory - the `shard-visuals-*` artifacts unpacked this run's rendered
      # charts into that same directory, and no producer here can make those
      # again.
      #
      # `DROP_RACED_ASSETS_COMMAND` is what keeps those charts from being the
      # thing that loses the day. A chart is filed under its item's own id, so a
      # path a run that pushed while this one worked has already taken is that
      # same item's chart. Its file is published; this run's copy is not, and
      # the rebuild keeps the published item anyway, so this run's copy goes.
      #
      # `corpus` is staged here and is deliberately NOT in `REFRESH_PATHS`. The
      # window records what this run saw rather than deriving from the tip, so a
      # race is answered by replaying this run's rows onto the new base - the
      # same branch of the script `state/seen` takes - and never by rebuilding
      # them.
      #
      # The `id` is here so the rebuild below can read this step's `rebased`
      # output. Nothing else reads it.
      - name: Commit the day
        id: commit_day
        env:
          COMMIT_MESSAGE: "digest: ${{ needs.plan.outputs.date }}"
          NOTHING_STAGED_MESSAGE: "nothing changed"
          PUSH_FAILED_MESSAGE: "could not push the day"
          PUSH_DEADLINE_SECONDS: ${{ needs.plan.outputs.push_deadline_seconds }}
          REFRESH_PATHS: ${{ steps.derived.outputs.refresh_paths }}
          REGENERATE_COMMAND: >-
            python -m idhazh assemble --date ${{ needs.plan.outputs.date }}
            --commit ${{ github.sha }} --runner ubuntu-latest
          DROP_RACED_ASSETS_COMMAND: >-
            python backend/utilities/drop_raced_assets.py
            --date ${{ needs.plan.outputs.date }}
        run: >-
          bash .github/scripts/commit-and-push.sh
          frontend/public/digest frontend/public/telemetry frontend/public/assist/index
          frontend/public/source-health.json frontend/public/console
          frontend/public/run-days frontend/public/day-metrics
          frontend/public/machine frontend/public/span-rollup
          frontend/public/run-timeline state corpus

      # After the day is committed and never before it. The fold deletes a
      # committed file, so it may only run once the thing it might collide with
      # is already pushed - a fold that ran first and then lost the push would
      # leave the month deleted in a tree nobody kept, and every later run would
      # fold a shard that had already been folded.
      #
      # `--dry-run` is set on purpose and is the whole shape of this step today.
      # `.github/workflows/prune.yml` force-pushes main on a schedule, so a state
      # file this deletes stops being recoverable from history once the prune
      # passes over it (CLAUDE.md section 8). So the step logs every file a live
      # run would remove and removes nothing, and turning the deletion on is a
      # separate one-line commit taken after a scheduled run has printed that
      # list. Grep the job log for `prune-state would remove` to read it.
      #
      # The flag covers the whole invocation, so it also suspends the seen prune
      # and the item-health fold, which had been live and had never fired. On
      # 2026-09-13 the earliest either would have deleted anything is
      # `state/seen/2026/08/23.csv` on 2026-11-22 - so removing the flag before
      # then costs nothing that was already happening, and leaving it on costs
      # nothing either.
      #
      # It also covers the score archive, which joined this step on 2026-09-03
      # and is the one store here whose deletion is preceded by a summary that is
      # written, read back and reconciled against the day files it replaces. The
      # earliest it removes anything is the day files under `state/scores/2026/08/`
      # on 2027-10-01, and its dry run prints what the archive would weigh against
      # them.
      #
      # It also covers the archive cleanup, which joined this step on 2026-09-06
      # and is the one thing here that would cost a reader something it can see.
      # `retention.dry_run` is true, so nothing is ever deleted and the
      # pass is a measurement of the backlog: it appends one row to
      # `state/visual-prunes/YYYY/MM/DD.csv` every run, carrying what it found
      # and what the fuse would have held back. `retention.image_months` took
      # its first value, 13, on 2026-09-13, so the pass names a cutoff now -
      # and nothing published is old enough to sit behind it. Switching the
      # deletion on is plan 13's job and needs `frontend/public/digest` added to
      # the commit call
      # below, since `git add` records a removal only for a path it is handed.
      #
      # It also covers the trace prune, which joined this step on 2026-09-06 and
      # is a lookup like the seen prune above: a raw span trace an operator opens
      # for a recent run, deleted whole past `observability.trace_window_days`
      # rather than folded. `state/traces/` is empty until
      # `observability.tracing_enabled` is switched on in a later plan, so today
      # this walks nothing - wiring the prune now is what makes the window bound
      # the tree from the first run that ever writes one.
      #
      # `--execution` is the same `github.run_id` the plan job filed its ledgers
      # under, so the cleanup row joins to the run that published the day.
      #
      # `continue-on-error` on both, for the reason the harvest carries it: what
      # this job owes a reader is the published day, and thirteen-month-old
      # telemetry must never be what stops one. A month it does not fold today it
      # folds on the next run.
      #
      # It stages `state` whole rather than the directories it touches.
      # `git add` runs under `set -euo pipefail` and would abort on a path a
      # fresh checkout does not carry, and neither `state/telemetry-aggregate/`
      # nor `state/score-archive/` exists until the first fold or the first
      # archive writes it, nor `state/traces/` until tracing is switched on.
      # `state` always does, and the day's own commit above
      # has already taken everything else in it. `state/visual-prunes/` moved to
      # a day tree on 2026-09-08, so a run writes a file that was not in the
      # checkout it started from - staging `state` whole is what already reaches
      # it, and is why that move needed nothing here.
      #
      # `frontend/public/telemetry` is named beside it because the fold deletes
      # the browser's copy of a month in the same step it folds the ledger, and
      # `git add` records a removal only for a path it is given. The directory is
      # in every checkout - the day's own commit above stages it - so naming it
      # cannot abort the step.
      # `always()` because `Commit the day` above deliberately carries no
      # `continue-on-error` - marking a lost publish as success is worse than
      # failing - and without this the whole tail of the job is skipped with it.
      # The job stays red and the record is still kept, which is strictly
      # better than choosing one.
      - name: Retire the ledger shards and the visuals nothing still reads
        if: always()
        continue-on-error: true
        run: >-
          python -m idhazh prune-state
          --date "${{ needs.plan.outputs.date }}"
          --execution "${{ github.run_id }}" --dry-run

      # The closed-day fold, and this job is its only caller. A day older than
      # `run.settled_fold_after_days` can gain no more rows, so its writer files
      # are replaced by the one settled file they agree on.
      #
      # AFTER `Commit the day`, and that order is the whole of why it sits here
      # rather than in the plan job. The day's commit carries `REFRESH_PATHS`,
      # so a push that loses its race hands those paths back to the tip and runs
      # the producer again - and `idhazh assemble` does not write a settled file.
      # A fold that ran before that commit would be half-reverted by the
      # rebuild, silently, with the writer files already gone.
      #
      # `always()` and `continue-on-error` for the reason the prune above them
      # carries both: the day has already published by here, and no bookkeeping
      # pass is worth the run.
      - name: Fold the days that can gain no more rows
        if: always()
        continue-on-error: true
        run: >-
          python -m idhazh compact
          --date "${{ needs.plan.outputs.date }}"

      # The `id` is here for the same reason the day's commit carries one. This
      # step stages `frontend/public/telemetry`, which the console pages read,
      # so a rebase here moves the built site exactly as a rebase there does.
      # `always()` for the reason the step above it carries one: a day's push
      # that lost its race must not also cost the fold.
      - name: Commit the folded telemetry
        id: commit_fold
        if: always()
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "state: retire the shards past their reading window"
          NOTHING_STAGED_MESSAGE: "every month is still at full grain"
          PUSH_FAILED_MESSAGE: "could not push the folded telemetry"
          PUSH_DEADLINE_SECONDS: ${{ needs.plan.outputs.push_deadline_seconds }}
        run: >-
          bash .github/scripts/commit-and-push.sh
          state frontend/public/telemetry

      # The commit steps above rebase when the push loses a race, and the
      # rebuild there rewrites the day against the tip that won. `frontend/build`
      # still holds the build made before any of that, so the gate below would
      # weigh one tree's pages against another tree's records. Run 33270983446
      # failed exactly there: /console/ read 746 B under a record that arrived
      # with the rebase, while the build it measured was 5 B off the record its
      # own source carried. The day was fine and had already published.
      #
      # So this runs when a commit step above rewrote the checkout and not
      # otherwise. Both of them are named: the day's commit stages the digest,
      # the fold's stages `frontend/public/telemetry`, and the console pages read
      # that - so either one rebasing leaves this build's input stale. An `if:`
      # naming only the first would skip the rebuild on the second and put run
      # 33270983446 back.
      #
      # An output nobody wrote is the empty string, so a commit step that was
      # skipped or that died before it could answer reads as "no rebase" and
      # this step does not run. That is the right answer: the tree was not
      # pushed, so there is nothing to rebuild against, and a commit step that
      # failed has already failed the job.
      #
      # What this saves today is nothing, and the reason is worth writing down.
      # Measured 2026-09-09 over the 20 most recent successful runs
      # (33901670861 through 34260129217): the day's push lost the race in 20 of
      # 20, so the rebuild was needed every time. It costs a median 24 s, spread
      # 17-27 s. The cause is this job racing its own run - the checkout above
      # is main's tip at trigger time, and `plan` and every `work` shard have
      # pushed to main since. Fix that and this `if:` starts paying: 24 s times
      # five publishes a day, about two minutes of wall-clock a day.
      #
      # `npm ci` is deliberately not repeated. frontend/package-lock.json moved
      # 8 times in 60 days against about 8 frontend source commits a day, so a
      # reinstall would delete node_modules on every run to cover the rarer of
      # the two. The build alone is 17 s and writes only gitignored output.
      - name: Rebuild the site against the tree that was pushed
        if: >-
          steps.commit_day.outputs.rebased == 'true'
          || steps.commit_fold.outputs.rebased == 'true'
        working-directory: frontend
        run: npm run build

      # The other severity, and the reason it is down here. A page heavier than
      # the weight recorded for it in config/idhazh.json still reads correctly:
      # what grew is the document, not the meaning. Losing the day for it also
      # throws away the two to three hours that built it, to hold a number we
      # wrote down ourselves. So the day publishes first.
      #
      # It stays fatal. The job goes red, main's next CI goes red with it, and
      # somebody re-measures the ceiling - one line in config/idhazh.json.
      #
      # It reads the rebuild above, so its numbers describe the tree that was
      # pushed rather than the one this job started from.
      - name: Bundle gate - encoder, page ceilings and payload ceilings
        working-directory: frontend
        run: npm run bundle-gate

      # Every visual decision this day made, laid out so a person can look at
      # them and say whether the machine kept the visual they would have kept.
      # It gates nothing: nothing downloads this, nothing reads it back, and no
      # publish decision can (../../CLAUDE.md section 0a).
      #
      # This job because it is the only one holding every population at once -
      # `items-*` carries the decisions and `shard-visuals-*` carries the
      # drawings - and a job of its own would re-pay a checkout, an install and
      # a second download of both to isolate about twenty seconds of file
      # copying.
      #
      # Last, and `continue-on-error`, for the reason the corpus harvest carries
      # it: what this job owes a reader is the published day, and a contact
      # sheet is further from the reader than the training corpus is. The
      # step-level bound is what `continue-on-error` cannot give - it does not
      # stop a hung step spending the job's remaining minutes.
      #
      # The tree lands under backend/var/, which .gitignore already covers, so
      # no commit step names it and no rebuild owns it.
      # `always()` because the upload below already carries one, and an upload
      # reachable on a failed day with nothing to upload records nothing. The
      # decisions this reads came out of the `items-*` artifact, which a failed
      # push does not touch.
      - name: Build the day's review tree
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python backend/utilities/review_queue.py \
            --date "${{ needs.plan.outputs.date }}" \
            --budget-mb 5

      # Seven days, and the number is not the evidence package's 14. A review
      # tree is rebuilt by every run that publishes a day, so a reviewer who
      # misses a week loses freshness and nothing else; `evidence-*` is 14
      # because a missed day there is an article body that cannot be recovered,
      # and that reason does not transfer.
      #
      # What it costs, stated rather than implied: the `--budget-mb` above caps
      # one run's tree at 5 MB, so the five cron slots held for seven days is
      # 175 MB worst case against the 500 MB of artifact storage Guardrail #2
      # allows - 35 percent, and that assumes every run fills its whole budget.
      # A typical day's rendered set has measured 324,580 bytes
      # (../../docs/concepts/adaptive-pruning.md, 2026-09-13), which puts the
      # real figure near 5 percent.
      #
      # `if: always()`, because the step above may have degraded and a partial
      # sheet is still worth looking at.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review
          path: backend/var/review/${{ needs.plan.outputs.date }}/
          retention-days: 7
          if-no-files-found: ignore
