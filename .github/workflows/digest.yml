name: Content refresh

# Plan once, run work shards, and publish completed items.
# Workflow rules: docs/reference/github-actions.md.

on:
  schedule:
    # Separate UTC cron entries identify each slot in github.event.schedule.
    # Run off the hour to reduce scheduler contention.
    - cron: '20 2 * * *'
    - cron: '20 6 * * *'
    - cron: '20 10 * * *'
    - cron: '20 14 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Digest date (YYYY-MM-DD). Defaults to today, UTC.'
        default: ''
      shards:
        description: 'Total work-shard jobs'
        type: choice
        default: '8'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
      faithfulness:
        description: 'Run the faithfulness scorer (slow first run - downloads weights)'
        type: boolean
        default: true
      article_limit:
        description: 'Plan at most this many articles, best first, for a short test run. Blank plans the full day.'
        default: ''

permissions:
  contents: write

# Writer identities and commit retries handle overlapping runs.

# Model settings and the runtime pin are read from config, not copied here.
env:
  # Runner-local health probe; inference uses model_server.base_url from config.
  MODEL_SERVER_PROBE: 'http://127.0.0.1:8080'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.decide.outputs.date }}
      day_dir: ${{ steps.decide.outputs.day_dir }}
      plan_dir: ${{ steps.decide.outputs.plan_dir }}
      shards: ${{ steps.fanout.outputs.shards }}
      matrix: ${{ steps.fanout.outputs.matrix }}
      shard_timeout_minutes: ${{ steps.bounds.outputs.shard_timeout_minutes }}
      faithfulness: ${{ steps.decide.outputs.faithfulness }}
      llama_cpp_build: ${{ steps.runtime.outputs.llama_cpp_build }}
    steps:
      # Start before checkout so elapsed time includes setup.
      - name: Stamp the plan clock
        run: |
          set -euo pipefail
          echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - id: decide
        env:
          # Pass dispatch input as data, not interpolated shell code.
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DATE="${DISPATCH_DATE:-}"
          [ -n "$DATE" ] || DATE=$(date -u +%F)
          # Reject malformed dates before they become published paths.
          if ! [[ "$DATE" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "date must be YYYY-MM-DD, and it becomes the day's address" >&2
            exit 1
          fi
          # Scheduled runs have no inputs; compare faithfulness as a string.
          FAITH="${{ inputs.faithfulness }}"
          [ -n "$FAITH" ] || FAITH=true
          echo "day_dir=frontend/public/digest/${DATE//-//}" >> "$GITHUB_OUTPUT"
          # The run-plan ledger's folder for this day: the plan job hands it on.
          echo "plan_dir=state/raw/run-plan/${DATE//-//}" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "faithfulness=$FAITH" >> "$GITHUB_OUTPUT"

      # Share the installed runtime pin with cache keys and run manifests.
      - id: runtime
        name: Say which llama.cpp build this run installs
        run: |
          set -euo pipefail
          python3 backend/utilities/model_runtime.py print-pinned-build \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # Publish the validated timeout before worker job expressions resolve.
      - id: bounds
        run: |
          set -euo pipefail
          python3 backend/utilities/shard_bound.py >> "$GITHUB_OUTPUT"

      - name: Say which slot this is and how late it started
        if: github.event_name == 'schedule'
        env:
          SLOT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          SLOT_MINUTE=$(printf '%s' "$SLOT" | cut -d' ' -f1)
          SLOT_HOUR=$(printf '%s' "$SLOT" | cut -d' ' -f2)
          # Force decimal arithmetic for zero-padded UTC clock fields.
          ASKED=$(( 10#$SLOT_HOUR * 60 + 10#$SLOT_MINUTE ))
          NOW=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          LATE=$(( NOW - ASKED ))
          # A negative difference means the slot ran after midnight.
          [ "$LATE" -ge 0 ] || LATE=$(( LATE + 1440 ))
          echo "slot ${SLOT_HOUR}:${SLOT_MINUTE} UTC, started ${LATE} minutes late"
          if [ "$LATE" -ge 120 ]; then
            echo "::warning title=Late run::Slot ${SLOT_HOUR}:${SLOT_MINUTE} UTC started ${LATE} minutes late. GitHub queues scheduled runs by load and drops slots it cannot place - see docs/reference/github-actions.md."
          fi

      # Checkout uses the trigger commit; refresh state before planning writes it.
      - name: Take the run state from the tip, not from the trigger commit
        run: python3 backend/utilities/take_state_from_the_tip.py state --date "${{ steps.decide.outputs.date }}"

      # github.run_id gives every shard the same unique execution identity.
      # A blank article limit (every scheduled run) plans the full day.
      - name: Plan the day
        env:
          # Pass dispatch input as data, not interpolated shell code.
          DISPATCH_ARTICLE_LIMIT: ${{ inputs.article_limit }}
        run: |
          set -euo pipefail
          LIMIT=()
          if [ -n "${DISPATCH_ARTICLE_LIMIT:-}" ]; then
            if ! [[ "$DISPATCH_ARTICLE_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
              echo "article_limit must be blank or a whole number of at least 1" >&2
              exit 1
            fi
            LIMIT=(--article-limit "$DISPATCH_ARTICLE_LIMIT")
          fi
          python backend/utilities/digest_publish.py run plan \
            --date "${{ steps.decide.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            "${LIMIT[@]}"

      # The probe needs the plan's execution ID and an otherwise idle runner.
      - name: What machine this job drew
        run: |
          set -euo pipefail
          python backend/utilities/digest_publish.py run fingerprint \
            --date "${{ steps.decide.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --shard 0 \
            --job plan

          # Size workers after planning; a dispatch count overrides the configured size.
          # Use the same count for the matrix and its concurrency cap.
      - id: fanout
        run: |
          set -euo pipefail
          SHARD_PATTERN='^[1-8]$'
          SHARDS="${{ inputs.shards }}"
          if [ -z "$SHARDS" ]; then
            SHARDS=$(python -m idhazh shards --date "${{ steps.decide.outputs.date }}" --execution "${{ github.run_id }}")
            # Clamp derived counts to the dispatch range; reject invalid inputs below.
            while [ "$SHARDS" -gt 1 ] && ! [[ "$SHARDS" =~ $SHARD_PATTERN ]]; do
              SHARDS=$((SHARDS - 1))
            done
          fi
          if ! [[ "$SHARDS" =~ $SHARD_PATTERN ]]; then
            echo "shards must be an integer from 1 through 8" >&2
            exit 1
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      # Record elapsed time before committing; commit and upload time are excluded.
      - name: What this job cost
        run: |
          set -euo pipefail
          python backend/utilities/digest_publish.py run job-clock \
            --date "${{ steps.decide.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --job plan \
            --shard 0 \
            --job-started-at "${JOB_STARTED_AT:-}"

          # Persist seen and health records even if workers fail later.
          # A failed push must not prevent the plan artifact from reaching workers.
      - name: Commit what the plan saw
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "plan: ${{ steps.decide.outputs.date }}"
        run: >-
          python backend/utilities/digest_publish.py plan
          --date "${{ steps.decide.outputs.date }}"
          --execution "${{ github.run_id }}" --commit "${{ github.sha }}"

      # Hand this day's run plans on even after a failed push; fail here if the plan
      # stage wrote none. Later jobs pick their own run's plan by --execution.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan
          path: ${{ steps.decide.outputs.plan_dir }}/
          retention-days: 1
          if-no-files-found: error

  # The worker timeout comes from run.shard_timeout_minutes in config.
  work:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.shard_timeout_minutes) }}
    strategy:
      fail-fast: false
      # Match the planned count so larger dispatches do not queue sibling shards.
      max-parallel: ${{ fromJSON(needs.plan.outputs.shards) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Include checkout, installation, cache restore and model startup in timing.
      - name: Stamp the shard clock
        run: |
          set -euo pipefail
          echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install before commands that import idhazh.
      # CPU-only torch avoids unused GPU dependencies in the faithfulness extra.
      - name: Install
        run: |
          if [ "${{ needs.plan.outputs.faithfulness }}" = "false" ]; then
            pip install -e .
          else
            pip install --index-url https://download.pytorch.org/whl/cpu torch
            pip install -e ".[faithfulness]"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: ${{ needs.plan.outputs.plan_dir }}/

      # Probe before the model server consumes memory and bandwidth.
      - name: What machine this job drew
        run: |
          set -euo pipefail
          python backend/utilities/digest_publish.py run fingerprint \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --shard ${{ matrix.shard }} \
            --job work

          # Share runtime setup and caches with the other model workflows.
      - uses: ./.github/actions/model-server
        id: model_server
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          probe_url: ${{ env.MODEL_SERVER_PROBE }}
          llama_cpp_build: ${{ needs.plan.outputs.llama_cpp_build }}

      # Verify each server's template, prefix cache, grammar, architecture and window.
      # A healthy endpoint alone does not prove the configured model entry is correct.
      # Contract: docs/architecture/summarize/model-boundary.md.
      - name: The server proves the entry
        run: |
          set -euo pipefail
          python3 backend/utilities/prove_the_entry.py --config-root config

      # Record host, runtime and weights even if the shard fails.
      - name: What this runner is
        if: always()
        env:
          LLAMA_CPP_BUILD: ${{ needs.plan.outputs.llama_cpp_build }}
          MODEL_PATH: ${{ steps.model_server.outputs.weights_path }}
        run: |
          echo "pinned llama.cpp build: ${LLAMA_CPP_BUILD}"
          grep -m1 'model name' /proc/cpuinfo || true
          nproc || true
          grep -m1 'system_info' llama-server.log || true
          LD_LIBRARY_PATH=backend/bin backend/bin/llama-server --version 2>&1 | head -3 || true
          sha256sum backend/bin/llama-server || true
          sha256sum "${MODEL_PATH}" || true

      # Detach the sampler so it survives this step; track the sampler's own PID.
      - name: Sample memory
        run: |
          set -euo pipefail
          python3 backend/utilities/memory_sampler.py start-sampler \
            --pid "$(cat llama-server.pid)"

      # Stamp the same runtime build that the model-server action installed.
      - name: Work the shard
        env:
          LLAMA_CPP_BUILD: ${{ needs.plan.outputs.llama_cpp_build }}
        run: |
          python backend/utilities/digest_publish.py run work \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }} \
            ${{ needs.plan.outputs.faithfulness == 'false' && '--no-faithfulness' || '' }}

      - name: Runtime log on failure
        if: failure()
        run: tail -50 llama-server.log || true

      # Record partial results first in the cancellation grace period.
      # Reporting failures must not block the items artifact.
      - name: Record what this shard measured
        if: always()
        continue-on-error: true
        run: |
          python backend/utilities/digest_publish.py run record \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }}

      # Read cumulative counters once, before job-clock consumes them.
      - name: What the server counted
        if: always()
        continue-on-error: true
        run: |
          curl -sf --max-time 30 "${MODEL_SERVER_PROBE}/metrics" -o llama-metrics.prom || true
          if [ -s llama-metrics.prom ]; then
            # Print all counters and name missing expected series after runtime changes.
            grep -E '^llamacpp:' llama-metrics.prom || true
            for series in llamacpp:n_busy_slots_per_decode llamacpp:n_tokens_max \
                          llamacpp:prompt_tokens_total llamacpp:prompt_seconds_total; do
              grep -m1 "^${series} " llama-metrics.prom \
                || echo "${series}: this build does not publish it"
            done
          else
            echo "no metrics: llama-server was already gone, or the role's inference.metrics is off"
          fi
          # Capture the runner's cgroup peak here; the portable stage reads this file.
          if [ -f /sys/fs/cgroup/memory.peak ]; then
            echo "cgroup_memory_peak_bytes=$(cat /sys/fs/cgroup/memory.peak)" > memory-peak.txt
          else
            echo "cgroup_memory_peak_bytes=unavailable" > memory-peak.txt
          fi

      # Combine startup timing, the server log and counters in the host record.
      # An absent start stamp leaves a missing reading, not a failed shard.
      - name: What this job cost
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python backend/utilities/digest_publish.py run job-clock \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --job work \
            --shard ${{ matrix.shard }} \
            --job-started-at "${JOB_STARTED_AT:-}" \
            --server-log llama-server.log \
            --counters-file llama-metrics.prom

          # The shard's deadline in config/push-retry.json leaves time to upload items.
      - name: Commit what this shard measured
        if: always()
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "work: ${{ needs.plan.outputs.date }} shard ${{ matrix.shard }}"
          SHARD: ${{ matrix.shard }}
        run: >-
          python backend/utilities/digest_publish.py work
          --date "${{ needs.plan.outputs.date }}"
          --execution "${{ github.run_id }}" --commit "${{ github.sha }}"
          --shard "${{ matrix.shard }}"

      - name: Prompt cache log summary
        if: always()
        run: |
          if [ ! -f llama-server.log ]; then
            echo "llama-server.log not found"
            exit 0
          fi
          # Runtime lines start with a timestamp and level before the srv/slot tag.
          # Match alternate context-field spellings across runtime builds.
          pattern='^[0-9.]+ [A-Z] (srv|slot) |n_ctx_slot|n_ctx_seq|n_ctx_per_seq'
          grep -E "$pattern" llama-server.log || true
          # Report match coverage so a runtime log-format change stays visible.
          matched=$(grep -cE "$pattern" llama-server.log || true)
          total=$(wc -l < llama-server.log)
          echo "matched ${matched:-0} of ${total} lines of llama-server.log"
          # f_sim_best measures reuse against the new prompt; f_keep against the old slot.
          for field in f_sim_best f_keep; do
            grep -oE "${field} = [0-9.]+" llama-server.log | awk '{ print $3 }' | sort -n | awk -v field="$field" '
              { v[NR] = $1 + 0 }
              END {
                if (NR == 0) { printf "%s: no samples\n", field; exit }
                for (i = 1; i <= NR; i++) { b = int(v[i] * 10); if (b > 9) b = 9; bucket[b]++ }
                line = ""
                for (b = 0; b <= 9; b++) line = line sprintf(" %.1f:%d", b / 10, bucket[b] + 0)
                printf "%s: n=%d min=%.3f median=%.3f max=%.3f buckets%s\n", field, NR, v[1], v[int((NR + 1) / 2)], v[NR], line
              }'
          done

      - name: What memory this shard used
        if: always()
        run: |
          cat memory-peak.txt 2>/dev/null || echo "memory-peak.txt not found"
          python3 backend/utilities/memory_sampler.py summarize

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-log-${{ matrix.shard }}
          path: |
            llama-server.log
            rss-samples.jsonl
            python-procs.jsonl
            memory-peak.txt
            llama-metrics.prom
          retention-days: 2
          if-no-files-found: ignore

      # Keep article text for training-corpus backfill.
      # Upload completed items even after failure or timeout.
      # A rendered chart travels inside its decision; assemble writes the file.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: items-${{ matrix.shard }}
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/
          retention-days: 7
          if-no-files-found: ignore

      # Retain article/summary evidence for manual faithfulness labelling.
      # See docs/how-to/label-the-faithfulness-queue.md.
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.shard }}
          path: backend/var/evidence/${{ needs.plan.outputs.date }}/
          retention-days: 14
          if-no-files-found: ignore

      # Retain prompts and replies for regression comparisons, not site publication.
      # logging.capture_prompts and logging.capture_replies control collection.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-${{ matrix.shard }}
          path: backend/var/run/${{ needs.plan.outputs.date }}/captures/
          retention-days: 90
          if-no-files-found: ignore

  assemble:
    needs: [plan, work]
    # Keep completed work when workers fail; require a successful plan.
    # !cancelled() overrides implicit success() without reviving cancelled runs.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Start before checkout so elapsed time includes setup, as plan and work do.
      - name: Stamp the assemble clock
        run: |
          set -euo pipefail
          echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: ${{ needs.plan.outputs.plan_dir }}/

      # Before the embeddings and the site build, which want the runner the
      # bandwidth reading wants.
      - name: What machine this job drew
        continue-on-error: true
        run: |
          set -euo pipefail
          python backend/utilities/digest_publish.py run fingerprint \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --shard 0 \
            --job assemble

      - uses: actions/download-artifact@v8
        with:
          pattern: items-*
          merge-multiple: true
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/

      - name: Assemble and publish
        run: |
          python backend/utilities/digest_publish.py run assemble \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --runner ubuntu-latest

      - name: Harvest the training corpus
        # Harvest while downloaded item text is available.
        # The stage enforces finetune.harvest_every_days; failure must not block publication.
        continue-on-error: true
        run: python backend/utilities/digest_publish.py run harvest --date "${{ needs.plan.outputs.date }}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the site
        working-directory: frontend
        run: npm ci

      # Validate this run's day before committing; older days are unchanged.
      # The site build does not read every story fetched later by the browser.
      - name: The day this run wrote still matches its contracts
        run: python -m idhazh check-publication --day "${{ needs.plan.outputs.date }}"

      - name: Build the site
        working-directory: frontend
        run: npm run build

      # Measure the built deployment tree, not the smaller committed payloads.
      # Stop before committing if the built site exceeds the Pages size cap.
      - name: Measure the built site against the Pages cap
        working-directory: frontend
        run: python -m idhazh site-weight --site-tree build

      - name: Check published ledger columns
        working-directory: frontend
        run: python -m idhazh published-columns --site-tree build

      # Read rebuild-owned paths from their shared declaration.
      # Record elapsed time before committing; commit and push time are excluded,
      # as they are for plan and work. No server log or counters: assemble stands
      # no model server up, so those two readings are not its to take.
      - name: What this job cost
        continue-on-error: true
        run: |
          set -euo pipefail
          python backend/utilities/digest_publish.py run job-clock \
            --date "${{ needs.plan.outputs.date }}" \
            --execution "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --job assemble \
            --shard 0 \
            --job-started-at "${JOB_STARTED_AT:-}"

      # Preserve completed raw/artifacts; rebuild derived outputs on fresh main.
      # Corpus replay rolls the actual incoming rows into the newest window.
      - name: Commit the day
        id: commit_day
        env:
          COMMIT_MESSAGE: "digest: ${{ needs.plan.outputs.date }}"
        run: >-
          python backend/utilities/digest_publish.py assemble
          --date "${{ needs.plan.outputs.date }}"
          --execution "${{ github.run_id }}" --commit "${{ github.sha }}"

      # Materialize only published named inputs; HEAD/index remain code-pinned.
      - name: Read the actual published inputs
        env:
          PUBLISHED_TIP: ${{ steps.commit_day.outputs.candidate }}
        run: python backend/utilities/digest_publish.py published-inputs --tip "$PUBLISHED_TIP"

      - name: Rebuild the site against the tree that was pushed
        working-directory: frontend
        run: npm run build

      # Run the bundle gate after committing: excess page weight must not discard
      # a valid day. A failure still marks the job red.
      - name: Bundle gate - encoder, page ceilings and payload ceilings
        working-directory: frontend
        run: npm run bundle-gate

      # Review downloaded items and charts without gating publication.
      # Keep failed-day results; a step timeout bounds optional work.
      - name: Build the day's review tree
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python backend/utilities/review_queue.py \
            --date "${{ needs.plan.outputs.date }}" \
            --budget-mb 5

          # Retain partial review results even when review generation fails.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review
          path: backend/var/review/${{ needs.plan.outputs.date }}/
          retention-days: 7
          if-no-files-found: ignore
