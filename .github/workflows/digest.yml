name: Content refresh

# The run, five times a day. An orchestrator that never does the work,
# disposable workers that do, and an assemble step that publishes whatever
# finished.
#
# The shape mirrors the runner's own economics (Rule #2): weights are
# restored once per JOB rather than once per run, so a worker handles a shard of
# several items to amortize the restore rather than one item per machine.

on:
  schedule:
    # Five UTC runs, four hours apart. A story that broke at 07:00 waited a full
    # day under a daily schedule, and the digest is only worth opening if it is
    # current.
    #
    # The 02:20 slot exists so a finished digest is waiting before 06:30. A
    # scheduled run here starts 40-70 min after its cron minute and then takes
    # 164-184 min (ubuntu-latest, 2026-08-23/24, n=3), so the old 06:20 first
    # slot did not publish until about 10:30.
    #
    # :20, not :00. GitHub queues scheduled jobs by load and the top of the hour
    # is the busiest minute on the platform; twenty past costs a reader nothing
    # and buys a run that starts closer to when it was asked for.
    - cron: '20 2,6,10,14,18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Digest date (YYYY-MM-DD). Defaults to today, UTC.'
        default: ''
      shards:
        description: 'Total work-shard jobs'
        type: choice
        default: '4'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      faithfulness:
        description: 'Run the faithfulness scorer (slow first run - downloads weights)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

env:
  MODEL_REPO: Qwen/Qwen3-8B-GGUF
  MODEL_FILE: Qwen3-8B-Q4_K_M.gguf
  ROUTE_REPO: Qwen/Qwen3-4B-GGUF
  ROUTE_FILE: Qwen3-4B-Q4_K_M.gguf
  # The same build the measurement harness pins, so a number measured in
  # measure.yml describes the binary that produces the digest.
  LLAMA_CPP_BUILD: b10598
  LLAMA_CPP_ASSET: llama-b10598-bin-ubuntu-x64.tar.gz
  LLAMA_CPP_SHA256: d77a09db4165f8850b513629ed0ffeaab7851bb03e7cc3870b74e721f894694c

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.decide.outputs.date }}
      shards: ${{ steps.decide.outputs.shards }}
      matrix: ${{ steps.decide.outputs.matrix }}
      faithfulness: ${{ steps.decide.outputs.faithfulness }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - id: decide
        run: |
          set -euo pipefail
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE=$(date -u +%F)
          SHARDS="${{ inputs.shards }}"
          [ -n "$SHARDS" ] || SHARDS=4
          SHARD_PATTERN='^[1-4]$'
          if ! [[ "$SHARDS" =~ $SHARD_PATTERN ]]; then
            echo "shards must be an integer from 1 through 4" >&2
            exit 1
          fi
          # A scheduled run has no inputs at all, so every one of these is the
          # empty string and every one needs its default here. `faithfulness`
          # is normalized to a STRING for the same reason: read as a boolean,
          # the empty string compares equal to `false` and silently turned the
          # scorer off on every scheduled run - which is every automatic run.
          FAITH="${{ inputs.faithfulness }}"
          [ -n "$FAITH" ] || FAITH=true
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "faithfulness=$FAITH" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      # No weights load here. The plan job is feed reads and arithmetic, and it
      # finishes in seconds - which is what makes fanning out afterwards cheap.
      - name: Plan the day
        run: python -m idhazh plan --date "${{ steps.decide.outputs.date }}"

      # The plan job writes the sight and health ledgers, so the plan job commits
      # them - not assemble. A run that dies in the worker still saw what it saw,
      # and the next run needs that: first sight is the only age an undated
      # article has, and a feed we never recorded is a feed we cannot quarantine.
      # A bad day is exactly the day worth measuring, so waiting for a successful
      # publish would lose the records that matter most.
      - name: Commit what the plan saw
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen state/feed-health
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "plan: ${{ steps.decide.outputs.date }}"
          # The ledgers are in a commit by this point, so anything still in the
          # working tree is runner noise. A rebase refuses to start while it is
          # there, and refusing loses the sight and health records this step
          # exists to keep. Discard the noise, and print it so the run log names
          # whatever produced it.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            NOISE=$(git status --porcelain --untracked-files=no)
            if [ -n "$NOISE" ]; then
              echo "discarding working-tree noise before the rebase:"
              echo "$NOISE"
              git checkout -- .
            fi
            git pull --rebase origin main
          done
          echo "could not push what the plan saw after three attempts" >&2
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: backend/var/run/${{ steps.decide.outputs.date }}/plan.json
          retention-days: 1

  work:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      # Restored once per JOB, not once per run. Four workers pay this four
      # times, and it is the single largest fixed cost in the pipeline.
      #
      # The key names the build. The fetch below only runs on a miss, so without
      # the build in the key a cached binary stays frozen until the entry is
      # evicted, then silently becomes a different one.
      - name: Cache weights and runtime
        id: weights
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: llm-${{ env.MODEL_FILE }}-${{ env.LLAMA_CPP_BUILD }}-v3

      - name: Fetch runtime and weights
        if: steps.weights.outputs.cache-hit != 'true'
        # One pinned build, checked against its digest before anything runs from
        # it. Authenticated, because four shards and the router all ask at once
        # and anonymous api.github.com allows 60 requests an hour.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          # `cp -a`, not `find -type f`. These builds ship versioned shared
          # objects as symlinks - libllama-common.so.0 points at the real file -
          # and `-type f` skips a symlink, so the server died at exec on a
          # library that had been "copied".
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          chmod +x backend/bin/llama-server
          curl -sSL -o "backend/models/${MODEL_FILE}" \
            "https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE}?download=true"

      # No `if:`. This runs on a cache hit as well as a miss, because a restored
      # entry is the one case where nobody watched the bytes arrive. It sits
      # before the server starts, so wrong weights cost one step instead of a
      # shard of summaries filed under a model that never ran (Rule #10).
      - name: Verify the weights
        run: |
          set -euo pipefail
          EXPECTED=$(python -c 'import json; print(json.load(open("config/idhazh.json", encoding="utf-8"))["models"]["summarize"]["sha256"] or "")')
          if [ -z "$EXPECTED" ]; then
            echo "config records no sha256 for models.summarize" >&2
            exit 1
          fi
          echo "${EXPECTED}  backend/models/${MODEL_FILE}" | sha256sum --check

      - name: Start the model
        run: |
          set -euo pipefail
          chmod +x backend/bin/llama-server
          MODEL_ALIAS=$(python -c 'import json; print(json.load(open("config/idhazh.json", encoding="utf-8"))["models"]["summarize"]["id"])')
          MODEL_ARGV=$(python backend/utilities/llama_server_argv.py --config config \
            --binary backend/bin/llama-server --weights "backend/models/${MODEL_FILE}" \
            --alias "$MODEL_ALIAS" \
            --format shell)
          mapfile -d '' LLAMA_ARGV < <(python backend/utilities/llama_server_argv.py --config config \
            --binary backend/bin/llama-server --weights "backend/models/${MODEL_FILE}" \
            --alias "$MODEL_ALIAS" \
            --format nul)
          echo "starting: $MODEL_ARGV"
          LD_LIBRARY_PATH=backend/bin nohup "${LLAMA_ARGV[@]}" > llama-server.log 2>&1 &
          echo "$!" > llama-server.pid
          sleep 2
          kill -0 "$(cat llama-server.pid)" || {
            echo "llama-server exited before install" >&2
            tail -50 llama-server.log >&2
            exit 1
          }

      - name: Install
        run: |
          if [ "${{ needs.plan.outputs.faithfulness }}" = "false" ]; then
            pip install -e .
          else
            pip install -e ".[faithfulness]"
          fi

      - name: Check model health
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 5
          done
          # Assert it, do not hope. Without this the loop simply ends, every
          # item fails as "model unreachable", and the run publishes an empty
          # day that looks like a quiet news day.
          curl -sf http://127.0.0.1:8080/health > /dev/null || {
            echo "llama-server never became healthy" >&2
            tail -50 llama-server.log >&2
            exit 1
          }
          # Healthy says a server answers. It does not say which weights it
          # answers for, and every summary and eval row is filed under the
          # config alias whether or not the server agrees.
          MODEL_ALIAS=$(python -c 'import json; print(json.load(open("config/idhazh.json", encoding="utf-8"))["models"]["summarize"]["id"])')
          curl -sf http://127.0.0.1:8080/v1/models \
            | jq -e --arg alias "$MODEL_ALIAS" '[.data[].id] | index($alias) != null' > /dev/null || {
            echo "the server does not serve ${MODEL_ALIAS}" >&2
            curl -s http://127.0.0.1:8080/v1/models >&2 || true
            exit 1
          }
          curl -sf http://127.0.0.1:8080/props \
            | jq -e --arg file "$MODEL_FILE" '[.. | strings | select(endswith($file))] | length > 0' > /dev/null || {
            echo "the loaded weights are not ${MODEL_FILE}" >&2
            curl -s http://127.0.0.1:8080/props >&2 || true
            exit 1
          }

      - name: Work the shard
        run: |
          python -m idhazh work \
            --date "${{ needs.plan.outputs.date }}" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }} \
            ${{ needs.plan.outputs.faithfulness == 'false' && '--no-faithfulness' || '' }}

      - name: Runtime log on failure
        if: failure()
        run: tail -50 llama-server.log || true

      - name: Prompt cache log summary
        if: always()
        run: |
          if [ -f llama-server.log ]; then
            grep -E 'selected slot by|kv cache rm \[|prompt eval time =|n_slots|n_ctx_slot|n_ctx_per_seq' llama-server.log || true
          else
            echo "llama-server.log not found"
          fi

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-log-${{ matrix.shard }}
          path: llama-server.log
          retention-days: 2
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: items-${{ matrix.shard }}
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/
          retention-days: 1
          if-no-files-found: ignore

  # Visual routing runs on the small model, in its own job, because one
  # llama-server serves one set of weights. It is deliberately unable to stop a
  # publication: `continue-on-error` plus assemble's `always()` means a router
  # that never starts costs every item its picture and costs the day nothing.
  #
  # This bound is the backstop, not the budget. The stage stops itself at
  # `run.route_budget_minutes` in config/idhazh.json, which is set below this
  # number with room for the fixed cost and one worst-case item. Raising this
  # number is not the fix for a slow router (Rule #2); lowering that one is.
  route:
    needs: [plan, work]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache the router weights and runtime
        id: router
        uses: actions/cache@v6
        with:
          path: |
            backend/models
            backend/bin
          key: llm-${{ env.ROUTE_FILE }}-${{ env.LLAMA_CPP_BUILD }}-v3

      - name: Fetch runtime and router weights
        if: steps.router.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/bin backend/models
          URL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_BUILD}" \
            | jq -r --arg asset "$LLAMA_CPP_ASSET" \
              'if type=="object" then ([.assets[] | select(.name == $asset)][0].browser_download_url // "") else "" end')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "pinned llama.cpp asset not found: ${LLAMA_CPP_BUILD}/${LLAMA_CPP_ASSET}" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o llama.tar.gz "$URL"
          echo "${LLAMA_CPP_SHA256}  llama.tar.gz" | sha256sum --check
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          SRC=$(dirname "$(find llama -type f -name 'llama-server' | head -1)")
          cp -a "$SRC"/. backend/bin/
          chmod +x backend/bin/llama-server
          curl -sSL -o "backend/models/${ROUTE_FILE}" \
            "https://huggingface.co/${ROUTE_REPO}/resolve/main/${ROUTE_FILE}?download=true"

      - name: Start the router
        run: |
          set -euo pipefail
          chmod +x backend/bin/llama-server
          ROUTE_ALIAS=$(python -c 'import json; print(json.load(open("config/idhazh.json", encoding="utf-8"))["models"]["route"]["id"])')
          ROUTE_ARGV=$(python backend/utilities/llama_server_argv.py --config config \
            --binary backend/bin/llama-server --weights "backend/models/${ROUTE_FILE}" \
            --alias "$ROUTE_ALIAS" \
            --format shell)
          mapfile -d '' LLAMA_ARGV < <(python backend/utilities/llama_server_argv.py --config config \
            --binary backend/bin/llama-server --weights "backend/models/${ROUTE_FILE}" \
            --alias "$ROUTE_ALIAS" \
            --format nul)
          echo "starting: $ROUTE_ARGV"
          LD_LIBRARY_PATH=backend/bin nohup "${LLAMA_ARGV[@]}" > router.log 2>&1 &
          echo "$!" > router.pid
          sleep 2
          kill -0 "$(cat router.pid)" || {
            echo "the router exited before install" >&2
            tail -50 router.log >&2
            exit 1
          }

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      - uses: actions/download-artifact@v8
        with:
          pattern: items-*
          merge-multiple: true
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/

      - name: Check router health
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8080/health > /dev/null || {
            echo "the router never became healthy" >&2
            tail -50 router.log >&2
            exit 1
          }

      # The router's prefill rate varies 3x between runs (20.2 to 62.9 tok/s,
      # six runs 2026-08-24/25) while the prompt size and the decode rate stay
      # put, which is what decides whether a day fits its budget. The runner's
      # CPU is the remaining suspect and nothing recorded it, so record it.
      - name: What this runner is
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          nproc
          grep -m1 'system_info' router.log || true

      - name: Route and render
        run: python -m idhazh route --date "${{ needs.plan.outputs.date }}"

      - name: Router log on failure
        if: failure()
        run: tail -50 router.log || true

      - name: Router cache log summary
        if: always()
        run: |
          if [ -f router.log ]; then
            grep -E 'selected slot by|kv cache rm \[|prompt eval time =|n_slots|n_ctx_slot|n_ctx_per_seq' router.log || true
          else
            echo "router.log not found"
          fi

      - name: Upload router log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: router-log
          path: router.log
          retention-days: 2
          if-no-files-found: ignore

      # `always()`, because a cancelled job skips a step that has no condition.
      # Every route decision and every rendered chart lives only in this
      # artifact, so without it a router stopped for any reason hands assemble
      # nothing and the day publishes with no visuals at all - which is exactly
      # what four of the six runs on 2026-08-24/25 did.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routes
          path: |
            backend/var/run/${{ needs.plan.outputs.date }}/items/*.route.json
            frontend/public/digest/
          retention-days: 1
          if-no-files-found: ignore

  assemble:
    needs: [plan, work, route]
    # Always runs, even when a worker failed. A run that publishes nothing on a
    # bad day is a run whose bad days are invisible.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: backend/var/run/${{ needs.plan.outputs.date }}/

      - uses: actions/download-artifact@v8
        with:
          pattern: items-*
          merge-multiple: true
          path: backend/var/run/${{ needs.plan.outputs.date }}/items/

      # The routes and their rendered assets. `continue-on-error` above means
      # this artifact may simply not exist, which is the degraded-not-failed
      # path: every item then publishes with no picture.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: routes
          path: .

      - name: Assemble and publish
        run: |
          python -m idhazh assemble \
            --date "${{ needs.plan.outputs.date }}" \
            --commit "${{ github.sha }}" \
            --runner ubuntu-latest

      - name: Commit the day
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/digest frontend/public/telemetry state
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "digest: ${{ needs.plan.outputs.date }}"
          # The runner checked out a commit that may be minutes old, and a daily
          # job must not lose a day's work because someone pushed while it ran.
          #
          # The day is in a commit by this point, so every remaining working-tree
          # change is runner noise - a line ending, a build artifact, a file some
          # step left behind. A rebase refuses to start while any of it is there,
          # and refusing costs the reader a day that plan, four shards and
          # assemble all finished (section 1a: degrade, do not fail). Discard the
          # noise, and print it so the run log names whatever produced it.
          #
          # Untracked files are left alone: they cannot block a rebase, and a
          # later step may still want them.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            NOISE=$(git status --porcelain --untracked-files=no)
            if [ -n "$NOISE" ]; then
              echo "discarding working-tree noise before the rebase:"
              echo "$NOISE"
              git checkout -- .
            fi
            git pull --rebase origin main
          done
          echo "could not push the day after three attempts" >&2
          exit 1
