name: Text analysis results

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "spaCy: model profile"
        required: false
        default: md
        type: choice
        options:
          - sm
          - md
          - lg
      feature_mode:
        description: "spaCy: default = configured English defaults; all = every supported feature; custom = custom_features CSV"
        required: false
        default: default
        type: choice
        options:
          - default
          - all
          - custom
      custom_features:
        description: "spaCy: custom CSV, for example: entities, sentences, document_metrics"
        required: false
        type: string
      text:
        description: "Text analyzed by both providers; visible in dispatch, artifacts, and run summary"
        required: true
        type: string
        default: |-
          Artificial intelligence is attracting an increasingly large share of venture capital, but the funding remains concentrated among a handful of companies. According to Crunchbase, global startup funding reached approximately USD 510 billion in the first half of 2026, surpassing the USD 440 billion invested throughout 2025. AI companies alone accounted for about 80% of global venture funding in the first quarter.

          OpenAI secured USD 122 billion in committed capital in a single round at a post-money valuation of USD 852 billion in March. Anthropic subsequently raised USD 65 billion at a valuation of USD 965 billion in May, overtaking OpenAI.

          Yet while leading AI model developers continue to attract substantial investment, many businesses built around specialized applications have struggled to translate user adoption into profitability.

          As attention shifts from model capabilities and computing infrastructure to practical applications, startups face a different set of tests.

          Ahead of the main conference at Hong Kong FinTech Week x StartmeupHK 2026, 36Kr spoke with Tracy Ji, founding managing partner of Meridian Capital (also known as Huaying Capital), and Chin Yung Lu, acting head of startups at Invest Hong Kong. The pair shared how investors generally assess AI businesses, how founders should manage limited cash reserves, and what Hong Kong can offer companies expanding internationally.

permissions:
  contents: read

jobs:
  text_analysis:
    name: Text analysis - en / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEXT_ANALYSIS_LANGUAGE: en
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the tested checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TESTED_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TESTED_COMMIT" != "$EXPECTED_SHA" ]]; then
            echo "checked out commit does not match github.sha" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - name: Verify the provider dependency locks
        run: |
          uv lock --locked --project services/local_api_host
          uv lock --locked --project services/text_analysis/spacy
          uv lock --locked --project services/text_analysis/gliner

      - name: Sync the shared provider environment
        run: uv sync --project services/text_analysis/gliner --frozen --extra model --group dev

      - name: Prepare the selected spaCy model
        env:
          TEXT_ANALYSIS_PROFILE: ${{ inputs.profile }}
        run: >-
          uv run --project services/text_analysis/gliner --no-sync python
          services/text_analysis/spacy/scripts/prepare-selected-model.py

      - name: Prepare the configured GLiNER model
        run: >-
          uv run --project services/text_analysis/gliner --no-sync
          python services/text_analysis/gliner/scripts/prepare_model.py --root .

      - name: Check the prepared provider environment
        run: uv pip check --python services/text_analysis/gliner/.venv/bin/python

      - name: Analyze and report results
        env:
          TEXT_ANALYSIS_PROFILE: ${{ inputs.profile }}
          TEXT_ANALYSIS_FEATURE_MODE: ${{ inputs.feature_mode }}
          TEXT_ANALYSIS_CUSTOM_FEATURES: ${{ inputs.custom_features }}
          TEXT_ANALYSIS_OUTPUT_DIRECTORY: ${{ runner.temp }}/text-analysis-results
        run: >-
          uv run --project services/text_analysis/gliner --no-sync
          python tools/text-analysis-caller/run_analysis.py
          < "$GITHUB_EVENT_PATH"

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: text-analysis-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/text-analysis-results
          if-no-files-found: error
          retention-days: 90
