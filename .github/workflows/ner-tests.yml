name: Text-Analysis-NER-tests

on:
  workflow_dispatch:
    inputs:
      language:
        description: Configured language to test
        required: false
        type: choice
        options:
          - en
          - zh
      profile:
        description: Configure spaCy model profile
        required: false
        default: md
        type: choice
        options:
          - sm
          - md
          - lg
      feature_mode:
        description: "default: configured language defaults; all: every supported feature; custom: CSV from custom_features"
        required: false
        type: choice
        options:
          - default
          - all
          - custom
      custom_features:
        description: "Custom CSV, for example: entities, sentences, document_metrics"
        required: false
        type: string
      text:
        description: Text to analyze; visible in dispatch, request evidence, and run summary
        required: true
        type: string

permissions:
  contents: read

jobs:
  spacy_ner_test:
    name: spaCy live test - ${{ inputs.language }} / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the tested checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TESTED_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TESTED_COMMIT" != "$EXPECTED_SHA" ]]; then
            echo "checked out commit does not match github.sha" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install the shared TypeScript contracts
        run: bun install --frozen-lockfile --cwd packages/common-contracts

      - name: Check Unicode evidence spans
        run: bun test ./services/text_analysis/spacy/scripts/validate-evidence-spans.test.ts

      - name: Check existing Python host regressions
        run: >-
          uv run --project services/summary_evaluator --frozen --group dev
          pytest -c services/summary_evaluator/pyproject.toml
          services/summary_evaluator/tests/test_component_registration.py
          services/summary_evaluator/tests/test_server_lifecycle.py
          services/summary_evaluator/tests/test_trace_context.py

      - name: Verify the provider dependency locks
        run: |
          uv lock --locked --project services/local_api_host
          uv lock --locked --project services/text_analysis/spacy
          uv lock --locked --project services/text_analysis/gliner

      - name: Sync the shared provider environment
        run: uv sync --project services/text_analysis/gliner --frozen --extra model --group dev

      - name: Check native and shared API source
        working-directory: services/text_analysis/gliner
        env:
          MYPYPATH: ../hosting
        run: |
          uv run --no-sync ruff check src tests scripts ../../local_api_host/src ../hosting
          uv run --no-sync mypy src tests scripts ../../local_api_host/src ../hosting

      - name: Check native features and verification contracts
        env:
          PYTHONPATH: services/text_analysis/spacy/scripts
        run: >-
          uv run --project services/text_analysis/gliner --no-sync python
          -m unittest
          services/text_analysis/spacy/tests/test_named_entities.py
          services/text_analysis/spacy/tests/test_important_terms.py
          services/text_analysis/spacy/tests/test_api_contracts.py
          services/text_analysis/spacy/tests/test_spacy_verification.py

      - name: Prepare the selected spaCy model
        env:
          TEXT_ANALYSIS_LANGUAGE: ${{ inputs.language }}
          TEXT_ANALYSIS_PROFILE: ${{ inputs.profile }}
        run: >-
          uv run --project services/text_analysis/gliner --no-sync python
          services/text_analysis/spacy/scripts/prepare-selected-model.py

      - name: Run live text-analysis verification
        env:
          TEXT_ANALYSIS_LANGUAGE: ${{ inputs.language }}
          TEXT_ANALYSIS_PROFILE: ${{ inputs.profile }}
          TEXT_ANALYSIS_FEATURE_MODE: ${{ inputs.feature_mode }}
          TEXT_ANALYSIS_CUSTOM_FEATURES: ${{ inputs.custom_features }}
          TEXT_ANALYSIS_COMMIT_SHA: ${{ github.sha }}
          TEXT_ANALYSIS_EVIDENCE_DIRECTORY: ${{ runner.temp }}/spacy-tests
          TEXT_ANALYSIS_RUN_ID: ${{ github.run_id }}
          TEXT_ANALYSIS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          uv run --project services/text_analysis/gliner --no-sync python
          services/text_analysis/spacy/scripts/run-spacy-test.py
          < "$GITHUB_EVENT_PATH"

      - name: Upload text-analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: text-analysis-spacy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/spacy-tests/report.json
            ${{ runner.temp }}/spacy-tests/analysis-request.json
            ${{ runner.temp }}/spacy-tests/health-response.json
            ${{ runner.temp }}/spacy-tests/analysis-response.json
            ${{ runner.temp }}/spacy-tests/events.jsonl
            ${{ runner.temp }}/spacy-tests/report.md
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 90

      - name: Prepare the configured GLiNER model
        run: >-
          uv run --project services/text_analysis/gliner --no-sync
          python services/text_analysis/gliner/scripts/prepare_model.py --root .

      - name: Check the prepared provider environment
        run: uv pip check --python services/text_analysis/gliner/.venv/bin/python

      - name: Check the native and shared APIs
        env:
          PYTHONPATH: services/text_analysis/hosting
          TEXT_ANALYSIS_LANGUAGE: ${{ inputs.language }}
          TEXT_ANALYSIS_PROFILE: ${{ inputs.profile }}
        run: >-
          uv run --project services/text_analysis/gliner --no-sync
          pytest services/text_analysis/gliner/tests/test_api.py
          --junitxml="${{ runner.temp }}/gliner-api-results.xml"

      - name: Upload GLiNER API results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gliner-api-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gliner-api-results.xml
          if-no-files-found: error
          retention-days: 90
