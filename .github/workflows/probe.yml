name: Runtime probe

# What the runner and its pinned runtime report when asked directly, rather
# than read off a release note or assumed from how the platform is built. Every
# step below puts a question to the machine the job drew.
#
# The question that made this file: whether the pinned build takes the
# speculation kind a Gemma multi-token head needs. A models entry naming a
# kind the build cannot drive fails late and quietly - the server starts, loads
# the head, drafts nothing - so the answer costs an hour of bench time to learn
# the expensive way and about a minute to learn here.
#
# There is no input for a different build, on purpose. This installs the build
# `.github/scripts/llama-cpp-pin.sh` names, which is the build the runtime
# workflows run, so its answer cannot drift from the binary production uses.
# Probing a candidate build is a branch that moves the pin, dispatched with
# `--ref`, which is the same commit somebody would have to make to adopt it
# anyway.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: What this runner and its pinned runtime report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Does the guest expose a hardware performance monitoring unit? Six reads
      # of /proc and /sys - no package, no checkout, under a second - and they
      # go first so the reading lands whether or not the install below does.
      # The decision rule: an absent or empty cpu/events/ directory means no
      # cache counter can be read here at all, and the cache-utilization
      # question is closed without a profiling toolchain. `perf_event_paranoid`
      # is recorded beside it but is not the blocker - a sysctl is adjustable
      # and a missing unit is not. No `set -e`: every read below can fail, and
      # a read that fails is the answer rather than an error. What one dispatch
      # found, and on which runner, is docs/reference/host-metrics.md.
      - name: Say what a hardware profiler could read here
        run: |
          set -uo pipefail
          events=/sys/bus/event_source/devices/cpu/events
          {
            echo "## What a hardware profiler could read on this runner"
            echo
            echo "Runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}, kernel $(uname -r)."
            echo "Processor: $(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)."
            echo
            echo '```'
            echo '$ cat /proc/sys/kernel/perf_event_paranoid'
            cat /proc/sys/kernel/perf_event_paranoid || echo 'unreadable'
            echo
            echo '$ ls /sys/bus/event_source/devices/'
            ls /sys/bus/event_source/devices/ || echo 'no event_source directory'
            echo
            echo "\$ ls ${events}/ | head -40"
            ls "${events}/" 2>/dev/null | head -40
            echo "-> $(ls -A "${events}" 2>/dev/null | wc -l) entries"
            echo
            echo '$ ls -d /sys/fs/resctrl'
            ls -d /sys/fs/resctrl 2>/dev/null || echo 'no resctrl'
            echo
            echo '$ grep -om1 rdt_a /proc/cpuinfo'
            grep -om1 rdt_a /proc/cpuinfo || echo 'no rdt_a'
            echo
            echo '$ grep -om1 cqm_occup_llc /proc/cpuinfo'
            grep -om1 cqm_occup_llc /proc/cpuinfo || echo 'no cqm'
            echo '```'
            echo
            if [ -n "$(ls -A "${events}" 2>/dev/null)" ]; then
              echo 'VERDICT: this guest exposes a hardware PMU, so a cache event is readable here.'
            else
              echo 'VERDICT: no hardware PMU. No cache event can be read on this runner,'
              echo 'whatever perf_event_paranoid says, and no toolchain changes that.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6

      # The build this job is about to install, asked of the file that decides
      # it. The summary below names the build it answered for, and reading it
      # from its one home is what stops this workflow carrying a second copy
      # that can disagree with the binary it actually unpacks.
      - id: runtime
        name: Say which llama.cpp build this job installs
        run: |
          set -euo pipefail
          bash .github/scripts/llama-cpp-pin.sh \
            | tee /dev/stderr >> "$GITHUB_OUTPUT"

      # The runtime half of the shared fetch, without the weights half. This
      # job opens no weights at all, and a script that always downloaded a
      # multi-gigabyte model would turn a one-minute probe into the slowest
      # question in the repository.
      - name: Install pinned llama.cpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/install-llama-runtime.sh

      # The whole help text is the artifact, so the next question about this
      # build is answered by downloading it rather than by a second run.
      - name: Ask the runtime what it accepts
        env:
          LLAMA_CPP_BUILD: ${{ steps.runtime.outputs.llama_cpp_build }}
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH=backend/bin ./backend/bin/llama-server --help > help.txt 2>&1 || true
          if [ ! -s help.txt ]; then
            echo "the runtime printed nothing" >&2
            exit 1
          fi
          {
            echo "## What ${LLAMA_CPP_BUILD} accepts for speculation"
            echo
            echo '```'
            grep -i -- 'spec' help.txt || echo 'nothing about speculation'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the answer
        uses: actions/upload-artifact@v7
        with:
          name: runtime-probe
          path: help.txt
          retention-days: 30
