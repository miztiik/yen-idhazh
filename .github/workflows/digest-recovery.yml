name: Digest assembly recovery

# Finish saved worker output with current code; never dispatch plan or work jobs.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed Content refresh run ID with retained plan and items'
        required: true
      check_only:
        description: 'Assemble and check without committing a production day'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: digest-recovery-${{ github.event.inputs.source_run }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publication-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the site
        working-directory: frontend
        run: npm ci
      - name: Recover assembly through the normal publication checks
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          set -euo pipefail
          MODE=()
          if [ "$CHECK_ONLY" = "true" ]; then
            MODE=(--check-only)
          fi
          python backend/utilities/digest_recover.py "$SOURCE_RUN" "${MODE[@]}"
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-evidence
          path: backend/var/publication/assemble/
          retention-days: 7
          if-no-files-found: ignore
