name: bonsai-ternary-model-test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'System Prompt'
        required: false
        default: 'Summarize the key takeways in given text.'
      input_text:
        description: 'Input text to summarize'
        required: false
        default: 'Ternary quantization maps neural network weights to -1, 0, and +1, shrinking model weights to 1.75 bits per parameter. This enables a 27B model to run on systems with standard memory constraints. Running local LLMs directly inside CI runners enables zero-data-leakage verification, automated pull request analysis, and benchmark-driven testing directly at the compute source without external API dependencies.'

jobs:
  run-inference:
    runs-on: ubuntu-latest
    name: Ternary Bonsai Inference (16GB RAM)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # Safety swap buffer (8GB) for unexpected memory bursts
      - name: Setup 8GB Safety Swap Buffer
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          echo "Allocating 8GB safety swap..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Configure ES Module environment for Node.js
      - name: Setup Node ES Module Workspace
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm pkg set type="module"

      # Download PrismML's llama-server (supports PTQ1_0 / type 143)
      - name: Download PrismML llama-server
        run: |
          mkdir -p ./bin
          echo "Fetching PrismML llama-server binary..."
          curl -L "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10685-7dffb15/llama-prism-b10685-7dffb15-bin-ubuntu-x64.tar.gz" -o llama-prism.tar.gz
          tar -xzf llama-prism.tar.gz -C ./bin --strip-components=1 || tar -xzf llama-prism.tar.gz -C ./bin
          chmod +x ./bin/llama-server
          ./bin/llama-server --version || true

      # Cache and Download the 5.95 GB Ternary GGUF Model
      - name: Cache GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
          key: bonsai-2-27b-ptq1_0-v1

      - name: Download Ternary-Bonsai Model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./models
          echo "Downloading Ternary-Bonsai-2-27B (~5.95 GB)..."
          curl -L -o ./models/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
            "https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/Ternary-Bonsai-2-27B-PTQ1_0.gguf"

      # Start Prism llama-server (Tuned for 16GB RAM + 64k Context)
      - name: Start Prism llama-server
        run: |
          CORES=$(nproc)
          echo "Detected $CORES CPU cores on 16GB runner. Starting llama-server..."

          ./bin/llama-server \
            -m ./models/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            -c 65536 \
            -np 1 \
            -fa \
            -ctk q8_0 \
            -ctv q8_0 \
            -b 4096 \
            -ub 1024 \
            -t $CORES \
            -tb $CORES \
            --mlock \
            --prompt-cache-all \
            --temp 0.2 \
            > llama-server.log 2>&1 &

          echo "Waiting for llama-server to warm up and lock model in RAM..."
          for i in {1..90}; do
            if curl -s http://127.0.0.1:8080/health | grep -q "ok"; then
              echo "llama-server is healthy and ready!"
              break
            fi
            echo "Waiting for server warmup... ($i/90)"
            sleep 2
          done

      # Execute the Event-Driven Pipeline
      - name: Execute AI Event Pipeline
        env:
          PROMPT: "${{ github.event.inputs.prompt }}"
          INPUT_TEXT: "${{ github.event.inputs.input_text }}"
        run: |
          npx --yes tsx .github/scripts/ai-pipeline.ts

      # Debug Artifact: Upload server logs if pipeline fails
      - name: Upload Server Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-log
          path: llama-server.log
