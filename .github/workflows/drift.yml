name: Drift review

# Live article changes warrant inspection; the report does not diagnose their cause.

on:
  schedule:
    # Sunday, after the week's runs have landed.
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      recent_days:
        description: 'Days in the recent window'
        default: '7'
      baseline_days:
        description: 'Days in the trailing baseline window'
        default: '28'

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Reads the committed ledger. It never re-scores anything: a trend
      # computed against a model that has since moved is not a trend.
      - name: Compare the windows
        id: compare
        env:
          # Through `env`, not pasted into the program below. The scheduled run
          # passes no inputs, so both of these are the `||` default and the
          # shape check below is proved against that path first.
          RECENT_DAYS: ${{ inputs.recent_days || '7' }}
          BASELINE_DAYS: ${{ inputs.baseline_days || '28' }}
        run: |
          set -euo pipefail
          for window in "$RECENT_DAYS" "$BASELINE_DAYS"; do
            if ! [[ "$window" =~ ^[0-9]{1,4}$ ]]; then
              echo "a window is a count of days: 1 to 4 digits" >&2
              exit 1
            fi
          done
          python - <<'PY' | tee drift.txt
          import datetime, os, pathlib
          from idhazh.config import load
          from idhazh.drift import read_windows, report

          windows = read_windows(
              pathlib.Path("state"),
              today=datetime.datetime.now(datetime.UTC).date(),
              recent_days=int(os.environ["RECENT_DAYS"]),
              baseline_days=int(os.environ["BASELINE_DAYS"]),
          )
          text, status = report(windows, config=load().app.drift)
          print(text)
          raise SystemExit(status)
          PY

      - name: Open an issue when something moved
        if: success()
        run: |
          set -euo pipefail
          if grep -qE '^(shorter_sources|more_copying|scoring_chrome) ' drift.txt; then
            gh issue create \
              --title "Drift detected $(date -u +%F)" \
              --body-file drift.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}
