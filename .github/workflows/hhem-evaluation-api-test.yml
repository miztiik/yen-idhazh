name: summary-eval-hhem

on:
  workflow_dispatch:
    inputs:
      source_text:
        description: Full source text; published in the expandable run report
        required: true
        type: string
      summary_text:
        description: Supplied summary; published in the expandable run report
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/hhem-evaluator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Prepare existing shared host APIs
        working-directory: .
        run: |
          bun install --frozen-lockfile --cwd packages/common-contracts
          bun install --frozen-lockfile --cwd packages/ledger-file-writer
          bun install --frozen-lockfile --cwd services/host-fingerprints
          bun install --frozen-lockfile --cwd services/host-probes

      - name: Install the selected CPU model environment
        run: uv sync --frozen --extra model --no-dev

      - name: Start API, check health, evaluate and close owned services
        run: >-
          uv run --frozen --extra model --no-dev python
          ../../.github/scripts/summary-eval-hhem/run.py --root ../..

      - name: Generating report from evaluator results
        if: always()
        run: >-
          uv run --frozen --extra model --no-dev python
          ../../.github/scripts/summary-eval-hhem/report.py --root ../..

      - name: Publish report and body-free evaluation data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: summary-eval-hhem-report
          path: |
            backend/var/summary-eval-hhem/evaluation.json
            backend/var/summary-eval-hhem/report.md
          if-no-files-found: warn
