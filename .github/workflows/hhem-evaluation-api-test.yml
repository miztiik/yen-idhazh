name: HHEM evaluation API test

on:
  workflow_dispatch:
    inputs:
      source_text:
        description: Full source text to check the summary against
        required: true
        type: string
      summary_text:
        description: Supplied summary text to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/hhem-evaluator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Prepare the existing locked host instrument
        working-directory: .
        run: bun install --frozen-lockfile --cwd services/host-probes

      - name: Install the selected CPU model environment
        run: uv sync --frozen --extra model --no-dev

      - name: Evaluate once and close owned services
        run: uv run --frozen --extra model --no-dev python -m hhem_evaluator.run_manual_evaluation --root ../..

      - name: Upload only validated body-free evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hhem-evaluation-report
          path: |
            services/hhem-evaluator/var/workflow/report.json
            services/hhem-evaluator/var/workflow/report.md
          if-no-files-found: warn
