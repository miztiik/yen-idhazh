name: CI

# Every gate CLAUDE.md section 9 names, on every change. The suite includes the
# five injection canaries (row 5), so a prompt, sanitizer or contract edit that
# lets an attack through fails the build rather than shipping.
#
# The runner here is the same stock ubuntu-latest the pipeline runs on
# (Guardrail #2), so a gate that would not fit the pipeline's budget does not
# fit this one either.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      panel_captures:
        description: Generate panel pictures for design review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A pull request groups by its ref, so a newer commit cancels the run its
  # older commit started - the older commit is superseded and its verdict is
  # worth nothing. A push groups by its own commit instead, so it shares a
  # group with nothing and is neither cancelled nor queued behind the next
  # push.
  #
  # A trunk push is not superseded by the next one, because `scope` answers
  # from each push's own changed paths. Measured 2026-09-12, before this was
  # fixed: two pushes carrying 14 code files between them were cancelled by a
  # third that changed one plan-doc, and that third run correctly skipped every
  # application job - so the code reached `main` with no verdict on `main`.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change has to pay for. Two questions, not one.
  #
  # `code` asks whether anything but documentation changed. That branch is a
  # closed list of prefixes rather than a guess, so a path nobody classified
  # falls to the expensive side. It is asked on a push as well as a pull
  # request, because a documentation edit cannot break an application check on
  # either event, and a merge that runs the whole suite over a changed sentence
  # buys nothing.
  #
  # `browser` asks which half of the site gate a pull request buys: the canary
  # and browser half only reads the published surface, so a change that cannot
  # move that surface should not spend four minutes proving it. That one is a
  # wager that nobody forgot a path, so a push that carries any code does not
  # consult it at all - a pull request the list was wrong about reddens `main`
  # on the merge push, which is where the wager is settled.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.decide.outputs.browser }}
      code: ${{ steps.decide.outputs.code }}
      model_absent: ${{ steps.decide.outputs.model_absent }}
      console: ${{ steps.decide.outputs.console }}
      panels: ${{ steps.decide.outputs.panels }}
      robots: ${{ steps.decide.outputs.robots }}
      validate_all: ${{ steps.decide.outputs.validate_all }}
      playwright: ${{ steps.browsers.outputs.playwright }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          # A pull request names its range and a push names its own. A dispatch
          # names neither, and the selector buys everything when it cannot see a
          # range.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node frontend/scripts/test-scope.ts --ci >> "$GITHUB_OUTPUT"

      # Read once here, used by the two jobs that cache a browser, because a
      # key written twice is a key that drifts and then never hits. The value
      # is asserted to be a plain version before it leaves this step: it is
      # substituted into a cache key below, so a lockfile carrying a space or a
      # quote must fail here rather than build an expression further down.
      - id: browsers
        run: |
          set -euo pipefail
          version=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the pinned Playwright version is not a plain version: $version" >&2
            exit 1
          fi
          echo "playwright=$version" >> "$GITHUB_OUTPUT"

  gates:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Two commits rather than one, for the plan-queue check below. A pull
      # request is checked out as a merge commit whose first parent is the base
      # branch, so `HEAD^1..HEAD` is what this branch changes - and reading it
      # costs one more commit rather than a fetch over the network.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # The one check a change carrying no code can still fail. Everything
      # below it is about code, and a documentation change skips all of it.
      - name: Whitespace
        run: git diff --check HEAD^1 HEAD

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.code == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        if: needs.scope.outputs.code == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: needs.scope.outputs.code == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: needs.scope.outputs.code == 'true'
        run: ruff check .

      - name: Type-check
        if: needs.scope.outputs.code == 'true'
        run: mypy

      - name: Tests, including the five injection canaries
        if: needs.scope.outputs.code == 'true'
        run: pytest --junitxml=test-results/backend/pytest-junit.xml

      # Per-module timing for `docs/how-to/run-the-gates.md`'s "re-check the
      # slow marks" step. `pytest --durations` already names the 25 slowest
      # tests in the log; this is the report `backend/utilities/
      # slow_mark_audit.py` reads to answer the same question for every
      # module, not just the slowest few. The suite writes it whether the run
      # passes or fails, so a red run is still auditable.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        with:
          name: pytest-junit
          path: test-results/backend/pytest-junit.xml
          retention-days: 7
          if-no-files-found: error

      # What prerendering used to give free. Until the reading routes were split
      # on 2026-09-01 every story was serialised into a document at build time,
      # so a story the contract refused failed the build. A reading document now
      # carries a seed and a browser fetches the rest, so no build ever opens the
      # stories past it. This opens all of them, against the committed shape the
      # build reads and the served shape a reader's browser fetches.
      #
      # The guarantee is weaker than the one it replaces, and that is stated
      # rather than hidden: a broken day can no longer be built, it can only no
      # longer be MERGED. The publishing jobs run the same command before their
      # own commit, which is what covers a day the pipeline pushes on its own.
      #
      # Only when the shape can have moved. A published day is frozen, so a
      # contract, schema, config or harness change - or an edit to the tree
      # itself - is the only thing that can invalidate one, and a merge to `main`
      # always counts. Measured 2026-09-05: 16 days took 6.6 s, about 0.27 s a
      # day, so a year of publishing would be around 100 s of every run
      # (Guardrail #12).
      - name: Every committed day still matches its contracts
        if: needs.scope.outputs.validate_all == 'true'
        run: python -m idhazh check-publication

  # The one gate `gates` cannot be: it runs on ONE interpreter, and the thing
  # under test here is whether two of them agree. `robots.txt` is a permission,
  # and until 2026-09-02 the standard library read one file two ways across the
  # range `pyproject.toml` declares - so a page this crawler may read depended
  # on which runner picked up the job. Both ends of that range read the same
  # committed fixtures here, and a disagreement fails rather than publishes.
  #
  # The whole file, not a selection: the address rules and the RFC 9309 status
  # reading sit beside the fixture matrix and are the same kind of decision.
  #
  # Only when the answer can have moved: a change to the extraction code, its
  # tests, or the interpreter range. Every push to `main` still runs it.
  robots:
    needs: scope
    if: needs.scope.outputs.robots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          # The newest supported interpreter, and the only thing this job adds:
          # `gates` already runs the whole suite, this file included, on 3.12.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: The robots fixtures, on the newest supported interpreter
        run: pytest backend/tests/test_extract.py

  site:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # For the site-weight gate at the end, which is a backend module: one
      # reader of `config/idhazh.json` rather than a second copy of the budget.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install the backend and test tooling
        run: pip install -e ".[dev]"

      - uses: ./.github/actions/prepare-duckdb

      # The build strips types, so it passes on code the type-checker rejects.
      # Without this gate a type error only shows up in an editor.
      - name: Type-check
        working-directory: frontend
        run: npm run check

      - name: Test selection and run safeguards
        working-directory: frontend
        run: npm run test:tooling

      - name: Frontend logic without a build or browser
        working-directory: frontend
        run: npm run test:logic -- --forbid-only

      # Every route still has to render. What the build no longer proves is that
      # every STORY does: a reading document carries a seed and the browser
      # fetches the rest, so the stories past the seed are never serialised here.
      # The `gates` job runs `idhazh check-publication` for those.
      - name: Build the site
        working-directory: frontend
        run: npm run build

      # Three checks under one step. The on-device encoder must stay behind a
      # dynamic import; a static import would put a multi-megabyte library on
      # every reader's first load, and nothing about that edit looks wrong in
      # review. Each page that renders no day must stay under its ceiling in
      # config/idhazh.json, and so must each file a reader's browser fetches -
      # the console's telemetry left its document on 2026-09-09, so a page
      # ceiling alone no longer sees what the console costs. Read which one
      # failed - they have different answers.
      - name: Bundle gate - encoder, page ceilings and payload ceilings
        working-directory: frontend
        run: npm run bundle-gate

      # Whole-site weight against the 1 GB Pages cap (Guardrail #2). The bundle gate
      # above bounds one page at a time; nothing bounded the sum. `build` is the
      # tree the deploy uploads, so it is the only honest thing to measure, and
      # it exists only after the build step above.
      - name: Measure the built site against the Pages cap
        working-directory: frontend
        run: python -m idhazh site-weight --site-tree build

      - name: Check published ledger columns
        working-directory: frontend
        run: python -m idhazh published-columns --site-tree build

      # The oracle for the assist row: delete the whole model directory, build,
      # and the digest must be untouched. If it degrades at all, the feature is
      # on the critical path and the row has failed. Last in this job, because
      # it overwrites the tree the two gates above measured, and here rather
      # than in `browser`, because this job finishes minutes before that one.
      #
      # `build/index` is the other half, and it is why the month index is staged
      # outside `static/assist/`. Browsing the archive is not a model feature, so
      # the data the story list fetches has to survive the parking that proves
      # the model is optional.
      - name: Model-absent gate - the digest does not depend on any of it
        if: needs.scope.outputs.model_absent == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          mv static/assist ../assist-parked
          npm run build
          test -s build/archive/index.html
          test ! -d build/assist
          test -d build/index
          grep -q 'Archive' build/archive/index.html
          mv ../assist-parked static/assist
          echo "the digest renders complete with no model directory."

  # The canary build plus a browser. It answers for the published surface only,
  # so it is skipped when nothing a published page reads has moved.
  browser:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        working-directory: frontend
        run: npm ci

      # The canary day is built by the backend, through the same contracts and
      # the same encoder the pipeline uses. Building it any other way would test
      # a payload shape nothing actually writes.
      - name: Install the backend, for the canary day builder
        run: pip install -e .

      - uses: ./.github/actions/prepare-duckdb

      - name: Restore the browser binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ needs.scope.outputs.playwright }}

      # The install step runs on a hit as well, and that is the point: the
      # restore covers the browser bytes, and the `--with-deps` half is an
      # apt-get the cache cannot hold. On a hit it finds the binaries in place
      # and downloads nothing.
      - name: Install Chromium for the browser suite
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Publish every injection canary as a real day, from the RAW attack text.
      # The backend suite already proves the sanitizer strips these; this asks
      # the harder question - if it ever stopped, would the page still be inert?
      - name: Build the canary day
        run: python backend/utilities/build_canary_day.py

      - name: Build the site from the canaries
        working-directory: frontend
        run: npm run build:canary

      # Eight canaries on the published surface, plus the hand-labelled
      # retrieval bar. A single injection getting through fails the build.
      #
      # A pull request buys the console's own specs only for a console change or
      # a harness change - they are 584 of the suite's 997 tests and the console
      # is an operator's page. Main runs every group, which is where a shared
      # edit that broke the console is caught. The panel captures and gates are
      # bought by a wider set - anything every panel is drawn from - because they
      # are two spec files rather than hundreds. The site job runs the no-server
      # logic group.
      - name: Browser suite - canaries and retrieval
        working-directory: frontend
        env:
          SKIP_CONSOLE_SUITE: ${{ needs.scope.outputs.console == 'false' }}
          SKIP_PANELS_SUITE: ${{ needs.scope.outputs.panels == 'false' }}
          SKIP_PANEL_CAPTURES: ${{ inputs.panel_captures != true }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser/results.json
          # 4 vCPU with nothing else on it, so a worker per core: 344 s at one
          # worker, 207 s at four, runs 33989034726 and 33991122503, 2026-09-05.
          PLAYWRIGHT_WORKERS: '4'
        run: npm run test:browser -- --reporter=github,json

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: frontend/test-results/browser/results.json
          retention-days: 7
          if-no-files-found: error

      # Pictures are explicit design-review material. Routine runs retain the
      # panel assertions but do not generate or upload the bulk captures.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.panel_captures == true }}
        with:
          name: panel-captures
          path: frontend/test-results/panels/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          # The panel captures are their own artefact, so a red run does not
          # upload them twice.
          path: |
            frontend/test-results/
            !frontend/test-results/panels/
            !frontend/test-results/browser/results.json
          retention-days: 7
          if-no-files-found: ignore
