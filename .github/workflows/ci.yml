name: CI

# Every gate CLAUDE.md section 9 names, on every change. The suite includes the
# five injection canaries (row 5), so a prompt, sanitizer or contract edit that
# lets an attack through fails the build rather than shipping.
#
# The runner here is the same stock ubuntu-latest the pipeline runs on
# (Rule #2), so a gate that would not fit the pipeline's budget does not
# fit this one either.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which half of the site gate a change has to pay for. `site` runs on every
  # change because almost any backend module reaches it through `pip install`;
  # the canary and browser half only reads the published surface, so a change
  # that cannot move that surface should not spend four minutes proving it.
  # A pull request that is wrong about this reddens `main` on the merge push,
  # where the filter does not apply - that is the failure this trades for.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.decide.outputs.browser }}
      console: ${{ steps.decide.outputs.console }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/browser-suite-needed.sh >> "$GITHUB_OUTPUT"

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The shell nothing else checks. `ruff` and `mypy` stop at Python, and
      # .github/scripts/ holds the loop both daily commit steps run - an unset
      # variable or an unquoted expansion there costs a whole day's digest.
      # `--severity=style` is the strictest level, so a warning is a failure
      # rather than a note somebody scrolls past. It reads a file, not a `run:`
      # body, so the shell written inline in a workflow is covered by the
      # workflow contract test instead.
      - name: Lint the shell
        run: shellcheck --severity=style .github/scripts/*.sh

      - name: Type-check
        run: mypy

      - name: Tests, including the five injection canaries
        run: pytest

      # A generated artifact that was hand-edited regenerates to something else.
      # The suite already asserts this against a temp directory; doing it again
      # against the working tree catches an exporter that writes in place.
      - name: Contract drift gate
        run: |
          python -m idhazh.contracts.export
          git diff --exit-code -- schemas/

      # What prerendering used to give free. Until the reading routes were split
      # on 2026-09-01 every story was serialised into a document at build time,
      # so a story the contract refused failed the build. A reading document now
      # carries a seed and a browser fetches the rest, so no build ever opens the
      # stories past it. This opens all of them, against the committed shape the
      # build reads and the served shape a reader's browser fetches.
      #
      # The guarantee is weaker than the one it replaces, and that is stated
      # rather than hidden: a broken day can no longer be built, it can only no
      # longer be MERGED. The publishing jobs run the same command before their
      # own commit, which is what covers a day the pipeline pushes on its own.
      - name: Every committed day still matches its contracts
        run: python -m idhazh validate-days

  # The one gate `gates` cannot be: it runs on ONE interpreter, and the thing
  # under test here is whether two of them agree. `robots.txt` is a permission,
  # and until 2026-09-02 the standard library read one file two ways across the
  # range `pyproject.toml` declares - so a page this crawler may read depended
  # on which runner picked up the job. Both ends of that range read the same
  # committed fixtures here, and a disagreement fails rather than publishes.
  #
  # The whole file, not a selection: the address rules and the RFC 9309 status
  # reading sit beside the fixture matrix and are the same kind of decision.
  #
  # Measured on run 33669915697, 2026-09-02: 41 s on 3.12 and 36 s on 3.14,
  # both alongside `gates` at 1 m 22 s, so the run's wall clock does not move.
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          # The newest supported interpreter, and the only thing this job adds:
          # `gates` already runs the whole suite, this file included, on 3.12.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: The robots fixtures, on the newest supported interpreter
        run: pytest backend/tests/test_extract.py

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # For the site-weight gate at the end, which is a backend module: one
      # reader of `config/idhazh.json` rather than a second copy of the budget.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install the backend and test tooling
        run: pip install -e ".[dev]"

      # The build strips types, so it passes on code the type-checker rejects.
      # Without this gate a type error only shows up in an editor.
      - name: Type-check
        working-directory: frontend
        run: npm run check

      - name: Test selection and run safeguards
        working-directory: frontend
        run: npm run test:tooling

      - name: Frontend logic without a build or browser
        working-directory: frontend
        run: npm run test:logic -- --forbid-only

      # Every route still has to render. What the build no longer proves is that
      # every STORY does: a reading document carries a seed and the browser
      # fetches the rest, so the stories past the seed are never serialised here.
      # The `gates` job runs `idhazh validate-days` for those.
      - name: Build the site
        working-directory: frontend
        run: npm run build

      # Two checks under one step. The on-device encoder must stay behind a
      # dynamic import; a static import would put a multi-megabyte library on
      # every reader's first load, and nothing about that edit looks wrong in
      # review. Each page that renders no day must stay under its ceiling in
      # config/idhazh.json. Read which one failed - they have different answers.
      - name: Bundle gate - encoder and page ceilings
        working-directory: frontend
        run: npm run bundle-gate

      # Whole-site weight against the 1 GB Pages cap (Rule #2). The bundle gate
      # above bounds one page at a time; nothing bounded the sum. `build` is the
      # tree the deploy uploads, so it is the only honest thing to measure, and
      # it exists only after the build step above.
      - name: Measure the built site against the Pages cap
        working-directory: frontend
        run: python -m idhazh site-weight --site-tree build

  # Everything that needs a second and third build of the site, plus a browser.
  # It answers for the published surface only, so it is skipped when nothing a
  # published page reads has moved.
  browser:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        working-directory: frontend
        run: npm ci

      # The canary day is built by the backend, through the same contracts and
      # the same encoder the pipeline uses. Building it any other way would test
      # a payload shape nothing actually writes.
      - name: Install the backend, for the canary day builder
        run: pip install -e .

      # The oracle for the assist row: delete the whole model directory, build,
      # and the digest must be untouched. If it degrades at all, the feature is
      # on the critical path and the row has failed.
      #
      # `build/index` is the other half, and it is why the month index is staged
      # outside `static/assist/`. Browsing the archive is not a model feature, so
      # the data the story list fetches has to survive the parking that proves
      # the model is optional.
      - name: Model-absent gate - the digest does not depend on any of it
        working-directory: frontend
        run: |
          set -euo pipefail
          mv static/assist ../assist-parked
          npm run build
          test -s build/archive/index.html
          test ! -d build/assist
          test -d build/index
          grep -q 'Archive' build/archive/index.html
          mv ../assist-parked static/assist
          echo "the digest renders complete with no model directory."

      - name: Install Chromium for the browser suite
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Publish every injection canary as a real day, from the RAW attack text.
      # The backend suite already proves the sanitizer strips these; this asks
      # the harder question - if it ever stopped, would the page still be inert?
      - name: Build the canary day
        run: python backend/utilities/build_canary_day.py

      - name: Build the site from the canaries
        working-directory: frontend
        run: npm run build:canary

      # Eight canaries on the published surface, plus the hand-labelled
      # retrieval bar. A single injection getting through fails the build.
      #
      # A pull request buys the console's own specs only for a console change or
      # a harness change - they are 584 of the suite's 997 tests and the console
      # is an operator's page. Main runs every group, which is where a shared
      # edit that broke the console is caught. The site job runs the no-server
      # logic group.
      - name: Browser suite - canaries and retrieval
        working-directory: frontend
        env:
          SKIP_CONSOLE_SUITE: ${{ needs.scope.outputs.console == 'false' }}
          # 4 vCPU with nothing else on it, so a worker per core: 344 s at one
          # worker, 207 s at four, runs 33989034726 and 33991122503, 2026-09-05.
          PLAYWRIGHT_WORKERS: '4'
        run: npm run test:browser

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The day-scale reading check, which cannot share the `browser` job.
  #
  # `frontend/build` is one directory. The `browser` job builds the real site
  # once, for the model-absent gate, but it builds it with `static/assist`
  # moved out of the way and then overwrites the whole tree with the canary.
  # `whole-day.spec.ts` exists to refuse a tree that is not the published site,
  # so running it beside either of those would be running it against the thing
  # it was written to catch. Its own job gets its own build and races nothing.
  #
  # Separate rather than appended for a second reason, and it is the deciding
  # one. Measured on `ubuntu-latest`, 2026-09-05: the build takes 24 s and the
  # spec 85 s, so appending them to `browser` costs 109 s of wall clock on
  # every pull request that buys the browser half. This whole job is 183 s and
  # it runs concurrently, against a `browser` job that measured 460, 482, 494,
  # 514, 542 and 554 s over its last six green runs on main - so the run
  # finishes at the same moment it does now. Actions minutes are free and
  # unmetered on a public repository (Rule #2), and 20 concurrent jobs are
  # available against the six this workflow already starts.
  whole-day:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # Sized from the worst case, not the blended figure (Rule #10). The job
    # measured 183 s; the spec's own per-test timeout is 600 s, and a browser
    # that crashes rather than finishing has to be allowed to report as a crash.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The real site, never the canary. `npm run build:canary` must not appear
      # anywhere in this job.
      - name: Build the published site
        working-directory: frontend
        run: npm run build

      # Every story of the heaviest committed day, every drawing, at 390 and
      # 1440 CSS px, in both themes. The module refuses to load unless the tree
      # under test serves exactly the days this repository has committed.
      - name: The whole day, end to end
        working-directory: frontend
        run: npm run test:whole-day

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-whole-day
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore