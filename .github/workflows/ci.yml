name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer PR run replaces its predecessor. Each main push checks its own range.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.code }}
      bun: ${{ steps.select.outputs.bun }}
      logic: ${{ steps.select.outputs.logic }}
      tooling: ${{ steps.select.outputs.tooling }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check the change and select suites
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --check HEAD^1 HEAD
          node frontend/scripts/state-csv-guard.ts
          node frontend/scripts/test-scope.ts --ci >> "$GITHUB_OUTPUT"

  # Automatic Pages publication looks for this job by name.
  gates:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Some backend tests call the native writer and contract bindings.
      - uses: ./.github/actions/publication-runtime

      - name: Python checks and tests
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy
          pytest

      - name: TypeScript checks and tests
        if: needs.scope.outputs.bun == 'true'
        run: |
          services=(
            services/serve-pipeline-apis
            services/host-fingerprints
            services/host-probes
            services/feed-ingest-plan
            services/summary-generator
            tools/summary-generator-caller
            packages/feed-probe
          )
          for package in "${services[@]}"; do
            bun install --frozen-lockfile --cwd "$package"
          done
          for package in packages/common-contracts packages/data-delivery packages/ledger-file-writer "${services[@]}"; do
            echo "::group::$package"
            (cd "$package" && bun run check && bun run test)
            echo "::endgroup::"
          done

  site:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/publication-runtime

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          npm ci
          pip install -e "..[dev]"

      - uses: ./.github/actions/prepare-duckdb

      - name: Type-check the site
        run: npm run check

      - name: Frontend logic tests
        if: needs.scope.outputs.logic == 'true'
        run: npm run test:logic -- --forbid-only

      - name: Test tooling
        if: needs.scope.outputs.tooling == 'true'
        run: npm run test:tooling

      - name: Build and verify the site
        run: |
          npm run build
          python -m idhazh site-weight --site-tree build
          python -m idhazh published-columns --site-tree build

      - name: Smoke-test the built reader
        env:
          IDHAZH_TEST_BUILD: real
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser -- --project=reader --no-deps tests/reading-page.spec.ts
