name: CI

# Every gate CLAUDE.md section 9 names, on every change. The suite includes the
# five injection canaries (row 5), so a prompt, sanitizer or contract edit that
# lets an attack through fails the build rather than shipping.
#
# The runner here is the same stock ubuntu-latest the pipeline runs on
# (Rule #2), so a gate that would not fit the pipeline's budget does not
# fit this one either.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The shell nothing else checks. `ruff` and `mypy` stop at Python, and
      # .github/scripts/ holds the loop both daily commit steps run - an unset
      # variable or an unquoted expansion there costs a whole day's digest.
      # `--severity=style` is the strictest level, so a warning is a failure
      # rather than a note somebody scrolls past. It reads a file, not a `run:`
      # body, so the shell written inline in a workflow is covered by the
      # workflow contract test instead.
      - name: Lint the shell
        run: shellcheck --severity=style .github/scripts/*.sh

      - name: Type-check
        run: mypy

      - name: Tests, including the five injection canaries
        run: pytest

      # A generated artifact that was hand-edited regenerates to something else.
      # The suite already asserts this against a temp directory; doing it again
      # against the working tree catches an exporter that writes in place.
      - name: Contract drift gate
        run: |
          python -m idhazh.contracts.export
          git diff --exit-code -- schemas/

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The canary day is built by the backend, through the same contracts and
      # the same encoder the pipeline uses. Building it any other way would test
      # a payload shape nothing actually writes.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install the backend, for the canary day builder
        run: pip install -e .

      # The build strips types, so it passes on code the type-checker rejects.
      # Without this gate a type error only shows up in an editor.
      - name: Type-check
        working-directory: frontend
        run: npm run check

      # A payload that fails its contract never reaches a reader: prerendering
      # turns what would be a runtime error into a build failure.
      - name: Build the site
        working-directory: frontend
        run: npm run build

      # Three checks under one step. The on-device encoder must stay behind a
      # dynamic import; a static import would put a multi-megabyte library on
      # every reader's first load, and nothing about that edit looks wrong in
      # review. Each route's first-load JavaScript must match its recorded
      # weight. Each page that renders no day must stay under its ceiling in
      # config/idhazh.json. Read which one failed - they have different answers.
      - name: Bundle gate - encoder, first-load weight, page ceilings
        working-directory: frontend
        run: npm run bundle-gate

      # Whole-site weight against the 1 GB Pages cap (Rule #2). The bundle gate
      # above bounds one page at a time; nothing bounded the sum. `build` is the
      # tree the deploy uploads, so it is the only honest thing to measure, and
      # it exists only after the build step above.
      - name: Measure the built site against the Pages cap
        working-directory: frontend
        run: python -m idhazh site-weight --site-tree build

      # The oracle for the assist row: delete the whole model directory, build,
      # and the digest must be untouched. If it degrades at all, the feature is
      # on the critical path and the row has failed.
      #
      # `build/index` is the other half, and it is why the month index is staged
      # outside `static/assist/`. Browsing the archive is not a model feature, so
      # the data the story list fetches has to survive the parking that proves
      # the model is optional.
      - name: Model-absent gate - the digest does not depend on any of it
        working-directory: frontend
        run: |
          set -euo pipefail
          mv static/assist ../assist-parked
          npm run build
          test -s build/archive/index.html
          test ! -d build/assist
          test -d build/index
          grep -q 'Archive' build/archive/index.html
          mv ../assist-parked static/assist
          echo "the digest renders complete with no model directory."

      - name: Install Chromium for the browser suite
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Publish every injection canary as a real day, from the RAW attack text.
      # The backend suite already proves the sanitizer strips these; this asks
      # the harder question - if it ever stopped, would the page still be inert?
      - name: Build the canary day
        run: python backend/utilities/build_canary_day.py

      - name: Build the site from the canaries
        working-directory: frontend
        run: npm run build:canary

      # Eight canaries on the published surface, plus the hand-labelled
      # retrieval bar. A single injection getting through fails the build.
      - name: Browser suite - canaries and retrieval
        working-directory: frontend
        run: npm run test:browser

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The canary build is the last thing in the directory. Leaving it there
      # would let a later step, or a careless copy, publish hostile fixtures.
      - name: Rebuild the real site
        working-directory: frontend
        run: npm run build
