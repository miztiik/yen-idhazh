[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idhazh"
version = "0.1.0"
description = "Build-time producer for yen-idhazh: a static-first, self-evaluating article digest."
readme = "README.md"
# The floor is what CI installs. The ceiling is what the dependencies publish:
# the compiled ones ship one wheel per CPython minor, and `onnxruntime` is
# pinned exactly, so its matrix is the wall. Version 1.29.0 publishes cp311
# through cp314 and no source distribution at all, so 3.15 cannot install at any
# price (read from the package index, 2026-08-26). Without a ceiling pip does
# not refuse an interpreter it cannot resolve - it falls back to a source build
# and stops answering. `a0` because pip matches this specifier with prereleases
# enabled, so a plain `<3.15` would still admit a 3.15 beta.
requires-python = ">=3.12,<3.15.0a0"
license = "MIT"
dependencies = [
    # The single source of truth for every persisted shape (Guardrail #3). Also
    # the JSON Schema emitter that schemas/ is generated from.
    "pydantic>=2.12",
    # Feed parsing for the Collect stage. Mature, tolerant of the malformed RSS
    # the open web actually serves, and parses a string without any network of
    # its own - so a test drives it from a committed fixture (Guardrail #8).
    "feedparser>=6.0",
    # Boilerplate removal for the Extract stage. A custom HTML extractor is a
    # maintenance surface with no beneficiary feature.
    #
    # Held below 2.3: trafilatura 2.3.0 (released 2026-10-02) changed what it
    # keeps from link farms, forms and boilerplate widgets, and seven extraction
    # tests that pass on 2.2.0 fail on it - the contamination signal no longer
    # fires on the real contaminated page, and the element fixtures carry fewer
    # quantities. The committed fixtures and thresholds were measured on 2.2.
    # Lift the ceiling in the change that re-measures them on 2.3.
    "trafilatura>=1.12,<2.3",
    # The public suffix list, for the one question "which name did somebody
    # register". Already installed as a trafilatura dependency; declared here
    # because build_reference_dataset.py imports it directly, and a transitive
    # dependency that a direct import relies on breaks the day the package above
    # it drops it. The alternative is a hand-written suffix rule, which is wrong
    # on bbc.co.uk and on every newsletter platform, and which Guardrail #8
    # refuses anyway. Zero install cost: it is already in the tree. Beneficiary:
    # the reference dataset's split unit, plan 23 row #P2.
    "courlan>=1.3",
    # The sentence encoder for build-time embeddings, run through the SAME ONNX
    # file the browser loads - one artifact, two runtimes, no drift. Chosen over
    # torch plus transformers, which is roughly 800 MB of wheels for weights
    # that would then have to agree with a second copy. Measured 2026-08-22
    # (Windows 11, 8 vCPU): 16 ms to embed three summaries. Beneficiary: Row #19.
    #
    # Pinned exactly, not floored. A committed vector is a claim that the same
    # text re-encodes to the same bytes, and a kernel rewrite in a patch release
    # can break that claim without breaking anything an API test would notice.
    # A range here means two runners may disagree about the same day.
    "onnxruntime==1.29.0",
    "tokenizers>=0.21",
    # One reading of robots.txt on every interpreter we support. The standard
    # library's `urllib.robotparser` disagrees with itself across the declared
    # range: 3.12 takes the first matching group and the first matching rule,
    # 3.14 merges repeated groups and applies longest-match with `*` and `$`.
    # One committed file can therefore be read as allowed on one runner and
    # refused on another, which makes our own crawling unreproducible - and
    # this is the control Guardrail #11 rests on, so it may not be version-dependent.
    #
    # Pinned exactly, not floored, for the same reason `onnxruntime` is: the
    # answer is a permission, and a patch release that changed one precedence
    # rule would silently move which pages a run may read.
    #
    # From the package index, 2026-09-02: a 10,296-byte pure-Python wheel,
    # BSD-3-Clause, from the Scrapy organisation, no declared dependencies,
    # requires-python >= 3.10. Measured 2026-09-02 on `ubuntu-latest`
    # (Linux 6.17.0-1022-azure x86_64, 4 vCPU, 16 GB), CPython 3.12.14, in a
    # throwaway workflow off `main`: 0.661 / 0.449 / 0.454 s to install
    # (n=3, mean 0.521, spread 0.212 - sample 1 downloads the wheel and the
    # other two read pip's cache) and 53,292 installed bytes over 17 files. It
    # adds one line to `pip list` and moves no version that was already there,
    # so this is not a repeat of `.[faithfulness]`. It ships `py.typed`, so
    # `mypy --strict` needs no override. Full method and the developer-box
    # contrast in docs/reference/pipeline-cost.md.
    #
    # Beneficiary: one reading of robots.txt on every interpreter we support.
    "protego==0.6.2",
    # The parquet engine behind the ledger door. Beneficiary: every ledger read
    # or written through the door, all of it through the one module that imports
    # the engine, `backend/idhazh/ledger/parquet.py`.
    #
    # In every install rather than an optional extra, because which jobs reach
    # the door cannot be read off the workflows: a Node script can start Python,
    # and a verb can be held in a variable. A job that opens a door file without
    # the engine fails on the first one it opens.
    #
    # Cost: a few seconds on each install that never opens a parquet file. An
    # estimate from GitHub's own step timings on ubuntu-latest, 2026-09-29: a
    # plain install took 10 to 16 s (mean 12.9, n=13) and an install with the
    # engine 13 to 22 s (mean 15.2, n=10). That is about 2 s apart on average,
    # inside the spread between runs, and 12 s at the widest. pyarrow 25.0.1
    # declares no dependencies of its own, so it moves no version already there.
    "pyarrow>=21",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    # Runs the suite across the cores the machine already has, by default. It
    # was opt-in until 2026-08-30, on the argument that a parallel-only failure
    # would hide from the one gate everybody trusts. Running BOTH cases parallel
    # settles that better than running one of each: a test that only fails
    # under xdist now fails everywhere rather than only on a developer box.
    #
    # Dev-only; measured 2026-08-30 on Windows 11, Python 3.14.2, by summing
    # site-packages before and after the install: 720,767 installed bytes over
    # 84 files, for pytest-xdist 3.8.0 and the execnet 2.1.2 it pulls in. That
    # is 7,574 bytes under PyYAML's 728,341 and 2.1 percent of shellcheck-py's
    # 34,782,285. It added those two distributions and moved no version that was
    # already there.
    #
    # Measured effect, same box and date (12 logical CPUs, 31.8 GiB RAM, every
    # case wrapped in backend/utilities/gate_lock.py so no sibling gate could
    # land inside it): 548.03, 484.68 and 505.78 s serially, against 159.04,
    # 149.60 and 147.67 s under `-n auto` (n=3 each; means 512.83 s and
    # 152.10 s; spreads 63.35 s and 11.37 s). That is 3.37x - about six minutes
    # back on every local run of the suite. All six runs passed the same 1,695
    # node ids, none skipped, and `git status --porcelain` was empty after each,
    # so no test needed pinning to one worker.
    #
    # Beneficiary: the full suite a developer runs before pushing.
    "pytest-xdist>=3.6",
    # Structured parsing for the workflow trigger contract test. Dev-only;
    # measured 2026-08-23 on Windows 11, Python 3.12: 728341 installed bytes.
    # One observation, so no spread. Beneficiary: workflow routing regression gate.
    "PyYAML>=6.0",
    "ruff>=0.9",
]
# The faithfulness scorer. A 250M cross-encoder, but transformers plus torch is
# hundreds of megabytes, so it stays out of the default install and out of the
# test path - the model-free counterweights are what run everywhere.
faithfulness = [
    "torch>=2.5",
    # Capped below 5. The HHEM checkpoint ships its own modelling code, which
    # defines `_tied_weights_keys`; transformers 5 expects
    # `all_tied_weights_keys` and raises AttributeError while loading it. An
    # unpinned ceiling meant CI resolved to a version the model predates, and
    # every worker died before summarizing a single article.
    "transformers>=4.46,<5",
]

[project.scripts]
idhazh = "idhazh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/idhazh"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "TID251", # banned-api - names the one reader allowed past a facade
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# These are the writer-name patterns `idhazh.ledger` keeps off its public
# facade. `idhazh.path_classes` is the one caller allowed to read them
# directly (`[tool.ruff.lint.per-file-ignores]` below); anywhere else, this
# rule fails the build in place of a hand-written AST walk over the whole
# backend tree (Guardrail #12 - that walk's cost grew with the repository,
# not with the rule).
"idhazh.ledger.filenames._SEGMENT_NAME".msg = "Only idhazh.path_classes reads this writer-name pattern directly."
"idhazh.ledger.filenames._SEGMENT_SUFFIX".msg = "Only idhazh.path_classes reads this writer-name pattern directly."
"idhazh.ledger.filenames._REPAIR_NAME".msg = "Only idhazh.path_classes reads this writer-name pattern directly."
"idhazh.ledger.filenames._REPAIR_STAMP".msg = "Only idhazh.path_classes reads this writer-name pattern directly."
# The parquet engine behind the ledger door. idhazh.ledger.parquet is the one
# module allowed to import it (per-file-ignores below); anywhere else, this
# rule fails the build in place of a hand-written AST walk over backend/idhazh
# and frontend/src (Guardrail #12 - that walk's cost grew with the repository).
"pyarrow".msg = "Only idhazh.ledger.parquet imports the parquet engine directly."

[tool.ruff.lint.per-file-ignores]
# Test names read better long, and a fixture literal is not a magic value.
# TID251: a test fixture reads and writes its own parquet file directly to
# build or inspect a committed fixture; the engine-swap rule the ban otherwise
# enforces governs backend/idhazh and frontend/src, never test fixtures (the
# walk this replaced never covered backend/tests/ either).
"backend/tests/*" = ["E501", "TID251"]
# The one caller the pattern constants are for (see banned-api above).
"backend/idhazh/path_classes.py" = ["TID251"]
# The one caller the parquet engine ban is for (see banned-api above).
"backend/idhazh/ledger/parquet.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

# Measurement-only dependencies, absent from a default install and shipping no
# type stubs of their own.
[[tool.mypy.overrides]]
module = ["feedparser.*", "onnxruntime.*", "torch.*", "trafilatura.*", "transformers.*"]
ignore_missing_imports = true

# The parquet engine ships no type stubs and no py.typed marker. Its values are
# untyped inside the one module that imports it, and nowhere else.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# `-n auto` is the default because the suite is parallel-safe and 3.37x faster
# on a developer box; `-n 0` turns it off for a debugging run.
# `--strict-markers` makes a mark that is not on the list below a collection
# error naming the file, instead of a warning that leaves the test in no subset.
# `--durations` costs nothing to switch on: pytest times every phase of every
# test either way (`_pytest.runner.CallInfo.from_call`), and the option only
# decides what gets printed. So every run, local and CI, ends by naming what it
# spent its time on. `docs/reference/benchmarks/what-the-suite-costs.md` is the
# standing reading.
addopts = "-q -n auto --strict-markers --durations=25"
# Four selectors, so a change can run the tests it can break instead of all
# 3,498. Each is a module-level `pytestmark`, so a module that is renamed or
# moved keeps its mark. CI still runs the whole suite - a mark is a developer's
# shortcut, never the thing that decides what a merge is checked against.
# `backend/tests/test_marks.py` holds the four against every test module, so a
# module in no subset is named rather than silently never run.
markers = [
    "contract: the persisted shapes - generated schemas, config contracts, the ledgers, the committed digest tree",
    "visual: the visual planner, its validator, the spec compiler and the two renderers",
    "slow: a module whose average test takes over a second",
    "workflow: the workflow YAML and the shell scripts under .github/",
]
