<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- Installable, and nothing more than that. A manifest is a static JSON
		     file: no request, no account, no notification, no code running off the
		     reader's device. Its own paths are relative, so it resolves under the
		     Pages project path without being templated. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- The browser chrome matches the page before any script runs. One tag, no
		     media query: the page is dark whatever the system prefers. -->
		<meta name="theme-color" content="#0b0e14" />
		<!-- Self-hosted, Latin subset, one variable file. Only the preload sits
		     here: it has to be in the head to start the fetch early. The
		     @font-face rule lives in app.css, because a rule inlined here is
		     bytes in EVERY prerendered page rather than in one cached stylesheet.
		     frontend/static/fonts/PROVENANCE.md holds the version and the hash. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-latin-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- The one inline script this site carries. The stylesheet already paints
		     dark, so this exists only to apply a stored light choice before the
		     first frame. Anything else, storage included, is dark. -->
		<script>
			(function () {
				var choice = 'dark';
				try {
					if (localStorage.getItem('idhazh:theme') === 'light') choice = 'light';
				} catch (e) {
					choice = 'dark';
				}
				document.documentElement.setAttribute('data-theme', choice);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- The one thing a script-free reader on a dated URL can be told.

		     From 2026-09-09 a dated address is answered by the fallback document,
		     whose body is a boot script and nothing else, so with script off that
		     page is blank - and a blank page is a site that looks broken to the one
		     reader who will never report it. Two pages on this site render complete
		     with no script at all, and this says which and links them.

		     It is last in the body and it says nothing about needing anything, so on
		     the pages that DO render it sits under what the reader came for and is
		     true there too. That is the price: one quiet line at the foot of every
		     prerendered page, for a script-free reader, in exchange for a dated URL
		     that is not a white screen. -->
		<noscript>
			<p style="margin: 2rem 0; font-size: 0.875rem">
				A page for one day opens with JavaScript. Without it,
				<a href="%sveltekit.assets%/">the front page</a> still opens on the head of the newest
				digest, and every published day is listed in
				<a href="%sveltekit.assets%/archive/">the archive</a>.
			</p>
		</noscript>
	</body>
</html>
