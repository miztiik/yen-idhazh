<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- Installable, and nothing more than that. A manifest is a static JSON
		     file: no request, no account, no notification, no code running off the
		     reader's device. Its own paths are relative, so it resolves under the
		     Pages project path without being templated. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- The browser chrome matches the page before any script runs. One tag, no
		     media query: the page is dark whatever the system prefers. -->
		<meta name="theme-color" content="#0b0e14" />
		<!-- Self-hosted, Latin subset, one variable file. Only the preload sits
		     here: it has to be in the head to start the fetch early. The
		     @font-face rule lives in app.css, because a rule inlined here is
		     bytes in EVERY prerendered page rather than in one cached stylesheet.
		     frontend/static/fonts/PROVENANCE.md holds the version and the hash. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-latin-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- The one inline script this site carries. The stylesheet already paints
		     dark, so this exists only to apply a stored light choice before the
		     first frame. Anything else, storage included, is dark. -->
		<script>
			(function () {
				var choice = 'dark';
				try {
					if (localStorage.getItem('idhazh:theme') === 'light') choice = 'light';
				} catch (e) {
					choice = 'dark';
				}
				document.documentElement.setAttribute('data-theme', choice);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
