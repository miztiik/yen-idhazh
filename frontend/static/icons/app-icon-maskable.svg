<!-- The maskable variant. A platform may crop this to a circle, a squircle or a
     rounded square, so the mark sits inside the 80 percent safe zone and the
     gradient runs edge to edge with no corner radius of its own. Cropping the
     `any` icon instead is how a mark loses its ends on Android. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#4f6bff" />
      <stop offset="0.48" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#c86dd7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#brand)" />
  <g fill="#ffffff">
    <rect x="164" y="184" width="184" height="30" rx="15" />
    <rect x="164" y="248" width="184" height="30" rx="15" />
    <rect x="164" y="312" width="104" height="30" rx="15" fill-opacity="0.72" />
  </g>
</svg>
